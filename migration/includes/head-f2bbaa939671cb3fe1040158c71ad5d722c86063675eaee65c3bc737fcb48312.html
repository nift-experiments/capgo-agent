<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/capacitor-device-sensors-guide/#newsarticle","url":"https://capgo.app/blog/capacitor-device-sensors-guide/","headline":"Capacitor Device Sensors Guide: Motion, Compass, Steps","description":"Capacitor device sensors guide: read the accelerometer, barometer, compass, pedometer, light and proximity sensors on iOS and Android, with permissions.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"Capacitor device sensors are available through small, focused plugins: @capgo/capacitor-accelerometer for motion, @capgo/capacitor-barometer for air pressure, @capgo/capacitor-compass for heading, @capgo/capacitor-pedometer for steps, plus light, proximity and shake plugins. Each follows the same pattern: check availability, request permission if needed, start updates, listen, and stop when you are done. This guide covers every sensor with Capacitor 8 code, the platform differences that matter, and the battery rules that keep apps out of trouble.\nSensor overview\n\n\n\nSensor\nPlugin\niOS\nAndroid\nPermission\n\n\n\n\nAccelerometer\n@capgo/capacitor-accelerometer\nYes\nYes\niOS NSMotionUsageDescription\n\n\nBarometer\n@capgo/capacitor-barometer\nYes, with relative altitude\nYes, pressure only, on devices with a sensor\niOS motion usage string\n\n\nCompass\n@capgo/capacitor-compass\nYes\nYes, with accuracy events\niOS location when in use\n\n\nPedometer\n@capgo/capacitor-pedometer\nSteps, distance, floors, pace, cadence\nSteps\niOS motion, Android ACTIVITY_RECOGNITION\n\n\nAmbient light\n@capgo/capacitor-light-sensor\nNo public API\nYes\nNone\n\n\nProximity\n@capgo/capacitor-proximity\nYes\nYes\nNone\n\n\nShake gesture\n@capgo/capacitor-shake\nYes\nYes\nNone\n\n\nGyroscope / orientation\nWeb DeviceMotionEvent / DeviceOrientationEvent\nYes\nYes\niOS requestPermission() in the WebView\n\n\n\nInstall only what you use. Each plugin is small, and fewer permission strings mean fewer questions in App Review.\nbun add @capgo/capacitor-accelerometer @capgo/capacitor-compass @capgo/capacitor-pedometer\nbunx cap sync\niOS setup\nAdd the usage strings your sensors need to ios/App/App/Info.plist:\n&lt;!-- Accelerometer, pedometer, barometer altitude --&gt;\n&lt;key&gt;NSMotionUsageDescription&lt;/key&gt;\n&lt;string&gt;Counts your steps and detects movement during workouts.&lt;/string&gt;\n\n&lt;!-- Compass heading --&gt;\n&lt;key&gt;NSLocationWhenInUseUsageDescription&lt;/key&gt;\n&lt;string&gt;Shows which direction you are facing on the map.&lt;/string&gt;\nExplain the user benefit in plain words. Generic text like “This app needs motion access” is a frequent App Review rejection reason.\nAndroid setup\nMost sensors need no permission. The pedometer plugin adds ACTIVITY_RECOGNITION to the merged manifest, and you request it at runtime on Android 10+.\nIf a sensor is essential, declare the hardware feature so Google Play hides your app from devices without it. If it is optional, declare it with required=\"false\" and check availability at runtime:\n&lt;uses-feature android:name=\"android.hardware.sensor.barometer\" android:required=\"false\" /&gt;\n&lt;uses-feature android:name=\"android.hardware.sensor.stepcounter\" android:required=\"false\" /&gt;\n&lt;uses-feature android:name=\"android.hardware.sensor.compass\" android:required=\"false\" /&gt;\nAccelerometer: motion and tilt\nThe accelerometer reports acceleration on the x, y and z axes in G. A phone lying flat reads about z = -1 or 1 depending on the platform convention, because gravity is included.\nimport { CapacitorAccelerometer } from '@capgo/capacitor-accelerometer';\n\nconst { isAvailable } = await CapacitorAccelerometer.isAvailable();\nif (isAvailable) {\n  await CapacitorAccelerometer.requestPermissions();\n\n  const listener = await CapacitorAccelerometer.addListener('measurement', ({ x, y, z }) =&gt; {\n    const tiltX = Math.atan2(x, Math.sqrt(y * y + z * z)) * (180 / Math.PI);\n    ball.style.transform = `translateX(${tiltX * 3}px)`;\n  });\n\n  await CapacitorAccelerometer.startMeasurementUpdates();\n\n  // later\n  await CapacitorAccelerometer.stopMeasurementUpdates();\n  await listener.remove();\n}\nUse cases: tilt controls in games, “lift to wake” UI, fall or impact detection, activity intensity. Raw data is noisy, so smooth it with a low-pass filter before using it:\nconst alpha = 0.2;\nlet smoothed = { x: 0, y: 0, z: 0 };\n\nfunction lowPass(m: { x: number; y: number; z: number }) {\n  smoothed = {\n    x: smoothed.x + alpha * (m.x - smoothed.x),\n    y: smoothed.y + alpha * (m.y - smoothed.y),\n    z: smoothed.z + alpha * (m.z - smoothed.z),\n  };\n  return smoothed;\n}\nDo not update the DOM on every sample. Store the latest value and render it in a requestAnimationFrame loop.\nShake gestures\nFor “shake to report a bug” or “shake to undo”, you do not need to tune thresholds yourself:\nimport { CapacitorShake } from '@capgo/capacitor-shake';\n\nconst handle = await CapacitorShake.addListener('shake', () =&gt; openFeedbackForm());\nGyroscope and device orientation\nThere is no separate plugin needed for rotation. The WebView already exposes it:\nasync function enableMotion() {\n  // iOS 13+ requires a user gesture and explicit permission\n  const DME = DeviceMotionEvent as unknown as { requestPermission?: () =&gt; Promise&lt;'granted' | 'denied'&gt; };\n  if (typeof DME.requestPermission === 'function') {\n    const result = await DME.requestPermission();\n    if (result !== 'granted') return;\n  }\n\n  window.addEventListener('devicemotion', (e) =&gt; {\n    const r = e.rotationRate; // alpha, beta, gamma in degrees per second\n    if (r) updateRotation(r.alpha ?? 0, r.beta ?? 0, r.gamma ?? 0);\n  });\n\n  window.addEventListener('deviceorientation', (e) =&gt; {\n    // alpha: 0-360 around z, beta: -180..180 front/back, gamma: -90..90 left/right\n    updateOrientation(e.alpha, e.beta, e.gamma);\n  });\n}\n\ndocument.querySelector('#enable-motion')!.addEventListener('click', enableMotion);\nCall requestPermission from a button tap, never on page load, or iOS rejects the request.\nCompass: heading\nimport { CapgoCompass, CompassAccuracy } from '@capgo/capacitor-compass';\n\nconst status = await CapgoCompass.requestPermissions(); // iOS: location permission\nif (status.compass === 'granted') {\n  await CapgoCompass.addListener('headingChange', ({ value }) =&gt; {\n    needle.style.transform = `rotate(${-value}deg)`;\n  });\n\n  await CapgoCompass.startListening({\n    minInterval: 100,      // ms between events\n    minHeadingChange: 2,   // degrees\n  });\n\n  // Android only: ask the user to calibrate when accuracy drops\n  await CapgoCompass.addListener('accuracyChange', ({ accuracy }) =&gt; {\n    calibrationHint.hidden = accuracy &gt;= CompassAccuracy.MEDIUM;\n  });\n  await CapgoCompass.watchAccuracy();\n}\n\n// One-off reading\nconst { value } = await CapgoCompass.getCurrentHeading();\nvalue is degrees from magnetic north, 0 to 360. Things to know:\n\nThe magnetometer is disturbed by magnets in phone cases, laptops and car mounts. Show a calibration hint (move the phone in a figure eight) when Android reports low accuracy.\nThrottle with minInterval and minHeadingChange rather than in JavaScript. It saves bridge traffic.\nFor a map that rotates with the user, combine heading with geolocation. If you need location while the app is in the background, see the background geolocation plugin.\n\nPedometer: steps, distance and floors\nThe step counter is a low-power chip that counts continuously, even when your app is not running.\nimport { CapacitorPedometer } from '@capgo/capacitor-pedometer';\n\nconst features = await CapacitorPedometer.isAvailable();\n// { stepCounting, distance, pace, cadence, floorCounting }\n\nconst perm = await CapacitorPedometer.requestPermissions();\nif (perm.activityRecognition !== 'granted') {\n  // explain why and link to settings\n}\n\n// Steps today (start and end are required on iOS)\nconst startOfDay = new Date();\nstartOfDay.setHours(0, 0, 0, 0);\nconst today = await CapacitorPedometer.getMeasurement({\n  start: startOfDay.getTime(),\n  end: Date.now(),\n});\nconsole.log(today.numberOfSteps, today.distance, today.floorsAscended);\n\n// Live updates during a walk\nawait CapacitorPedometer.addListener('measurement', (m) =&gt; {\n  stepsEl.textContent = String(m.numberOfSteps ?? 0);\n});\nawait CapacitorPedometer.startMeasurementUpdates();\nPlatform differences:\n\niOS (Core Motion) answers historical queries for about the last seven days and also provides distance, floors, pace and cadence on supported devices.\nAndroid reports steps only. The hardware counter resets on reboot, so do not treat it as a lifetime total. Store your own baseline.\n\nFor long-term history, daily totals across devices, or data from a watch, read from the health store with @capgo/capacitor-health instead. It aggregates steps from all sources in Apple Health and Health Connect. Our Health Connect migration guide explains the setup.\nBarometer: pressure and altitude\nimport { CapacitorBarometer } from '@capgo/capacitor-barometer';\n\nconst { isAvailable } = await CapacitorBarometer.isAvailable();\nif (isAvailable) {\n  await CapacitorBarometer.requestPermissions();\n  await CapacitorBarometer.addListener('measurement', ({ pressure, relativeAltitude }) =&gt; {\n    pressureEl.textContent = `${pressure.toFixed(1)} hPa`;\n    altitudeEl.textContent = `${relativeAltitude.toFixed(1)} m`;\n  });\n  await CapacitorBarometer.startMeasurementUpdates();\n}\npressure is in hectopascals on both platforms. relativeAltitude is the change in meters since updates started, provided by iOS only. On Android it is always 0, so compute it yourself with the barometric formula:\nconst P0 = 1013.25; // standard sea-level pressure in hPa\nconst altitudeMeters = (p: number) =&gt; 44330 * (1 - Math.pow(p / P0, 1 / 5.255));\n\nlet baseline: number | null = null;\nfunction relativeAltitude(pressure: number) {\n  baseline ??= altitudeMeters(pressure);\n  return altitudeMeters(pressure) - baseline;\n}\nAbsolute altitude from pressure is off by tens of meters because weather changes sea-level pressure. Relative changes over minutes are accurate to about a meter, which is enough for counting floors or climbs. Many budget Android phones have no barometer, so always check isAvailable.\nAmbient light sensor (Android)\nimport { LightSensor } from '@capgo/capacitor-light-sensor';\n\nconst { available } = await LightSensor.isAvailable(); // always false on iOS\nif (available) {\n  await LightSensor.addListener('lightSensorChange', ({ illuminance }) =&gt; {\n    document.body.classList.toggle('high-contrast', illuminance &gt; 10_000); // bright sunlight\n  });\n  await LightSensor.start({ updateInterval: 500 });\n}\nTypical values: below 10 lux is a dark room, a few hundred lux is an office, tens of thousands is direct sunlight. Use it for a reading mode that adapts to the room, or to raise contrast outdoors. To change the screen brightness itself, pair it with @capgo/capacitor-brightness.\nProximity sensor\nThe proximity sensor tells you when something covers the top of the screen, usually the user’s ear during a call.\nimport { CapacitorProximity } from '@capgo/capacitor-proximity';\n\nconst status = await CapacitorProximity.getStatus();\nif (status.available) {\n  await CapacitorProximity.enable();  // screen turns off when covered\n}\n\n// when the call or voice message ends\nawait CapacitorProximity.disable();\nOn iOS this toggles UIDevice.isProximityMonitoringEnabled, which turns the display off while covered. On Android the plugin listens to the proximity sensor and dims the app window. Enable it only while a voice call, voice message, or walkie-talkie mode is active, so the user’s cheek does not press buttons.\nPractical rules for sensor apps\n\nCheck availability first. Tablets often lack a step counter or barometer, and emulators fake most sensors. Hide features you cannot support.\nStop updates when not visible. Use @capacitor/app’s appStateChange to stop listeners when the app goes to the background and restart them on resume. Sensors left running drain the battery and cause one-star reviews.\nThrottle in native code when the plugin allows it (compass minInterval, light sensor updateInterval), not in JavaScript.\nAsk for permission in context. Request motion access when the user starts a workout, not on first launch.\nTest on real hardware. Simulators return constant or synthetic values. Test at least one budget Android phone, where sensors are missing or noisy.\nRespect privacy rules. Motion and location data count as sensitive in App Store privacy labels and the Play data safety form. Declare what you collect.\n\nTroubleshooting\nNo events on iOS: the usage string is missing in Info.plist, or permission was denied. Check Settings, Privacy and Security, Motion and Fitness.\nPedometer returns 0 on Android: ACTIVITY_RECOGNITION was denied, or the device has no step counter. Check isAvailable().stepCounting.\nCompass jumps around: magnetic interference or no calibration. Watch accuracy on Android and show a calibration hint.\nrelativeAltitude is always 0: expected on Android. Compute it from pressure as shown above.\nDeviceMotionEvent.requestPermission throws: it was not called from a user gesture.\nBattery drain reports: listeners keep running in the background. Stop them on appStateChange.\nShip sensor features quickly\nThresholds, smoothing factors and UI for sensor features usually need several rounds of tuning with real users. That logic lives in JavaScript, so you can adjust it with Capgo live updates without a store review, while new plugins and permission strings go through a regular build. If you are connecting external sensors like chest straps, continue with our guide to building a heart rate monitor with Capacitor.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/capacitor-device-sensors-guide/"},"keywords":"capacitor device sensors, capacitor accelerometer, capacitor compass, capacitor pedometer, capacitor barometer, capacitor light sensor, capacitor proximity sensor, ionic sensors, capacitor gyroscope","articleSection":"Guides"},{"@type":"FAQPage","@id":"https://capgo.app/blog/capacitor-device-sensors-guide/#faqpage","url":"https://capgo.app/blog/capacitor-device-sensors-guide/","mainEntity":[{"@type":"Question","name":"Which Capacitor sensor plugins need a permission prompt?","acceptedAnswer":{"@type":"Answer","text":"On iOS, the pedometer and barometer (and the accelerometer plugin, per its setup docs) use Core Motion and need NSMotionUsageDescription, and the compass needs location permission because iOS derives heading from Core Location. On Android, only the pedometer needs a runtime permission, ACTIVITY_RECOGNITION on Android 10+. Accelerometer, barometer, compass, light and proximity sensors need none."}},{"@type":"Question","name":"Why does the light sensor not work on iOS?","acceptedAnswer":{"@type":"Answer","text":"Apple does not expose the ambient light sensor through a public API, so no App Store compliant plugin can read lux values on iPhone. @capgo/capacitor-light-sensor reports available: false on iOS. Use the screen brightness or the system dark mode setting as a proxy."}},{"@type":"Question","name":"Do these sensor plugins work in the browser?","acceptedAnswer":{"@type":"Answer","text":"Partly. Browsers expose motion and orientation through DeviceMotionEvent and DeviceOrientationEvent, and some plugins fall back to them. Barometer, pedometer, light and proximity readings are generally not available on the web, so always check isAvailable() and design a fallback."}},{"@type":"Question","name":"Should I use the accelerometer or the pedometer to count steps?","acceptedAnswer":{"@type":"Answer","text":"Use the pedometer. It reads the dedicated low-power step counter that runs even when your app is closed, and it is far more accurate than counting peaks in raw accelerometer data, which drains battery and only works while your app is running."}},{"@type":"Question","name":"How do I read the gyroscope in Capacitor?","acceptedAnswer":{"@type":"Answer","text":"Use the standard DeviceMotionEvent in the WebView. event.rotationRate gives rotation in degrees per second around each axis. On iOS, call DeviceMotionEvent.requestPermission() from a user tap first."}}]}]}</script>
