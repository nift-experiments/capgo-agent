<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-add-authentication-to-a-capacitor-app/#newsarticle","url":"https://capgo.app/blog/how-to-add-authentication-to-a-capacitor-app/","headline":"How to Add Authentication to a Capacitor App (2026)","description":"Compare every way to add authentication to a Capacitor app: native Google and Apple login, OIDC SSO, Firebase, Supabase, Better Auth, passkeys and biometrics.","image":["https://capgo.app/mfa-login.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To add authentication to a Capacitor app, pick an identity source (your own backend, a hosted service like Firebase or Supabase, an OIDC provider like Auth0, Okta or Entra ID, or a self-hosted library like Better Auth), use native plugins for anything that opens a provider login page, verify tokens on a server, and store the resulting session in the Keychain or Keystore. Biometrics and passkeys then make the next sign-in fast.\nThis guide maps every common option to the right Capacitor plugin and flow, with code for the parts that are the same in every app: the login call, token verification, session storage and biometric unlock. It is up to date for Capacitor 8 in October 2026. Each provider has its own step-by-step guide linked below.\nThe auth flow every Capacitor app ends up with\nNo matter which provider you choose, the shape is the same:\n\nIdentify the user: native social sheet, provider login page in the system browser, passkey prompt, or a form that posts email and password.\nGet a proof: an ID token, an authorization code, or a session token from your auth server.\nVerify on the server: check signature, issuer, audience and expiry, then create or find the user.\nIssue a session: your own token or the provider’s tokens, with a refresh strategy.\nStore it securely on the device and attach it to API calls.\nUnlock quickly next time with biometrics, and handle logout and account deletion.\n\nSteps 1 and 2 change with the provider. Steps 3 to 6 are your responsibility in every option except fully hosted BaaS, where the SDK does most of it.\nWhy WebView login pages break\nA Capacitor app runs your web code in a WKWebView (iOS) or Android WebView with a local origin (capacitor://localhost or https://localhost). Loading a provider’s login page inside that WebView causes three problems:\n\nGoogle returns disallowed_useragent and refuses to show the page.\nThe app cannot prove the page is the real provider, which is why RFC 8252 tells native apps to use the system browser.\nA full-page redirect navigates away from your bundled app and loses state.\n\nSo every flow below uses either a native SDK (Apple, Google, Facebook) or a system browser session (ASWebAuthenticationSession on iOS, Chrome Custom Tabs on Android) that returns to the app through a custom scheme.\nYour options at a glance\n\n\n\nApproach\nBest for\nCapacitor plugin\nBackend work\nGuide\n\n\n\n\nSign in with Apple\nAny iOS app with third-party login\n@capgo/capacitor-social-login\nVerify ID token\nApple guide\n\n\nGoogle Sign-In\nConsumer apps, Android first\n@capgo/capacitor-social-login\nVerify ID token\nGoogle guide\n\n\nAuth0\nHosted login with many connections\n@capgo/capacitor-social-login (OAuth2)\nValidate access tokens\nAuth0 guide\n\n\nOkta\nWorkforce and B2B SSO\n@capgo/capacitor-social-login (OAuth2)\nValidate access tokens\nOkta guide\n\n\nMicrosoft Entra ID\nMicrosoft 365 organizations\n@capgo/capacitor-social-login (OAuth2)\nValidate access tokens, Graph\nEntra ID guide\n\n\nBetter Auth\nSelf-hosted, own user database\nbetter-auth client + Social Login\nRun the Better Auth server\nBetter Auth guide\n\n\nSupabase Auth\nPostgres backend with built-in auth\nSocial Login + supabase-js\nMinimal\nSupabase guide\n\n\nFirebase Authentication\nApps already on Firebase\n@capgo/capacitor-firebase-authentication\nMinimal\nFirebase docs\n\n\nPasskeys\nPasswordless login on your own domain\n@capgo/capacitor-passkey\nWebAuthn server\nPasskey docs\n\n\nEmail and password\nSimple apps, own backend\nNone (HTTP)\nHashing, reset, rate limits\nThis article\n\n\n\nNative social sign-in (Apple, Google, Facebook)\nOne plugin covers the three big consumer providers plus a generic OAuth2 engine:\nbun add @capgo/capacitor-social-login\nbunx cap sync\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nawait SocialLogin.initialize({\n  apple: { clientId: 'com.example.app' },\n  google: {\n    webClientId: 'WEB_CLIENT_ID.apps.googleusercontent.com',\n    iOSClientId: 'IOS_CLIENT_ID.apps.googleusercontent.com',\n  },\n});\n\nconst { result } = await SocialLogin.login({ provider: 'google', options: {} });\n// send result.idToken to your server\nTurn off providers you do not use in capacitor.config.ts (plugins.SocialLogin.providers) so their SDKs are not compiled into the app. That also removes the Facebook SDK’s advertising ID permission if you do not use Facebook.\nEach provider has native setup: Apple needs the capability in Xcode and a Services ID for Android, Google needs SHA-1 fingerprints and a reversed client ID URL scheme. The Apple and Google guides go through every step and the common errors.\nEnterprise SSO with OAuth 2.0 and OpenID Connect\nFor Auth0, Okta, Microsoft Entra ID, Keycloak, Cognito, OneLogin or your own OIDC server, use the plugin’s oauth2 provider. It runs the authorization code flow with PKCE in ASWebAuthenticationSession on iOS and in Custom Tabs on Android when you set androidUseCustomTabs: true:\nawait SocialLogin.initialize({\n  oauth2: {\n    corp: {\n      issuerUrl: 'https://sso.example.com/realms/mobile', // OIDC discovery\n      clientId: 'mobile-app',\n      redirectUrl: 'com.example.app://oauth/corp',\n      scope: 'openid profile email offline_access',\n      pkceEnabled: true,\n      androidUseCustomTabs: true,\n    },\n  },\n});\n\nconst { result } = await SocialLogin.login({\n  provider: 'oauth2',\n  options: { providerId: 'corp' },\n});\nYou can register several providers in the same map and pick one with providerId, which is how multi-tenant B2B apps let each customer bring their own IdP. The plugin also handles refresh (SocialLogin.refresh), logout with id_token_hint, and an Ionic Auth Connect compatible wrapper (SocialLoginAuthConnect) for teams migrating off Auth Connect. Provider walkthroughs: Auth0, Okta, Entra ID. For the protocol background, see 5 steps to implement OAuth2 in Capacitor apps.\nHosted backends: Firebase and Supabase\nIf your data already lives in Firebase or Supabase, use their auth so security rules and row-level security work without extra glue.\n\nSupabase: get an ID token with the Social Login plugin and call supabase.auth.signInWithIdToken({ provider: 'google', token }). Supabase verifies it and returns a session. Full setup: Supabase with Capacitor Social Login.\nFirebase: either use @capgo/capacitor-firebase-authentication, which wraps the native Firebase Auth SDKs, or get an ID token with Social Login and create a Firebase credential from it in the JS SDK. See the Firebase Google login docs.\n\nSelf-hosted: Better Auth\nBetter Auth is an open-source TypeScript auth library that stores users in your own database. It works in Capacitor once you trust the app origins and switch to bearer tokens, because cross-site cookies are unreliable in WKWebView. Social login goes through the native plugin and an ID token handoff. Step-by-step: How to use Better Auth in Capacitor apps.\nPasskeys\nPasskeys replace passwords with a key pair stored in iCloud Keychain or Google Password Manager. They need your app to be associated with your website domain (apple-app-site-association on iOS, assetlinks.json on Android) and a WebAuthn server.\n@capgo/capacitor-passkey lets you keep standard WebAuthn code. Configure the relying party in capacitor.config.ts, call the shim once at startup, and navigator.credentials.create() and .get() are routed to the native passkey APIs:\nimport { CapacitorPasskey } from '@capgo/capacitor-passkey';\n\nawait CapacitorPasskey.autoShimWebAuthn();\n\n// existing WebAuthn code keeps working\nconst assertion = await navigator.credentials.get({\n  publicKey: requestOptionsFromServer,\n});\nLibraries like Better Auth, and hosted providers like Auth0 and Okta, can act as the WebAuthn server. See the passkey plugin page.\nEmail and password with your own backend\nNo plugin is needed, it is just fetch. The work is on the server: hash with Argon2id or bcrypt, rate-limit login attempts, send verification and reset emails, and support account deletion. Open reset and verification links in the app with Universal Links and App Links, so the link lands in the right place on a phone. Unless you have a reason to own all of that, a library like Better Auth or a hosted service gives you the same features with less risk.\nVerify tokens on the server, always\nClient-side checks can be bypassed. Whatever the provider, the server must verify the token before creating a session:\nimport { createRemoteJWKSet, jwtVerify } from 'jose';\n\ntype IssuerConfig = {\n  jwks: ReturnType&lt;typeof createRemoteJWKSet&gt;;\n  issuer: string | string[];\n  audience: string[];\n};\n\nconst issuers: Record&lt;'google' | 'apple', IssuerConfig&gt; = {\n  google: {\n    jwks: createRemoteJWKSet(new URL('https://www.googleapis.com/oauth2/v3/certs')),\n    issuer: ['https://accounts.google.com', 'accounts.google.com'],\n    audience: ['WEB_CLIENT_ID.apps.googleusercontent.com', 'IOS_CLIENT_ID.apps.googleusercontent.com'],\n  },\n  apple: {\n    jwks: createRemoteJWKSet(new URL('https://appleid.apple.com/auth/keys')),\n    issuer: 'https://appleid.apple.com',\n    audience: ['com.example.app', 'com.example.app.signin'],\n  },\n};\n\nexport async function verifyIdToken(provider: 'google' | 'apple', idToken: string) {\n  const cfg = issuers[provider];\n  const { payload } = await jwtVerify(idToken, cfg.jwks, {\n    issuer: cfg.issuer,\n    audience: cfg.audience,\n  });\n  return payload; // use payload.sub as the stable provider user ID\n}\nKey users on the provider’s sub (plus provider name), not on email. Only link accounts by email when the provider marks it verified (email_verified: true). Meta’s Limited Login tokens do not include that claim.\nStore the session securely\nlocalStorage and Capacitor Preferences are plain files. Put long-lived tokens in the Keychain (iOS) or Keystore-encrypted storage (Android). @capgo/capacitor-native-biometric has simple setData, getData and deleteData methods for that:\nbun add @capgo/capacitor-native-biometric\nbunx cap sync\nimport { NativeBiometric } from '@capgo/capacitor-native-biometric';\n\nexport const sessionStore = {\n  async save(token: string) {\n    await NativeBiometric.setData({ key: 'session.token', value: token });\n  },\n  async load(): Promise&lt;string | null&gt; {\n    try {\n      const { value } = await NativeBiometric.getData({ key: 'session.token' });\n      return value;\n    } catch {\n      return null;\n    }\n  },\n  async clear() {\n    await NativeBiometric.deleteData({ key: 'session.token' }).catch(() =&gt; {});\n  },\n};\nKeep access tokens short-lived and refresh them with a refresh token or a server session. Our secure token storage guide covers rotation and revocation in more depth.\nBiometrics: unlock, not identity\nFace ID and fingerprint only prove that the person holding the phone can unlock it. Use them to gate access to a stored session:\nimport { AccessControl, NativeBiometric } from '@capgo/capacitor-native-biometric';\n\n// after a real login, offer biometric unlock\nawait NativeBiometric.setData({\n  key: 'session.refresh',\n  value: refreshToken,\n  accessControl: AccessControl.BIOMETRY_ANY,\n});\n\n// next app start\nconst { value } = await NativeBiometric.getSecureData({\n  key: 'session.refresh',\n  reason: 'Unlock your account',\n});\n// exchange `value` with your server for a fresh access token\nWith accessControl set, the OS releases the value only after a successful biometric check, so the protection is enforced by the Keychain or Keystore, not by JavaScript. Pair it with server-side session expiry and, for high-risk apps, root and jailbreak detection. More in Biometric authentication in Capacitor apps.\nChoosing a method\n\n\n\nIf you…\nUse\n\n\n\n\nShip a consumer app on iOS and Android\nApple + Google via Social Login, plus email or passkeys\n\n\nSell to companies that use Microsoft 365\nEntra ID via OAuth2 provider\n\n\nNeed many enterprise IdPs per customer\nAuth0 or Okta as a broker, or several OAuth2 providers by providerId\n\n\nAlready use Supabase or Firebase\nTheir auth with native ID token sign-in\n\n\nWant your own user table without a vendor\nBetter Auth\n\n\nWant passwordless\nPasskeys, with a fallback such as email magic link\n\n\nNeed fast re-login\nBiometric unlock of a stored session, on top of any of the above\n\n\n\nApp Store and Play rules that affect login\n\nApple 4.8 Login Services: third-party login as the main account system requires an equivalent privacy-focused option. Sign in with Apple satisfies it.\nApple 5.1.1(v): account creation requires in-app account deletion, and Sign in with Apple tokens should be revoked. See account deletion compliance.\nGoogle Play account deletion: apps with accounts must offer deletion in the app and through a web link declared in Play Console.\nReviewer access: give reviewers a working demo account. If login is SSO only, provide a test tenant user.\nXcode 26: App Store Connect has required builds made with Xcode 26 and the iOS 26 SDK since April 2026, so update before you submit a release that adds new auth capabilities.\n\nShip auth changes safely\nAuth bugs block every user, so you want to fix them fast. Native changes (entitlements, URL schemes, intent filters) need a store build. Everything in TypeScript, like provider config, scopes, error handling and UI, can be pushed with Capgo live updates and rolled back if something breaks. Capgo Build produces the signed iOS and Android binaries in the cloud when you do need a new native release.\nNext steps\nPick your provider and follow the matching guide:\n\nSign in with Apple\nSign in with Google\nAuth0\nOkta\nMicrosoft Entra ID\nBetter Auth\nSocial Login plugin documentation\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-add-authentication-to-a-capacitor-app/"},"keywords":"capacitor authentication, add authentication to capacitor app, ionic capacitor login, capacitor social login, capacitor oauth, capacitor passkeys, capacitor biometric login, capacitor firebase auth, capacitor supabase auth","articleSection":"Guides"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-add-authentication-to-a-capacitor-app/#faqpage","url":"https://capgo.app/blog/how-to-add-authentication-to-a-capacitor-app/","mainEntity":[{"@type":"Question","name":"Can I use more than one authentication method in the same Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"Yes, and most consumer apps do. A common setup is Sign in with Apple, Google and email with password or passkeys, all creating the same user record on the backend. Link accounts by the provider's verified email or let signed-in users connect extra providers from their settings."}},{"@type":"Question","name":"Why does Google login fail inside my Capacitor WebView?","acceptedAnswer":{"@type":"Answer","text":"Google blocks OAuth pages loaded in embedded WebViews and returns disallowed_useragent. Use native Google Sign-In through a plugin, which uses Credential Manager on Android and the Google SDK on iOS, then send the ID token to your backend."}},{"@type":"Question","name":"Is biometric authentication a replacement for a password?","acceptedAnswer":{"@type":"Answer","text":"No. Face ID or fingerprint checks happen on the device and only prove that the device owner is present. Use biometrics to unlock a session token or credential that a real login created earlier, and keep the server as the authority on who the user is."}},{"@type":"Question","name":"What does Apple require for login in iOS apps?","acceptedAnswer":{"@type":"Answer","text":"If you offer a third-party login such as Google or Facebook as the main account system, guideline 4.8 requires an equivalent privacy-focused login, which Sign in with Apple satisfies. If users can create accounts, guideline 5.1.1(v) requires in-app account deletion, including revoking Sign in with Apple tokens."}},{"@type":"Question","name":"Do these authentication plugins support Capacitor 8 and the web?","acceptedAnswer":{"@type":"Answer","text":"Yes. @capgo/capacitor-social-login v8 targets Capacitor 8 and runs on iOS, Android and web. The Google and Apple providers use Google Identity Services and Apple JS on the web, and the OAuth2 engine uses a popup or redirect."}}]}]}</script>
