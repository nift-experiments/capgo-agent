<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/publish-capacitor-app-on-huawei-appgallery/#newsarticle","url":"https://capgo.app/blog/publish-capacitor-app-on-huawei-appgallery/","headline":"How to Publish a Capacitor App on Huawei AppGallery","description":"Publish a Capacitor app on Huawei AppGallery: developer registration, Google Play services audit, HMS fallbacks, APK signing, listing assets and review tips.","image":["https://capgo.app/capacitor.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"You can publish a Capacitor app on Huawei AppGallery with the same Android build you ship to Google Play. Register a free HUAWEI Developers account, check which plugins depend on Google Play services (missing on Huawei phones released since late 2019), hide or replace those features, then upload a signed APK in AppGallery Connect with a listing and wait for review. This guide covers each step, including a small native check you can drop into your app to detect Google Play services without extra dependencies.\nWho should ship on AppGallery\nAppGallery is the default store on Huawei phones and tablets. It matters if your users include:\n\nPeople in Europe, the Middle East, Africa, Latin America and Southeast Asia using Huawei devices released after the 2019 US trade restrictions, which ship without Google Play services and without the Play Store.\nEnterprise or government customers that standardized on Huawei hardware.\n\nA note on HarmonyOS: Huawei phones sold outside mainland China run EMUI, which is Android-based and installs APKs. Devices in mainland China running HarmonyOS NEXT (HarmonyOS 5 and later) only run native HarmonyOS apps, so an Android APK does not reach them. This guide is about the Android-based AppGallery.\nStep 1: Audit Google Play services dependencies\nCapacitor itself only depends on AndroidX and its own Android library. The risk comes from plugins that pull in Google libraries. Look at your dependencies:\ncd android\n./gradlew :app:dependencies --configuration releaseRuntimeClasspath \\\n  | grep -E \"com.google.android.gms|com.google.firebase|com.google.android.play|billingclient\" \\\n  | sort -u\nThen sort them into “works without Google Play services” and “needs Google Play services”.\n\n\n\nDependency\nOn Huawei without GMS\nTypical plugins\n\n\n\n\nFirebase Cloud Messaging\nDoes not work\n@capacitor/push-notifications, Firebase messaging plugins\n\n\nGoogle Maps SDK\nDoes not work\n@capacitor/google-maps\n\n\nGoogle Sign-In (play-services-auth, Credential Manager Google ID)\nDoes not work\nGoogle provider of @capgo/capacitor-social-login\n\n\nGoogle Play Billing\nDoes not work\n@capgo/capacitor-native-purchases, RevenueCat on Android\n\n\nPlay In-App Review\nDoes not work\n@capgo/capacitor-in-app-review\n\n\nPlay In-App Updates\nDoes not work\nPlay update helpers in @capgo/capacitor-updater\n\n\nPlay Integrity\nDoes not work\nApp attestation plugins on Android\n\n\nFused location (play-services-location)\nDepends on plugin; some fall back to Android’s LocationManager\n@capacitor/geolocation, background geolocation plugins\n\n\nplay-services-tasks, play-services-basement alone\nFine (plain libraries)\nMany plugins\n\n\nFirestore, Realtime Database, Storage, Remote Config, Crashlytics, email/password Auth\nWork\nFirebase plugins\n\n\nCapgo live updates\nWork\n@capgo/capacitor-updater\n\n\nApple and Facebook login\nWork\n@capgo/capacitor-social-login Apple / Facebook providers\n\n\n\n“Does not work” usually means the call throws or never resolves. It rarely crashes the whole app, but reviewers test on Huawei devices and a dead button or a blank screen is a common rejection reason.\nStep 2: Detect Google Play services at runtime\nYou can check for Google Play services without adding any Google dependency by asking Android’s package manager whether com.google.android.gms is installed. Add a tiny local plugin to your Capacitor Android project.\nandroid/app/src/main/java/com/example/app/ServicesCheckPlugin.java:\npackage com.example.app;\n\nimport android.content.pm.PackageManager;\nimport com.getcapacitor.JSObject;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginCall;\nimport com.getcapacitor.PluginMethod;\nimport com.getcapacitor.annotation.CapacitorPlugin;\n\n@CapacitorPlugin(name = \"ServicesCheck\")\npublic class ServicesCheckPlugin extends Plugin {\n\n    private boolean isInstalled(String packageName) {\n        try {\n            getContext().getPackageManager().getPackageInfo(packageName, 0);\n            return true;\n        } catch (PackageManager.NameNotFoundException e) {\n            return false;\n        }\n    }\n\n    @PluginMethod\n    public void getStatus(PluginCall call) {\n        JSObject ret = new JSObject();\n        ret.put(\"gms\", isInstalled(\"com.google.android.gms\"));\n        ret.put(\"hms\", isInstalled(\"com.huawei.hwid\"));\n        call.resolve(ret);\n    }\n}\nRegister it in MainActivity.java before super.onCreate:\npackage com.example.app;\n\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(ServicesCheckPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}\nSince Android 11, apps only see other packages they declare. Add a &lt;queries&gt; block to android/app/src/main/AndroidManifest.xml, inside &lt;manifest&gt;:\n&lt;queries&gt;\n    &lt;package android:name=\"com.google.android.gms\" /&gt;\n    &lt;package android:name=\"com.huawei.hwid\" /&gt;\n&lt;/queries&gt;\nCall it from TypeScript:\nimport { Capacitor, registerPlugin } from '@capacitor/core';\n\ninterface ServicesCheckPlugin {\n  getStatus(): Promise&lt;{ gms: boolean; hms: boolean }&gt;;\n}\n\nconst ServicesCheck = registerPlugin&lt;ServicesCheckPlugin&gt;('ServicesCheck');\n\nexport async function getMobileServices() {\n  if (Capacitor.getPlatform() !== 'android') {\n    return { gms: true, hms: false };\n  }\n  return ServicesCheck.getStatus();\n}\nPackage presence is a reasonable proxy. It does not tell you whether Google Play services is up to date or enabled; if you also need that, add com.google.android.gms:play-services-base and use GoogleApiAvailability.isGooglePlayServicesAvailable(), which works even on devices without GMS.\nStep 3: Degrade gracefully\nUse the result to switch features on and off:\nimport { PushNotifications } from '@capacitor/push-notifications';\nimport { getMobileServices } from './services';\n\nexport const features = {\n  push: true,\n  googleSignIn: true,\n  playBilling: true,\n  inAppReview: true,\n};\n\nexport async function initFeatures() {\n  const { gms } = await getMobileServices();\n\n  features.push = gms;\n  features.googleSignIn = gms;\n  features.playBilling = gms;\n  features.inAppReview = gms;\n\n  if (features.push) {\n    const perm = await PushNotifications.requestPermissions();\n    if (perm.receive === 'granted') {\n      await PushNotifications.register();\n    }\n  }\n}\nPractical fallbacks:\n\nSign-in: hide the Google button and show email, Apple or Facebook login instead. With @capgo/capacitor-social-login you initialize only the providers you show.\nPayments: Google Play Billing is not available. AppGallery has its own Huawei IAP. If digital purchases are core to your app, either integrate Huawei IAP or ship the AppGallery build without purchases and say so in the listing.\nPush: use Huawei Push Kit for HMS devices. There is no official Capacitor plugin; Huawei publishes Cordova plugins under @hmscore/* which run in Capacitor, or you can write a small native plugin around the Push Kit SDK.\nMaps: use a web map (Leaflet, MapLibre GL JS) inside the WebView, which works on every device, or Huawei Map Kit.\nRate the app: on Huawei, link to your AppGallery page instead of calling the Play review API.\nStore links: “Update the app” buttons should open AppGallery (appmarket://details?id=com.example.app) on Huawei devices, not the Play Store.\n\nTest on a real Huawei device or Huawei’s cloud debugging service. An emulator with Google APIs will hide every one of these issues.\nStep 4: Register a HUAWEI Developers account\n\nCreate a HUAWEI ID at developer.huawei.com.\nComplete identity verification as an individual or an enterprise. Individuals typically provide an ID document and bank card details; enterprises provide business registration documents. Review usually takes one to two working days.\nPick the account type and country carefully. Huawei does not let you convert an individual account to an enterprise account, and the verified country or region cannot be changed later.\n\nRegistration is free.\nStep 5: Create the app in AppGallery Connect\n\nOpen AppGallery Connect &gt; My apps &gt; New app.\nPlatform: Android. Device: Mobile phone (covers tablets too).\nApp name, default language and package name. The package name must match appId in capacitor.config.ts and cannot be changed after the first upload.\nChoose the app category.\n\nStep 6: Build and sign the release package\nAppGallery accepts APK and AAB. The APK route is simpler: you sign it with your own key, and Huawei does not need to hold your signing key.\nbun run build\nbunx cap sync android\ncd android\n./gradlew assembleRelease\nConfigure signing in android/app/build.gradle (load passwords from environment variables or keystore.properties, never commit them):\nandroid {\n    signingConfigs {\n        release {\n            storeFile file(System.getenv(\"ANDROID_KEYSTORE_PATH\") ?: \"upload-keystore.jks\")\n            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\nThe APK is in android/app/build/outputs/apk/release/. If you need a keystore, the Android keystore generator creates one. Keep it safe: every future AppGallery update must be signed with the same key.\nIf you upload an AAB instead, AppGallery requires its App Signing service, which means Huawei generates and holds the final signing key, the same model as Play App Signing.\nA few things to check before upload:\n\nversionCode must increase with every upload.\nThe app name in the APK should match the AppGallery listing name.\nIf you distribute outside mainland China, provide English (US) as a language in the listing.\nSince September 30, 2026, Android’s developer verification applies to apps installed on certified devices in Brazil, Indonesia, Singapore and Thailand. Huawei devices without Google services are not Google-certified, but if the same package also installs from outside Google Play on certified devices, register the package name in the Android Developer Console.\n\nStep 7: Prepare the listing\nAppGallery’s listing has its own specs, different from Apple and Google:\n\n\n\nField\nRequirement\n\n\n\n\nIcon\n216 x 216 PNG (512 x 512 also accepted), no rounded corners added by you\n\n\nScreenshots\n3 to 8, 450 x 800 or 800 x 450 px (or proportionally larger), same orientation\n\n\nBrief introduction\nUp to 80 characters\n\n\nIntroduction\nUp to 8,000 characters\n\n\nPrivacy policy URL\nRequired if the app collects personal data\n\n\nAge rating\nQuestionnaire in AppGallery Connect\n\n\nTest account\nRequired if the app has a login\n\n\nCountries / regions\nPick distribution countries explicitly\n\n\n\nDo not reuse screenshots that show the Google Play logo, Android device frames branded by other manufacturers, or “Get it on Google Play” badges. Huawei rejects listings that reference other stores. For the rest of the assets, reuse what you made for the other stores; our App Store and Google Play listing guide covers them.\nStep 8: Upload, submit and review\n\nIn Version information &gt; Draft, upload the APK under Software version.\nFill in the listing, rating, privacy and countries.\nSet the release time (immediately after approval or scheduled).\nSubmit for review.\n\nReview usually takes a few working days. Rejections arrive by email with the guideline reference. The common ones for Capacitor apps:\n\nFeatures that do not work without Google Play services (login button that does nothing, map screen blank).\nDuplicate app: an app with the same package name already exists on AppGallery from another developer, or Huawei previously copied your app from Google Play. Contact Huawei developer support with proof of ownership.\nOther store references in screenshots or text.\nMissing English for international distribution.\nPrivacy policy missing or not reachable from inside the app.\n\nAppGallery Connect also has a Publishing API, so you can automate uploads from CI once the first version is live.\nStep 9: Keep updates fast\nEvery native change goes through Huawei review again, just like the other stores. For JavaScript, HTML and CSS changes, Capgo live updates deliver the new bundle directly to installed apps on Huawei, Google and Apple devices with one upload, because the updater fetches bundles from your Capgo endpoint and does not use Google Play services. Use a dedicated channel if your Huawei build has different features:\nbunx @capgo/cli@latest bundle upload --channel huawei\nSet the default channel for the Huawei build at build time, or assign devices to the channel from your app. The Capgo updater docs explain channels and configuration.\nChecklist\n\n Dependency audit done, GMS-only features listed\n Runtime services check added and tested on a real Huawei device\n Google-only features hidden or replaced (push, sign-in, billing, maps, review)\n HUAWEI Developers account verified\n App created with the same package name as capacitor.config.ts\n Release APK signed with a backed-up keystore, versionCode bumped\n Icon, 3 to 8 screenshots, brief and full introduction, privacy policy\n No Google Play references in listing assets\n Test account for reviewers if needed\n Submitted, review email monitored\n\nIf you are also preparing Google Play, read how to create Apple and Google Play developer accounts for the 12-tester rule that only applies there.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/publish-capacitor-app-on-huawei-appgallery/"},"keywords":"huawei appgallery, publish app on appgallery, capacitor huawei, appgallery connect, hms core, huawei without google play services, huawei push kit capacitor, appgallery apk upload","articleSection":"Android"},{"@type":"FAQPage","@id":"https://capgo.app/blog/publish-capacitor-app-on-huawei-appgallery/#faqpage","url":"https://capgo.app/blog/publish-capacitor-app-on-huawei-appgallery/","mainEntity":[{"@type":"Question","name":"Can I publish a Capacitor app on Huawei AppGallery?","acceptedAnswer":{"@type":"Answer","text":"Yes. AppGallery accepts the same signed APK or Android App Bundle you build for Google Play. Capacitor's core has no Google Play services dependency, so the work is checking which of your plugins rely on Google services and hiding or replacing those features on Huawei devices."}},{"@type":"Question","name":"Does it cost anything to publish on AppGallery?","acceptedAnswer":{"@type":"Answer","text":"No. Registering a HUAWEI Developers account and publishing apps on AppGallery is free. You only need to pass identity verification as an individual or enterprise."}},{"@type":"Question","name":"Will Firebase push notifications work on Huawei phones?","acceptedAnswer":{"@type":"Answer","text":"Not on Huawei phones without Google Play services. Firebase Cloud Messaging requires Google Play services on the device. Use Huawei Push Kit for those users, or fall back to in-app messaging and email."}},{"@type":"Question","name":"Do Capgo live updates work on Huawei devices?","acceptedAnswer":{"@type":"Answer","text":"Yes. The Capgo updater downloads bundles over HTTPS from your update server and applies them locally, without Google Play services. Only its optional Google Play in-app update helpers depend on the Play Store."}},{"@type":"Question","name":"Can the same APK go to Google Play and AppGallery?","acceptedAnswer":{"@type":"Answer","text":"Yes, with the same package name. Note that Google Play re-signs your app with the Play app signing key, while your AppGallery APK is signed with your own key, so users cannot switch between store versions without reinstalling, and API keys tied to a SHA-256 fingerprint need both fingerprints."}}]}]}</script>
