<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/ai-agents-capacitor-development/#newsarticle","url":"https://capgo.app/blog/ai-agents-capacitor-development/","headline":"How to Use AI Agents in Capacitor App Development","description":"Use AI agents in Capacitor app development: install Capacitor skills, connect Capgo MCP servers, and let agents add plugins, debug, build, and ship.","image":["https://capgo.app/capgo_banner.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To use AI agents in Capacitor app development, give the agent two things it lacks by default: procedural knowledge of Capacitor’s native side, through installable skills, and live tools, through MCP servers and a CLI it can run. With Capgo’s open-source Capacitor skills and the Capgo MCP servers, an agent such as Claude Code, Codex, or Cursor can add plugins with the right native config, debug iOS and Android builds, request cloud builds, and upload live updates.\nThis guide explains why general agents get Capacitor wrong, how to set up skills and MCP in a few commands, prompts for each stage of the app lifecycle, and the guardrails that keep it safe.\nWhy general-purpose agents struggle with Capacitor\nAgents are strong on web code. A Capacitor project adds a second half that changes every year:\n\nVersion drift. Capacitor 8 changed Android SDK levels, defaults to Swift Package Manager for new iOS projects, and requires Xcode 26 for App Store uploads. Training data mixes Capacitor 3 to 8 advice.\nNative config across files. A single plugin can need Info.plist keys, entitlements, AndroidManifest.xml permissions, Gradle changes, and a cap sync. Agents often do only the JavaScript part.\nPlugin choice. Many community plugins are unmaintained. An agent picks whatever it saw most often, not what works on Capacitor 8.\nInvisible failures. Errors live in Xcode, Logcat, or a CI log, not in the editor.\n\nYou fix this with context the agent can load on demand, and tools it can call instead of guessing.\nThe toolkit: skills, MCP, and the CLI\n\n\n\nLayer\nWhat it gives the agent\nCapgo option\n\n\n\n\nSkills\nStep-by-step procedures for specific tasks\nCapacitor skills (open source, Cap-go/capgo-skills)\n\n\nPublic MCP\nDocs search, when-to-use guidance, OpenAPI location\nhttps://capgo.app/mcp (read-only)\n\n\nCLI MCP\nAuthenticated account actions: bundles, channels, builds\nbunx @capgo/cli@latest mcp\n\n\nCLI\nSame actions as shell commands, easy to review\nbunx @capgo/cli@latest ...\n\n\n\nInstall the skills\nbunx skills add Cap-go/capgo-skills\nThe installer detects supported agents and places the skills where each one looks for them. The set covers plugin selection, best practices, Capacitor app and plugin major upgrades (including v7 to v8), CocoaPods to SPM migration, debugging, iOS and Android logs, push notifications, deep links, safe areas, security scanning, testing, CI/CD, App Store preflight, Cordova and web app migrations, Capgo live updates, and Capgo native builds. The skills page lists every skill.\nIn Claude Code you can also use the plugin marketplace:\nclaude plugin marketplace add Cap-go/capgo-skills\nclaude plugin install capgo-cloud@capgo-skills\nConnect the MCP servers\nThe public server needs no account. Add it to Claude Code:\nclaude mcp add --transport http capgo-docs https://capgo.app/mcp\nThe CLI server runs locally over stdio and uses your Capgo login, so log in first:\nbunx @capgo/cli@latest login\nclaude mcp add capgo -- bunx @capgo/cli@latest mcp\nFor editors that use a JSON config (Cursor, Windsurf, Claude Desktop), the equivalent is:\n{\n  \"mcpServers\": {\n    \"capgo\": {\n      \"command\": \"bunx\",\n      \"args\": [\"@capgo/cli@latest\", \"mcp\"]\n    }\n  }\n}\nThe CLI MCP exposes tools such as capgo_upload_bundle, capgo_list_channels, capgo_update_channel, capgo_check_compatibility, capgo_request_build, capgo_doctor, and capgo_get_stats. The full list is in the CLI MCP reference, and the MCP page explains which server to use when.\nUsing agents across the Capacitor lifecycle\nName the skill in your prompt. It makes the agent load the right procedure instead of improvising.\n1. Turn a web app into a Capacitor app\nUse the webapp-to-capacitor skill to add Capacitor 8 with iOS and Android\nto this Vite + React app. Keep the existing build output folder.\nThe agent installs @capacitor/core and the CLI, sets webDir, adds the platforms, and runs a first sync. For existing Cordova projects, use cordova-to-capacitor. For Next.js, Nuxt, or similar, use framework-to-capacitor, which handles static export settings.\n2. Add native features with the right plugin\nUse the capacitor-plugins skill to add biometric login.\nPick a plugin that supports Capacitor 8, configure iOS and Android,\nand show me the usage code.\nThe skill knows the official @capacitor/* packages and the Capgo plugin directory, so the agent picks a maintained plugin and adds the Info.plist usage strings, Android permissions, and sync step. Review the diff like any pull request.\n3. Debug with real logs\nUse the ios-android-logs skill to capture Logcat while I reproduce the crash\non the connected Android device, then use debugging-capacitor to find the cause.\nThe logs skill gives the agent the exact adb and Xcode commands to stream and filter device logs, so it reads the real stack trace instead of guessing from source.\n4. Upgrade Capacitor and migrate to SPM\nUse the capacitor-app-upgrade-v7-to-v8 skill to upgrade this app.\nStop and show me the plan before changing native files.\nThen, if your iOS project still uses CocoaPods:\nUse the cocoapods-to-spm skill to move the iOS project to Swift Package Manager.\nAsking for a plan first is a good habit for any change that touches ios/ or android/. For the manual version of the same work, see our Capacitor 8 upgrade guide and the SPM migration guide.\n5. Check security and store readiness\nUse the capacitor-security skill to scan this project and fix high severity issues.\nThen run the capacitor-apple-review-preflight skill before I submit.\nThe preflight checks common rejection causes: missing usage strings, privacy manifest gaps, Sign in with Apple requirements, and metadata issues.\n6. Build iOS and Android in the cloud\nSave signing credentials once yourself, not through the agent:\nbunx @capgo/cli@latest build credentials save --platform ios \\\n  --certificate ./cert.p12 --p12-password \"...\" \\\n  --ios-provisioning-profile ./profile.mobileprovision \\\n  --apple-key ./AuthKey.p8 --apple-key-id \"KEY_ID\" \\\n  --apple-issuer-id \"ISSUER_ID\" --apple-team-id \"TEAM_ID\"\nCredentials are stored locally in ~/.capgo-credentials/credentials.json (or .capgo-credentials.json with --local, which you should git-ignore), sent for the build, and deleted from Capgo after the build completes. Then the agent can work on its own:\nUse the capgo-native-builds skill to request an iOS release build from the\ncurrent working directory, then read the logs and fix any build error.\nThat maps to:\nbunx @capgo/cli@latest build request com.example.app --platform ios --path .\nBecause --path . uploads the working tree, the agent can iterate on an iOS build error from Windows or Linux without committing speculative fixes. More on Capgo Build. If you need certificates first, the iOS certificate generator helps.\n7. Ship a hotfix as a live update\nUse the capgo-live-updates skill to build the web app and upload it to the\nbeta channel. Check native compatibility first.\nThe agent runs the build, then:\nbunx @capgo/cli@latest bundle upload --channel=beta\nThe compatibility check compares native dependencies with what is installed on devices, so the agent does not push a bundle that needs a native plugin the store build lacks. Promote to production after testing on beta. See how Capgo live updates work.\nGuardrails that keep agent work safe\n\nPlan before native changes. Ask for a plan and a diff for anything under ios/ and android/.\nKeep secrets out of the conversation. Save build credentials and API keys yourself, git-ignore credential files, and never paste keys into prompts.\nUse channels as a safety net. Let the agent upload to a beta or internal channel. Promote to production yourself.\nRely on rollback. Capgo rolls a device back to the last working bundle if a new one fails to start, which limits the damage of a bad upload.\nPrefer reviewable commands. The CLI commands above are easy to read in the agent’s log. If you are unsure what an MCP tool did, ask the agent to show the equivalent CLI command.\nKeep humans on store submissions. Agents can prepare builds and metadata. Submitting for review and answering reviewers should stay with a person.\n\nTroubleshooting\nThe agent ignores the skill. Name it explicitly in the prompt, and check it was installed for that agent (rerun bunx skills add Cap-go/capgo-skills).\nMCP tools are missing. For the CLI server, confirm bunx @capgo/cli@latest login succeeded in the same environment the agent runs in. Restart the agent after adding a server.\nThe agent suggests outdated Capacitor APIs. Tell it your Capacitor version, and point it at the public MCP so it checks current docs.\nCloud build fails on signing. Credentials are missing or the provisioning profile does not match the bundle ID. Re-save credentials and rerun the build request.\nUpload rejected as incompatible. The bundle needs native changes. Ship a store build first, then the live update.\nWrap-up\nAI agents become useful for Capacitor once they stop guessing. Install the Capacitor skills so they follow correct procedures, connect the public Capgo MCP for docs and the CLI MCP for account actions, and keep a few guardrails around native changes, secrets, and production channels. For more on building AI features into the app itself, read why Capacitor works well for AI mobile apps.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/ai-agents-capacitor-development/"},"keywords":"AI agents Capacitor, Capacitor AI coding, Claude Code Capacitor, Cursor Capacitor, Capacitor skills, Capgo MCP server, AI mobile app development, agent skills Ionic","articleSection":"Guides"},{"@type":"FAQPage","@id":"https://capgo.app/blog/ai-agents-capacitor-development/#faqpage","url":"https://capgo.app/blog/ai-agents-capacitor-development/","mainEntity":[{"@type":"Question","name":"Which AI agents work with the Capacitor skills?","acceptedAnswer":{"@type":"Answer","text":"Any agent that supports the open skills format: Claude Code, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, and others. Install them with bunx skills add Cap-go/capgo-skills."}},{"@type":"Question","name":"Do I still need MCP servers if I install the skills?","acceptedAnswer":{"@type":"Answer","text":"They solve different problems. Skills teach the agent how to do a task correctly. MCP servers give it live tools and data: the public Capgo MCP for docs and API discovery, and the Capgo CLI MCP for authenticated actions like uploads and builds."}},{"@type":"Question","name":"Does the agent see my signing certificates?","acceptedAnswer":{"@type":"Answer","text":"It does not need to. Capgo Build credentials are saved once with the CLI in a local credentials file and sent only for the build, then deleted after it completes. The agent triggers commands and reads logs, so keep credential files out of the repo and out of prompts."}},{"@type":"Question","name":"Do I need a Mac for the agent to build iOS apps?","acceptedAnswer":{"@type":"Answer","text":"Not with cloud builds. The agent can run a Capgo Build request from Windows or Linux, read the logs, and iterate on fixes. You still need an Apple Developer account and signing credentials."}},{"@type":"Question","name":"Can an agent ship a live update without app review?","acceptedAnswer":{"@type":"Answer","text":"It can upload a web bundle to a channel with the Capgo CLI. Live updates must stay within store rules, which allow updating web code but not changing the app's main purpose. Changes to native code still go through a store release."}}]}]}</script>
