<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/capacitor-privacy-screen-hide-app-content/#newsarticle","url":"https://capgo.app/blog/capacitor-privacy-screen-hide-app-content/","headline":"Capacitor Privacy Screen: Hide App Content","description":"Add a Capacitor privacy screen to hide app content in the app switcher and block screenshots, with per-screen control, config and platform caveats.","image":["https://capgo.app/org_security.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"A Capacitor privacy screen hides your app’s content when the user opens the app switcher and, on Android, blocks screenshots and screen recording. Without one, iOS and Android take a snapshot of your last screen, so a bank balance, a medical record or a one-time code stays visible in the recent apps list. @capgo/capacitor-privacy-screen adds this with one call or one config flag, and lets you protect only the screens that need it.\nWhat the app switcher exposes\nWhen a user leaves your app, both systems capture an image of the current screen:\n\niOS takes a snapshot when the app resigns active and shows it in the app switcher, and briefly while the app relaunches.\nAndroid shows a live or cached preview in Recents.\n\nAnyone glancing at the phone sees that snapshot. So does anyone screen-sharing a call, or a user who records their screen for a support ticket. Screenshots are also synced to cloud photo libraries, which is where sensitive data really leaks.\nWhich apps need it\n\n\n\nApp type\nWhat can leak\n\n\n\n\nBanking, fintech, crypto\nBalances, card numbers, IBANs, transactions\n\n\nPassword managers, authenticators\nPasswords, TOTP codes, recovery keys\n\n\nHealth and medical\nDiagnoses, prescriptions, lab results\n\n\nMessaging\nPrivate conversations\n\n\nHR, payroll, legal\nSalaries, contracts\n\n\nDating, private media\nPhotos and matches\n\n\n\nSecurity reviews and penetration tests for these categories routinely flag missing app switcher protection. OWASP MASVS includes checks for sensitive data exposed through the UI, and auditors test exactly this.\nInstall\nbun add @capgo/capacitor-privacy-screen\nbunx cap sync\nThe plugin supports Capacitor 8 with version 8.x.\nOption 1: protect the whole app from launch\nSet it in capacitor.config.ts. The native plugin reads this when it loads, before your JavaScript runs, so even the first snapshot is protected:\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.bank',\n  appName: 'Example Bank',\n  webDir: 'dist',\n  plugins: {\n    PrivacyScreen: {\n      enabled: true,\n      android: {\n        dimBackground: false,\n        privacyModeOnActivityHidden: 'splash',\n      },\n      ios: {\n        blurEffect: 'dark',\n      },\n    },\n  },\n};\n\nexport default config;\nRun bunx cap sync after changing the config. The enabled option is read from Capacitor config only, it is not a runtime option.\nOption 2: protect specific screens\nimport { PrivacyScreen } from '@capgo/capacitor-privacy-screen';\n\nexport async function enterSensitiveScreen() {\n  await PrivacyScreen.enable({\n    android: { dimBackground: true },\n    ios: { blurEffect: 'light' },\n  });\n}\n\nexport async function leaveSensitiveScreen() {\n  await PrivacyScreen.disable();\n}\n\nconst { enabled } = await PrivacyScreen.isEnabled();\nHook these into your router so every path in and out is covered. With Vue Router, for example:\nrouter.afterEach(async (to) =&gt; {\n  if (to.meta.sensitive) {\n    await PrivacyScreen.enable();\n  } else {\n    await PrivacyScreen.disable();\n  }\n});\nWith Angular, use a guard or a NavigationEnd subscription. With React Router, a hook in your layout component works. The important thing is that back navigation, deep links and tab switches go through the same logic, otherwise a sensitive screen can end up unprotected.\nWhat each option does\nAndroid\n\nProtection uses WindowManager.LayoutParams.FLAG_SECURE. While enabled, screenshots and screen recordings are blocked and the Recents preview is hidden.\ndimBackground: true shows a dim overlay in the app switcher. With false, the plugin shows your splash drawable when available and falls back to dimming.\nprivacyModeOnActivityHidden controls what shows when your activity is hidden by something else, for example the system biometric prompt: 'none' (default), 'dim' or 'splash'.\nThe old preventScreenshots option is deprecated and ignored. FLAG_SECURE is always applied while protection is on. To allow a screenshot on one screen, call disable() before it and enable() after.\n\niOS\n\nWhen the app resigns active, the plugin adds an overlay so the app switcher snapshot does not show your content.\nblurEffect: 'light' or 'dark' uses native blur. 'none' (default) shows your launch screen when available, otherwise a system background.\nWhile enabled, app content is also placed in a secure rendering layer. Treat iOS screenshot blocking as best effort: Apple does not offer an official API to block screenshots, and behavior can change between iOS versions.\n\nWeb\nThe web implementation only tracks the enabled flag so your code runs everywhere. Browsers cannot hide tab previews or block screenshots.\nCombine it with biometrics\nA common pattern for banking apps: blur in the switcher, then require Face ID or fingerprint when the app comes back after some time. The plugin’s privacyModeOnActivityHidden keeps the content covered while the Android biometric prompt is up.\nimport { App } from '@capacitor/app';\nimport { NativeBiometric } from '@capgo/capacitor-native-biometric';\n\n// null until the app has really gone to the background\nlet backgroundedAt: number | null = null;\n\nApp.addListener('appStateChange', async ({ isActive }) =&gt; {\n  if (!isActive) {\n    backgroundedAt = Date.now();\n    return;\n  }\n  const away = backgroundedAt === null ? 0 : Date.now() - backgroundedAt;\n  backgroundedAt = null;\n  if (away &gt; 60_000) {\n    await NativeBiometric.verifyIdentity({ reason: 'Confirm it is you' });\n  }\n});\nSee the native biometric plugin for setup and error handling.\nThe official plugin and the Capgo plugin\nThe Capacitor team also publishes @capacitor/privacy-screen with a very similar API (enable, disable, isEnabled and the same platform options). The Capgo plugin keeps that API and adds:\n\nenabled: true in Capacitor config, so protection is active before any JavaScript runs. The official plugin is enabled from JavaScript only.\niOS secure rendering of content while enabled, documented as part of the plugin’s behavior, in addition to the app switcher overlay.\ngetPluginVersion() for diagnostics.\nA web implementation that keeps the enabled flag, so the same code runs in a browser preview.\n\nIf you already use the official plugin, switching is mostly an import change.\nUX details that matter\n\nDo not block screenshots everywhere without reason. Users take screenshots of receipts, confirmation numbers and settings. Protect screens with sensitive data, not the whole app, unless your security policy requires it.\nTell users why. If someone tries to take a screenshot on Android and gets a black image, a short note in your help center saves support tickets.\nTest screen sharing. Video calls and casting are blocked on Android while FLAG_SECURE is set. If your app has a “share screen with support” flow, disable protection for it.\nCheck accessibility. Screen readers still work with FLAG_SECURE, but test with TalkBack and VoiceOver anyway.\n\nTesting checklist\n\nOpen a sensitive screen, go to the app switcher. Content must be hidden on both platforms.\nOn Android, try a screenshot and a screen recording. Both must be black or blocked.\nTrigger a biometric prompt and check the background.\nNavigate back from a sensitive screen to a normal one. Protection should turn off if you use per-screen mode.\nKill and relaunch the app. With enabled: true in config, the first snapshot must be protected.\nTest on an iPad with Split View and Slide Over. The app may stay visible while not active.\n\nTroubleshooting\nSnapshot still shows content on iOS. You enabled protection after the app already went to the background, or only on some routes. Use the config option for whole-app protection.\nBlack screen in Recents on Android instead of the splash. Set dimBackground: false and make sure your splash drawable exists, otherwise the plugin falls back to dimming.\nScreenshots still work on Android. Check isEnabled(). Another part of your app may call disable() on navigation.\nProtection lost after an OTA update. Config values are native. If you change plugins.PrivacyScreen in capacitor.config.ts, ship a new store build. Runtime enable() and disable() calls in your JavaScript can be changed with Capgo live updates.\nRelated security work\nA privacy screen is one item on a mobile security checklist. Also look at secure storage, certificate pinning and root detection. Capgo has plugins for SSL pinning and root and jailbreak detection, and our post on Apple’s privacy rules for Capacitor apps covers the review side. Full plugin options are in the privacy screen docs.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/capacitor-privacy-screen-hide-app-content/"},"keywords":"capacitor privacy screen, hide app content app switcher, capacitor prevent screenshot, FLAG_SECURE capacitor, ionic privacy screen, @capgo/capacitor-privacy-screen","articleSection":"Security"},{"@type":"FAQPage","@id":"https://capgo.app/blog/capacitor-privacy-screen-hide-app-content/#faqpage","url":"https://capgo.app/blog/capacitor-privacy-screen-hide-app-content/","mainEntity":[{"@type":"Question","name":"How do I hide my app content in the iOS and Android app switcher?","acceptedAnswer":{"@type":"Answer","text":"Install @capgo/capacitor-privacy-screen and call PrivacyScreen.enable(), or set enabled: true under plugins.PrivacyScreen in capacitor.config.ts. iOS shows a blur or launch screen in the snapshot, Android uses FLAG_SECURE with an optional dim or splash overlay."}},{"@type":"Question","name":"Does the privacy screen block screenshots?","acceptedAnswer":{"@type":"Answer","text":"On Android, yes. FLAG_SECURE blocks screenshots and screen recording while protection is enabled. On iOS the plugin places content in a secure rendering layer while enabled, but treat iOS screenshot blocking as best effort and never as a security boundary."}},{"@type":"Question","name":"Can I enable the privacy screen only on some pages?","acceptedAnswer":{"@type":"Answer","text":"Yes. Call enable() when entering a sensitive page and disable() when leaving it. Make sure back navigation and deep links also go through that logic."}},{"@type":"Question","name":"Does it work on the web?","acceptedAnswer":{"@type":"Answer","text":"The web implementation keeps an enabled flag for API parity, but browsers cannot hide tab previews or block screenshots."}},{"@type":"Question","name":"Does a privacy screen affect performance?","acceptedAnswer":{"@type":"Answer","text":"No measurable effect in normal use. It sets a window flag on Android and adds an overlay on iOS when the app resigns active."}}]}]}</script>
