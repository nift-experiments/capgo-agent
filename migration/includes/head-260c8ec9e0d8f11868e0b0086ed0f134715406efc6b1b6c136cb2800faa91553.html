nd the bundle to a random, sticky share of the channel while everyone else stays on stable. Raise the percentage, promote, or roll back from the CLI or console. Auto-pause can stop exposure when the failure rate passes a threshold."}},{"@type":"Question","name":"What can't a live update change?","acceptedAnswer":{"@type":"Answer","text":"Live updates replace the web layer: JavaScript, HTML, CSS, and assets. Native plugins, Capacitor upgrades, capacitor.config changes, and iOS or Android project files need a store release. Capgo checks bundles for native compatibility on upload, and channels can block updates to older binaries."}}]}]}</script>
