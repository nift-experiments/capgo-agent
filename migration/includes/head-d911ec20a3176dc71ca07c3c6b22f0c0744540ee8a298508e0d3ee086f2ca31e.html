<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-detect-the-network-status-in-a-capacitor-app/#newsarticle","url":"https://capgo.app/blog/how-to-detect-the-network-status-in-a-capacitor-app/","headline":"How to Detect the Network Status in a Capacitor App","description":"Detect the network status in a Capacitor app: read online/offline state, listen for changes, verify real internet access, and handle metered networks.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To detect the network status in a Capacitor app, install @capacitor/network, call Network.getStatus() for the current state, and subscribe to networkStatusChange for updates. That tells you whether the device has a connection and whether it is Wi-Fi or cellular. To know if the internet actually works, or if the connection is metered, add a reachability check or @capgo/capacitor-network-diagnostics. This guide covers all three layers with Capacitor 8 code.\nThe three questions behind “is the user online?”\n\n\n\nQuestion\nAPI\nNotes\n\n\n\n\nIs there an active network interface?\nNetwork.getStatus().connected\nFast, event-driven, says nothing about internet access\n\n\nWhat kind of link is it?\nconnectionType\nwifi, cellular, none, unknown in the official plugin\n\n\nDoes the internet actually work?\nHTTP check or internetReachable\nNeeds a request or OS validation\n\n\nShould I avoid big downloads?\nexpensive, constrained\nMetered networks and iOS Low Data Mode\n\n\n\nMost offline bugs come from treating the first row as the third. A hotel Wi-Fi with a login page reports connected: true while every API call times out.\nInstall the Network plugin\nbun add @capacitor/network\nbunx cap sync\nNo configuration is needed. On Android the plugin adds ACCESS_NETWORK_STATE to the merged manifest, a normal permission granted at install. iOS requires nothing.\nRead the current status\nimport { Network } from '@capacitor/network';\n\nconst status = await Network.getStatus();\nconsole.log(status.connected);      // true or false\nconsole.log(status.connectionType); // 'wifi' | 'cellular' | 'none' | 'unknown'\nCall it on app start before deciding whether to load from cache or network. It returns in a few milliseconds because it reads the OS state, it does not send traffic.\nListen for network changes\nimport { Network, type ConnectionStatus } from '@capacitor/network';\nimport type { PluginListenerHandle } from '@capacitor/core';\n\nlet handle: PluginListenerHandle | undefined;\n\nexport async function watchNetwork(onChange: (s: ConnectionStatus) =&gt; void) {\n  onChange(await Network.getStatus());\n  handle = await Network.addListener('networkStatusChange', onChange);\n}\n\nexport async function stopWatchingNetwork() {\n  await handle?.remove();\n}\nTwo practical details:\n\nDebounce the event. When switching from Wi-Fi to cellular, both platforms can briefly report none before the new link is up. A 1 to 2 second debounce before showing an “offline” banner avoids flicker.\nRemove listeners when a component unmounts, or you will run the callback several times after hot reloads and navigation.\n\nReact hook\nimport { useEffect, useState } from 'react';\nimport { Network, type ConnectionStatus } from '@capacitor/network';\n\nexport function useNetworkStatus() {\n  const [status, setStatus] = useState&lt;ConnectionStatus&gt;({ connected: true, connectionType: 'unknown' });\n\n  useEffect(() =&gt; {\n    let timer: ReturnType&lt;typeof setTimeout&gt;;\n    const listener = Network.addListener('networkStatusChange', (s) =&gt; {\n      clearTimeout(timer);\n      timer = setTimeout(() =&gt; setStatus(s), s.connected ? 0 : 1500);\n    });\n    Network.getStatus().then(setStatus);\n    return () =&gt; {\n      clearTimeout(timer);\n      listener.then((l) =&gt; l.remove());\n    };\n  }, []);\n\n  return status;\n}\nGoing online is applied immediately, going offline waits 1.5 seconds. The same pattern works as a Vue composable or an Angular service with a BehaviorSubject.\nWhy “connected” does not mean online\nconnected: true comes from the OS network stack. It stays true when:\n\nthe Wi-Fi network has a captive portal (airports, hotels, trains)\nthe router has no upstream connection\nDNS is broken or filtered\na corporate firewall or VPN blocks your API domain\nyour own backend is down\n\nThe fix is a reachability check against something you control:\nexport async function canReachApi(timeoutMs = 4000): Promise&lt;boolean&gt; {\n  const controller = new AbortController();\n  const timer = setTimeout(() =&gt; controller.abort(), timeoutMs);\n  try {\n    const res = await fetch('https://api.example.com/health', {\n      method: 'HEAD',\n      cache: 'no-store',\n      signal: controller.signal,\n    });\n    return res.ok;\n  } catch {\n    return false;\n  } finally {\n    clearTimeout(timer);\n  }\n}\nRun it on app start, when networkStatusChange reports connected: true, and after a request fails. Do not poll every few seconds, it drains battery and data. Make sure the health endpoint allows your app’s origin in CORS (capacitor://localhost on iOS, https://localhost on Android by default), or use CapacitorHttp to send it from native code.\nGet richer status with network diagnostics\n@capgo/capacitor-network-diagnostics reads more of what the OS knows and can run native checks that bypass WebView CORS:\nbun add @capgo/capacitor-network-diagnostics\nbunx cap sync\nimport { NetworkDiagnostics } from '@capgo/capacitor-network-diagnostics';\n\nconst status = await NetworkDiagnostics.getNetworkStatus();\n// {\n//   connected: true,\n//   connectionType: 'wifi' | 'cellular' | 'ethernet' | 'vpn' | 'other' | 'unknown' | 'none',\n//   internetReachable: true,\n//   expensive: false,      // metered / cellular\n//   constrained: false,    // iOS Low Data Mode\n//   captivePortal: false,  // Android only\n//   details: { ... }\n// }\nHow the fields map to the OS:\n\n\n\nField\nAndroid\niOS\n\n\n\n\ninternetReachable\nNET_CAPABILITY_VALIDATED (Android probed the internet)\nMirrors the NWPathMonitor path status\n\n\nexpensive\nisActiveNetworkMetered()\nNWPath.isExpensive\n\n\nconstrained\nAlways false\nNWPath.isConstrained (Low Data Mode)\n\n\ncaptivePortal\nNET_CAPABILITY_CAPTIVE_PORTAL\nNot reported\n\n\nvpn type\nYes\nYes\n\n\n\nOn Android, internetReachable is a strong signal because the OS already tested the connection. On iOS it is closer to connected, so keep the HTTP check for critical flows.\nNative reachability checks\nconst api = await NetworkDiagnostics.testUrl({\n  url: 'https://api.example.com/health',\n  method: 'HEAD',\n  timeoutMs: 4000,\n});\n// api.reachable, api.statusCode, api.durationMs, api.errorCode\n\nconst socket = await NetworkDiagnostics.testWebSocket({ url: 'wss://realtime.example.com' });\nconst port = await NetworkDiagnostics.testPort({ host: 'mqtt.example.com', port: 8883 });\nNative requests are not subject to CORS, so you can test third-party hosts too.\nA support “network report” screen\nWhen users say “the app does not work”, a one-tap diagnostic report saves hours of back and forth:\nconst report = await NetworkDiagnostics.runDiagnostics({\n  urls: [{ url: 'https://api.example.com/health' }, { url: 'https://cdn.example.com/ping' }],\n  websockets: [{ url: 'wss://realtime.example.com' }],\n  download: { url: 'https://cdn.example.com/1mb.bin', maxBytes: 1_048_576 },\n  packetLoss: { url: 'https://api.example.com/health', count: 5 },\n});\n\nconsole.log(report.issues);        // human-readable list of problems\nconsole.log(report.download?.mbps);\nconsole.log(report.packetLoss?.lossPercent);\nAttach the JSON to a support ticket. You will see right away whether the problem is DNS, a blocked WebSocket, a captive portal, or a slow link.\nAdapt to metered and Low Data Mode connections\nRespecting data limits is a quick win for reviews in markets with expensive mobile data:\nexport async function shouldPrefetchMedia() {\n  const s = await NetworkDiagnostics.getNetworkStatus();\n  if (!s.connected) return false;\n  if (s.constrained) return false; // user asked iOS to save data\n  if (s.expensive) return false;   // cellular or metered Wi-Fi\n  return true;\n}\nUse it to decide on video autoplay, image quality, background sync, and large downloads. On Android, users can mark a Wi-Fi network as metered, so do not assume Wi-Fi is free.\nBuild an offline banner\nA small banner is clearer than failing requests. Using the hook above:\nexport function OfflineBanner() {\n  const { connected } = useNetworkStatus();\n  if (connected) return null;\n  return (\n    &lt;div role=\"status\" aria-live=\"polite\" className=\"offline-banner\"&gt;\n      You are offline. Changes will sync when you reconnect.\n    &lt;/div&gt;\n  );\n}\nrole=\"status\" with aria-live=\"polite\" makes screen readers announce the change. For framework-specific UI, see our guide to building an offline screen in Vue, Angular and React.\nQueue work while offline\nDetection is only half of offline support. When the status goes offline:\n\nServe reads from local storage. A SQLite database such as @capgo/capacitor-fast-sql handles large datasets better than localStorage.\nWrite user actions to an outbox table with a timestamp and an idempotency key.\nOn networkStatusChange to connected, run canReachApi(), then flush the outbox in order.\nRetry failed requests with exponential backoff, capped at a few minutes.\n\nFor uploads that must survive the app being closed, hand them to a native uploader rather than fetch.\nWeb fallback\n@capacitor/network also runs in the browser, where it is based on navigator.onLine and the online and offline events. That means your code works in bun run dev and in a PWA without changes, but connectionType will often be unknown on the web. Chrome’s navigator.connection exposes effectiveType and saveData, Safari does not, so treat them as optional hints.\nTroubleshooting\nThe listener never fires on iOS Simulator: the simulator shares the Mac’s network. Toggle Wi-Fi on the Mac or test on a device with airplane mode.\nconnectionType is unknown on a VPN: the official plugin only reports wifi, cellular, none and unknown. Use the diagnostics plugin, which returns vpn and ethernet.\nThe app shows offline for a second when switching networks: debounce the offline transition as shown above.\nThe health check fails on device but works in the browser: CORS. Allow capacitor://localhost and https://localhost, or use NetworkDiagnostics.testUrl, which runs natively.\nnavigator.onLine is true while the plugin says offline: trust the plugin. Some Android WebViews do not update navigator.onLine reliably.\nShip offline fixes over the air\nOffline handling is mostly JavaScript: thresholds, banners, retry logic, cache rules. With Capgo live updates, you can tune those for every user the same day. Capgo downloads update bundles in the background and keeps the current version if a download fails, so a bad connection never leaves users with a half-installed update. The network diagnostics docs list every option.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-detect-the-network-status-in-a-capacitor-app/"},"keywords":"capacitor network status, capacitor network plugin, detect offline capacitor, ionic network status, capacitor networkStatusChange, capacitor internet connection check, capacitor offline mode","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-detect-the-network-status-in-a-capacitor-app/#faqpage","url":"https://capgo.app/blog/how-to-detect-the-network-status-in-a-capacitor-app/","mainEntity":[{"@type":"Question","name":"How do I check if the device is online in Capacitor?","acceptedAnswer":{"@type":"Answer","text":"Install @capacitor/network and call Network.getStatus(). It returns connected (boolean) and connectionType ('wifi', 'cellular', 'none' or 'unknown'). Add a networkStatusChange listener to react when the connection changes."}},{"@type":"Question","name":"Why does Capacitor say I am connected when nothing loads?","acceptedAnswer":{"@type":"Answer","text":"connected only means the device has an active network interface. A captive portal, a router without upstream internet, a blocked DNS or a down API all report connected: true. Confirm reachability with a short HTTP request to your own backend, or read internetReachable from @capgo/capacitor-network-diagnostics, which uses Android's validated network capability."}},{"@type":"Question","name":"Do I need any permission to read the network status?","acceptedAnswer":{"@type":"Answer","text":"No runtime permission. On Android the plugins declare ACCESS_NETWORK_STATE in their own manifest, which is a normal install-time permission. iOS needs nothing."}},{"@type":"Question","name":"Is navigator.onLine enough in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"It works for a rough signal and fires online and offline events in the WebView, but it cannot tell Wi-Fi from cellular, cannot detect metered or Low Data Mode connections, and is unreliable on some Android WebViews. Use the native plugin on device and keep navigator.onLine as a web fallback."}},{"@type":"Question","name":"How can I detect a metered or Low Data Mode connection?","acceptedAnswer":{"@type":"Answer","text":"Call NetworkDiagnostics.getNetworkStatus() from @capgo/capacitor-network-diagnostics. expensive is true for metered or cellular paths, and constrained is true when iOS Low Data Mode is on. Use these flags to skip large downloads or video autoplay."}}]}]}</script>
