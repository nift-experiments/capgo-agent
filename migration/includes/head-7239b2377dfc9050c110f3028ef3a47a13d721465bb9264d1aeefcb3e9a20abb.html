<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/public-api-json/#newsarticle","url":"https://capgo.app/blog/public-api-json/","headline":"Capgo Public API JSON Reference Guide","description":"Complete Capgo public API JSON reference for automating CapacitorJS updates. Covers schemas, authentication, channels, and CI/CD integration patterns.","image":["https://cdnimg.co/c504846a-b33a-4018-bc93-5bfa9be0f3af/d38bbe1d-16ca-4f70-856a-0e8ef624c177/public-api-json-api-guide.jpg"],"datePublished":"2026-09-30T07:30:58.555Z","dateModified":"2026-09-30T07:33:35.000Z","inLanguage":"en","articleBody":"A public API JSON interface lets software exchange structured data through HTTP requests and responses. Capgo’s typed, RESTful API gives CapacitorJS and Electron teams programmatic control over live updates, channels, bundles, and device delivery.\nTable of Contents\n\nUnderstanding Capgo Public API JSON Fundamentals\n\nWhat the Interface Controls\nWhy Typed JSON Helps\n\n\n\n\nUnderstanding Capgo Public API JSON Fundamentals\nCapgo isn’t a general-purpose data directory. Its public API JSON interface connects your build system with Capgo’s cloud delivery service, so release automation can publish and direct signed web bundles without waiting for App Store or Play review. REST uses familiar HTTP methods such as GET, POST, PUT, PATCH, and DELETE, with JSON commonly serving as the response format, as explained in this REST API guide from Postman.\n\nFor Capgo, JSON is the shared language between automation scripts, CI/CD jobs, TypeScript clients, and the delivery platform. That consistency makes payloads readable in logs and straightforward to validate before a deployment starts.\n\nWhat the Interface Controls\nUse the public API JSON endpoints to manage operational release resources, including:\n\nBundles, the web assets and metadata that make up a deployable update.\nChannels, such as staging, beta, production, or customer-specific release streams.\nVersions, which identify and track the builds assigned to those channels.\nDevice targeting, which helps direct releases to selected platforms, app versions, operating systems, or metadata groups.\nObservability data, including adoption, failures, rollback activity, and per-device status.\n\nA typical request follows a predictable sequence. Your pipeline creates or prepares a bundle, sends JSON metadata to Capgo, checks the returned status, and then assigns the release to an appropriate channel. A later query can confirm which devices received the update.\n\nKey idea: Treat Capgo JSON as a release-control contract, not merely a data format. Every field should support publishing, targeting, monitoring, or recovering an application update.\n\n\nWhy Typed JSON Helps\nTyped payloads reduce ambiguity in TypeScript codebases. A version identifier should remain a string, a rollout flag should remain a Boolean, and a device count should remain numeric. Before connecting automation, define interfaces for requests and responses, then validate required fields and nullable values.\nRead also: Learn more about using TypeScript with APIs.\nKeep three habits in every integration:\n\nInspect status codes and response bodies together, because HTTP success alone may not describe deployment completion.\nPreserve returned identifiers, especially bundle, version, and channel IDs, for subsequent calls.\nLog safely, excluding API keys and sensitive device data.\n\nThe following reference sections use this foundation to explain authentication, upload payloads, channel schemas, targeting queries, and error objects. For current endpoint names and field definitions, verify Capgo’s documentation at capgo.app.\n{\n“authorization”: “Bearer YOUR_CAPGO_API_KEY”,\n“contentType”: “application/json”,\n“accept”: “application/json”\n}\n{\n“success”: true,\n“bundleId”: “com.example.field-app”,\n“version”: “2.4.0”,\n“status”: “uploaded”,\n“bundleUuid”: “generated-bundle-identifier”,\n“createdAt”: “2026-01-15T10:30:00Z”\n}\n{\n“defaultVersion”: “2.4.3”,\n“autoUpdate”: true,\n“rollbackProtection”: {\n“enabled”: true,\n“fallbackVersion”: “2.4.2”\n}\n}\n{\n“data”: [\n{\n“timestamp”: “2026-02-04T09:00:00Z”,\n“installs”: 842,\n“rollbacks”: 3,\n“errors”: 11\n},\n{\n“timestamp”: “2026-02-04T10:00:00Z”,\n“installs”: 1276,\n“rollbacks”: 2,\n“errors”: 8\n}\n],\n“summary”: {\n“totalInstalls”: 2118,\n“totalRollbacks”: 5,\n“totalErrors”: 19\n}\n}\n{\n“error”: {\n“code”: “INVALID_PARAMETER”,\n“message”: “The ‘version’ field is required”,\n“field”: “version”,\n“details”: {\n“expected”: “string”,\n“received”: “null”\n}\n}\n}\n{\n“version”: “2.4.0”,\n“checksum”: “sha256-value”,\n“encryption”: true,\n“externalUrl”: “https://storage.example/bundle.zip”\n}\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/public-api-json/"},"keywords":"public api json, CapacitorJS updates, API automation, JSON schema, live updates","articleSection":"Mobile"}</script>
