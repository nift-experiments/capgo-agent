<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-use-better-auth-in-capacitor-apps/#newsarticle","url":"https://capgo.app/blog/how-to-use-better-auth-in-capacitor-apps/","headline":"How to Use Better Auth in Capacitor Apps (2026 Guide)","description":"Use Better Auth in a Capacitor 8 app: trusted origins, bearer tokens instead of cookies, email and password, native Google and Apple sign-in, and fixes.","image":["https://capgo.app/signup.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To use Better Auth in a Capacitor app, install the better-auth client in your web code, point it at your Better Auth server, add the Capacitor origins (capacitor://localhost on iOS, https://localhost on Android) to trustedOrigins, and switch from cookies to bearer tokens with the bearer plugin. Email and password works through the SDK as-is. For Google and Apple, get an ID token with a native plugin such as @capgo/capacitor-social-login and hand it to authClient.signIn.social({ idToken }).\nThis guide shows the server and client setup, token storage, social sign-in, enterprise providers, and the errors people hit when they move a Better Auth web app into Capacitor 8.\nWhat changes when Better Auth runs inside Capacitor\nA Capacitor app is a web app served from a local origin inside a native WebView. Compared to a normal website, three things are different:\n\n\n\nTopic\nOn a website\nIn a Capacitor app\n\n\n\n\nOrigin\nhttps://app.example.com\ncapacitor://localhost (iOS), https://localhost (Android)\n\n\nAuth server\nOften same site, cookies just work\nDifferent domain, third-party cookies are blocked by WKWebView\n\n\nOAuth redirects\nFull-page redirect is fine\nRedirect leaves your bundled app, Google blocks WebViews\n\n\n\nThe fixes are: trust the Capacitor origins, use bearer tokens, and use native plugins for social login.\nStep 1: Configure the Better Auth server\nThis example uses Hono, but the Better Auth config is the same for Express, Next.js route handlers or any other runtime.\nbun add better-auth hono\n// auth.ts\nimport { betterAuth } from 'better-auth';\nimport { bearer } from 'better-auth/plugins';\nimport { db } from './db'; // your Drizzle, Prisma, Kysely or pg instance\n\nexport const auth = betterAuth({\n  baseURL: process.env.BETTER_AUTH_URL, // https://auth.example.com\n  database: db,\n  emailAndPassword: {\n    enabled: true,\n  },\n  socialProviders: {\n    google: {\n      clientId: process.env.GOOGLE_WEB_CLIENT_ID as string,\n      clientSecret: process.env.GOOGLE_CLIENT_SECRET as string,\n    },\n    apple: {\n      clientId: process.env.APPLE_SERVICE_ID as string,\n      clientSecret: process.env.APPLE_CLIENT_SECRET as string,\n      appBundleIdentifier: process.env.APPLE_BUNDLE_ID as string, // com.example.app\n    },\n  },\n  trustedOrigins: [\n    'capacitor://localhost', // iOS WebView\n    'https://localhost', // Android WebView (androidScheme https, the default)\n    'https://app.example.com', // your web build\n    'https://appleid.apple.com',\n  ],\n  plugins: [bearer()],\n});\nappBundleIdentifier matters for Apple. Tokens from the native iOS sheet carry your bundle ID as audience, while web and Android tokens carry the Services ID. Better Auth uses this field to accept both.\nMount the handler and allow CORS from the app origins. Expose the set-auth-token header, otherwise the client never sees the bearer token:\n// server.ts\nimport { Hono } from 'hono';\nimport { cors } from 'hono/cors';\nimport { auth } from './auth';\n\nconst app = new Hono();\n\napp.use(\n  '/api/auth/*',\n  cors({\n    origin: ['capacitor://localhost', 'https://localhost', 'https://app.example.com'],\n    allowHeaders: ['Content-Type', 'Authorization'],\n    allowMethods: ['GET', 'POST', 'OPTIONS'],\n    exposeHeaders: ['set-auth-token'],\n    credentials: true,\n  }),\n);\n\napp.on(['GET', 'POST'], '/api/auth/*', (c) =&gt; auth.handler(c.req.raw));\n\nexport default app;\nRun bunx @better-auth/cli migrate (or generate for your ORM) to create the tables.\nStep 2: Create the auth client in the app\nbun add better-auth @capgo/capacitor-native-biometric\nbunx cap sync\nStore the session token in the Keychain or Keystore, and keep a copy in memory so the client can read it synchronously:\n// auth-client.ts\nimport { createAuthClient } from 'better-auth/client';\nimport { NativeBiometric } from '@capgo/capacitor-native-biometric';\n\nconst TOKEN_KEY = 'session.token';\nlet sessionToken = '';\n\nexport async function loadSessionToken() {\n  try {\n    const { value } = await NativeBiometric.getData({ key: TOKEN_KEY });\n    sessionToken = value;\n  } catch {\n    sessionToken = '';\n  }\n}\n\nasync function saveSessionToken(token: string) {\n  sessionToken = token;\n  if (token) {\n    await NativeBiometric.setData({ key: TOKEN_KEY, value: token });\n  } else {\n    await NativeBiometric.deleteData({ key: TOKEN_KEY }).catch(() =&gt; {});\n  }\n}\n\nexport const authClient = createAuthClient({\n  baseURL: 'https://auth.example.com',\n  fetchOptions: {\n    auth: {\n      type: 'Bearer',\n      token: () =&gt; sessionToken,\n    },\n    onSuccess: async (ctx) =&gt; {\n      const token = ctx.response.headers.get('set-auth-token');\n      if (token) await saveSessionToken(token);\n    },\n  },\n});\n\nexport async function clearSession() {\n  await saveSessionToken('');\n}\nCall await loadSessionToken() before your app renders, then authClient.getSession() to restore the user:\nimport { authClient, loadSessionToken } from './auth-client';\n\nawait loadSessionToken();\nconst { data: session } = await authClient.getSession();\nif (session) {\n  console.log('Signed in as', session.user.email);\n}\nIf you use React, Vue, Svelte or Solid, import createAuthClient from the matching subpath (better-auth/react, better-auth/vue, …) to get the useSession hook. The fetchOptions stay the same. The setData and getData methods are native only. On web, fall back to cookies or sessionStorage using Capacitor.isNativePlatform().\nStep 3: Email and password\nNo plugin needed. These are plain HTTP calls.\nimport { authClient, clearSession } from './auth-client';\n\nexport async function signUp(email: string, password: string, name: string) {\n  const { data, error } = await authClient.signUp.email({ email, password, name });\n  if (error) throw new Error(error.message);\n  return data;\n}\n\nexport async function signIn(email: string, password: string) {\n  const { data, error } = await authClient.signIn.email({ email, password });\n  if (error) throw new Error(error.message);\n  return data;\n}\n\nexport async function signOut() {\n  await authClient.signOut();\n  await clearSession();\n}\nFor email verification and password reset, Better Auth sends links that open a URL. Point callbackURL at a page on your domain that is also configured as an iOS Universal Link and Android App Link, so the link opens the app on phones and the website elsewhere.\nStep 4: Native Google sign-in\nConfigure Google as described in How to sign in with Google using Capacitor, then:\nimport { SocialLogin } from '@capgo/capacitor-social-login';\nimport { authClient } from './auth-client';\n\nawait SocialLogin.initialize({\n  google: {\n    webClientId: 'WEB_CLIENT_ID.apps.googleusercontent.com',\n    iOSClientId: 'IOS_CLIENT_ID.apps.googleusercontent.com',\n    mode: 'online', // Better Auth needs the idToken, offline mode only returns a code\n  },\n});\n\nexport async function signInWithGoogle() {\n  const { result } = await SocialLogin.login({ provider: 'google', options: {} });\n\n  if (result.responseType !== 'online' || !result.idToken) {\n    throw new Error('Google did not return an ID token');\n  }\n\n  const { data, error } = await authClient.signIn.social({\n    provider: 'google',\n    idToken: {\n      token: result.idToken,\n      accessToken: result.accessToken?.token,\n    },\n  });\n  if (error) throw new Error(error.message);\n  return data;\n}\nBetter Auth verifies the token against Google’s keys and the configured client ID, creates or links the user, and returns a session. The bearer token arrives in the set-auth-token header and your onSuccess hook stores it.\nStep 5: Native Apple sign-in\nConfigure Apple as described in How to sign in with Apple using Capacitor. Generate a nonce, pass it to Apple, and send the same value to Better Auth:\nimport { SocialLogin } from '@capgo/capacitor-social-login';\nimport { authClient } from './auth-client';\n\nexport async function signInWithApple() {\n  const nonce = crypto.randomUUID();\n\n  const { result } = await SocialLogin.login({\n    provider: 'apple',\n    options: { scopes: ['email', 'name'], nonce },\n  });\n\n  if (!result.idToken) throw new Error('Apple did not return an ID token');\n\n  const { data, error } = await authClient.signIn.social({\n    provider: 'apple',\n    idToken: {\n      token: result.idToken,\n      nonce,\n      accessToken: result.accessToken?.token,\n    },\n  });\n  if (error) throw new Error(error.message);\n  return data;\n}\nApple only shares the user’s name on the first authorization. If you want it on the user record, update the profile right after the first sign-in with result.profile.givenName and familyName.\nFacebook follows the same pattern. On iOS with Limited Login you get an idToken, elsewhere you pass the access token. The Better Auth integration page has the full Facebook example.\nStep 6: Okta, Auth0, Entra ID and other OIDC providers\nBetter Auth’s genericOAuth plugin ships helpers for Auth0, Okta, Keycloak and Microsoft Entra ID, plus manual config for any OIDC server. On the web build, authClient.signIn.oauth2({ providerId }) works as on any site.\nOn iOS and Android the flow needs the system browser, because the provider login page must not load inside your WebView. The pattern that works:\n\nThe app opens your Better Auth sign-in URL in the system browser (for example with SocialLogin.openSecureWindow or an in-app browser plugin).\nBetter Auth runs the OAuth dance with the provider and creates the session on the server.\nYour callback page converts that session into a short-lived one-time token (Better Auth has a oneTimeToken plugin for this) and redirects to a deep link such as com.example.app://auth?token=....\nThe app verifies the one-time token with the auth client and receives a normal bearer session.\n\nThat is more moving parts than the ID token handoff. If you only need enterprise SSO and do not need Better Auth’s user database, signing in directly against the provider is simpler, see the Okta, Auth0 and Entra ID guides.\nStep 7: Protect your API with the session\nYour own API can read the session from the bearer token with Better Auth’s server API:\nimport { Hono } from 'hono';\nimport { auth } from './auth';\n\nconst api = new Hono();\n\napi.get('/me/orders', async (c) =&gt; {\n  const session = await auth.api.getSession({ headers: c.req.raw.headers });\n  if (!session) return c.json({ error: 'unauthorized' }, 401);\n  return c.json(await listOrders(session.user.id));\n});\nThe bearer plugin makes getSession accept Authorization: Bearer &lt;token&gt; the same way it accepts the cookie.\nTroubleshooting\n\n\n\nProblem\nCause\nFix\n\n\n\n\nInvalid origin or 403 on sign-in\nCapacitor origin not trusted\nAdd capacitor://localhost and https://localhost to trustedOrigins\n\n\nCORS error in the WebView console\nServer CORS does not list the app origins\nAdd them to your CORS middleware, allow Authorization\n\n\nSign-in succeeds but getSession returns null\nRelying on cookies across domains\nUse the bearer plugin and send the token\n\n\nset-auth-token is always null\nHeader not exposed\nAdd exposeHeaders: ['set-auth-token'] to CORS\n\n\nGoogle: disallowed_useragent\nOAuth page loaded in the WebView\nUse native sign-in and the idToken handoff\n\n\nGoogle ID token rejected\nAudience does not match the configured client ID\nDecode the token with SocialLogin.decodeIdToken and compare aud with clientId\n\n\nApple ID token rejected on iOS\nAudience is the bundle ID\nSet appBundleIdentifier in the Apple provider\n\n\nApple nonce error\nDifferent nonce sent to Apple and Better Auth\nGenerate once, reuse the same value\n\n\nSession lost after app restart\nToken kept only in memory\nPersist with setData and load it before the first request\n\n\n\nDeploying the mobile side\nAuth changes are rarely native. Trusted origins and providers are server config, and the client code is TypeScript, so most fixes can ship through Capgo live updates instead of a store release. You only need a new binary when you add a native plugin or change URL schemes.\nRelated guides\n\nHow to add authentication to a Capacitor app compares Better Auth with Firebase, Supabase and hosted identity providers.\nBiometric authentication in Capacitor apps for unlocking a stored session with Face ID or fingerprint.\nSocial Login plugin for the native Google, Apple and Facebook flows.\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-use-better-auth-in-capacitor-apps/"},"keywords":"better auth capacitor, better-auth ionic, better auth mobile app, better auth bearer plugin, capacitor authentication self hosted, better auth google sign in capacitor, better auth apple sign in","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-use-better-auth-in-capacitor-apps/#faqpage","url":"https://capgo.app/blog/how-to-use-better-auth-in-capacitor-apps/","mainEntity":[{"@type":"Question","name":"Does Better Auth work in Capacitor without changes?","acceptedAnswer":{"@type":"Answer","text":"The client SDK runs in the WebView, but two things need setup. Better Auth rejects requests from origins it does not trust, so add capacitor://localhost and https://localhost to trustedOrigins. And session cookies set by a different domain are unreliable in WKWebView, so use the bearer plugin and send the session token in the Authorization header."}},{"@type":"Question","name":"Can I call authClient.signIn.social for Google inside the app?","acceptedAnswer":{"@type":"Answer","text":"Not with the default redirect flow. Google blocks OAuth in embedded WebViews with disallowed_useragent, and the redirect would navigate your app away from its bundle. Use a native sign-in plugin to get an ID token, then pass it to signIn.social with the idToken option."}},{"@type":"Question","name":"Where should I store the Better Auth session token on mobile?","acceptedAnswer":{"@type":"Answer","text":"In the iOS Keychain or Android Keystore rather than localStorage. The setData and getData methods of @capgo/capacitor-native-biometric store strings encrypted at rest, and you can keep a copy in memory for the auth client's token getter."}},{"@type":"Question","name":"Is Better Auth a good choice for enterprise SSO like Okta or Entra ID?","acceptedAnswer":{"@type":"Answer","text":"It can be. Better Auth's Generic OAuth plugin supports any OIDC provider. On native platforms the redirect has to run in the system browser and come back to the app with a deep link, which takes more wiring than social ID token sign-in. If you only need SSO and no user database, signing in directly with the provider can be simpler."}}]}]}</script>
