<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/privacy-manifest-for-ios-apps/#newsarticle","url":"https://capgo.app/blog/privacy-manifest-for-ios-apps/","headline":"Privacy Manifest for iOS Apps","description":"Learn about Apple's new Privacy Manifest requirements for iOS apps, including compliance steps and implications for developers starting May 2024.","image":["https://capgo.app/blog-images/privacy-manifest-for-ios-apps.webp"],"datePublished":"2025-05-21T11:49:21.738Z","dateModified":"2026-08-25T01:16:42.000Z","inLanguage":"en","articleBody":"Starting May 1, 2024, Apple requires all iOS apps on the App Store to include Privacy Manifests. These files, known as PrivacyInfo.xcprivacy, outline how apps and their dependencies handle user data. Non-compliance can result in app rejection or removal. Here’s what you need to know:\n\n\nWhat is a Privacy Manifest?\nA structured file that documents:\n\nData collected by your app and third-party SDKs.\nAPIs used for sensitive data or tracking.\nDomains accessed by the app.\n\n\n\nWhy does it matter?\n\nEnsures transparency in data practices.\nKeeps App Store Privacy Labels accurate.\nAvoids app review delays or rejections.\n\n\n\nKey compliance steps:\n\nUse Xcode 15 or later to create and configure the PrivacyInfo.xcprivacy file.\nDocument all APIs, data types, and tracking domains.\nObtain Privacy Manifests from third-party SDK providers.\nValidate using Xcode’s Privacy Report.\n\n\n\nDeadlines:\n\nMay 1, 2024: Enforcement began.\nApps must now include Privacy Manifests to be approved.\n\n\n\nNon-compliance risks include App Store rejection, legal issues, and loss of user trust. Tools like automated scanners and privacy generators can simplify the process. Stay proactive to ensure your app meets Apple’s privacy standards.\nWWDC23: Get started with privacy manifests | Apple\n\nApple’s Privacy Manifest Rules\nApple’s privacy manifest introduces a requirement for transparent disclosure of data collection and API usage across all components of iOS apps.\nTo comply, developers must include a PrivacyInfo.xcprivacy file that outlines three critical elements:\n\nRequired reason API declarations: Clearly state why specific APIs are being used.\nData usage categories: Specify what types of data are collected and how they are used.\nDomain usage documentation: Detail the domains accessed by the app [3].\n\nCompliance Deadlines\nApple has established firm deadlines for meeting these requirements:\n\n\n\nDate\nMilestone\n\n\n\n\nMay 1, 2024\nMandatory enforcement begins\n\n\nPost–May 2024\nOngoing monitoring continues\n\n\n\nThese dates highlight the urgency for developers to align their apps with the new rules to avoid disruptions.\nNon-Compliance Risks\nFailure to comply with these guidelines can lead to severe consequences, including:\n\nImmediate App Store rejection: Non-compliant apps will not be approved for distribution.\nLegal exposure: Non-disclosure of data practices could result in regulatory action.\nReputational damage: Users may lose trust in apps that fail to meet transparency standards [2].\n\n\n“Apps using specific APIs must declare their intended use in a privacy manifest file, effective May 1, 2024.” – Apple [6]\n\nFor developers using over-the-air (OTA) update solutions like Capgo, compliance is especially important. These update mechanisms, along with data handling practices, must be explicitly documented.\nAdditionally, every SDK and framework integrated into your app must include its own privacy manifest, outlining its data collection and API usage. During the App Store submission process, Xcode will compile these individual manifests into a unified Privacy Report [3].\nRequired Tools and Setup\nTo implement Privacy Manifests in your iOS apps, you’ll need to set up your development environment with the necessary tools and credentials. These steps will help you prepare to create a compliant PrivacyInfo.xcprivacy file.\nSystem Requirements\nMake sure you have the following installed and configured:\n\nXcode 15 or later: This is the minimum version that supports Privacy Manifests [1].\n\nAvailable on the Mac App Store (stable release).\nBeta versions can be downloaded from the Apple Developer portal [16].\n\n\nmacOS: Use a stable version to ensure compatibility with Xcode.\n\nDeveloper Credentials\nTo work with Privacy Manifests and submit your app to the App Store, you’ll need the following credentials:\n\n\n\nRequirement\nPurpose\nValidation\n\n\n\n\nApple Developer Account\nFor app submission and certificate management\nRequires an annual subscription.\n\n\nDevelopment Certificate\nEnables code signing and development builds.\nMust be valid and up to date.\n\n\nDistribution Certificate\nRequired for submitting apps to the App Store.\nNeeds renewal every 12 months.\n\n\nProvisioning Profiles\nUsed for device testing and deployment.\nMust align with the app’s bundle identifier.\n\n\n\nTo create your PrivacyInfo.xcprivacy file, open Xcode and go to New &gt; File &gt; iOS &gt; Resource &gt; App Privacy [1]. Place this file in the root directory of your app’s bundle resources to ensure it’s recognized during the build process.\nStarting in Spring 2024, Apple will require all apps submitted to App Store Connect to include approved reasons for any listed API usage [7].\nOnce your tools and credentials are ready, you can move on to building the Privacy Manifest file directly in Xcode.\nBuilding the Privacy Manifest File\nCreating a Privacy Manifest file in Xcode can be straightforward with the right steps and tools. Here’s how you can set it up and streamline the process using automation.\nXcode Setup Steps\n\n\n\nCreate the Privacy Manifest File\nOpen Xcode, navigate to File &gt; New &gt; File, and select “App Privacy File” under the Resource section. Make sure your app’s target is selected during this process [8].\n\n\nConfigure Required Keys\nAdd the following keys to your newly created PrivacyInfo.xcprivacy file:\n\n\n\nKey\nDescription\nRequired Value\n\n\n\n\nNSPrivacyTracking\nIndicates if the app uses data for tracking\nBoolean (true/false)\n\n\nNSPrivacyTrackingDomains\nLists domains used for tracking\nArray of domains\n\n\nNSPrivacyCollectedDataTypes\nData types collected\nArray of dictionaries\n\n\nNSPrivacyAccessedAPITypes\nAPI access details\nArray of dictionaries\n\n\n\n\n\nValidate Configuration\nAfter configuring the file, verify your setup by generating a privacy report in Xcode. To do this:\n\nCreate an archive by going to Product &gt; Archive.\nRight-click the generated archive.\nSelect Generate Privacy Report [8].\n\n\n\nUsing automation tools can help cut down on repetitive tasks and ensure consistency.\nAutomation Methods\nPrivado.ai Integration\nPrivado’s Privacy Manifest generator, introduced in June 2024, simplifies the process by automating code scanning and report generation. This tool:\n\nScans your code and SDK dependencies.\nMaps out data collection practices.\nAuto-fills privacy reports.\nLinks responses directly to the corresponding sections of your source code [10].\n\nApp Privacy Manifest Fixer\nLaunched in April 2025, this tool uses shell scripts to:\n\nAnalyze your manifest and automatically resolve compliance issues.\nSeamlessly integrate with your existing build processes.\nSupport custom templates for different project types [11].\n\nFor consistent results, include these tools in your project directory. This ensures smooth manifest generation across your team and CI/CD pipelines.\nWhen utilizing over-the-air updates through platforms like Capgo, ensure your Privacy Manifest reflects any data collection or API usage tied to update functionality. Maintaining transparency here is key to staying compliant with App Store requirements while benefiting from modern update features.\nData Collection and API Documentation\nOnce you’ve built your manifest file in Xcode, the next step is documenting your app’s API usage and data collection practices. This is essential not only to meet Apple’s compliance requirements but also to establish trust with your users.\nAPI Usage Documentation\nYour PrivacyInfo.xcprivacy file must list all APIs that access sensitive information. When documenting API usage in your Privacy Manifest, include both the API categories and the approved reasons for their usage.\nHere’s a quick overview of what needs to be documented:\n\n\n\nAPI Category\nCommon Usage\nRequired Documentation\n\n\n\n\nFile Timestamp\nInstall date tracking\nDeclare purpose code (e.g., C617.1)\n\n\nUser Defaults\nSettings persistence\nInclude reason code (e.g., CA92.1)\n\n\nDisk Space\nUpdate verification\nDeclare NSPrivacyAccessedAPICategoryDiskSpace usage reason\n\n\n\nThis level of detail ensures a seamless connection between your manifest file and your data collection practices.\n\n“You are responsible for all code included in your apps, per the App Store Review Guidelines. This includes any data collection and tracking practices.” - Tony, Privacy Engineering, Apple [5]\n\nWhen implementing over-the-air updates, pay particular attention to disk space API declarations. For instance, Firebase Analytics version 10.24.0 resolved ITMS-91053 errors in April 2024 by addressing issues related to NSPrivacyAccessedAPICategoryDiskSpace and NSPrivacyAccessedAPICategoryUserDefaults [12].\nData Types and Categories\nYour Privacy Manifest must clearly outline all data types collected and categorize them appropriately. Specifically, you need to document the following:\n\nWhether the data links to the user’s identity.\nWhether the data is used for tracking purposes.\nIf both apply, specify the approved purpose from Apple’s predefined list.\n\nFor apps using third-party SDKs, ensure each SDK includes its own privacy manifest. For example, Persona SDK v2.18.0+ automatically declares the following data types:\n\nCoarse location (e.g., IP address)\nDevice ID (device-level identification)\nUser ID (account-level identification)\nDiagnostic data (e.g., error logs)\nProduct interaction (e.g., flow events)\n\nTo stay compliant, regularly audit your codebase to identify APIs that require inclusion in your Privacy Manifest [13]. This kind of proactive review can help avoid submission delays and keep your app aligned with Apple’s evolving privacy standards.\nThird-Party SDK Management\nThird-party SDKs must align with Apple’s Privacy Manifest standards to comply with regulations and maintain user trust. These standards, discussed earlier, are equally important for third-party SDKs. Below, you’ll find details on managing OTA updates in Capacitor apps and ensuring SDK compliance.\nCapacitor and OTA Updates\nWhen using over-the-air (OTA) updates in Capacitor apps, it’s crucial to configure your privacy manifest accurately. For apps employing live update solutions, you need to declare specific API usage in the privacy manifest:\n\n\n\nAPI Category\nRequired Declaration\nPurpose\n\n\n\n\nDisk Space\nNSPrivacyAccessedAPICategoryDiskSpace\nUpdate package storage\n\n\nUser Defaults\nNSPrivacyAccessedAPICategoryUserDefaults\nUpdate configuration\n\n\nNetwork Access\nNSPrivacyAccessedAPICategoryNetworkInformation\nUpdate delivery\n\n\n\nCapgo simplifies this process by integrating privacy manifest compliance into its OTA update system. It automatically declares the required APIs and data access, ensuring your app remains compliant while benefiting from real-time updates.\nNow, let’s explore the key steps for verifying SDK compliance.\nSDK Compliance Checks\nAfter addressing OTA update declarations, it’s essential to ensure all integrated SDKs meet the necessary standards. With 88% of organizations using thousands of cloud apps [16], robust SDK compliance checks are a must.\n\n\nAutomated Scanning\nUse tools like Ostorlab.co to scan your app’s IPA file [1]. This complements the insights provided by your Xcode Privacy Report, offering a thorough analysis of your app’s compliance.\n\n\nVersion Management\nIf an SDK lacks a privacy manifest, you’ll need to manually declare its data usage in your app’s PrivacyInfo.xcprivacy file [14]. This step ensures transparency and adherence to Apple’s guidelines.\n\n\nSecurity Implementation\nMismanaged SDKs can lead to significant consequences. For instance, Tilting Point Media faced a $500,000 settlement on June 18, 2024, for CCPA and COPPA violations due to improperly configured SDKs [15]. To avoid similar pitfalls:\n\nEncrypt sensitive data before it’s handled by SDKs.\nApply least-privilege access principles to limit unnecessary permissions.\nContinuously monitor SDK usage within your app.\nRegularly audit SDK policies to ensure they remain compliant.\n\n\n\nTesting and Submission Process\nBefore you submit your app, you’ll need to test your Privacy Manifest implementation following Apple’s required procedures, effective May 1, 2024 [9].\nXcode Privacy Report\nOnce you’ve set up your Privacy Manifest, the next step is testing its accuracy. Using Xcode 15, archive your project and generate a Privacy Report [8]. This report provides an overview of your app’s declared data types, SDK practices, API usage, and tracking domains.\n\n“Xcode 15 can aggregate all the privacy manifests in your app’s project, and produce a privacy report that summarizes the declared data uses… This helps you review, understand, and describe the privacy practices of your app and its dependencies.” - Tony, Privacy Engineering, Apple [5]\n\nFor further validation, you can use the Points of Interest instrument in Xcode 15 to detect any connections to tracking domains [5].\nSubmission Requirements\nAfter reviewing the Privacy Report, ensure the following key components are ready for submission:\n\n\n\nRequirement\nDescription\nVerification Method\n\n\n\n\nPrivacy Manifest File\n.plist file documenting data collection\nConfirm file presence in Xcode\n\n\nSDK Compliance\nPrivacy-impacting SDKs must include manifests\nCheck SDK documentation\n\n\nAPI Usage Declaration\nApproved reasons for Required Reason APIs\nMatch Privacy Report with App Store data\n\n\nSDK Signatures\nPrivacy-impacting SDKs must be signed\nVerify SDK signatures\n\n\n\nImportant Steps to Verify:\n\nLink the Privacy Manifest to your app target [17].\nConfirm that third-party SDKs include their privacy bundles [17].\nAccurately document and declare all tracking domains [5].\n\n\n“Check that the privacy manifest matches your understanding of the third-party SDK’s functionality.” - Tony, Privacy Engineering at Apple [5]\n\nFor a practical example, take the CodeWithChris team. In October 2023, they successfully implemented Apple’s privacy requirements while building their mood tracker app. They relied on Xcode’s privacy report to ensure every aspect of their app met Apple’s new standards before submission [18].\nUpdates and Maintenance\nKeeping your Privacy Manifest up-to-date is just as important as maintaining your app’s codebase. As privacy policies evolve, regular updates ensure compliance and streamline the approval process.\nPolicy Update Tracking\nStaying aligned with Apple’s privacy policies is critical for maintaining App Store compliance. Since the May 1, 2024 enforcement deadline, developers have been required to keep a close eye on changes to privacy regulations and API specifications.\n\n\n\nUpdate Type\nMonitoring Method\nAction Required\n\n\n\n\nApple Policy Changes\nDeveloper Portal Notifications\nReview manifest compliance\n\n\nSDK Changes\nRelease Notes review\nUpdate privacy bundles\n\n\nAPI Requirements\nXcode Release Notes\nVerify Required Reason APIs\n\n\n\nFor instance, InMobi’s SDK version 10.7.2 included a detailed privacy manifest, which serves as a strong example of third-party documentation [4].\n\n“Developers are responsible for all code included in their apps” - Apple [4]\n\nVersion Control\nBeyond monitoring policy updates, systematic version control is essential for ensuring long-term compliance with Apple’s evolving requirements. This step builds on earlier measures, helping developers maintain consistency and accountability.\n\n\nAutomated Verification\nAutomated checks can improve deployment success rates by identifying compliance issues in real time. They also enable quick rollbacks if problems arise, reducing downtime.\n\n\nSDK Integration Tracking\nKeep a detailed log of SDK versions and their associated privacy manifests. For example, Spotify’s mobile team reduced app crashes by 15% over 30 days through precise SDK tracking and targeted fixes in August 2024 [20].\n\n\nChange Management\nDocument every change thoroughly:\n\nRecord the reasons for updates\nNote affected APIs and data types\nMaintain an audit trail to simplify compliance reviews\n\n\n\nUsing version control tools with automated build and version management capabilities can make this process smoother. For example, Appcircle’s versioning system allows developers to manage build numbers and track versions through environment variables or Xcode integration [20].\nSummary and Resources\nStaying compliant with Apple’s privacy standards requires ongoing attention and the right tools. Managing a Privacy Manifest is not a one-and-done task - it demands accuracy and regular updates. Recent findings reveal that many developers still fall short of compliance [1].\nHere are some essential tools and resources to help streamline implementation:\n\n\n\nResource Type\nPurpose\nAccess Method\n\n\n\n\nXcode Privacy Report\nValidate privacy manifests\nXcode 15+\n\n\nApple Developer Portal\nStay updated on policies\nDeveloper account\n\n\nWWDC Sessions\nGet technical guidance\nApple Developer app\n\n\nSDK Documentation\nEnsure third-party compliance\nIndividual SDK portals\n\n\n\nThese tools simplify the process of maintaining compliance, especially when it comes to validation and documentation. Developers can also explore automated solutions for privacy manifest management. For instance, Capgo provides a live update feature for Capacitor apps, enabling quick updates while adhering to App Store requirements.\nStarting in Spring 2024, Apple will require apps to resolve all privacy manifest and Required Reason API issues before they can be submitted or updated in the App Store [5]. To stay ahead, developers should:\n\nCollect privacy manifests from third-party SDK providers.\nDocument all tracking domains and Required Reason API usage.\nRegularly validate manifests using Xcode’s privacy report.\nKeep thorough records of data collection practices.\n\nFor further guidance, these resources are indispensable:\n\nApple Developer Website: Access updates on privacy requirements and policy changes [19].\nApp Store Connect: Review submission guidelines and requirements [19].\nWWDC Videos: Watch technical sessions for privacy-related insights [21].\n\nFAQs\n::: faq\nWhat happens if iOS app developers don’t meet Apple’s Privacy Manifest requirements by May 1, 2024?\nFailing to meet Apple’s Privacy Manifest requirements by May 1, 2024, could have serious repercussions for iOS app developers. Your app might face rejection during the App Store review process, lose certain features, or even be removed from the store altogether.\nBeyond that, non-compliance could subject future app submissions to greater scrutiny, potentially delaying approval times. These setbacks don’t just affect your app’s availability - they can also erode user trust and diminish your app’s presence in the marketplace. Staying ahead of the deadline helps ensure your app remains compliant and accessible to your audience.\n:::\n::: faq\nHow can developers ensure third-party SDKs in their iOS apps meet Apple’s Privacy Manifest requirements?\nTo meet Apple’s Privacy Manifest requirements, developers must include a PrivacyInfo.xcprivacy file in their app or SDK. This file needs to clearly detail the types of data being collected and explain the purpose behind using specific APIs. Additionally, developers should confirm whether the third-party SDKs they rely on fall under Apple’s guidelines for requiring a privacy manifest and signature.\nStarting May 1, 2024, every app submitted to the App Store must comply with these rules. It’s important for developers to work closely with their SDK providers to ensure accurate reporting of data practices, making it easier to align with the app’s privacy manifest. Following these steps not only helps avoid App Store rejections but also fosters user trust by promoting transparency in data handling.\n:::\n::: faq\nHow can developers create and maintain a Privacy Manifest for their iOS apps to comply with Apple’s policies?\nDevelopers working on iOS apps can create and manage a Privacy Manifest by adhering to Apple’s guidelines and utilizing available tools. Apple’s official documentation provides detailed instructions on setting up a PrivacyInfo.xcprivacy file, which specifies the data your app collects and any third-party SDKs in use. For step-by-step assistance, Apple’s WWDC23 video on privacy manifests is an excellent resource, covering how to identify privacy practices and generate privacy reports using Xcode 15 or later.\nTo streamline compliance, tools such as mobile app consent software can help manage SDKs and ensure proper user consent is obtained. These tools make it easier to stay aligned with Apple’s data-sharing policies while fostering transparency with users. For developers using Capacitor apps, platforms like Capgo offer real-time update capabilities while maintaining compliance with privacy requirements.\n:::\nKeep going from Privacy Manifest for iOS Apps\nIf you are using Privacy Manifest for iOS Apps to plan security and compliance, connect it with Encryption for the implementation detail in Encryption, Compliance for the implementation detail in Compliance, Capgo Security Scanner for the product workflow in Capgo Security Scanner, Capgo Security for the product workflow in Capgo Security, and Capgo Trust Center for the product workflow in Capgo Trust Center.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/privacy-manifest-for-ios-apps/"},"keywords":"Privacy Manifest, iOS apps, data privacy, Apple guidelines, app compliance, developer resources","articleSection":"Development"}</script>
