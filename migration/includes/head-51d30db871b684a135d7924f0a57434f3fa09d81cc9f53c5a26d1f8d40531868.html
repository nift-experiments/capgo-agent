<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/apple-intelligence-capacitor-app/#newsarticle","url":"https://capgo.app/blog/apple-intelligence-capacitor-app/","headline":"How to Use Apple Intelligence in a Capacitor App","description":"Use Apple Intelligence in a Capacitor app via the Foundation Models framework on iOS 26: device checks, streaming, context limits, and errors.","image":["https://capgo.app/blog-images/capacitor-ai-mobile-apps.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To use Apple Intelligence in a Capacitor app, install @capgo/capacitor-llm, call setModel({ path: 'Apple Intelligence' }), check getReadiness(), then create a chat and stream replies through the textFromAi event. Under the hood the plugin uses Apple’s Foundation Models framework, introduced with iOS 26, which runs Apple’s on-device language model with no API key, no cost per request, and no data leaving the phone.\nThis guide covers what the framework offers, device requirements, a complete TypeScript integration, the 4,096-token context window, error handling, App Review notes, and how the same code runs on Android.\nWhat Apple Intelligence offers app developers\nWith iOS 26, Apple opened its on-device foundation model to third-party apps through the Foundation Models framework. In Swift you work with SystemLanguageModel and LanguageModelSession. The plugin wraps those so your web code can use them:\n\n\n\nFoundation Models concept\nPlugin equivalent\n\n\n\n\nSystemLanguageModel.default.availability\ngetReadiness()\n\n\nLanguageModelSession\ncreateChat() returns an id\n\n\nsession.streamResponse(to:)\nsendMessage() plus textFromAi events\n\n\nErrors thrown during generation\ngenerationError event and a rejected sendMessage\n\n\n\nThe model is roughly 3 billion parameters. It is good at summarizing, rewriting, extracting, classifying, and short-form generation. It is not a replacement for a large cloud model on open-ended knowledge questions, and Apple says as much in its own guidance. Design features around text the user already has.\nDevice and OS requirements\n\n\n\nRequirement\nDetail\n\n\n\n\niPhone\niPhone 15 Pro, 15 Pro Max, and iPhone 16 models and later\n\n\niPad\niPad mini (A17 Pro), iPads with M1 and later\n\n\nMac\nApple silicon Macs (relevant for testing in the Simulator)\n\n\nOS\niOS 26 / iPadOS 26 or later\n\n\nSetting\nApple Intelligence turned on in Settings &gt; Apple Intelligence &amp; Siri\n\n\nLanguage\nDevice and Siri language set to a language Apple Intelligence supports\n\n\nStorage\nApple lists about 7 GB of free space for Apple Intelligence models\n\n\nToolchain\nXcode 26, which App Store Connect also requires for uploads since April 2026\n\n\n\nIf your project still builds with an older Xcode, see Apple’s Xcode 26 requirement for Capacitor apps. Your app’s minimum deployment target does not need to change. The plugin supports iOS 15 and later and only touches Foundation Models on iOS 26.\nInstall the plugin\nbun add @capgo/capacitor-llm\nbunx cap sync ios\nUse plugin 8.x with Capacitor 8. No Info.plist keys or entitlements are needed for Apple Intelligence. If you are still on Capacitor 7, the Capacitor 8 upgrade guide comes first. Reference docs: /docs/plugins/llm/.\nStep 1: Select the model and check availability\nsetModel({ path: 'Apple Intelligence' }) selects the system model and resolves right away. Actual availability comes from getReadiness(), which maps Apple’s availability enum to readable strings:\n\n\n\nreadiness value\nMeaning\nWhat to show\n\n\n\n\nready\nModel available\nThe feature\n\n\nDevice is not eligible for Apple Intelligence\nHardware not supported\nHide the feature or use a cloud fallback\n\n\nApple Intelligence is not enabled\nUser turned it off\nA hint to enable it in Settings\n\n\nModel is not ready\nModel still downloading or preparing\n“Preparing”, retry later\n\n\nApple Intelligence requires iOS 26.0 or later\nOlder iOS\nHide the feature\n\n\n\nimport { Capacitor } from '@capacitor/core';\nimport { CapgoLLM } from '@capgo/capacitor-llm';\n\nexport type AIState = 'ready' | 'enable-in-settings' | 'preparing' | 'unsupported';\n\nexport async function initAppleIntelligence(): Promise&lt;AIState&gt; {\n  if (Capacitor.getPlatform() !== 'ios') return 'unsupported';\n\n  await CapgoLLM.setModel({ path: 'Apple Intelligence' });\n  const { readiness } = await CapgoLLM.getReadiness();\n\n  if (readiness === 'ready') return 'ready';\n  if (readiness.includes('not enabled')) return 'enable-in-settings';\n  if (readiness.includes('not ready')) return 'preparing';\n  return 'unsupported';\n}\nCheck again when the app returns to the foreground. Users often enable Apple Intelligence after seeing your hint, and the model download can finish while your app is in the background.\nimport { App } from '@capacitor/app';\n\nApp.addListener('appStateChange', async ({ isActive }) =&gt; {\n  if (isActive) updateAIState(await initAppleIntelligence());\n});\nStep 2: Create a chat with instructions\nA chat maps to one LanguageModelSession, which keeps the conversation history. The typed createChat() takes no options, so put your instructions at the start of the first message:\nconst INSTRUCTIONS =\n  'You summarize meeting notes. Reply with at most 5 bullet points. ' +\n  'Keep names and dates exactly as written. Do not add information.';\n\nconst { id: chatId } = await CapgoLLM.createChat();\nUse one chat per task. A chat that keeps growing will eventually hit the context limit described below.\nStep 3: Stream the response into the UI\nOn iOS, each textFromAi event carries a snapshot of the response so far, because that is how Foundation Models streams. On Android with Gemini Nano, events carry only the new text. This helper handles both and resolves with the final text:\nimport { CapgoLLM } from '@capgo/capacitor-llm';\n\nfunction mergeChunk(current: string, chunk: string) {\n  return chunk.startsWith(current) ? chunk : current + chunk;\n}\n\nexport async function ask(chatId: string, message: string, onText: (t: string) =&gt; void) {\n  let text = '';\n  let finish!: (value: string) =&gt; void;\n  let fail!: (error: Error) =&gt; void;\n  const done = new Promise&lt;string&gt;((resolve, reject) =&gt; {\n    finish = resolve;\n    fail = reject;\n  });\n\n  const handles = await Promise.all([\n    CapgoLLM.addListener('textFromAi', (e) =&gt; {\n      if (e.chatId !== chatId) return;\n      text = mergeChunk(text, e.text);\n      onText(text);\n    }),\n    CapgoLLM.addListener('aiFinished', (e) =&gt; {\n      if (e.chatId === chatId) finish(text);\n    }),\n    CapgoLLM.addListener('generationError', (e) =&gt; {\n      if (!e.chatId || e.chatId === chatId) fail(new Error(e.error));\n    }),\n  ]);\n\n  try {\n    await CapgoLLM.sendMessage({ chatId, message });\n    return await done;\n  } finally {\n    await Promise.all(handles.map((h) =&gt; h.remove()));\n  }\n}\nPutting it together: summarize notes on device\nexport async function summarizeNotes(notes: string, render: (t: string) =&gt; void) {\n  const state = await initAppleIntelligence();\n  if (state !== 'ready') throw new Error(`AI unavailable: ${state}`);\n\n  const { id } = await CapgoLLM.createChat();\n  const prompt = `${INSTRUCTIONS}\\n\\nNotes:\\n${notes.slice(0, 8000)}\\n\\nSummary:`;\n  return ask(id, prompt, render);\n}\nThe slice is a crude guard against huge inputs. A better approach is to summarize long documents in chunks and then summarize the summaries, each in a fresh chat.\nIn a framework component, disable the button while ask runs. The plugin rejects a second sendMessage on the same chat with “chat is responding, please wait before asking new questions”.\nThe 4,096-token context window\nThe on-device model has a context window of 4,096 tokens. Everything counts toward it: instructions, every previous turn in the chat, the new prompt, and the response being generated. When a session exceeds it, Foundation Models throws an “exceeded context window size” error, which reaches you as a generationError event and a rejected sendMessage.\nPractical rules:\n\nOne chat per task, not one chat per screen.\nKeep instructions short and specific.\nFor multi-turn chat, start a new chat when it gets long and pass a short summary of the earlier conversation.\nAsk for concise output. Long answers use the same budget.\n\nTuning output\nOn the Apple Intelligence path the plugin uses the system’s default generation settings. temperature, topk, and maxTokens in setModel apply to the custom LiteRT-LM and MediaPipe model paths. To steer Apple’s model, rely on the prompt: say how long the answer should be, give the format (bullets, JSON, one sentence), and include one short example when the format matters.\nThe same code on Android\nOnly the model selection changes:\nconst path = Capacitor.getPlatform() === 'ios' ? 'Apple Intelligence' : 'Gemini Nano';\nawait CapgoLLM.setModel({ path });\nOn Android, setModel rejects when Gemini Nano is not available, and you can fall back to a downloadable Gemma model through the same plugin. The details are in how to use Gemini Nano in a Capacitor app.\nTesting\n\nReal device: the reliable path. Use a supported iPhone on iOS 26 with Apple Intelligence on.\nSimulator: it can use the model when the host Mac runs macOS 26 on Apple silicon with Apple Intelligence enabled. Behavior and speed differ from a phone, so confirm on hardware.\nUnsupported states: test with Apple Intelligence turned off to check your “enable in Settings” UI, and on an older iPhone or iOS version to check that the feature hides cleanly.\n\nApp Review and privacy\nPrompts and responses stay on the device, so on-device generation adds no data collection to your privacy label by itself. Two things are still on you:\n\nApple publishes acceptable use requirements for the Foundation Models framework. Read them before you ship, especially for features that generate content shown to other users.\nThe model has built-in guardrails and may refuse some prompts or outputs. Treat a refusal as a normal result and show a clear message.\n\nSince prompts are plain strings in your web code, you can improve them after launch with Capgo live updates instead of waiting for a new App Store build. Changes to native code, including plugin upgrades, still need a store release, which you can build in the cloud with Capgo Build.\nCommon errors and fixes\n\n\n\nSymptom\nLikely cause\nFix\n\n\n\n\nreadiness is “Device is not eligible”\niPhone older than 15 Pro or unsupported iPad\nHide the feature or use a server model\n\n\nreadiness is “not enabled”\nUser turned Apple Intelligence off\nShow a Settings hint, recheck on resume\n\n\nreadiness is “Model is not ready”\nModel still downloading\nShow a preparing state, retry later\n\n\nsendMessage rejects “error deviceNotEligible error”\nSending without checking readiness\nGate on getReadiness() first\n\n\n“chat not found”\nChat created before a new setModel call\nCalling setModel clears chats, create a new one\n\n\n“chat is responding”\nSecond message sent during streaming\nDisable input until aiFinished\n\n\ngenerationError mentioning context window\nChat too long\nStart a new chat with a summary\n\n\nBuild error about Foundation Models\nXcode older than 26\nUpdate Xcode or build in the cloud\n\n\n\nWrap-up\nApple Intelligence brings a free, private, offline language model to every eligible iPhone on iOS 26, and a Capacitor app can use it with a few lines of TypeScript. Select the model, gate the UI on getReadiness(), keep each task in its own short chat, stream snapshots into the UI, and handle refusals and context errors as normal outcomes. For a broader take on shipping AI features in hybrid apps, read why Capacitor works well for AI mobile apps.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/apple-intelligence-capacitor-app/"},"keywords":"Apple Intelligence Capacitor, Foundation Models framework Capacitor, on-device AI iOS 26, Capacitor LLM plugin, Ionic Apple Intelligence, SystemLanguageModel, local LLM iPhone","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/apple-intelligence-capacitor-app/#faqpage","url":"https://capgo.app/blog/apple-intelligence-capacitor-app/","mainEntity":[{"@type":"Question","name":"Does Apple Intelligence text generation work offline?","acceptedAnswer":{"@type":"Answer","text":"Yes. The Foundation Models framework runs Apple's on-device model, so generation works without a network connection once Apple Intelligence is enabled and its model is downloaded."}},{"@type":"Question","name":"Can I use the Foundation Models framework on iOS 18?","acceptedAnswer":{"@type":"Answer","text":"No. The framework requires iOS 26. Your Capacitor app can still support older iOS versions, because the plugin only calls Foundation Models when it is available and reports a readiness message otherwise."}},{"@type":"Question","name":"Which iPhones support Apple Intelligence for developers?","acceptedAnswer":{"@type":"Answer","text":"iPhone 15 Pro and 15 Pro Max, and iPhone 16 models and later, running iOS 26 with Apple Intelligence turned on. iPads with M1 or later and iPad mini with A17 Pro also qualify."}},{"@type":"Question","name":"Does using Apple Intelligence cost anything?","acceptedAnswer":{"@type":"Answer","text":"No. The on-device model is free to use, with no API key and no per-token billing. @capgo/capacitor-llm is open source as well."}},{"@type":"Question","name":"Does the same code work on Android?","acceptedAnswer":{"@type":"Answer","text":"Yes. With @capgo/capacitor-llm you switch the model path to 'Gemini Nano' on supported Android phones, or load a Gemma model, and keep the same chat and event code."}}]}]}</script>
