<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/google-play-obfuscation-capacitor-android/#newsarticle","url":"https://capgo.app/blog/google-play-obfuscation-capacitor-android/","headline":"Fix Google Play Obfuscation Below 25% in Capacitor Apps","description":"Pass Google Play's 25% obfuscation check in a Capacitor Android app by enabling R8, shrinking unused DEX, and shipping a release App Bundle.","image":["https://capgo.app/blog-images/google-play-obfuscation-capacitor-android.png"],"datePublished":"2026-09-02T11:47:00.000Z","dateModified":"2026-09-02T15:39:27.000Z","inLanguage":"en","articleBody":"Play Console is now flagging Capacitor Android apps for App optimization is below our threshold, often with Obfuscation stuck around 3%. Google wants at least 25% obfuscation, optimization, and shrinking. Enforcement starts in February 2027, and failing it can reduce visibility and publishing options.\nThe warning looks like this in Android vitals:\n\nThis is a native Android DEX issue. It is not about your Vue, React, or Angular bundle. Capgo live updates also do not change this score. You fix it in the Android Gradle release build, then upload a new App Bundle.\nWhat Google is measuring\nGoogle Play inspects the DEX in your Android App Bundle: compiled Java and Kotlin, including Capacitor, plugins, and AndroidX. From February 2027, apps with more than 10 MB of DEX must hit 25% on all three:\n\n\n\nMetric\nWhat it means\nTypical Capacitor cause of a low score\n\n\n\n\nObfuscation\nClass, field, and method names renamed to short names\nminifyEnabled is still false\n\n\nOptimization\nR8 inlines, merges, and rewrites bytecode\nDefault proguard-android.txt includes -dontoptimize\n\n\nShrinking\nUnused classes and methods removed\nResource/code shrinking never turned on\n\n\n\nPlay reads r8.json when you build with the latest patch of Android Gradle Plugin 8.10 or higher. Otherwise it uses mapping.txt, then DEX heuristics. A Capacitor app shipped with minification off has almost no mapping file, so Play sees readable names and reports a few percent obfuscation (often leftover from already-obfuscated library AARs). That matches a 3% vitals score.\nOfficial policy: Play Console technical quality requirements. Implementation detail: DEX code optimization and enable app optimization with R8.\nWhy Capacitor apps fail this check\nThe Capacitor Android template still ships release builds without R8:\nbuildTypes {\n    release {\n        minifyEnabled false\n        proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n    }\n}\nThat is the default in android-template/app/build.gradle. Debug builds should stay this way. Release builds should not, if you publish to Play.\nYour JavaScript is already minified by Vite or webpack. Play does not count that. Only native DEX names, unused native code, and R8 optimizations count.\nStep 1 — Turn R8 on for release\nOpen android/app/build.gradle (Groovy is the Capacitor default) and change the release block:\nbuildTypes {\n    release {\n        minifyEnabled true\n        shrinkResources true\n        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n    }\n}\nIf the module uses Kotlin DSL (build.gradle.kts):\nbuildTypes {\n    getByName(\"release\") {\n        isMinifyEnabled = true\n        isShrinkResources = true\n        proguardFiles(\n            getDefaultProguardFile(\"proguard-android-optimize.txt\"),\n            \"proguard-rules.pro\"\n        )\n    }\n}\nThree details matter:\n\nminifyEnabled true is what actually runs R8 (shrink + obfuscate + optimize).\nshrinkResources true removes unused Android resources. It requires minification.\nFor this R8 setup, use proguard-android-optimize.txt. proguard-android.txt ships -dontoptimize, which blocks R8 optimizations and fails AGP 9. Play allows any shrinker; Capacitor apps should use R8 with the optimize defaults. See Capacitor Plugin AGP 9 Build Error Fix if a plugin still references the old file.\n\nDo not set minifyEnabled true on debug. Release-only keeps local runs fast and stack traces readable.\nStep 2 — Do not disable R8 full mode\nOpen android/gradle.properties and remove this line if it exists:\nandroid.enableR8.fullMode=false\nAGP 8+ already enables full mode. Leaving that flag in place caps optimization.\nAlso search android/app/proguard-rules.pro (and any extra -include files) for:\n-dontobfuscate\n-dontoptimize\n-dontshrink\n-keep class ** { *; }\nThose rules will keep Play scores low even after you flip minifyEnabled. Delete them unless you have a documented, temporary reason.\nStep 3 — Keep Capacitor plugins, not the whole app\nR8 uses reflection metadata. Capacitor plugins are discovered by annotations, so they need keep rules. You usually do not add them yourself. Since Capacitor 3.2.3, @capacitor/android ships consumer ProGuard rules that keep:\n\n@CapacitorPlugin classes, @PluginMethod, permission and activity callbacks\nClasses that extend com.getcapacitor.Plugin\nLegacy @NativePlugin and Cordova plugin classes\n\nStay on a current Capacitor 6/7/8 line so those consumer rules are applied.\nAdd extra rules in android/app/proguard-rules.pro only for a crash you can reproduce in a release build. Narrow beats broad:\n# Good: one misbehaving plugin package\n-keep class com.mycompany.myplugin.** { *; }\n\n# Bad: this will tank obfuscation and shrinking\n-keep class com.getcapacitor.** { *; }\n-keep class ** { *; }\nIf a third-party plugin still crashes after a targeted keep rule, update the plugin, then consider a maintained alternative from the Capgo plugin directory, or ask Capgo Consulting to patch it.\nOfficial Capacitor notes: Using ProGuard.\nStep 4 — Build a real release bundle\nDebug APKs will still show ~0% obfuscation. Play only grades what you upload.\nFrom the project root:\nnpm run build\nnpx cap sync android\ncd android\n./gradlew bundleRelease\nWithout a release signingConfig, these tasks still succeed but emit an unsigned .aab. Sign it in Android Studio before the Play upload.\nInstall a release APK on a device (./gradlew assembleRelease, then the APK under app/build/outputs/apk/release/). An .aab is a Play upload format, not something you sideload. Exercise native plugins (camera, push, file, billing, auth). R8 bugs do not show up in npx cap run android debug sessions.\nAfter the Gradle commands above (you are in android/), confirm R8 actually ran:\n\napp/build/outputs/mapping/release/mapping.txt\napp/build/outputs/mapping/release/configuration.txt\nOn the latest patch of AGP 8.10 or higher, r8.json inside the App Bundle\n\nThose release folders are the default Capacitor variant. With product flavors, mapping is under the variant name (mapping/freeRelease/). The APK is under apk/&lt;flavor&gt;/release/ (for example apk/free/release/).\nIf mapping.txt is missing, you are in the wrong variant folder, CI assembled debug, or R8 ran with -dontobfuscate. Recheck minifyEnabled true on release and that keep rules do not disable obfuscation.\nStep 5 — Keep crash reports readable\nObfuscated stack traces are useless without the mapping file. Keep mapping.txt for each Play version:\n\nPlay Console: Test and release → App bundle explorer → Downloads → Assets, then upload mapping.txt if it is not already attached.\nFirebase Crashlytics / Sentry: upload the same mapping as part of CI.\n\nAndroid Studio / AGP often embeds mapping in the .aab. Still verify the Assets tab after the first optimized upload.\nStep 6 — Upload and re-check Play\nUpload the new .aab to an internal testing track (production is not required to refresh the score). Open:\n\nTest and release → App bundle explorer for that version\nDEX size plus obfuscation / optimization / shrinking percentages\nMonitor and improve → Android vitals after the new version is the one Play analyzes\n\nYou need 25% on each of the three metrics, not only obfuscation. Enabling R8 with proguard-android-optimize.txt usually jumps a Capacitor app from single-digit obfuscation to well above 25% on all three.\nPlay only enforces the 25% floor when DEX is over 10 MB for apps (50 MB for games). Even below that floor, fixing it is still worth doing: smaller DEX, less memory, faster startup.\nIf you are still under 25%\nR8 is on, but Play (or the local analyzer) still shows a weak score. Broad keep rules are the usual leftover.\n\nOpen R8 Configuration Analyzer if your Android Gradle Plugin is 9.3 or newer — assembleRelease then writes configanalyzer.html next to mapping.txt. On AGP 9.2 and earlier, skip that HTML file and use mapping.txt, APK Analyzer, and Play’s App bundle explorer instead.\nSort keep rules by how much of the app they freeze. Library consumer rules you cannot edit are normal. App-level -keep class com.foo.** { *; } is not.\nOpen the .aab in Android Studio APK Analyzer, select the large .dex files, and toggle deobfuscated names (needs mapping.txt). Packages that stay huge and readable are the packages to stop keeping wholesale.\nUpdate plugins that still reference proguard-android.txt. That file blocks optimization on AGP 9 and is a red flag in older plugins.\n\nDo not “fix” a low score by shrinking DEX with minifyEnabled false and hoping heuristics change. Play wants shrinking, optimization, and obfuscation.\nWhat this does not replace\n\nJavaScript minification in vite.config.ts does not move this metric.\nCapgo live updates ship HTML/JS/CSS. They do not rebuild DEX. After R8 is on in the store binary, you can still ship JS fixes over the air. The obfuscation check itself needs one native Play upload.\n16 KB page size is a separate Play native requirement. See Android 16 KB page size.\n\nIf you already build Android with Capgo Build, change android/app/build.gradle in the repo. The next cloud build picks up R8. You do not need a different Play pipeline, only a release binary produced with minification on. Same idea if you keep GitHub Actions Android builds: the workflow must assemble release, not debug.\nFAQ\nWill enabling R8 break my Capacitor plugins?\nIt can, if a plugin uses reflection and ships no consumer keep rules. Core Capacitor already keeps plugin classes. Test a release build. Add a narrow keep rule only for the package that crashes. If the plugin is unmaintained, Capgo Consulting can fork and keep it building.\nDoes npx cap run prove I passed the check?\nNo. That command uses a debug build with R8 off. Use bundleRelease / a signed Play upload.\nWe already set minifyEnabled true and still see 3%. Why?\nSearch for -dontobfuscate, proguard-android.txt, android.enableR8.fullMode=false, and blanket -keep rules. Confirm CI uploaded the minified AAB, not an old artifact.\nDo we need ProGuard instead of R8?\nNo. R8 is the Android Gradle Plugin shrinker. It reads ProGuard-style rule files. Google’s Play docs allow any shrinker; R8 is the one Capacitor apps should use.\nChecklist\n\n release { minifyEnabled true; shrinkResources true }\n proguard-android-optimize.txt (not proguard-android.txt)\n No -dontobfuscate / -dontoptimize / app-wide -keep class **\n Capacitor 3.2.3+ so plugin consumer rules apply\n Release build produces mapping.txt\n Native plugins tested on a release install\n New .aab uploaded; mapping attached in App bundle explorer\n Obfuscation, optimization, and shrinking each at 25%+\n\nThat is the whole Play Console warning: Capacitor left R8 off, Play started scoring DEX, and a one-line release Gradle change plus a store upload is the fix.\nKeep going from Fix Google Play Obfuscation Below 25% in Capacitor Apps\nIf you are using Fix Google Play Obfuscation Below 25% in Capacitor Apps to plan Android store releases, connect it with Capgo Native Builds for release App Bundles, Capgo CI/CD for the upload pipeline, CI/CD Integration for implementation detail, Automatic Capacitor Android build with GitHub actions for self-hosted pipelines, and Capgo Consulting if a plugin breaks after R8 is enabled.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/google-play-obfuscation-capacitor-android/"},"keywords":"Google Play obfuscation, Capacitor Android, R8, ProGuard, minifyEnabled, Play Console Android vitals, app optimization threshold, DEX shrinking","articleSection":"Development"}</script>
