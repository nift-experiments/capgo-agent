<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-play-audio-in-the-background-in-capacitor/#newsarticle","url":"https://capgo.app/blog/how-to-play-audio-in-the-background-in-capacitor/","headline":"How to Play Audio in the Background in Capacitor","description":"Play audio in the background in Capacitor: iOS audio background mode, Android foreground service, lock screen controls, playlists, and interruptions.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To play audio in the background in Capacitor, you need two native pieces: the audio background mode on iOS, and a mediaPlayback foreground service on Android. Add lock screen controls through a media session, and your music, podcast or meditation app keeps playing when the user locks the phone or switches apps. This guide shows both setups on Capacitor 8, with @capgo/capacitor-native-audio for native playback and @capgo/capacitor-media-session for system controls.\nWhy audio stops in the background\nA Capacitor app is a native shell around a WebView, so it follows each platform’s lifecycle rules:\n\n\n\n\niOS\nAndroid\n\n\n\n\nWhat happens on background\nApp is suspended within seconds\nActivity is paused, WebView timers throttle, process can be killed\n\n\nWhat keeps audio alive\nUIBackgroundModes contains audio, audio session category playback\nA foreground service of type mediaPlayback with a notification\n\n\nSilent switch\nplayback category ignores it, ambient respects it\nNo equivalent\n\n\nLock screen controls\nMPNowPlayingInfoCenter and MPRemoteCommandCenter\nMediaSession with a media style notification\n\n\nStore rule\nMust play audible content the user expects (guideline 2.5.4)\nForeground service type must match real use, declared in Play Console\n\n\n\nNeither platform gives you background audio by default, and fixing only one side is the most common reason for “works on iPhone, stops on Android” bug reports.\nChoose your playback approach\nThere are two good architectures:\n\nNative playback with @capgo/capacitor-native-audio: audio is decoded by AVFoundation on iOS and Media3 ExoPlayer on Android. Best for music players, audiobooks, meditation apps, and anything where the WebView might be throttled. It supports local files, remote URLs, HLS streams, fades, rate, and Now Playing metadata.\nHTML &lt;audio&gt; plus @capgo/capacitor-media-session: keep your existing web player and let the plugin publish metadata and controls to the OS. On Android it also runs the foreground service while the session is playing. Best when you already have a web player or need a single code path for web and native.\n\n\n\n\n\n@capgo/capacitor-native-audio\n&lt;audio&gt; + media session\n\n\n\n\nPlayback engine\nNative\nWebView\n\n\nWeb support\nYes (HTML audio fallback)\nYes\n\n\nLock screen metadata\nshowNotification + notificationMetadata\nsetMetadata\n\n\nAndroid foreground service\nYou start one\nPlugin starts it while playing or paused\n\n\nRemote control events\nplaybackState listener\nsetActionHandler\n\n\nPrecise low-latency SFX\nYes\nLimited\n\n\n\nConfigure iOS for background audio\nOpen ios/App/App/Info.plist and add the background mode. You can also tick “Audio, AirPlay, and Picture in Picture” under Signing &amp; Capabilities, Background Modes in Xcode, which writes the same key:\n&lt;key&gt;UIBackgroundModes&lt;/key&gt;\n&lt;array&gt;\n  &lt;string&gt;audio&lt;/string&gt;\n&lt;/array&gt;\nThe audio session category matters too. @capgo/capacitor-native-audio sets it for you: with showNotification: true it uses .playback with the default mode, which interrupts other apps (Spotify pauses) and makes your app the Now Playing app. With showNotification: false it uses .playback with mixWithOthers, which is right for sound effects but does not show lock screen controls. Pick one per app, not per track.\nIf you play through &lt;audio&gt;, WebKit activates the playback session when media starts. Make sure playback is started from a user gesture the first time, or iOS will block it.\nBuild with Xcode 26 or later before uploading to App Store Connect, which has been required since April 2026. Capgo Build can do that in the cloud if you work on Windows or Linux.\nConfigure Android for background audio\nAdd the permissions to android/app/src/main/AndroidManifest.xml:\n&lt;uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" /&gt;\n&lt;uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" /&gt;\n&lt;uses-permission android:name=\"android.permission.WAKE_LOCK\" /&gt;\n&lt;uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" /&gt;\nFOREGROUND_SERVICE_MEDIA_PLAYBACK is mandatory for apps targeting Android 14 (API 34) or higher, and Capacitor 8 targets API 36. Without it, starting the service throws a SecurityException. When you publish, Play Console asks you to declare the foreground service type and justify it. “Media playback the user started” is the accepted use.\nPOST_NOTIFICATIONS is a runtime permission on Android 13+. Media session notifications are exempt from the notification permission and still show in the shade, but any other notification your service posts needs it.\nAndroid 12+ blocks starting a foreground service while the app is in the background. Start it when the user presses play, while your activity is visible.\nOption A: let the media session plugin run the service\n@capgo/capacitor-media-session declares a mediaPlayback service in its own manifest and starts it when you set the playback state to playing or paused. It stops it when the state goes back to none and the app is in the background. If you want the service to run for the whole app session, set the plugin config in capacitor.config.ts:\nplugins: {\n  MediaSession: {\n    foregroundService: 'always',\n  },\n},\nThe default, starting only during playback, is what most apps want.\nOption B: start your own foreground service\n@capgo/capacitor-native-audio handles playback, focus and the media notification, but it does not create the foreground service. If you use it without the media session plugin, add a small service and a local plugin to your Android project.\nandroid/app/src/main/java/com/example/app/PlaybackService.java:\npackage com.example.app;\n\nimport android.app.Notification;\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.app.Service;\nimport android.content.Intent;\nimport android.content.pm.ServiceInfo;\nimport android.os.Build;\nimport android.os.IBinder;\nimport androidx.core.app.NotificationCompat;\n\npublic class PlaybackService extends Service {\n    private static final String CHANNEL_ID = \"playback\";\n\n    @Override\n    public int onStartCommand(Intent intent, int flags, int startId) {\n        if (Build.VERSION.SDK_INT &gt;= Build.VERSION_CODES.O) {\n            NotificationChannel channel = new NotificationChannel(\n                CHANNEL_ID, \"Playback\", NotificationManager.IMPORTANCE_LOW);\n            getSystemService(NotificationManager.class).createNotificationChannel(channel);\n        }\n        Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)\n            .setContentTitle(\"Playing audio\")\n            .setSmallIcon(R.mipmap.ic_launcher)\n            .setOngoing(true)\n            .build();\n\n        if (Build.VERSION.SDK_INT &gt;= Build.VERSION_CODES.Q) {\n            startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);\n        } else {\n            startForeground(1, notification);\n        }\n        return START_NOT_STICKY;\n    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        return null;\n    }\n}\nPlaybackServicePlugin.java in the same package:\npackage com.example.app;\n\nimport android.content.Intent;\nimport androidx.core.content.ContextCompat;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginCall;\nimport com.getcapacitor.PluginMethod;\nimport com.getcapacitor.annotation.CapacitorPlugin;\n\n@CapacitorPlugin(name = \"PlaybackService\")\npublic class PlaybackServicePlugin extends Plugin {\n    @PluginMethod\n    public void start(PluginCall call) {\n        ContextCompat.startForegroundService(getContext(), new Intent(getContext(), PlaybackService.class));\n        call.resolve();\n    }\n\n    @PluginMethod\n    public void stop(PluginCall call) {\n        getContext().stopService(new Intent(getContext(), PlaybackService.class));\n        call.resolve();\n    }\n}\nRegister it in MainActivity.java before super.onCreate, and declare the service in the manifest:\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(PlaybackServicePlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}\n&lt;service\n    android:name=\".PlaybackService\"\n    android:exported=\"false\"\n    android:foregroundServiceType=\"mediaPlayback\" /&gt;\nFrom TypeScript:\nimport { Capacitor, registerPlugin } from '@capacitor/core';\n\ninterface PlaybackServicePlugin {\n  start(): Promise&lt;void&gt;;\n  stop(): Promise&lt;void&gt;;\n}\n\nexport const PlaybackService = registerPlugin&lt;PlaybackServicePlugin&gt;('PlaybackService');\n\nexport const isAndroid = Capacitor.getPlatform() === 'android';\nPlay audio natively with @capgo/capacitor-native-audio\nbun add @capgo/capacitor-native-audio\nbunx cap sync\nConfigure once at startup, then preload and play:\nimport { NativeAudio } from '@capgo/capacitor-native-audio';\nimport { PlaybackService, isAndroid } from './playback-service';\n\nawait NativeAudio.configure({\n  focus: true,               // request audio focus, pause others\n  background: true,          // keep playing in the background\n  backgroundPlayback: true,  // Android: skip auto pause on background\n  showNotification: true,    // lock screen and notification controls\n});\n\nexport async function playEpisode(id: string, url: string, title: string, artwork: string) {\n  await NativeAudio.preload({\n    assetId: id,\n    assetPath: url,\n    isUrl: true,\n    notificationMetadata: {\n      title,\n      artist: 'My Podcast',\n      artworkUrl: artwork,\n    },\n  });\n\n  if (isAndroid) await PlaybackService.start();\n  await NativeAudio.play({ assetId: id });\n}\n\nexport async function stopEpisode(id: string) {\n  await NativeAudio.stop({ assetId: id });\n  await NativeAudio.unload({ assetId: id });\n  if (isAndroid) await PlaybackService.stop();\n}\nassetPath accepts a path relative to your web assets (audio/intro.mp3), a file:// URL, an https:// URL or an HLS .m3u8 stream. For anything other than a bundled asset, set isUrl: true. If your audio host requires auth, pass headers.\nBuild a playlist that advances on its own\nThe complete event fires when a track ends, even with the screen locked, because the native player keeps running:\nconst queue = [\n  { id: 'ep1', url: 'https://cdn.example.com/ep1.mp3', title: 'Episode 1' },\n  { id: 'ep2', url: 'https://cdn.example.com/ep2.mp3', title: 'Episode 2' },\n];\nlet index = 0;\n\nawait NativeAudio.addListener('complete', async ({ assetId }) =&gt; {\n  await NativeAudio.unload({ assetId });\n  index += 1;\n  if (index &lt; queue.length) {\n    const next = queue[index];\n    await NativeAudio.preload({\n      assetId: next.id,\n      assetPath: next.url,\n      isUrl: true,\n      notificationMetadata: { title: next.title, artist: 'My Podcast' },\n    });\n    await NativeAudio.play({ assetId: next.id });\n  } else if (isAndroid) {\n    await PlaybackService.stop();\n  }\n});\nKeep the foreground service running between tracks. If you stop it after one track and try to start it again while in the background, Android 12+ throws ForegroundServiceStartNotAllowedException.\nKeep your UI in sync with the lock screen\nUsers will press pause on the lock screen, on headphones, or in the notification. Listen to playbackState and treat the native player as the source of truth:\nawait NativeAudio.addListener('playbackState', (event) =&gt; {\n  // event.state: 'playing' | 'paused' | 'stopped'\n  // event.reason: 'play', 'pause', 'remotePlay', 'complete', ...\n  store.setPlaying(event.isPlaying);\n  if (event.currentTime !== undefined) store.setPosition(event.currentTime);\n});\n\nawait NativeAudio.addListener('currentTime', ({ currentTime }) =&gt; {\n  store.setPosition(currentTime); // every 100 ms while playing\n});\nAlso refresh state when the app returns to the foreground, using isPlaying and getCurrentTime, since the WebView may have been paused while events were emitted.\nUse an HTML audio element with media session controls\nIf you already have a web player, keep it and add the plugin:\nbun add @capgo/capacitor-media-session\nbunx cap sync\nimport { MediaSession } from '@capgo/capacitor-media-session';\n\nconst audio = new Audio();\naudio.preload = 'auto';\n\nexport async function play(track: { url: string; title: string; artist: string; cover: string }) {\n  audio.src = track.url;\n  await audio.play();\n\n  await MediaSession.setMetadata({\n    title: track.title,\n    artist: track.artist,\n    artwork: [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }],\n  });\n  await MediaSession.setPlaybackState({ playbackState: 'playing' });\n}\n\nawait MediaSession.setActionHandler({ action: 'play' }, async () =&gt; {\n  await audio.play();\n  await MediaSession.setPlaybackState({ playbackState: 'playing' });\n});\nawait MediaSession.setActionHandler({ action: 'pause' }, async () =&gt; {\n  audio.pause();\n  await MediaSession.setPlaybackState({ playbackState: 'paused' });\n});\nawait MediaSession.setActionHandler({ action: 'seekto' }, (details) =&gt; {\n  if (details.seekTime != null) audio.currentTime = details.seekTime;\n});\nawait MediaSession.setActionHandler({ action: 'nexttrack' }, () =&gt; playNext());\n\naudio.addEventListener('timeupdate', () =&gt; {\n  MediaSession.setPositionState({\n    duration: audio.duration || 0,\n    position: audio.currentTime,\n    playbackRate: audio.playbackRate,\n  });\n});\nCall setPositionState at most once or twice a second in production. The lock screen interpolates between updates, and flooding the bridge with timeupdate events wastes battery.\nHandle interruptions and route changes\nPhone calls, Siri, alarms and other apps interrupt playback. Native audio pauses on interruption and, on iOS, resumes when the system says it should. Two more cases need your attention:\n\nHeadphones unplugged: users expect playback to pause. On Android, register a receiver for AudioManager.ACTION_AUDIO_BECOMING_NOISY in your service if your player does not already pause. On iOS, listen for route changes with @capgo/capacitor-audio-session:\n\nimport { AudioSession, RouteChangeReasons } from '@capgo/capacitor-audio-session';\n\nawait AudioSession.addListener('routeChanged', (reason) =&gt; {\n  if (reason === RouteChangeReasons.OLD_DEVICE_UNAVAILABLE) {\n    pausePlayback();\n  }\n});\n\nawait AudioSession.addListener('interruption', (type) =&gt; {\n  // 'began' or 'ended'\n});\n\nDucking vs. pausing: navigation prompts duck your audio. Spoken-word apps should pause instead, since lowered speech is hard to follow.\n\nTest background playback\nSimulators lie about background behavior. Test on real devices:\n\nStart playback, lock the screen, wait two minutes. Audio must keep playing.\nUse the lock screen play, pause, next and seek controls, then unlock and check your UI matches.\nPlay, switch to another app that plays audio, then come back.\nStart a phone call or FaceTime audio during playback.\nOn Android, enable battery saver and test on a Samsung or Xiaomi device. Some OEMs kill background apps aggressively. A foreground service survives, a plain background task does not.\nOn Android 13+, deny the notification permission and confirm playback still works.\nLet a playlist run through several tracks with the screen off.\n\nadb shell dumpsys activity services | grep -A3 PlaybackService shows whether your service is running in the foreground.\nTroubleshooting\nAudio stops after about 30 seconds on iOS: UIBackgroundModes lacks audio, or the session category is ambient or soloAmbient. Check Info.plist in the built app, not only in your source.\nAudio stops after a few minutes on Android: no foreground service, or the service is not of type mediaPlayback. Also check OEM battery optimization settings.\nSecurityException: Starting FGS with type mediaPlayback ... requires permissions: add FOREGROUND_SERVICE_MEDIA_PLAYBACK.\nForegroundServiceStartNotAllowedException: you started the service while the app was in the background. Start it on the user’s play tap.\nNo lock screen controls on iOS: showNotification is false (mixable session), or no metadata was set. Only the app that owns a non-mixable session becomes the Now Playing app.\nTwo notifications on Android: you enabled showNotification in native audio and also posted your own service notification. Keep the service notification minimal, or use the media session plugin’s service only.\nOther music apps keep playing over yours: you configured a mixable session. Set focus: true and showNotification: true.\nShip player changes faster\nQueue logic, UI, metadata, and analytics for your player live in JavaScript. Once the native setup above is in a store build, Capgo live updates let you push fixes to that code without a new review cycle. The native audio docs and media session docs cover every option, and if your app also records audio, see the Capacitor audio recorder plugin.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-play-audio-in-the-background-in-capacitor/"},"keywords":"capacitor background audio, play audio in background capacitor, ionic background audio, capacitor native audio, capacitor media session, UIBackgroundModes audio, android foreground service media playback","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-play-audio-in-the-background-in-capacitor/#faqpage","url":"https://capgo.app/blog/how-to-play-audio-in-the-background-in-capacitor/","mainEntity":[{"@type":"Question","name":"Why does audio stop when my Capacitor app goes to the background?","acceptedAnswer":{"@type":"Answer","text":"On iOS, the app is suspended unless it declares the audio background mode and uses a playback audio session. On Android, the system pauses the WebView and can kill the process unless playback runs inside a foreground service of type mediaPlayback with a visible notification."}},{"@type":"Question","name":"Can I use the HTML audio element for background playback?","acceptedAnswer":{"@type":"Answer","text":"Yes. With the audio background mode on iOS and @capgo/capacitor-media-session on Android, which runs a mediaPlayback foreground service while the session is playing or paused, an HTML audio element keeps playing with the screen locked. Web Audio API contexts are less reliable in the background, so use an audio element for long playback."}},{"@type":"Question","name":"Which Android permissions are needed for background audio?","acceptedAnswer":{"@type":"Answer","text":"FOREGROUND_SERVICE and, for apps targeting Android 14 (API 34) or higher, FOREGROUND_SERVICE_MEDIA_PLAYBACK. Add WAKE_LOCK if you stream over the network with the screen off. The service must declare android:foregroundServiceType=\"mediaPlayback\"."}},{"@type":"Question","name":"Will Apple reject an app that uses the audio background mode?","acceptedAnswer":{"@type":"Answer","text":"Only if the mode is misused. Apple expects audible content the user started, such as music, podcasts, audiobooks or guided sessions. Playing silent audio to keep the app alive for other work is a common rejection reason under guideline 2.5.4."}},{"@type":"Question","name":"How do I show play and pause buttons on the lock screen?","acceptedAnswer":{"@type":"Answer","text":"Set metadata and action handlers with @capgo/capacitor-media-session (setMetadata, setPlaybackState, setActionHandler), or enable showNotification in @capgo/capacitor-native-audio and pass notificationMetadata when you preload a track."}}]}]}</script>
