<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-patch-a-capacitor-plugin/#newsarticle","url":"https://capgo.app/blog/how-to-patch-a-capacitor-plugin/","headline":"How to Patch a Capacitor Plugin (Bun, npm, pnpm)","description":"How to patch a Capacitor plugin with bun patch, patch-package or pnpm patch, apply native iOS and Android fixes, and decide when to fork or upstream.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To patch a Capacitor plugin, edit the plugin’s files in node_modules, save the change as a diff with bun patch --commit (or patch-package on npm and Yarn, pnpm patch-commit on pnpm), commit the generated file in patches/, then run bunx cap sync so the native projects pick it up. The package manager reapplies the patch on every install, for your team and in CI.\nPatching is the right move when a plugin has a small bug, a version constraint that blocks your build, or an upstream fix that’s merged but not released. This guide covers the workflow for each package manager, how native patches reach Xcode and Gradle, and when a fork or an upstream PR is the better call.\nWhy patching works for native plugin code\nA Capacitor plugin is an npm package with three parts: JavaScript in dist/, Android code in android/, and iOS code in ios/ plus a podspec and/or Package.swift. Capacitor compiles the native parts directly from node_modules:\n\nAndroid: android/capacitor.settings.gradle includes each plugin’s android folder from node_modules.\niOS with CocoaPods: the Podfile references each plugin with :path =&gt; '../../node_modules/...'.\niOS with SPM: CapApp-SPM/Package.swift references each plugin by local path in node_modules.\n\nSo a change to node_modules/@scope/plugin/ios/Sources/... ends up in your app binary after cap sync and a rebuild. Nothing needs to be published.\nBefore you patch\n\nCheck for a release. Look at the plugin’s changelog and open PRs. Upgrading is better than patching.\nRead the license. MIT and Apache-2.0 allow private modifications. Copyleft licenses such as GPL or MPL-2.0 can require you to publish modified source when you distribute the app. Check before you ship.\nWrite down why. Put the issue URL or a one-line reason in your commit message. Six months later nobody remembers why patches/ has a file in it.\n\nPatching with Bun\nBun has patching built in. No extra package, no postinstall script.\n# 1. Prepare the package for editing\nbun patch @capacitor/haptics\n\n# 2. Edit files under node_modules/@capacitor/haptics\n\n# 3. Save the patch\nbun patch --commit node_modules/@capacitor/haptics\nStep 1 makes Bun give you a private copy of the package in node_modules, so edits don’t touch Bun’s global cache. Step 3 writes a diff and records it in package.json:\n{\n  \"patchedDependencies\": {\n    \"@capacitor/haptics@8.0.2\": \"patches/@capacitor%2Fhaptics@8.0.2.patch\"\n  }\n}\nCommit both package.json and the patches/ folder. Every bun install, including bun install --frozen-lockfile in CI, applies the patch.\nThe key contains the exact version. If you bump the plugin, Bun no longer matches the patch, so recreate it for the new version or delete it if the fix shipped.\nPatching with npm or Yarn: patch-package\nnpm install --save-dev patch-package\nAdd a postinstall script so patches apply after every install:\n{\n  \"scripts\": {\n    \"postinstall\": \"patch-package\"\n  }\n}\nThen edit the files in node_modules and generate the patch:\nnpx patch-package @capacitor/haptics\nThis writes patches/@capacitor+haptics+8.0.2.patch. Commit it. If the patch stops applying after an upgrade, patch-package fails the install with a clear message.\nYarn Berry has its own yarn patch &lt;pkg&gt; / yarn patch-commit -s &lt;path&gt; flow that stores the patch in the resolutions field.\nPatching with pnpm\npnpm patch @capacitor/haptics\n# edit the temporary folder pnpm prints\npnpm patch-commit &lt;path-printed-above&gt;\npnpm records the patch under patchedDependencies and applies it on install.\nExample: fix a native build error in a plugin\nA common case: your app uses AGP 9, and an older plugin’s android/build.gradle still references proguard-android.txt, which AGP 9 rejects. You can’t wait for a release.\nbun patch some-capacitor-plugin\nEdit node_modules/some-capacitor-plugin/android/build.gradle:\n buildTypes {\n     release {\n         minifyEnabled false\n-        proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n+        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n     }\n }\nSave and sync:\nbun patch --commit node_modules/some-capacitor-plugin\nbunx cap sync android\ncd android &amp;&amp; ./gradlew assembleDebug\nThe full background on this error is in fix Capacitor plugin build errors with AGP 9.\nExample: relax an iOS dependency constraint\nTwo plugins pin different versions of the same SDK and CocoaPods can’t resolve them. If you’ve verified the plugin works with the newer SDK, relax its podspec:\n-  s.dependency 'FirebaseMessaging', '11.15.0'\n+  s.dependency 'FirebaseMessaging', '&gt;= 11.15.0', '&lt; 13.0'\nFor SPM apps, the same constraint lives in the plugin’s Package.swift:\n-  .package(url: \"https://github.com/firebase/firebase-ios-sdk.git\", exact: \"11.15.0\")\n+  .package(url: \"https://github.com/firebase/firebase-ios-sdk.git\", \"11.15.0\"..&lt;\"13.0.0\")\nThen:\nbunx cap sync ios\nWith CocoaPods you may need cd ios/App &amp;&amp; pod update FirebaseMessaging once, because Podfile.lock still holds the old version. With SPM, use File &gt; Packages &gt; Resolve Package Versions in Xcode.\nPatching Capacitor core itself\nSometimes the bug is in @capacitor/android, @capacitor/ios or the CLI, and the fix sits in an upstream pull request. You can patch those packages the same way, but every team ends up maintaining the same diffs.\nCapgo publishes @capgo/capacitor-patch for this. It’s a hook-only package with a catalog of small, version-gated patches that link back to their upstream PRs. It does nothing until you opt in:\nbun add @capgo/capacitor-patch\nbunx capgo-capacitor-patch list --all\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.app',\n  appName: 'Example',\n  webDir: 'dist',\n  plugins: {\n    CapacitorPatch: {\n      patches: ['upstream-pr-8418-android'],\n      strict: true,\n    },\n  },\n};\n\nexport default config;\nPackage patches run before cap sync and cap update, and native project patches run after. bunx capgo-capacitor-patch doctor does a dry run. With strict: true, sync fails when a selected patch no longer applies, which tells you when an upgrade made it obsolete. See the plugin docs for the full option list.\nPatch, fork, or upstream?\n\n\n\nSituation\nBest option\n\n\n\n\nA few lines, fix already merged upstream\nPatch, remove after next release\n\n\nVersion constraint too strict\nPatch, open an issue upstream\n\n\nBug with no upstream fix yet\nPatch and send a PR with the same diff\n\n\nNew feature or large refactor\nFork, publish under your scope\n\n\nPlugin abandoned\nFork, or switch to a maintained plugin\n\n\n\nForking well\nIf you fork, publish it so installs stay reproducible:\n# in the fork, rename to your scope in package.json: \"@acme/capacitor-foo\"\nbun run build\nbun publish --access restricted\nInstalling from a git URL also works, but the plugin’s dist/ folder must exist in that branch or be built by a prepare script, and not every package manager runs dependency lifecycle scripts by default. A published package avoids that.\nRemember that the npm name changes the native module name the CLI generates for SPM (@acme/capacitor-foo becomes AcmeCapacitorFoo), so update the fork’s Package.swift to match. Details are in migrate a Capacitor plugin to SPM.\nBefore you fork a plugin for a missing feature, check the Capgo plugin directory. There may already be a maintained plugin that covers it.\nUpstreaming\nThe goal is to delete your patch. Open an issue with a minimal repro, your Capacitor and plugin versions, and the patch diff. Then open a PR. Maintainers merge small, tested fixes much faster than issue reports alone.\nPatches and live updates\nYour web bundle includes the plugin’s JavaScript from dist/, so a patch to the JS side ships with the next web build. With Capgo live updates that reaches users without a store release.\nNative patches are different. Changes to Swift, Kotlin, Java, Gradle, podspec or Package.swift only take effect in a new native build submitted to the stores. Don’t push a web bundle that depends on a native patch to users who still run the old binary. Capgo’s compatibility check compares native plugin versions between a bundle and a channel to catch this.\nTroubleshooting\nThe patch isn’t applied in CI. Make sure patches/ is committed and not ignored. For patch-package, check that CI doesn’t use --ignore-scripts, which skips postinstall. For Bun, check patchedDependencies is in the committed package.json.\nMy native change has no effect. You edited the file but didn’t rebuild. Run bunx cap sync, then clean: in Xcode Product &gt; Clean Build Folder, on Android ./gradlew clean. With SPM, also reset package caches.\nbun patch --commit says there are no changes. You edited a file that isn’t part of the package (for example a hoisted copy in another folder). Edit the path Bun printed in step 1.\nPatch fails after upgrading the plugin. Check whether the fix is in the new release. If not, redo the patch against the new version.\nThe plugin builds, but the app crashes on that feature. Patches skip the plugin’s own test suite. Test the patched path on a real device on both platforms. The Capacitor iOS troubleshooting guide and Android troubleshooting guide cover how to read native logs.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-patch-a-capacitor-plugin/"},"keywords":"patch Capacitor plugin, bun patch, patch-package Capacitor, pnpm patch, fork Capacitor plugin, fix Capacitor plugin bug, capacitor-patch","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-patch-a-capacitor-plugin/#faqpage","url":"https://capgo.app/blog/how-to-patch-a-capacitor-plugin/","mainEntity":[{"@type":"Question","name":"Can I patch the native iOS and Android code of a Capacitor plugin?","acceptedAnswer":{"@type":"Answer","text":"Yes. Capacitor builds plugin native code straight from node_modules (Gradle includes the plugin's android folder, CocoaPods and SPM point to the plugin path). Patch the Swift, Kotlin, Java, Gradle, podspec or Package.swift files, then run cap sync and rebuild the app."}},{"@type":"Question","name":"Do I need patch-package if I use Bun?","acceptedAnswer":{"@type":"Answer","text":"No. Bun has built-in patching: bun patch <pkg>, edit the files, then bun patch --commit. Bun stores the diff in patches/ and records it under patchedDependencies in package.json, and reapplies it on every bun install."}},{"@type":"Question","name":"Can I ship a plugin patch with a live update?","acceptedAnswer":{"@type":"Answer","text":"Only if the change is in the plugin's JavaScript, which ends up in your web bundle. Native changes in Swift, Kotlin, Gradle or podspec files require a new App Store and Google Play build."}},{"@type":"Question","name":"What happens to my patch when I upgrade the plugin?","acceptedAnswer":{"@type":"Answer","text":"Patches are tied to an exact version. With Bun the key includes the version, so an upgrade needs a fresh patch. patch-package tries to apply the old diff and fails loudly if it no longer fits. Check whether the upstream release already contains the fix first."}},{"@type":"Question","name":"When should I fork instead of patching?","acceptedAnswer":{"@type":"Answer","text":"Fork when the change is large, touches many files, adds features, or must live for months. A long patch is hard to review and breaks on every upgrade. A fork published under your own npm scope is easier to version and test."}}]}]}</script>
