<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-sign-and-build-capacitor-app-in-the-cloud/#newsarticle","url":"https://capgo.app/blog/how-to-sign-and-build-capacitor-app-in-the-cloud/","headline":"How to Sign and Build a Capacitor App in the Cloud","description":"Sign and build your Capacitor app in the cloud: create the Android keystore and iOS certificate, store credentials safely, and run signed builds from CI.","image":["https://capgo.app/certificates.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To sign and build a Capacitor app in the cloud, you create your signing material once (an Android keystore, an iOS distribution certificate and provisioning profile), give it to a cloud build service, and then trigger builds from your terminal or CI. The service compiles the native project, signs it, and can upload it straight to TestFlight or Google Play. This guide covers each signing file, how to create it without a Mac, how to set it up with Capgo Build, and how to automate signed builds safely.\nWhat “signing in the cloud” means\nBoth stores only accept signed binaries. Signing proves the build came from you and that nobody changed it afterwards. Locally, Xcode and Android Studio hide most of this. In the cloud, nothing is implicit, so you need to know exactly which files are involved:\n\n\n\nPlatform\nFile\nWhat it is\nUsed for\n\n\n\n\nAndroid\n.jks / .keystore\nKeystore holding your upload key\nSigning the AAB or APK\n\n\nAndroid\nService account .json\nGoogle Cloud credentials\nUploading to Google Play\n\n\niOS\n.p12\nApple Distribution certificate plus private key\nSigning the IPA\n\n\niOS\n.mobileprovision\nProvisioning profile tying bundle ID, certificate, and capabilities\nAllowing the app to run and be distributed\n\n\niOS\n.p8 + key ID + issuer ID\nApp Store Connect API key\nUploading to TestFlight, reading build numbers\n\n\n\nKeep these out of Git. Everything below stores them in your local credential file or your CI’s secret store.\nAndroid signing\nCreate the upload keystore\nIf the app is already on Google Play, reuse the existing keystore. Signing an update with a different key is rejected unless you go through Play Console’s upload key reset.\nFor a new app:\nkeytool -genkeypair -v \\\n  -storetype PKCS12 \\\n  -keystore release.jks \\\n  -alias upload \\\n  -keyalg RSA -keysize 2048 \\\n  -validity 10000\nNotes:\n\nGoogle Play requires the key to be valid until at least October 22, 2033. -validity 10000 (about 27 years) covers that.\nWith the PKCS12 store type, the key password is the same as the store password.\nNo JDK at hand? The Android keystore generator produces the same file in the browser.\n\nPlay App Signing and the upload key\nNew apps on Google Play use Play App Signing. Google holds the app signing key and re-signs what users download. Your keystore is the upload key. If you lose it, Play Console support can register a new upload key, which is why losing it is a delay, not a disaster. Back it up anyway.\nService account for uploads\nTo upload from the cloud, create a service account in Google Cloud, enable the Google Play Android Developer API, download its JSON key, and invite the service account in Play Console under Users and permissions with release permissions for your app. Capgo’s onboarding can do this through Google sign-in, as shown below.\niOS signing\nThe three Apple pieces\n\nApple Distribution certificate. One per team is enough, valid for a year. Apple limits how many you can have, so do not create one per developer.\nProvisioning profile. Links the bundle ID, the certificate, and capabilities such as push notifications. Use an App Store Connect profile for TestFlight and the App Store, and an Ad Hoc profile for installs on registered devices. Each app extension (widget, share extension, notification service) needs its own profile.\nApp Store Connect API key. Created under Users and Access &gt; Integrations with App Manager access. The .p8 file downloads only once.\n\nYou need admin or account holder rights on the Apple Developer team to create these.\nCreate a certificate without a Mac\nThe Keychain Access flow needs macOS, but OpenSSL works anywhere:\n# 1. Private key and certificate signing request\nopenssl req -new -newkey rsa:2048 -nodes \\\n  -keyout dist.key -out dist.csr \\\n  -subj \"/emailAddress=dev@example.com/CN=Example Inc/C=US\"\n\n# 2. Upload dist.csr at developer.apple.com &gt; Certificates &gt; + &gt; Apple Distribution\n#    and download distribution.cer\n\n# 3. Convert and bundle into a .p12\nopenssl x509 -inform DER -in distribution.cer -out distribution.pem\nopenssl pkcs12 -export -legacy \\\n  -inkey dist.key -in distribution.pem \\\n  -out distribution.p12 -passout pass:choose-a-password\nThe -legacy flag matters with OpenSSL 3: without it, macOS build machines may fail to import the .p12 with “MAC verification failed”. The browser-based iOS certificate generator does the same steps if you prefer not to use a terminal.\nThen create the provisioning profile in the developer portal (Profiles &gt; + &gt; App Store Connect), select your app ID and the new certificate, and download it.\nSet up signing with Capgo Build\nCapgo Build compiles and signs Capacitor apps on Capgo-managed machines, so you can build iOS from Windows or Linux. Start by logging in and registering the app:\nbunx @capgo/cli@latest login\nbunx @capgo/cli@latest app add\nOption A: guided onboarding (recommended)\nbunx @capgo/cli@latest build init --platform ios\nbunx @capgo/cli@latest build init --platform android\nOn iOS, the onboarding creates or reuses the distribution certificate and the App Store provisioning profile with your App Store Connect API key. On macOS it can also walk you through creating that API key. On Android, it creates or imports the keystore and can provision the Google Cloud service account and the Play Console invite through Google sign-in. At the end it offers to start the first build.\nOption B: save existing files\nIf you already have the files from the previous sections:\n# iOS\nbunx @capgo/cli@latest build credentials save \\\n  --platform ios \\\n  --certificate ./distribution.p12 \\\n  --p12-password \"choose-a-password\" \\\n  --ios-provisioning-profile ./AppStore.mobileprovision \\\n  --apple-key ./AuthKey_ABC1234567.p8 \\\n  --apple-key-id ABC1234567 \\\n  --apple-issuer-id 00000000-0000-0000-0000-000000000000 \\\n  --apple-team-id TEAM123456\n\n# Android\nbunx @capgo/cli@latest build credentials save \\\n  --platform android \\\n  --keystore ./release.jks \\\n  --keystore-alias upload \\\n  --keystore-key-password \"store-password\" \\\n  --keystore-store-password \"store-password\" \\\n  --play-config ./play-service-account.json\nFor apps with extensions, repeat --ios-provisioning-profile with a bundleId=path mapping for each target:\n  --ios-provisioning-profile com.example.app=./App.mobileprovision \\\n  --ios-provisioning-profile com.example.app.widget=./Widget.mobileprovision\nCredentials are stored in ~/.capgo-credentials/credentials.json, keyed by app ID and platform. Add --local to store them in .capgo-credentials.json in the project instead, and add that file to .gitignore. Check what is saved with bunx @capgo/cli@latest build credentials list.\nTrigger a signed build\nPrepare the native project, then request the build:\nbun run build\nbunx cap sync\n\n# iOS: sign with the App Store profile and upload to TestFlight\nbunx @capgo/cli@latest build request com.example.app --platform ios --build-mode release\n\n# Android: sign the AAB and upload to the internal track\nbunx @capgo/cli@latest build request com.example.app --platform android --build-mode release --android-track internal\nLogs stream into your terminal. A pre-build scan checks certificate expiry, passwords, and profile pairing before anything is uploaded, so most signing mistakes fail in seconds instead of minutes. Run it on its own with bunx @capgo/cli@latest build prescan --platform ios.\nUseful variations:\n\n\n\nGoal\nFlags\n\n\n\n\nTest build on registered iPhones\n--ios-distribution ad_hoc --ios-provisioning-profile ./adhoc.mobileprovision --output-upload\n\n\nAPK for MDM or kiosk devices\n--platform android --no-playstore-upload --output-upload\n\n\nSubmit straight to App Review\n--submit-to-store-review --store-release-name 2.4.0\n\n\nKeep your own build number\n--skip-build-number-bump\n\n\nClean build without cache\n--no-cache\n\n\n\nFor ad hoc builds, collect device UDIDs first with the iOS UDID finder and add them to the profile.\nAutomate signed builds in CI\nIn CI, pass credentials as environment variables instead of a credentials file. The CLI exports exactly what you need:\nbunx @capgo/cli@latest build credentials manage --appId com.example.app\n# choose \"Export to .env\"\nOn GitHub, push every line to repository secrets in one command, then delete the file:\ngh secret set -f .env.capgo.com.example.app\ngh secret set CAPGO_TOKEN --body \"your-capgo-api-key\"\nrm .env.capgo.com.example.app\nA release workflow that signs and ships both platforms on a tag:\nname: Signed release\non:\n  push:\n    tags: ['v*']\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        platform: [ios, android]\n    steps:\n      - uses: actions/checkout@v6\n      - uses: oven-sh/setup-bun@v2\n      - run: bun install --frozen-lockfile\n      - run: bun run build\n      - run: bunx cap sync ${{ matrix.platform }}\n      - run: bunx @capgo/cli@latest build request com.example.app --platform ${{ matrix.platform }} --build-mode release\n        env:\n          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}\n          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}\n          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}\n          CAPGO_IOS_PROVISIONING_MAP_BASE64: ${{ secrets.CAPGO_IOS_PROVISIONING_MAP_BASE64 }}\n          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}\n          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}\n          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}\n          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}\n          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}\n          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}\n          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}\n          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}\nThe job runs on Linux. No macOS runner, no keychain commands, no fastlane. The same environment variables work in any CI: GitLab CI/CD variables, Bitbucket secured variables, Gitea secrets, or Azure DevOps variable groups. Platform-specific walkthroughs: Bitbucket Pipelines, Gitea Actions, and the GitHub Actions docs.\nHow your keys are handled\nA fair question before you hand signing keys to any cloud service. With Capgo Build:\n\nCredentials live on your machine (~/.capgo-credentials/) or in your CI secret store. Capgo does not keep a vault of your keys.\nFor each build, the CLI sends them over HTTPS. They are used only during that build and deleted when it completes.\nOnly the prepared native project is uploaded. Your web source, .git, and .env files are not.\nBuilt apps go to App Store Connect or Google Play directly, or to a time-limited download link if you ask for one.\n\nThe trade-off: rotating a credential means updating your CI secrets yourself. Re-export with build credentials manage and push the file again.\nExpiry and rotation\n\n\n\nItem\nLifetime\nWhat to do\n\n\n\n\nApple Distribution certificate\n1 year\nCreate a new one, regenerate profiles, re-save, update CI\n\n\nProvisioning profile\n1 year, or until its certificate is revoked\nRegenerate and re-save\n\n\nApp Store Connect API key\nUntil revoked\nRevoke when someone with access leaves\n\n\nAndroid upload keystore\nAs long as its validity (set it to decades)\nBack it up; reset via Play Console if lost\n\n\nPlay service account key\nUntil deleted\nRotate yearly or when access changes\n\n\n\nPut the Apple dates in a shared calendar. An expired certificate does not affect apps already on users’ devices, but it blocks every new build.\nTroubleshooting\n\n\n\nError\nCause and fix\n\n\n\n\nProvisioning profile doesn't include signing certificate\nProfile was generated for a different certificate. Regenerate it with the current one.\n\n\nProvisioning profile doesn't match bundle ID\nProfile created for another app ID or missing an extension target. Add a bundleId=path mapping for each target.\n\n\nMAC verification failed\nWrong .p12 password, or OpenSSL 3 export without -legacy.\n\n\nKeystore was tampered with, or password was incorrect\nWrong store password, or the file was corrupted by base64 line breaks.\n\n\nKey alias not found\nAlias differs from the one in the keystore. List it with keytool -list -keystore release.jks.\n\n\nApp Store Connect authentication failed\nWrong key ID or issuer ID, revoked key, or a skewed system clock on the machine that signs the token.\n\n\nPlay upload: caller does not have permission\nService account not invited in Play Console, or the Android Developer API not enabled.\n\n\n\nMore fixes are in the Capgo Build troubleshooting guide and CI/CD for Capacitor: common pitfalls.\nAfter the first signed build\nSigned native builds are only needed when native code changes. For JavaScript, CSS, and HTML changes, ship a live update to installed apps instead and keep store builds for releases that touch plugins or native configuration. If you are coming from a Mac-based setup, Build an iOS app from Windows with Capgo Build shows the full workflow without macOS.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-sign-and-build-capacitor-app-in-the-cloud/"},"keywords":"sign Capacitor app, Capacitor cloud build, Capacitor code signing, iOS certificate CI, Android keystore CI, build Capacitor without Mac, Capgo Build, TestFlight upload Capacitor","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-sign-and-build-capacitor-app-in-the-cloud/#faqpage","url":"https://capgo.app/blog/how-to-sign-and-build-capacitor-app-in-the-cloud/","mainEntity":[{"@type":"Question","name":"What files do I need to sign a Capacitor app in the cloud?","acceptedAnswer":{"@type":"Answer","text":"For Android, a keystore (.jks or .keystore) with its alias and passwords, plus a Google Play service account JSON if you want automatic uploads. For iOS, an Apple Distribution certificate exported as .p12, a provisioning profile for each app target, and an App Store Connect API key (.p8) for uploads."}},{"@type":"Question","name":"Can I create an iOS distribution certificate without a Mac?","acceptedAnswer":{"@type":"Answer","text":"Yes. Generate a private key and certificate signing request with OpenSSL or a browser tool, upload the request in the Apple Developer portal, then combine the downloaded certificate with your key into a .p12. Capgo's onboarding can also create the certificate and profile for you."}},{"@type":"Question","name":"Does Capgo store my signing keys?","acceptedAnswer":{"@type":"Answer","text":"No. The Capgo CLI keeps credentials on your machine or in your CI secrets. They are sent over HTTPS for each build, used only during that build, and deleted when it completes."}},{"@type":"Question","name":"What happens when my iOS certificate expires?","acceptedAnswer":{"@type":"Answer","text":"Apps already on the App Store keep working, but new builds fail to sign. Create a new Apple Distribution certificate, regenerate the provisioning profiles that reference it, save the new files with the Capgo CLI, and update your CI secrets."}},{"@type":"Question","name":"Do I need separate credentials for development and production?","acceptedAnswer":{"@type":"Answer","text":"For iOS, yes: App Store builds use an App Store Connect profile, test builds on registered devices use an Ad Hoc profile, both signed with the same distribution certificate. For Android, one upload keystore covers all Play tracks, and debug builds use the default debug key."}}]}]}</script>
