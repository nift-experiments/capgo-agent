<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/automatic-capacitor-android-build-github-action/#newsarticle","url":"https://capgo.app/blog/automatic-capacitor-android-build-github-action/","headline":"Automatic Capacitor Android build with GitHub actions","description":"How to set up a CI/CD pipeline for your Android Capacitor app using fastlane and GitHub Actions in 5 minutes","image":["https://capgo.app/fastlane_android.webp"],"datePublished":"2022-10-27T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Setting up CI/CD for Capacitor apps can be complex and time-consuming. Here’s what you need to know:\nRecommended for New Builds: Use Capgo Build\n\nWe now recommend using Capgo Build with the Capgo CLI for native Capacitor builds.\nThis Fastlane guide is kept for teams maintaining existing GitHub Actions pipelines, but new Android builds should use the Capgo CLI so you do not have to maintain Fastlane, Gradle runners, keystores, and upload scripts yourself.\n\nPrerequisites\nBefore starting, you’ll need to set up:\n\nA GitHub account with admin access\nYour app already published on Google Play Store with proper signing\nAndroid signing key and keystore files\nGoogle Cloud Console project with Play Store API enabled\nService account with proper permissions\nUnderstanding of GitHub Actions workflows\nKnowledge of Fastlane configuration\nTime to maintain and debug the pipeline\n\nCapgo Build for CI/CD by Capgo\nSkip the Fastlane, Gradle runner, keystore, and upload-script maintenance. Capgo Build runs signed native Android builds from your existing CI/CD pipeline:\n\nWorks with your pipeline: Trigger Capgo Build from GitHub Actions, GitLab CI, Jenkins, or local scripts after your web build and npx cap sync.\nSigning from CI secrets: Keep Android keystores, key aliases, passwords, and Play Console service account JSON in your own CI secrets.\nNo native runner upkeep: Capgo Build provides maintained Android build environments, so you do not have to manage SDK images, Gradle cache issues, or Fastlane lanes.\nArtifacts and submission: Download signed artifacts for QA or submit release builds through the Capgo CLI.\n\nPricing\n\nCapgo plans start at $12/month\nIncludes OTA updates and about 15 native builds per month\nExtra build minutes are billed by minute through credits\n\nSet up Capgo Build in CI/CD\nManual Setup Guide\nHere’s what you need to do:\nGitHub Actions Pricing\n\nGitHub Actions offers free minutes based on your repository type:\n\nPublic repositories: 2,000 minutes/month\nPrivate repositories: 2,000 minutes/month (Linux runners)\n\nFor private projects, costs are approximately $0.008/minute. A typical build takes 3-5 minutes.\nManual Setup Steps\n\nCreate Android Keystore\nSet up Google Play Service Account\nSet up Fastlane\nConfigure GitHub secrets\nCreate GitHub Actions workflow\n\n1. Create Android Keystore\nBefore you can sign and publish your Android app, you need to create a keystore file. This is a one-time setup.\nGenerate Keystore with keytool\nRun this command in your terminal:\nkeytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000\nYou’ll be prompted for:\n\nKeystore password: Choose a strong password (you’ll need this as KEYSTORE_STORE_PASSWORD)\nKey password: Choose a strong password (you’ll need this as KEYSTORE_KEY_PASSWORD)\nYour name, organization, etc.: Fill in your details\n\nImportant Notes\n\n\nSave these values securely:\n\nKeystore file location (e.g., my-release-key.keystore)\nKey alias (e.g., my-key-alias) - you’ll need this as KEYSTORE_KEY_ALIAS\nKeystore password - you’ll need this as KEYSTORE_STORE_PASSWORD\nKey password - you’ll need this as KEYSTORE_KEY_PASSWORD\n\n\n\nBackup the keystore file: If you lose it, you cannot update your published app\n\n\nKeep it secret: Never commit the keystore file to git\n\n\nStore it safely: Keep multiple backups in secure locations\n\n\nAlternative: Use Existing Keystore\nIf you already published your app, you must use the same keystore you used initially. You can find it:\n\nIn your local machine where you first built the app\nIn your Play Console → Setup → App signing (if using Google Play App Signing)\n\n2. Set up Google Play Service Account\nTo allow GitHub Actions to upload builds to Google Play, you need a service account.\nStep 2.1: Create Google Cloud Project\n\nGo to Google Cloud Console\nCreate a new project or select existing one\nNote the project ID\n\nStep 2.2: Enable Google Play Developer API\n\nIn Google Cloud Console, go to APIs &amp; Services → Library\nSearch for “Google Play Android Developer API”\nClick Enable\n\nStep 2.3: Create Service Account\n\nGo to IAM &amp; Admin → Service Accounts\nClick Create Service Account\nEnter details:\n\nName: github-actions-uploader\nDescription: “Service account for GitHub Actions to upload builds”\n\n\nClick Create and Continue\nSkip role assignment for now (click Continue, then Done)\n\nStep 2.4: Create Service Account Key\n\nClick on the newly created service account\nGo to Keys tab\nClick Add Key → Create new key\nChoose JSON format\nClick Create\nA JSON file will download - save this securely, you’ll need it later\n\nStep 2.5: Grant Access in Play Console\n\nGo to Google Play Console\nGo to Setup → API access\nUnder Service accounts, click Grant access for your service account\nOn the App permissions tab, add your app\nOn the Account permissions tab, grant these permissions:\n\nView app information and download bulk reports (read only)\nCreate, edit, and delete draft apps\nRelease apps to testing tracks\nRelease apps to production, exclude, and other tracks\n\n\nClick Invite user\nClick Send invite\n\nStep 2.6: Verify the JSON Key\nThe downloaded JSON file should look like this:\n{\n  \"type\": \"service_account\",\n  \"project_id\": \"your-project-id\",\n  \"private_key_id\": \"...\",\n  \"private_key\": \"-----BEGIN PRIVATE KEY-----\\n...\\n-----END PRIVATE KEY-----\\n\",\n  \"client_email\": \"github-actions-uploader@your-project-id.iam.gserviceaccount.com\",\n  \"client_id\": \"...\",\n  \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\",\n  \"token_uri\": \"https://oauth2.googleapis.com/token\",\n  \"auth_provider_x509_cert_url\": \"https://www.googleapis.com/oauth2/v1/certs\",\n  \"client_x509_cert_url\": \"...\"\n}\nYou’ll convert this to base64 in the GitHub secrets setup step.\n3. Set Up Fastlane\nCreate a fastlane folder at your project root and add a Fastfile with this content:\ndefault_platform(:android)\n\nKEYSTORE_KEY_ALIAS = ENV[\"KEYSTORE_KEY_ALIAS\"]\nKEYSTORE_KEY_PASSWORD = ENV[\"KEYSTORE_KEY_PASSWORD\"]\nKEYSTORE_STORE_PASSWORD = ENV[\"KEYSTORE_STORE_PASSWORD\"]\n\nplatform :android do\n    desc \"Deploy a beta version to the Google Play\"\n    private_lane :verify_changelog_exists do |version_code: |\n      changelog_path = \"android/metadata/en-US/changelogs/#{version_code}.txt\"\n      UI.user_error!(\"Missing changelog file at #{changelog_path}\") unless File.exist?(changelog_path)\n      UI.message(\"Changelog exists for version code #{version_code}\")\n    end\n\n    private_lane :verify_upload_to_staging do |version_name: |\n      UI.message \"Skipping staging verification step\"\n    end\n    \n    lane :beta do\n        keystore_path = \"#{Dir.tmpdir}/build_keystore.keystore\"\n        File.write(keystore_path, Base64.decode64(ENV['ANDROID_KEYSTORE_FILE']))\n        json_key_data = Base64.decode64(ENV['PLAY_CONFIG_JSON'])\n        \n        # Get previous build number and increment\n        previous_build_number = google_play_track_version_codes(\n            package_name: ENV['DEVELOPER_PACKAGE_NAME'],\n            track: \"internal\",\n            json_key_data: json_key_data,\n        )[0]\n        current_build_number = previous_build_number + 1\n        sh(\"export NEW_BUILD_NUMBER=#{current_build_number}\")\n        \n        # Build the app\n        gradle(\n          task: \"clean bundleRelease\",\n          project_dir: 'android/',\n          print_command: false,\n          properties: {\n            \"android.injected.signing.store.file\" =&gt; \"#{keystore_path}\",\n            \"android.injected.signing.store.password\" =&gt; \"#{KEYSTORE_STORE_PASSWORD}\",\n            \"android.injected.signing.key.alias\" =&gt; \"#{KEYSTORE_KEY_ALIAS}\",\n            \"android.injected.signing.key.password\" =&gt; \"#{KEYSTORE_KEY_PASSWORD}\",\n            'versionCode' =&gt; current_build_number\n          })\n        \n        # Upload to Play Store\n        upload_to_play_store(\n            package_name: ENV['DEVELOPER_PACKAGE_NAME'],\n            json_key_data: json_key_data,\n            track: 'internal',\n            release_status: 'completed',\n            skip_upload_metadata: true,\n            skip_upload_changelogs: true,\n            skip_upload_images: true,\n            skip_upload_screenshots: true,\n        )\n    end\nend\n4. Configure GitHub Secrets\nNow that you have your keystore and service account JSON, you need to store them securely in GitHub.\nStep 4.1: Access GitHub Secrets\n\nGo to your repository on GitHub\nClick Settings → Secrets and variables → Actions\nClick New repository secret\n\nStep 4.2: Add Required Secrets\nAdd each of these secrets one by one:\nPLAY_CONFIG_JSON\n\nTake the service account JSON file you downloaded in Step 2.4\nConvert it to base64:\n\nOn macOS/Linux:\nbase64 service_account_key.json | pbcopy\nOn Windows (PowerShell):\n[Convert]::ToBase64String([IO.File]::ReadAllBytes(\"service_account_key.json\")) | Set-Clipboard\n\nCreate a new secret named PLAY_CONFIG_JSON and paste the base64 string\n\nANDROID_KEYSTORE_FILE\n\nConvert your keystore to base64:\n\nOn macOS/Linux:\nbase64 my-release-key.keystore | pbcopy\nOn Windows (PowerShell):\n[Convert]::ToBase64String([IO.File]::ReadAllBytes(\"my-release-key.keystore\")) | Set-Clipboard\n\nCreate a new secret named ANDROID_KEYSTORE_FILE and paste the base64 string\n\nKEYSTORE_KEY_ALIAS\nCreate a new secret with the key alias you used when generating the keystore (e.g., my-key-alias)\nKEYSTORE_KEY_PASSWORD\nCreate a new secret with the key password you set when generating the keystore\nKEYSTORE_STORE_PASSWORD\nCreate a new secret with the keystore password you set when generating the keystore\nDEVELOPER_PACKAGE_NAME\nCreate a new secret with your app’s package name (e.g., com.example.app)\nYou can find your package name in android/app/build.gradle under applicationId\nStep 4.3: Verify All Secrets\nMake sure you have these 6 secrets configured:\n\n✅ PLAY_CONFIG_JSON\n✅ ANDROID_KEYSTORE_FILE\n✅ KEYSTORE_KEY_ALIAS\n✅ KEYSTORE_KEY_PASSWORD\n✅ KEYSTORE_STORE_PASSWORD\n✅ DEVELOPER_PACKAGE_NAME\n\n5. Create GitHub Actions Workflow\nCreate .github/workflows/build-upload-android.yml:\nname: Build and Deploy Android App\n\non:\n  push:\n    tags:\n      - '*'\n\njobs:\n  build_android:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      \n      - name: Setup Node.js\n        uses: actions/setup-node@v6\n        with:\n          node-version: 24\n          cache: npm\n          \n      - name: Install dependencies\n        run: npm ci\n        \n      - name: Cache Gradle\n        uses: actions/cache@v5\n        with:\n          path: |\n            ~/.gradle/caches\n            ~/.gradle/wrapper\n          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}\n          restore-keys: |\n            ${{ runner.os }}-gradle-\n            \n      - name: Build app\n        run: npm run build\n        \n      - name: Sync Capacitor\n        run: npx cap sync\n        \n      - name: Setup Java\n        uses: actions/setup-node@v5\n        with:\n            distribution: 'zulu'\n            java-version: '17'\n            \n      - name: Setup Ruby\n        uses: ruby/setup-ruby@v1\n        with:\n          ruby-version: '3.0'\n          bundler-cache: true\n          \n      - name: Run Fastlane\n        uses: maierj/fastlane-action@v3.1.0\n        env:\n          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}\n          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}\n          DEVELOPER_PACKAGE_NAME: ${{ secrets.DEVELOPER_PACKAGE_NAME }}\n          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}\n          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}\n          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}\n        with:\n          lane: android beta\n          \n      - name: Upload artifact\n        uses: actions/upload-artifact@v2\n        with:\n          name: android-release\n          path: ./android/app/build/outputs/bundle/release/app-release.aab\n          retention-days: 10\nHow It Works\n\nCreate a Git tag to trigger the workflow\nGitHub Actions builds your app\nFastlane uploads it to Google Play beta channel\nYour app is automatically updated\n\nBuild Time and Costs\n\nBuild time: 3-5 minutes\nCost for private repos: ~$0.04 per build\nFree for open-source projects\n\nRelated Articles\nCI/CD Setup Guides\n\nAutomatic Capacitor iOS Build with GitHub Actions - Complete iOS CI/CD setup\nAutomatic Build and Release with GitHub Actions - Full CI/CD pipeline tutorial\nManage Dev and Prod Builds with GitHub Actions - Environment management\n\nAlternative CI/CD Platforms\n\nBuild with GitLab CI - GitLab alternative for Android\nBuild with CodeMagic - CodeMagic setup guide\n\nLive Updates &amp; Deployment\n\nCapgo Live Updates Documentation - Add OTA updates to your app\nCI/CD Integration with Capgo - Integrate live updates in your pipeline\n\nResources\n\nGitHub Actions Documentation\nFastlane Documentation\n\nKeep going from Automatic Capacitor Android build with GitHub actions\nIf you are using Automatic Capacitor Android build with GitHub actions to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/automatic-capacitor-android-build-github-action/"},"keywords":"Fastlane, CI/CD, Android, automatic build, automatic release, mobile app updates, Capacitor","articleSection":"CI/CD"}</script>
