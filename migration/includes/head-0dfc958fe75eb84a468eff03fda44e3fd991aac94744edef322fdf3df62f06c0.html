<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/ci-cd-for-cordova-apps/#newsarticle","url":"https://capgo.app/blog/ci-cd-for-cordova-apps/","headline":"CI/CD for Cordova Apps in 2026: A Complete Setup Guide","description":"Set up CI/CD for Cordova apps in 2026: signed Android AAB and iOS IPA builds, store uploads, live update options, and when to move to Capacitor.","image":["https://capgo.app/cordova.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"CI/CD for a Cordova app in 2026 means building and signing the Android AAB on a Linux runner, building and signing the iOS IPA on a macOS runner, and uploading both to the stores from the same pipeline. The managed services Cordova teams used for this are gone or closing, so most teams now run the Cordova CLI on a general-purpose CI. This guide gives you a working GitHub Actions setup, the same steps for other CIs, and an honest look at live updates and long-term options.\nWhat changed for Cordova teams\nThree events shaped Cordova CI/CD:\n\nPhoneGap Build shut down on October 1, 2020.\nMicrosoft App Center retired on March 31, 2025. Build, distribution, and the hosted CodePush service ended with it.\nIonic Appflow stopped new sales in February 2025. Existing customers keep access until December 31, 2027.\n\nCordova itself still works. The Apache project ships cordova-android and cordova-ios releases, and plenty of internal and enterprise apps run on it. The gap is the managed layer: signing storage, store uploads, and over-the-air updates. You now assemble those from a CI service plus a few tools.\nAnatomy of a Cordova pipeline\n\n\n\nStage\nAndroid\niOS\n\n\n\n\nRunner\nLinux\nmacOS with Xcode 26\n\n\nRestore\ncordova prepare (platforms and plugins from package.json)\nsame\n\n\nWeb build\nyour bundler (Vite, webpack, Angular CLI) into www/\nsame\n\n\nNative build\nGradle via cordova build android --release\nxcodebuild via cordova build ios --release --device\n\n\nSigning\nupload keystore (.jks)\ndistribution certificate (.p12) and provisioning profile\n\n\nArtifact\n.aab for Google Play\n.ipa for TestFlight and the App Store\n\n\nUpload\nGoogle Play Developer API (service account)\nApp Store Connect API key\n\n\n\nTwo platform rules apply to every pipeline:\n\nSince April 28, 2026, App Store Connect only accepts builds made with Xcode 26 and the iOS 26 SDK or later. Check that your cordova-ios version supports it.\nGoogle Play requires AAB uploads for new apps, and raises its minimum target API level every year. Keep cordova-android current so its default targetSdkVersion follows.\n\nStep 1: Make the project reproducible\nCI can only rebuild what is in the repository. Before writing any workflow:\n\nCommit package.json and the lockfile. Cordova stores platforms and plugins in the cordova section of package.json, so cordova prepare restores them.\nDo not commit platforms/ or plugins/. They are generated.\nInstall the Cordova CLI as a dev dependency so every machine uses the same version:\n\nbun add -d cordova\n\nMove signing values out of config.xml and into a build.json that reads secrets at build time (next step).\nPin the Node.js version in .nvmrc or package.json engines.\n\nStep 2: Signing with build.json\nCordova reads signing settings from a build.json file. Commit a build.template.json with placeholders, generate the real build.json in CI from secrets, and never commit the generated file:\n{\n  \"android\": {\n    \"release\": {\n      \"keystore\": \"release.jks\",\n      \"storePassword\": \"${KEYSTORE_STORE_PASSWORD}\",\n      \"alias\": \"upload\",\n      \"password\": \"${KEYSTORE_KEY_PASSWORD}\",\n      \"packageType\": \"bundle\"\n    }\n  },\n  \"ios\": {\n    \"release\": {\n      \"codeSignIdentity\": \"Apple Distribution\",\n      \"developmentTeam\": \"ABCDE12345\",\n      \"packageType\": \"app-store\",\n      \"provisioningProfile\": \"com.example.app AppStore\",\n      \"automaticProvisioning\": false\n    }\n  }\n}\nThe ${...} placeholders are not expanded by Cordova. The workflow below writes the real values with envsubst.\nIf you do not have an Android keystore yet, create one with keytool or the browser-based Android keystore generator. For iOS, the iOS certificate generator creates a certificate signing request and .p12 without a Mac.\nStep 3: A GitHub Actions workflow\nThis workflow builds both platforms in parallel on a version tag and uploads them to the internal testing tracks.\n# .github/workflows/cordova-release.yml\nname: Cordova release\n\non:\n  push:\n    tags: ['v*']\n\njobs:\n  android:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: oven-sh/setup-bun@v2\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n      - run: bun install --frozen-lockfile\n      - run: bun run build            # outputs to www/\n      - run: bunx cordova prepare android\n      - name: Signing files\n        env:\n          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}\n          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}\n          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}\n        run: |\n          echo \"$KEYSTORE_BASE64\" | base64 --decode &gt; release.jks\n          envsubst &lt; build.template.json &gt; build.json\n      - run: bunx cordova build android --release --buildConfig=build.json\n      - uses: r0adkll/upload-google-play@v1\n        with:\n          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}\n          packageName: com.example.app\n          releaseFiles: platforms/android/app/build/outputs/bundle/release/app-release.aab\n          track: internal\n          status: completed\n\n  ios:\n    runs-on: macos-26\n    steps:\n      - uses: actions/checkout@v6\n      - uses: oven-sh/setup-bun@v2\n      - run: bun install --frozen-lockfile\n      - run: bun run build\n      - run: bunx cordova prepare ios\n      - name: Install certificate and profile\n        env:\n          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}\n          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}\n          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}\n          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}\n        run: |\n          echo \"$P12_BASE64\" | base64 --decode &gt; dist.p12\n          security create-keychain -p \"$KEYCHAIN_PASSWORD\" build.keychain\n          security set-keychain-settings -lut 21600 build.keychain\n          security unlock-keychain -p \"$KEYCHAIN_PASSWORD\" build.keychain\n          security import dist.p12 -k build.keychain -P \"$P12_PASSWORD\" -T /usr/bin/codesign\n          security set-key-partition-list -S apple-tool:,apple: -s -k \"$KEYCHAIN_PASSWORD\" build.keychain\n          security list-keychains -d user -s build.keychain login.keychain\n          for dir in \"$HOME/Library/MobileDevice/Provisioning Profiles\" \\\n                     \"$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles\"; do\n            mkdir -p \"$dir\"\n            echo \"$PROFILE_BASE64\" | base64 --decode &gt; \"$dir/app.mobileprovision\"\n          done\n          cp build.template.json build.json   # iOS values hold no secrets\n      - run: bunx cordova build ios --release --device --buildConfig=build.json\n      - name: Upload to TestFlight\n        env:\n          API_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n          API_ISSUER: ${{ secrets.APPLE_ISSUER_ID }}\n          API_KEY_BASE64: ${{ secrets.APPLE_KEY_CONTENT }}\n        run: |\n          mkdir -p ~/.appstoreconnect/private_keys\n          echo \"$API_KEY_BASE64\" | base64 --decode &gt; ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8\n          IPA=$(find platforms/ios/build -name '*.ipa' | head -n 1)\n          xcrun altool --upload-app -f \"$IPA\" -t ios --apiKey \"$API_KEY_ID\" --apiIssuer \"$API_ISSUER\"\n      - name: Clean up keychain\n        if: always()\n        run: security delete-keychain build.keychain || true\nWhy some lines are there:\n\nTwo provisioning profile folders. Xcode 16 and later read profiles from ~/Library/Developer/Xcode/UserData/Provisioning Profiles. Older Xcode used ~/Library/MobileDevice/Provisioning Profiles. Writing both avoids “No profiles for ‘com.example.app’ were found”.\nset-key-partition-list stops macOS from prompting for keychain access, which would hang a CI job.\nJDK version. Use the JDK your cordova-android release documents. Recent releases build with JDK 17.\nBuild numbers. Bump android-versionCode and ios-CFBundleVersion in config.xml before the build, for example from the CI run number, or the stores reject the upload as a duplicate.\n\nYou can swap the altool upload for fastlane’s upload_to_testflight and the Play action for fastlane supply if your team already uses fastlane.\nStep 4: The same pipeline on other CI services\nThe commands do not change between CIs. Only the runner selection and secret syntax do.\n\n\n\nCI\nAndroid runner\niOS runner\nNotes\n\n\n\n\nGitHub Actions\nubuntu-latest\nmacos-26 / macos-latest\nmacOS minutes cost more than Linux on private repos\n\n\nGitLab CI\nany Linux runner\nhosted macOS runners (beta, Premium and Ultimate) or self-hosted\nimages such as macos-26-xcode-26\n\n\nBitbucket Pipelines\nLinux Docker image\nself-hosted Mac only\nsee Bitbucket iOS guide\n\n\nGitea / Forgejo\nLinux runner\nself-hosted Mac in host mode\nsee Gitea iOS guide\n\n\nBitrise\nLinux stacks\nmacOS stacks\nships Cordova steps (prepare, archive)\n\n\nCodemagic\nLinux\nMac mini instances\ndocuments Ionic Cordova builds in codemagic.yaml\n\n\nAzure DevOps\nubuntu-latest\nmacOS-latest\ntasks to install certificates and profiles\n\n\n\nFor a feature-by-feature view, read Comparing CI/CD platforms for Cordova apps.\nStep 5: Live updates for Cordova\nLive updates let you ship HTML, CSS, and JavaScript fixes without a store review. App Center CodePush ended in March 2025, Appflow Live Updates end on December 31, 2027, and the old community hot code push plugins are unmaintained. A maintained option is Capgo live updates with the @capgo/cordova-updater plugin, which uses the same backend, channels, and CLI as the Capacitor updater.\nRequirements\n\nCordova CLI 12+\ncordova-android 13+ and/or cordova-ios 7+ (the plugin relies on their default https://localhost/ and app://localhost/ schemes)\nDo not use cordova-plugin-ionic-webview with it. Ionic WebView bypasses Cordova’s scheme handlers, so downloaded bundles would not load.\n\nInstall the plugin\nCreate the app in Capgo the same way as for Capacitor, then install the plugin with your Capgo app ID:\ncordova plugin add @capgo/cordova-updater \\\n  --variable APP_ID=com.example.app \\\n  --variable DEFAULT_CHANNEL=production\ncordova prepare android ios\nDEFAULT_CHANNEL, UPDATE_URL, and AUTO_UPDATE are optional install variables. Run cordova prepare again whenever you change them.\nConfirm each launch\nAfter deviceready, the plugin is available as cordova.plugins.Updater. Call notifyAppReady() on every launch, or the plugin treats the new bundle as broken and rolls back:\ndocument.addEventListener('deviceready', async () =&gt; {\n  const { Updater } = cordova.plugins\n\n  await Updater.notifyAppReady()\n\n  const latest = await Updater.getLatest()\n  if (latest.url &amp;&amp; !latest.error) {\n    const bundle = await Updater.download({\n      url: latest.url,\n      version: latest.version,\n      checksum: latest.checksum,\n    })\n    await Updater.next({ id: bundle.id })\n  }\n})\nUpload bundles from CI\nAdd a job that builds the web layer and uploads it, for web-only changes:\n  live-update:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: oven-sh/setup-bun@v2\n      - run: bun install --frozen-lockfile\n      - run: bun run build\n      - run: bunx @capgo/cli@latest bundle upload --channel=production\n        env:\n          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}\nLive updates only replace the web bundle. Adding, removing, or upgrading a Cordova plugin still needs a new store build. Capgo compares the native plugins recorded for the live bundle with your project and flags incompatible uploads; see live update compatibility. Full setup is in the Cordova updater docs.\nOn the build side, the Capgo Build documentation covers Capacitor projects only (it uploads the native project produced by cap sync). Cordova binaries keep building on your CI as shown above.\nOptional: migrating to Capacitor later\nYou do not need to leave Cordova to get a working pipeline and live updates. Migration is a separate decision, worth it when:\n\nYou want iOS builds without maintaining macOS runners. Capgo Build compiles Capacitor apps from a Linux CI job.\nPlugins you depend on stopped receiving Cordova updates, but have Capacitor equivalents.\nYou want Swift Package Manager support and current Android Gradle Plugin versions without patching platforms.\n\nThe migration keeps your www code. You add Capacitor, move plugins over (most Cordova plugins work as is), and replace a few that have Capacitor-native equivalents. Your Capgo app ID and channels stay the same; only the updater plugin changes from @capgo/cordova-updater to @capgo/capacitor-updater. The steps are in Migrating from Cordova to Capacitor, and the Cordova to Capacitor solution page covers getting help with it. After migration, the CI above shrinks to a web build, cap sync, and one build request call per platform, as described in Comparing CI/CD platforms for Capacitor apps.\nTroubleshooting Cordova builds in CI\n\n\n\nError\nCause and fix\n\n\n\n\nCurrent working directory is not a Cordova-based project\nconfig.xml or www/ missing. Run your web build before Cordova commands, or create an empty www/.\n\n\nNo platforms added to this project\nPlatforms are not listed in package.json. Run cordova platform add locally once and commit package.json.\n\n\nCould not find an installed version of Gradle\nRecent cordova-android uses the Gradle wrapper. Update the platform rather than installing Gradle globally.\n\n\nUnsupported class file major version\nJDK on the runner does not match the one cordova-android expects. Pin it with setup-java.\n\n\nNo signing certificate \"iOS Distribution\" found\nUse Apple Distribution as the identity, and check that the .p12 contains the private key.\n\n\nerrSecInternalComponent\nLocked keychain or missing partition list. Re-run the keychain setup commands.\n\n\nUpload rejected: SDK too old\nRunner image uses Xcode older than 26. Select macos-26 or set Xcode with xcode-select.\n\n\nPlay upload: Version code has already been used\nBump android-versionCode for every upload.\n\n\n\nSummary\nA Cordova pipeline in 2026 is a CI job per platform: a Linux runner for the Android AAB, a macOS runner with Xcode 26 for the IPA, secrets decoded into a generated build.json, and API keys for both stores. Any mainstream CI can run it. Add @capgo/cordova-updater and a bundle upload job for web-only fixes, and you have the build, store, and over-the-air pieces Appflow and App Center used to provide. Moving to Capacitor stays an option for later, not a requirement.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/ci-cd-for-cordova-apps/"},"keywords":"Cordova CI/CD, Cordova build pipeline, Cordova GitHub Actions, Cordova iOS build, Cordova Android AAB, Cordova live updates, App Center Cordova replacement, Cordova to Capacitor","articleSection":"CI/CD"},{"@type":"FAQPage","@id":"https://capgo.app/blog/ci-cd-for-cordova-apps/#faqpage","url":"https://capgo.app/blog/ci-cd-for-cordova-apps/","mainEntity":[{"@type":"Question","name":"Is Apache Cordova still usable in 2026?","acceptedAnswer":{"@type":"Answer","text":"Yes. Cordova still ships platform releases and many production apps run on it. What changed is the tooling around it: App Center retired on March 31, 2025, and Ionic Appflow only serves existing customers until December 31, 2027, so most Cordova teams need to own their build pipeline."}},{"@type":"Question","name":"Which CI service can build a Cordova app?","acceptedAnswer":{"@type":"Answer","text":"Any CI with a Linux runner can build the Android app, and any CI with macOS runners can build iOS: GitHub Actions, GitLab CI, Bitrise, Codemagic, Appcircle, CircleCI, and Azure DevOps all work. Bitrise and Codemagic document Cordova specifically; the others run the Cordova CLI as a script."}},{"@type":"Question","name":"How do I sign a Cordova Android release in CI?","acceptedAnswer":{"@type":"Answer","text":"Decode the keystore from a CI secret, then run cordova build android --release with a build.json that sets keystore, alias, passwords, and packageType bundle. Google Play requires an AAB for new apps and uses Play App Signing, so your keystore acts as the upload key."}},{"@type":"Question","name":"Does Capgo support Cordova live updates?","acceptedAnswer":{"@type":"Answer","text":"Yes. The @capgo/cordova-updater plugin brings Capgo live updates to Cordova iOS 7+ and Cordova Android 13+ apps, with the same JavaScript API as the Capacitor updater. You upload bundles from CI with the Capgo CLI bundle upload command."}},{"@type":"Question","name":"What replaced App Center CodePush for Cordova?","acceptedAnswer":{"@type":"Answer","text":"Microsoft did not ship a hosted replacement. Options are a managed service with a Cordova client such as Capgo with @capgo/cordova-updater, Ionic Appflow until its end date for existing customers, or a self-hosted update server."}}]}]}</script>
