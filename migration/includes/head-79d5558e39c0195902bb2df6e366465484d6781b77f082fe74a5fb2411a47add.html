<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/create-offline-screen-in-vue-angular-react/#newsarticle","url":"https://capgo.app/blog/create-offline-screen-in-vue-angular-react/","headline":"Offline Screen in Vue, Angular, React with Capacitor","description":"Learn how to implement an offline screen in Vue, Angular, or React applications using the Network API and Capacitor. Improve the user experience by handling offline scenarios effectively.","image":["https://capgo.app/vue_angular_react.webp"],"datePublished":"2022-06-21T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"How to Create an Offline Screen in Vue 3, Angular 14, or React\nIn this tutorial, we will learn how to create an offline screen in Vue 3, Angular 14, and React applications using the Network API. The Network API provides network and connectivity information, allowing us to handle offline scenarios and provide a better user experience. For deeper reachability checks beyond a simple online/offline flag, @capgo/capacitor-network-diagnostics can test URL reachability, TCP ports, and WebSocket handshakes from native code.\nPrerequisites\nBefore we begin, make sure you have the following installed:\n\nNode.js (version 14 or higher)\nVue CLI\nAngular CLI\nCreate React App\n\nSetting Up the Project\nFirst, let’s create a new project using the respective scaffolding tool for each framework.\nVue 3\nOpen your terminal and run the following command to create a new Vue 3 project:\nvue create offline-screen-vue3\nChoose the default preset and wait for the project to be created.\nAngular 14\nOpen your terminal and run the following command to create a new Angular 14 project:\nng new offline-screen-angular14\nFollow the prompts, and when asked for additional features, select “Routing” by pressing the spacebar key. Wait for the project to be created.\nReact\nOpen your terminal and run the following command to create a new React project:\nnpx create-react-app offline-screen-react\nWait for the project to be created.\nInstalling the Network API\nNow, let’s install the @capacitor/network package, which provides the Network API.\nOpen your terminal and navigate to your project directory. Then, run the following command to install the package:\nnpm install @capacitor/network\nFor Capacitor projects, also run the following command to sync the native project files:\nnpx cap sync\nMake sure you have the Capacitor CLI installed globally by running:\nnpm install -g @capacitor/cli\nImplementing the Offline Screen\nNext, we will implement the offline screen functionality in each framework. We will display a simple message when the user goes offline.\nVue 3\nIn your Vue 3 project, open the src/main.js file and import the Network module from @capacitor/network:\nimport { createApp } from 'vue';\nimport { Network } from '@capacitor/network';\n\nconst app = createApp(App);\n\n// Your application setup\n\napp.mount('#app');\n\nNetwork.addListener('networkStatusChange', status =&gt; {\n  if (status.connected) {\n    // User is back online\n    // Hide the offline screen\n    document.getElementById('offline-screen').style.display = 'none';\n  } else {\n    // User is offline\n    // Display the offline screen\n    document.getElementById('offline-screen').style.display = 'block';\n  }\n});\n\nconst logCurrentNetworkStatus = async () =&gt; {\n  const status = await Network.getStatus();\n  console.log('Network status:', status);\n};\nIn your application template (App.vue), add a &lt;div&gt; element with an id of offline-screen to display the offline screen message:\n&lt;template&gt;\n  &lt;div id=\"app\"&gt;\n    &lt;div id=\"offline-screen\"&gt;\n      &lt;h1&gt;You are offline&lt;/h1&gt;\n      &lt;p&gt;Please check your internet connection and try again.&lt;/p&gt;\n    &lt;/div&gt;\n    &lt;!-- Your application content --&gt;\n  &lt;/div&gt;\n&lt;/template&gt;\n\n&lt;style&gt;\n#offline-screen {\n  display: none;\n  text-align: center;\n  padding: 20px;\n  background-color: #f2f2f2;\n}\n\n#offline-screen h1 {\n  font-size: 24px;\n}\n\n#offline-screen p {\n  font-size: 16px;\n}\n&lt;/style&gt;\nNow, when the user goes offline, the offline screen will be displayed. When the user comes back online, the offline screen will be hidden.\nAngular 14\nIn your Angular 14 project, open the src/app/app.component.ts file and import the Network module from @capacitor/network:\nimport { Component } from '@angular/core';\nimport { Network } from '@capacitor/network';\n\n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n})\nexport class AppComponent {\n\n  constructor() {\n    Network.addListener('networkStatusChange', status =&gt; {\n      if (status.connected) {\n        // User is back online\n        // Hide the offline screen\n        document.getElementById('offline-screen').style.display = 'none';\n      } else {\n        // User is offline\n        // Display the offline screen\n        document.getElementById('offline-screen').style.display = 'block';\n      }\n    });\n  }\n\n  logCurrentNetworkStatus = async () =&gt; {\n    const status = await Network.getStatus();\n    console.log('Network status:', status);\n  };\n\n}\nIn your application template (app.component.html), add a &lt;div&gt; element with an id of offline-screen to display the offline screen message:\n&lt;div id=\"offline-screen\"&gt;\n  &lt;h1&gt;You are offline&lt;/h1&gt;\n  &lt;p&gt;Please check your internet connection and try again.&lt;/p&gt;\n&lt;/div&gt;\n\n&lt;!-- Your application content --&gt;\nAdd the following styles to the app.component.css file:\n#offline-screen {\n  display: none;\n  text-align: center;\n  padding: 20px;\n  background-color: #f2f2f2;\n}\n\n#offline-screen h1 {\n  font-size: 24px;\n}\n\n#offline-screen p {\n  font-size: 16px;\n}\nNow, when the user goes offline, the offline screen will be displayed. When the user comes back online, the offline screen will be hidden.\nReact\nIn your React project, open the src/App.js file and import the Network module from @capacitor/network:\nimport React, { useEffect } from 'react'\nimport { Network } from '@capacitor/network'\n\nfunction App() {\n\n  useEffect(() =&gt; {\n    Network.addListener('networkStatusChange', (status) =&gt; {\n      if (status.connected) {\n        // User is back online\n        // Hide the offline screen\n        document.getElementById('offline-screen').style.display = 'none'\n      }\n      else {\n        // User is offline\n        // Display the offline screen\n        document.getElementById('offline-screen').style.display = 'block'\n      }\n    })\n  }, [])\n\n  const logCurrentNetworkStatus = async () =&gt; {\n    const status = await Network.getStatus()\n    console.log('Network status:', status)\n  }\n\n  return (\n    &lt;div id=\"app\"&gt;\n      &lt;div id='offline-screen'&gt;\n        &lt;h1&gt;You are offline&lt;/h1&gt;\n        &lt;p&gt;Please check your internet connection and try again.&lt;/p&gt;\n      &lt;/div&gt;\n      {/* Your application content */}\n    &lt;/div&gt;\n  )\n\n}\n\nexport default App\nAdd the following styles to the App.css file:\n#offline-screen {\n  display: none;\n  text-align: center;\n  padding: 20px;\n  background-color: #f2f2f2;\n}\n\n#offline-screen h1 {\n  font-size: 24px;\n}\n\n#offline-screen p {\n  font-size: 16px;\n}\nNow, when the user goes offline, the offline screen will be displayed. When the user comes back online, the offline screen will be hidden.\nSupporting Methods and Interfaces\nThe Network API provides several methods and interfaces to help you handle the network connection. Here are some of the key ones:\n\ngetStatus(): Query the current status of the network connection.\naddListener('networkStatusChange', ...): Listen for changes in the network connection.\n\n\nKeep going from Offline Screen in Vue, Angular, React with Capacitor\nIf you are using Offline Screen in Vue, Angular, React with Capacitor to plan native media and interface behavior, connect it with Using @capgo/capacitor-live-activities for the native capability in Using @capgo/capacitor-live-activities, @capgo/capacitor-live-activities for the implementation detail in @capgo/capacitor-live-activities, Using @capgo/capacitor-video-player for the native capability in Using @capgo/capacitor-video-player, @capgo/capacitor-video-player for the implementation detail in @capgo/capacitor-video-player, and Using @capgo/capacitor-native-navigation for the native capability in Using @capgo/capacitor-native-navigation.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/create-offline-screen-in-vue-angular-react/"},"keywords":"Vue, Angular, React, offline screen, network API, Capacitor, mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Tutorial"}</script>
