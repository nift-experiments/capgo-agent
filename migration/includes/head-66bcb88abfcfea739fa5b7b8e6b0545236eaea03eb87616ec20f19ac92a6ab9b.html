<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/preparing-for-capacitor-9/#newsarticle","url":"https://capgo.app/blog/preparing-for-capacitor-9/","headline":"Preparing for Capacitor 9: What App and Plugin Teams Can Do Now","description":"Capacitor 9 raises the bar on Node, Xcode, Android Gradle, and deprecated native APIs. Here is how to get ready on Capacitor 8 before you flip the version switch, including Cordova optional sync, CLI live reload, and Capgo OTA store builds.","image":["https://capgo.app/blog-images/preparing-for-capacitor-9.webp"],"datePublished":"2026-09-14T10:00:00.000Z","dateModified":"2026-09-15T11:38:07.000Z","inLanguage":"en","articleBody":"Capacitor 9 is available on the next dist-tag while it moves toward general availability. You do not have to upgrade your app the day the alpha lands, but the official Capacitor 9 update guide and plugin update guide already spell out toolchain floors and API removals that are worth addressing early.\nThis article is a preparation checklist: work you can do on Capacitor 8 (or on a branch) so the eventual bunx cap migrate pass is boring instead of painful. When you are ready to cut over, follow Ionic’s guides linked above line by line.\nToolchain and platform floors (apps)\nPlan your CI, local machines, and store pipelines around these minimums:\n\n\n\nArea\nCapacitor 9 requirement\n\n\n\n\nNode.js\n24+ (latest LTS recommended; npm 11 ships with Node 24)\n\n\nXcode\n27+\n\n\niOS deployment target\n16.0+\n\n\nAndroid Studio\n2026.1.1+\n\n\nAndroid Gradle Plugin (AGP)\n9.2.1\n\n\nGradle wrapper\n9.5.1\n\n\n\nIf you are still on Capacitor 8.4 or earlier for iOS, you also need the UIScene lifecycle work from the Capacitor 8.5 update before Cap 9 — Xcode 27 expects it. Apps already on 8.5 can skip that extra step.\nOn iOS, Swift 6 (with Xcode 27) rejects @UIApplicationMain; when you upgrade, replace it with @main in AppDelegate.swift as described in the official guide.\nCordova at app sync time (not a plugin prep step)\nIn Capacitor 9, the Cordova compatibility layer is only wired into your app when cap sync detects an installed Cordova plugin. Android drops the extra Gradle modules when none are present; iOS stops adding CapacitorCordova to the Podfile or Package.swift when none are present.\nThat is an app-level behavior change after you upgrade. While you are still on Cap 8, you do not need to rip Cordova out of your template preemptively. Do audit whether any custom native code (yours or a forked plugin) imports Cordova symbols without an actual Cordova plugin in the project — those references will fail once optional Cordova wiring applies.\nAndroid: gradle.properties and AGP 9 defaults\nThe AGP Upgrade Assistant often writes explicit gradle.properties flags so builds keep AGP 8 behavior. Capacitor 9 apps should remove those entries instead of carrying them forward: most are deprecated ahead of AGP 10, and some break Cap 9 builds (for example android.builtInKotlin=false disables Kotlin support that AGP 9 bundles, and android.sdk.defaultTargetSdkToCompileSdkIfUnset=false stops AGP from inferring targetSdkVersion).\nWhen you migrate, also expect to:\n\nBump variables.gradle minimums (compile/target SDK 37, minSdkVersion 26, updated AndroidX versions — see the official doc).\nRemove explicit targetSdkVersion from the app build.gradle so AGP 9 can infer it from compileSdkVersion.\nDeclare variables.gradle symbols at the top of app/build.gradle (Gradle 9.6 deprecates implicit lookup from the root project).\nSwap default ProGuard file names, migrate core-ktx to androidx.core:core 1.19.0+, drop standalone Kotlin Gradle plugin usage, and remove jcenter().\n\nYou can read diff hunks in the Updating to 9.0 Android section and apply the same cleanups on a branch before bumping Capacitor versions.\nCLI: cap run --url\nCapacitor 9 merges live-reload host/port/https flags into a single --url argument. Instead of:\nbunx cap run android -l --host 192.168.1.181 --port 5173\npass the URL your dev server prints:\nbunx cap run android --url http://192.168.1.181:5173/\nUpdate scripts and README snippets now so muscle memory does not fight the new CLI after upgrade.\nOfficial plugins: push and splash gotchas\nTwo user-facing changes show up often in production apps:\nPush Notifications (iOS): The deprecated alert presentation option is removed. Use banner and/or list in your presentation options.\nSplash Screen (Android): Default launchFadeOutDuration changes from 200 ms to 0. If you relied on the fade hiding first paint glitches, set launchFadeOutDuration: 200 explicitly in capacitor.config until you adjust your startup UI.\nScan the plugin sections in the 9.0 update guide for AndroidX and Google Play Services version bumps tied to official plugins you use.\nPlugin maintainers: prep on Cap 8 without breaking Cap 8\nIf you ship Capacitor plugins consumed on Capacitor 8 and want Cap 9-ready code, focus on deprecated API removal, not on Cap-9-only packaging changes.\nSafe to do while Cap 8 remains supported:\n\nReplace @NativePlugin with @CapacitorPlugin and migrate legacy permission / activity-result APIs to @PermissionCallback / @ActivityCallback patterns (see the plugin 9.0 guide table).\nRemove PluginCall.hasOption, Plugin.getConfigValue, old CapConfig constructors and getters, PluginCall.save() / isSaved(), and other Java removals listed under “Breaking changes in code.”\nOn iOS, stop using the CAPBridge compatibility class and deprecated CAPBridgeProtocol helpers; use ApplicationDelegateProxy, typed PluginCall accessors, and bridge properties from the migration table.\nRun bunx @capacitor/plugin-migration-v8-to-v9@latest on a branch and keep only the API edits that still compile against Cap 8 peer dependencies until you publish a major for Cap 9.\n\nDo not remove the Cordova SPM product from your plugin’s Package.swift while you still support Capacitor 8. Cap 8 projects expect that dependency when your plugin is SPM-based; dropping it early breaks consumers still on 8. Treat optional Cordova / removing the unconditional Cordova product as a Capacitor 9-only release line (or a semver major explicitly documented as Cap 9+), after you stop supporting Cap 8 — as described in the plugin guide, not as prep work on the Cap 8 line.\nThe same rule of thumb applies to bumping capacitor-swift-pm to 9.0.0-alpha.x in Package.swift: that belongs on your Cap 9 major, not on a Cap-8-compatible release.\nCapgo live updates and the native Cap 9 store build\nCapgo delivers web bundle updates over the air; the native shell still comes from the App Store and Google Play. When you move your app to Capacitor 9:\n\nShip at least one store build compiled against Capacitor 9 native projects (iOS and Android). That binary establishes the native baseline Capgo channels target.\nOnly after that build is in users’ hands should you rely on OTA bundles tested against Cap 9 WebView and plugin behavior.\nPut production channels on the metadata strategy and upload the matching Cap 9 bundle to each channel with --auto-min-update-version. For that intentional native baseline upload, omit --fail-on-incompatible (native packages are supposed to change). Keep --fail-on-incompatible and --auto-min-update-version on everyday OTA uploads afterward. See Native + OTA channel workflow.\nKeep channel and semver rules aligned so you never push a bundle that assumes Cap 9 APIs to devices still running an older native shell.\n\nIf you use Capgo Build or your own CI, refresh agents before the Cap 9 store release so the pipeline matches what users install: macOS runners need Node 24+ and Xcode 27+; Linux runners need Node 24+ and host Android tooling aligned with AGP 9.2.1 / Gradle 9.5.1 (Xcode is macOS-only).\nSuggested order of operations\n\nUpgrade installed tooling on CI hosts and developer machines to the floors above (Node, Xcode, Android Studio, JDK). Do not bump the Cap 8 app’s AGP dependency, Gradle wrapper, or other Android project files to Cap 9 values until bunx cap migrate — those project changes belong to the migration step.\nFix deprecated native APIs in app code and plugins (especially custom AppDelegate URL handling and Android bridge usage).\nClean Android Gradle files and scripts (gradle.properties, ProGuard defaults, --url in dev scripts).\nAudit Cordova usage at the app level; do not change plugin SPM Cordova products until Cap 9-only releases.\nWhen Cap 9 is GA (or when you accept next), run bun add -d @capacitor/cli@next (or @latest after release), then bunx cap migrate, and follow Updating to 9.0.\nPublish the Cap 9 native build to stores, then resume or expand Capgo OTA rollouts on the matching channel.\n\nCapacitor 9 is mostly “pay down deprecations and align with modern Android and Apple toolchains.” Doing that work on Cap 8 keeps your upgrade diff small and your plugins compatible with the teams still shipping 8.x today.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/preparing-for-capacitor-9/"},"keywords":"Capacitor, Capacitor 9, mobile app development, live updates, OTA updates, Gradle, Xcode, plugin migration","articleSection":"Capacitor"}</script>
