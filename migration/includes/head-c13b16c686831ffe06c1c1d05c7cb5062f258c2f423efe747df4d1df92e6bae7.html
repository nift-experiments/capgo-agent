<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-release-major-version-in-capgo/#newsarticle","url":"https://capgo.app/blog/how-to-release-major-version-in-capgo/","headline":"How to release major version in capgo","description":"Understand how and when it's necessary to release major version for your app without breaking your user app","image":["https://capgo.app/capgo-feature-image.webp"],"datePublished":"2022-08-30T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"When releasing a major version\nVersioning can be difficult to manage, usually you want to send a Major update when a major change appears for the users.\nBut versioning is not made for that, the app store version is different from the Native version.\nNative version is made to manage breaking change in the code\nIn IOS, for example, iOS 16 is the store version of Apple, but the code version is 20A5283p (they don’t seem to use SemVer there)\nNow it’s clear we don’t mix them and use them for what they are made!\nMajor release\nIn your Capacitor app, a major release is necessary when a breaking change happens.\nFor example, a new IOS target (15 to 16), or a new version of Capacitor (3 to 4), or a plugin (1.2 to 2.0) you use have been updated to a major version.\nThis change means all tooling has to be aligned to handle the breaking change.\nThat why Capgo follows this system.\nSo if you release a major version, Capgo will not send it to a user who doesn’t have it installed from the store.\nThis behavior can be customized. You can learn more about it here\nVersions\nWhere Capgo find the version to compare\nIOS\n\nWill be used by Capgo to compare to JavaScript version and find Major upgrade\n\nIn IOS the var is set on your project here ios/App/App/Info.plist under the keyCFBundleShortVersionString or ios/App/App.xcodeproj/project.pbxproj under the key MARKETING_VERSION if MARKETING_VERSION was set in your Info.plist file.\n\nYou can override this behavior by setting version key in capacitor.config.json file docs here\n\nAndroid\n\nWill be uses by Capgo to compare to JavaScript version and find Major upgrade\n\nin Android, the var is set on your project here android/app/build.gradle under the key defaultConfig.versionName\n\nYou can override this behavior by setting version key in capacitor.config.json file docs here\n\nJavaScript\n\nWill be used by Capgo to compare to Native version and find Major upgrade\n\nin JavaScript, the var is set on your project here package.json under the key version\nExample\nYour Ionic app is currently released with the version 1.2.3 with Capacitor 3\nYou are doing the upgrade to capacitor 4.\nYou need to upgrade your version number to 2.2.3, then all your packages include Capgo with notice this big change.\nWhen you release this version to Capgo and the App Store.\nAll next live update in Capgo 2.2.4 will never be sent to user with 1.2.3 version. Only with 2.2.3 version.\nIf you follow this pattern, no need to worry more, all is well handled.\nIf I don’t follow this\nIn this case, that means you have to send your new app with Capacitor 4 to Apple and Google, but don’t to Capgo.\nThen you have to wait 100% of your users, have the app or at least 90%, it will take months, probably.\nWhile during this time you cannot send any update with Capgo, since old user cannot get the new version.\nYou don’t have a way to select only some users to receive the update.\nKeep going from How to release major version in capgo\nIf you are using How to release major version in capgo to plan rollback and version control, connect it with Rollbacks for the implementation detail in Rollbacks, Version Targeting for the implementation detail in Version Targeting, Update Behavior for the implementation detail in Update Behavior, bundle for the implementation detail in bundle, and Capgo Live Updates for the product workflow in Capgo Live Updates.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-release-major-version-in-capgo/"},"keywords":"mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Tutorial"}</script>
