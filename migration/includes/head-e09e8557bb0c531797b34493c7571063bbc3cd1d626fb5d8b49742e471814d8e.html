<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/integrate-universal-links-capacitor-nextjs/#newsarticle","url":"https://capgo.app/blog/integrate-universal-links-capacitor-nextjs/","headline":"How to Integrate Universal Links in Next.js with Capacitor","description":"Learn step by step how to set up universal links for your Next.js app with Capacitor on both iOS and Android platforms.","image":["https://capgo.app/deeplink_next_capacitor.webp"],"datePublished":"2023-12-14T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Universal links on iOS and App Links on Android allow users to be taken directly into your app from a link, bypassing the browser. This is particularly useful for improving user experience and maintaining the context from a web page to an app. In this guide, we’ll walk through the process of setting up these deep links for a Next.js app using Capacitor. For attribution and deferred deep links, @capgo/capacitor-appsflyer can route install campaigns into the correct in-app screen.\nSetting up deep links doesn’t require a lot of code, but it does involve some configuration. By the end of this guide, you’ll be able to click a link like https://www.capgo.app/details/22 and have your app open to the correct page if it’s installed.\nNext.js Deep Link Setup\nFirst, we’ll create a new Next.js app and a details page for testing:\nnpx create-next-app@latest capgoLinks\ncd capgoLinks\nmkdir pages/details\ntouch pages/details/[id].js\nnpm run build\nnpx cap add ios\nnpx cap add android\nEnsure your bundle ID is correctly set in the capacitor.config.json file, as it’s crucial for the setup:\n{\n  \"appId\": \"com.capgo.deeplinks\",\n  \"appName\": \"capgoLinks\",\n  \"webDir\": \"out\",\n  \"bundledWebRuntime\": false\n}\nFor routing, Next.js uses file-based routing, so by creating a file at pages/details/[id].js, we’ve already set up our wildcard route.\nIn pages/details/[id].js, we can retrieve the ID from the URL using Next.js’s built-in router:\nimport { useRouter } from 'next/router'\n\nfunction DetailsPage() {\n  const router = useRouter()\n  const { id } = router.query\n\n  return (\n    &lt;div&gt;\n      &lt;p&gt;My ID: {id}&lt;/p&gt;\n    &lt;/div&gt;\n  )\n}\n\nexport default DetailsPage\nNow, let’s handle the appUrlOpen event with Capacitor. This event is triggered when the app is opened via a custom URL scheme. Add a listener in the pages/_app.js file:\nimport { useEffect } from 'react'\nimport { App } from '@capacitor/app'\n\nfunction MyApp({ Component, pageProps }) {\n  useEffect(() =&gt; {\n    App.addListener('appUrlOpen', (event) =&gt; {\n      const slug = event.url.split('.app').pop()\n      if (slug)\n        window.location.href = slug\n\n    })\n  }, [])\n\n  return &lt;Component {...pageProps} /&gt;\n}\n\nexport default MyApp\nThis code listens for the appUrlOpen event and navigates to the appropriate route within your Next.js app.\niOS Configuration\nFor iOS, you’ll need an app ID with Associated Domains enabled. Create an apple-app-site-association file with the following content, replacing YOURTEAMID and com.your.bundleid with your actual team ID and bundle ID:\n{\n  \"applinks\": {\n    \"apps\": [],\n    \"details\": [\n      {\n        \"appID\": \"YOURTEAMID.com.your.bundleid\",\n        \"paths\": [\"*\"]\n      }\n    ]\n  }\n}\nUpload this file to the .well-known directory on your domain, making it accessible at https://www.capgo.app/.well-known/apple-app-site-association.\nIn Xcode, add the domain to your app’s entitlements using the format applinks:capgo.app.\nAndroid Configuration\nFor Android App Links, follow these steps:\n\nGenerate a keystore file if you don’t have one.\nObtain the SHA256 fingerprint from the keystore.\nCreate an assetlinks.json file with your package name and SHA256 fingerprint.\nUpload this file to the .well-known directory on your domain.\n\nIn your AndroidManifest.xml, add an intent-filter to the activity element that handles deep links:\n&lt;activity ...&gt;\n  &lt;intent-filter android:autoVerify=\"true\"&gt;\n    &lt;action android:name=\"android.intent.action.VIEW\" /&gt;\n    &lt;category android:name=\"android.intent.category.DEFAULT\" /&gt;\n    &lt;category android:name=\"android.intent.category.BROWSABLE\" /&gt;\n    &lt;data android:scheme=\"https\" android:host=\"capgo.app\" /&gt;\n  &lt;/intent-filter&gt;\n&lt;/activity&gt;\nAfter uploading the assetlinks.json file, you can verify it using Google’s Digital Asset Links tool. If everything is set up correctly, you’ll see a green checkmark.\nTo build and sign your app, use the following commands:\ncd android\n./gradlew assembleRelease\ncd ..\njarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore my-release-key.keystore android/app/build/outputs/apk/release/app-release-unsigned.apk alias_name\nzipalign -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk capgo.apk\nadb install capgo.apk\nThis will install the signed app on your connected Android device.\nCapacitor Configure for Native Project Settings\nTo automate native project settings, consider using the Capacitor configure package. Install it in your project:\nnpm install @capacitor/configure\nCreate a capacitor.config.yaml file at the root of your project:\nvars:\n  BUNDLE_ID: com.capgo.deeplinks\n  PACKAGE_NAME: com.capgo.deeplinks\nplatforms:\n  ios:\n    targets:\n      App:\n        bundleId: $BUNDLE_ID\n    entitlements:\n      - com.apple.developer.associated-domains: ['applinks:capgo.app']\n  android:\n    packageName: $PACKAGE_NAME\nRun the configure tool with this config:\nnpx cap-config run capacitor.config.yaml\nThis will apply the settings specified in the YAML file to your native projects.\nConclusion\nSetting up deep links with Capacitor for a Next.js app involves configuring your domain and project settings for both iOS and Android. While the process requires attention to detail, it’s streamlined compared to older methods and doesn’t require additional plugins. Ensure your domain verification files are correctly served and check them with the respective platform tools. Once set up, your app will seamlessly open from web links, providing a smooth transition for your users from web to app.\nKeep going from How to Integrate Universal Links in Next.js with Capacitor\nIf you are using How to Integrate Universal Links in Next.js with Capacitor to plan native plugin work, connect it with Capgo Plugin Directory for the product workflow in Capgo Plugin Directory, Capacitor Plugins by Capgo for the implementation detail in Capacitor Plugins by Capgo, Adding or Updating Plugins for the implementation detail in Adding or Updating Plugins, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, and Capgo Native Builds for the product workflow in Capgo Native Builds.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/integrate-universal-links-capacitor-nextjs/"},"keywords":"Capacitor, Universal Links, Next.js, mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"DeepLinking"}</script>
