<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/build-and-deploy-ios-apps-with-bitbucket-pipelines/#newsarticle","url":"https://capgo.app/blog/build-and-deploy-ios-apps-with-bitbucket-pipelines/","headline":"Build and Deploy iOS Apps with Bitbucket Pipelines","description":"Build, sign, and ship iOS apps to TestFlight from Bitbucket Pipelines without hosted macOS runners: cloud builds from a Linux step or a self-hosted Mac.","image":["https://capgo.app/capgo_ci-cd-illustration.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"Bitbucket Pipelines cannot build an iOS app on its hosted runners, because every step runs in a Linux container and Xcode only runs on macOS. You have two working options: register your own Mac as a self-hosted Bitbucket runner, or keep the step on Linux and hand the iOS compile, signing, and TestFlight upload to a cloud build service. This guide shows both, with complete bitbucket-pipelines.yml files for a Capacitor app.\nIf your team already lives in Bitbucket for code review, Jira links, and deployments, you do not need a second CI tool just for iOS. The pipeline stays in Bitbucket. Only the part that needs a Mac moves.\nWhy iOS builds break on Bitbucket Pipelines\nBitbucket Pipelines runs each step inside a Docker image you choose (node:22, cimg/android, and so on) on Atlassian’s Linux infrastructure. That is fine for bun install, unit tests, linting, and even full Android builds. It stops at iOS:\n\nxcodebuild, codesign, and the iOS SDK only exist on macOS.\nApple’s license only allows macOS to run on Apple hardware, so there is no Linux image that can produce a signed .ipa.\nSince April 28, 2026, App Store Connect rejects uploads that were not built with Xcode 26 and the iOS 26 SDK, so whatever Mac you use has to stay current. See Apple’s Xcode 26 requirement for Capacitor apps.\n\nBitbucket does support self-hosted runners on Linux, Windows, and macOS. Atlassian does not bill build minutes for steps that run on your own runners, but you pay in hardware and maintenance.\nYour three options\n\n\n\nOption\nWhere the iOS build runs\nWhat you maintain\nGood fit\n\n\n\n\nSelf-hosted macOS runner\nYour Mac mini or a rented Mac\nmacOS, Xcode, keychain, certificates, disk space, uptime\nTeams that already own Macs and have someone to run them\n\n\nSecond CI just for mobile\nAnother vendor’s Macs\nTwo pipelines, two sets of secrets and triggers\nTeams that want a dedicated mobile CI anyway\n\n\nCloud build called from a Linux step\nCapgo Build’s Mac fleet\nOne CLI call and a few secured variables\nCapacitor teams that want Bitbucket to stay the only CI\n\n\n\nThe rest of this guide covers the first and third options in detail. For a broader view of the platforms, read Comparing CI/CD platforms for iOS apps.\nOption 1: Build iOS from a Linux step with Capgo Build\nCapgo Build compiles and signs Capacitor apps on Capgo-managed Macs. Your Bitbucket step does what it already does well on Linux: install dependencies, build the web layer, and run cap sync ios. Then the Capgo CLI uploads the prepared native project (not your web source code or node_modules), runs the Xcode build, signs it with your certificate, and can upload the result to TestFlight. Logs stream back into the Bitbucket step, and the command exits non-zero if the build fails, so a failed iOS build fails the pipeline.\nBecause your runner pushes the project to Capgo, Capgo never needs access to your Bitbucket repository. There is no repository connection to authorize and no OAuth app to approve.\nPrerequisites\n\nA Capacitor app that builds locally (Capacitor 8 needs Node.js 22 or newer)\nAn Apple Developer Program membership with admin rights on the team\nA Capgo account and an API key with upload permission\nThe app registered in Capgo: bunx @capgo/cli@latest app add\n\nOne-time setup on your machine\nRun the onboarding once. On iOS it creates or reuses your distribution certificate and provisioning profile, and asks for an App Store Connect API key:\nbunx @capgo/cli@latest login\nbunx @capgo/cli@latest build init --platform ios\nIf you do not have a Mac at hand, you can still create the certificate signing request in the browser with the iOS certificate generator, or follow Build an iOS app from Windows with Capgo Build.\nRun one build from your laptop before touching CI. CI is a bad place to debug a first build:\nbun run build\nbunx cap sync ios\nbunx @capgo/cli@latest build request com.example.app --platform ios --build-mode release\nExport the credentials for Bitbucket\nThe CLI keeps credentials on your machine. To move them into Bitbucket, export them to a dotenv file:\nbunx @capgo/cli@latest build credentials manage --appId com.example.app --platform ios\n# choose \"Export to .env\" in the menu\nThis writes .env.capgo.com.example.app.ios with mode 0600. It contains these keys:\n\n\n\nVariable\nContent\n\n\n\n\nBUILD_CERTIFICATE_BASE64\nBase64 of your .p12 distribution certificate\n\n\nP12_PASSWORD\nCertificate password (empty if none)\n\n\nCAPGO_IOS_PROVISIONING_MAP_BASE64\nProvisioning profile mapping generated by the CLI\n\n\nAPPLE_KEY_ID\nApp Store Connect API key ID\n\n\nAPPLE_ISSUER_ID\nApp Store Connect issuer ID\n\n\nAPPLE_KEY_CONTENT\nBase64 of the .p8 API key\n\n\nAPP_STORE_CONNECT_TEAM_ID\nYour Apple team ID\n\n\n\nAdd each line as a secured variable in Bitbucket under Repository settings &gt; Pipelines &gt; Repository variables, plus CAPGO_TOKEN with your Capgo API key. Secured variables are masked in logs and cannot be read back from the UI.\nIf you prefer the API, this loop creates them in one go. It uses a Bitbucket API token with the pipeline variables write scope:\nWORKSPACE=my-team\nREPO=my-app\nENV_FILE=.env.capgo.com.example.app.ios\n\ngrep -v '^#' \"$ENV_FILE\" | grep '=' | while IFS= read -r line; do\n  key=\"${line%%=*}\"\n  value=\"${line#*=}\"\n  value=\"${value%\\\"}\"; value=\"${value#\\\"}\"\n  jq -n --arg k \"$key\" --arg v \"$value\" '{key:$k, value:$v, secured:true}' |\n    curl -s -u \"$BB_EMAIL:$BB_API_TOKEN\" \\\n      -H 'Content-Type: application/json' \\\n      -X POST --data @- \\\n      \"https://api.bitbucket.org/2.0/repositories/$WORKSPACE/$REPO/pipelines_config/variables\" &gt; /dev/null\n  echo \"created $key\"\ndone\n\nrm \"$ENV_FILE\"\nDelete the file afterwards and add .env.capgo.* to .gitignore. It holds plaintext signing material.\nFor production credentials, consider deployment variables instead of repository variables. They are scoped to a deployment environment (for example Production), and you can restrict that environment to admins or specific branches on Premium plans.\nThe pipeline file\nBitbucket injects repository and deployment variables as environment variables, so the Capgo CLI picks them up without any mapping. This file runs tests on every push, builds an ad hoc iOS build on demand, and ships to TestFlight on version tags:\n# bitbucket-pipelines.yml\nimage: node:22\n\ndefinitions:\n  caches:\n    bun: ~/.bun/install/cache\n\npipelines:\n  default:\n    - step:\n        name: Lint and test\n        caches:\n          - bun\n        script:\n          - curl -fsSL https://bun.sh/install | bash\n          - export PATH=\"$HOME/.bun/bin:$PATH\"\n          - bun install --frozen-lockfile\n          - bun run lint\n          - bun run test\n\n  tags:\n    'v*':\n      - step:\n          name: Build iOS and upload to TestFlight\n          deployment: Production\n          caches:\n            - bun\n          script:\n            - curl -fsSL https://bun.sh/install | bash\n            - export PATH=\"$HOME/.bun/bin:$PATH\"\n            - bun install --frozen-lockfile\n            - bun run build\n            - bunx cap sync ios\n            - &gt;\n              bunx @capgo/cli@latest build request com.example.app\n              --platform ios\n              --build-mode release\n              --ios-distribution app_store\n\n  custom:\n    ios-adhoc:\n      - step:\n          name: Ad hoc iOS build for testers\n          caches:\n            - bun\n          script:\n            - curl -fsSL https://bun.sh/install | bash\n            - export PATH=\"$HOME/.bun/bin:$PATH\"\n            - bun install --frozen-lockfile\n            - bun run build\n            - bunx cap sync ios\n            - echo \"$ADHOC_PROFILE_BASE64\" | base64 --decode &gt; adhoc.mobileprovision\n            - &gt;\n              bunx @capgo/cli@latest build request com.example.app\n              --platform ios\n              --build-mode release\n              --ios-distribution ad_hoc\n              --ios-provisioning-profile ./adhoc.mobileprovision\n              --output-upload\n              --output-retention 2d\n              --output-record /tmp/build.json\n            - bunx @capgo/cli@latest build last-output --path /tmp/build.json --field outputUrl\nA few details that matter:\n\nThe image is a plain Linux node:22. Nothing in this file needs macOS.\nOn Linux, cap sync ios copies web assets and updates native config but cannot run CocoaPods. That is fine. The Mac that runs the build installs pods or resolves Swift packages itself.\nCapgo reads the latest build number from App Store Connect and increments it, so you never hit “bundle version must be higher than the previously uploaded version”. Pass --skip-build-number-bump if you manage it yourself.\nThe ad hoc build needs an Ad Hoc provisioning profile, which only installs on the devices it lists. Store it as a secured ADHOC_PROFILE_BASE64 variable; the --ios-provisioning-profile flag overrides the App Store profile from the environment for this build only. Collect tester UDIDs with the iOS UDID finder.\nPin the CLI to an exact version (for example @capgo/cli@7.104.0) once your pipeline is stable, so a CLI release cannot change behavior mid-sprint.\n\nRun the custom pipeline from Pipelines &gt; Run pipeline &gt; ios-adhoc. The last command prints a download link that expires after the retention period.\nManual approval before TestFlight\nBitbucket supports trigger: manual on a step. Split the release into a build step and a gated upload step if you want a human to approve each TestFlight upload:\n  tags:\n    'v*':\n      - step:\n          name: Test\n          script:\n            - curl -fsSL https://bun.sh/install | bash\n            - export PATH=\"$HOME/.bun/bin:$PATH\"\n            - bun install --frozen-lockfile\n            - bun run test\n      - step:\n          name: Ship iOS to TestFlight\n          trigger: manual\n          deployment: Production\n          script:\n            - curl -fsSL https://bun.sh/install | bash\n            - export PATH=\"$HOME/.bun/bin:$PATH\"\n            - bun install --frozen-lockfile\n            - bun run build\n            - bunx cap sync ios\n            - bunx @capgo/cli@latest build request com.example.app --platform ios --build-mode release\nTo go straight to App Review after the TestFlight upload, add --submit-to-store-review with --store-release-name \"$BITBUCKET_TAG\". Your App Store listing, screenshots, and compliance answers still have to be complete in App Store Connect first.\nAdd Android in parallel\nAndroid builds can run directly on Bitbucket’s Linux runners, but you can also send them to Capgo Build so both platforms use the same signing and upload flow. Use a parallel block:\n  tags:\n    'v*':\n      - parallel:\n          - step:\n              name: iOS release\n              script:\n                - curl -fsSL https://bun.sh/install | bash\n                - export PATH=\"$HOME/.bun/bin:$PATH\"\n                - bun install --frozen-lockfile &amp;&amp; bun run build\n                - bunx cap sync ios\n                - bunx @capgo/cli@latest build request com.example.app --platform ios --build-mode release\n          - step:\n              name: Android release\n              script:\n                - curl -fsSL https://bun.sh/install | bash\n                - export PATH=\"$HOME/.bun/bin:$PATH\"\n                - bun install --frozen-lockfile &amp;&amp; bun run build\n                - bunx cap sync android\n                - bunx @capgo/cli@latest build request com.example.app --platform android --build-mode release --android-track internal\nThe Android step needs ANDROID_KEYSTORE_FILE, KEYSTORE_KEY_ALIAS, KEYSTORE_KEY_PASSWORD, KEYSTORE_STORE_PASSWORD, and PLAY_CONFIG_JSON as secured variables. Export them the same way with --platform android.\nShip web-only changes without a native build\nMost commits to a Capacitor app only touch HTML, CSS, and JavaScript. Those do not need a new binary. With Capgo live updates, a Bitbucket step can decide between a store build and an over-the-air bundle:\n  branches:\n    main:\n      - step:\n          name: Release (live update or native)\n          script:\n            - curl -fsSL https://bun.sh/install | bash\n            - export PATH=\"$HOME/.bun/bin:$PATH\"\n            - bun install --frozen-lockfile\n            - bun run build\n            - |\n              if bunx @capgo/cli@latest build needed com.example.app --channel production; then\n                echo \"No native change, shipping a live update\"\n                bunx @capgo/cli@latest bundle upload com.example.app --channel production\n              else\n                echo \"Native change detected, building iOS\"\n                bunx cap sync ios\n                bunx @capgo/cli@latest build request com.example.app --platform ios --build-mode release\n              fi\nbuild needed exits with code 0 when no native build is required and 1 when it is. It compares native plugin versions with what is live on the channel. It does not see manual edits under ios/, so also force the native path when those files change. The full pattern is in Auto choose live update or native build.\nOption 2: A self-hosted macOS runner\nIf you already own Macs, you can register one as a Bitbucket runner and run Xcode yourself.\nRegister the runner\n\nIn Bitbucket, open Repository settings &gt; Runners (or Workspace settings &gt; Workspace runners to share it) and click Add runner.\nChoose MacOS as the system. Bitbucket shows a start command with a runner UUID and OAuth credentials.\nOn the Mac, install a supported JDK (the runner is a Java program), Xcode 26, and fastlane. Then paste the start command.\nKeep the runner running as a launch agent so it survives reboots.\n\nA step targets the runner with labels:\npipelines:\n  tags:\n    'v*':\n      - step:\n          name: iOS build on our Mac\n          runs-on:\n            - self.hosted\n            - macos\n          script:\n            - bun install --frozen-lockfile\n            - bun run build\n            - bunx cap sync ios\n            - echo \"$BUILD_CERTIFICATE_BASE64\" | base64 --decode &gt; dist.p12\n            - echo \"$PROFILE_BASE64\" | base64 --decode &gt; profile.mobileprovision\n            - bundle exec fastlane ios beta\nmacOS runners execute directly on the host with your user’s environment, not in a container. Install Bun and Ruby on the Mac itself.\nA minimal Fastfile\ndefault_platform(:ios)\n\nplatform :ios do\n  lane :beta do\n    setup_ci(force: true)\n\n    api_key = app_store_connect_api_key(\n      key_id: ENV[\"APPLE_KEY_ID\"],\n      issuer_id: ENV[\"APPLE_ISSUER_ID\"],\n      key_content: ENV[\"APPLE_KEY_CONTENT\"],\n      is_key_content_base64: true\n    )\n\n    import_certificate(\n      certificate_path: \"dist.p12\",\n      certificate_password: ENV[\"P12_PASSWORD\"],\n      keychain_name: \"fastlane_tmp_keychain\",\n      keychain_password: \"\"\n    )\n    install_provisioning_profile(path: \"profile.mobileprovision\")\n\n    update_code_signing_settings(\n      path: \"ios/App/App.xcodeproj\",\n      use_automatic_signing: false,\n      team_id: ENV[\"APP_STORE_CONNECT_TEAM_ID\"],\n      code_sign_identity: \"Apple Distribution\",\n      profile_name: ENV[\"PROFILE_NAME\"]\n    )\n\n    increment_build_number(\n      xcodeproj: \"ios/App/App.xcodeproj\",\n      build_number: latest_testflight_build_number(api_key: api_key) + 1\n    )\n\n    build_app(\n      project: \"ios/App/App.xcodeproj\", # use workspace: \"ios/App/App.xcworkspace\" for CocoaPods projects\n      scheme: \"App\",\n      export_method: \"app-store\"\n    )\n\n    upload_to_testflight(api_key: api_key, skip_waiting_for_build_processing: true)\n  end\nend\nNew Capacitor 8 projects use Swift Package Manager, so you build App.xcodeproj. Older projects that still use CocoaPods build App.xcworkspace and need pod install on the runner. Our GitHub Actions iOS guide explains each fastlane action in more depth; the lane is the same on Bitbucket.\nWhat you sign up for\nThe archive is the easy part. A self-hosted Mac also means:\n\nXcode upgrades whenever Apple raises the minimum SDK, tested before the deadline.\nKeychain state. A crashed job can leave a temporary keychain behind, and the next job picks up the wrong identity.\nNo isolation. Jobs run on the same disk. DerivedData, old archives, and simulators fill it up.\nOne build at a time per runner, unless you buy more Macs.\nCertificates and profiles that expire every year and have to be renewed on the machine.\n\nThat is a reasonable trade if your team already manages Macs. If nobody wants to own that box, Option 1 removes it.\nTroubleshooting\n\n\n\nSymptom\nLikely cause and fix\n\n\n\n\nCAPGO_TOKEN is not set\nThe variable is missing, or it is a deployment variable and the step has no deployment: key.\n\n\nStep works on main but not on tags\nDeployment variables only apply to steps that declare that deployment environment.\n\n\nProvisioning profile doesn't match bundle ID\nThe profile was created for another app ID. Re-run build init and re-export.\n\n\nApp Store Connect authentication failed\nWrong issuer ID or key ID, or a revoked key. Check the key in App Store Connect &gt; Users and Access &gt; Integrations.\n\n\nUpload rejected for SDK version\nThe build used an Xcode older than 26. Upgrade the self-hosted Mac.\n\n\nSelf-hosted step stuck in “Pending”\nRunner offline or labels do not match self.hosted and macos.\n\n\nerrSecInternalComponent during codesign\nThe keychain is locked in a non-interactive session. Use setup_ci and import the certificate into the temporary keychain.\n\n\nBuild passes but nothing in TestFlight\nProcessing takes several minutes, and export compliance may be pending. Add ITSAppUsesNonExemptEncryption to Info.plist if your app uses only standard encryption.\n\n\n\nMore fixes for failing pipelines are in Fixing build failures in Capacitor CI/CD pipelines and the Capgo Build troubleshooting guide.\nWhich option should you pick?\nPick a self-hosted Mac when you already own the hardware, need full control of the Xcode environment, or build native Swift targets that are not Capacitor apps. Pick a cloud build from a Linux step when your app is a Capacitor app and you want Bitbucket to stay the single place your team configures CI. Either way, keep the build logic in bitbucket-pipelines.yml next to your code, put signing material in secured variables, and only run native builds when native code actually changed.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/build-and-deploy-ios-apps-with-bitbucket-pipelines/"},"keywords":"Bitbucket Pipelines iOS, Bitbucket Pipelines macOS, build iOS app Bitbucket, Bitbucket TestFlight, Capacitor iOS CI/CD, self-hosted macOS runner, Capgo Build","articleSection":"CI/CD"},{"@type":"FAQPage","@id":"https://capgo.app/blog/build-and-deploy-ios-apps-with-bitbucket-pipelines/#faqpage","url":"https://capgo.app/blog/build-and-deploy-ios-apps-with-bitbucket-pipelines/","mainEntity":[{"@type":"Question","name":"Does Bitbucket Pipelines have hosted macOS runners?","acceptedAnswer":{"@type":"Answer","text":"No. Atlassian's cloud runners execute steps in Linux Docker containers. To run xcodebuild you either register your own Mac as a self-hosted runner, or keep the step on Linux and send the iOS build to a cloud build service such as Capgo Build."}},{"@type":"Question","name":"Can I build a Capacitor iOS app from Bitbucket without owning a Mac?","acceptedAnswer":{"@type":"Answer","text":"Yes. A Linux step installs dependencies, builds the web assets, runs cap sync ios, and calls the Capgo CLI build request command. Capgo compiles, signs, and uploads the app to TestFlight on its own Mac fleet, and streams the logs back into the Bitbucket step."}},{"@type":"Question","name":"Where should I store iOS signing files for Bitbucket Pipelines?","acceptedAnswer":{"@type":"Answer","text":"Store them base64-encoded as secured repository or deployment variables. Bitbucket masks secured values in logs. Deployment variables are better for production credentials because you can restrict who can run the production deployment."}},{"@type":"Question","name":"How do I avoid a native iOS build on every commit?","acceptedAnswer":{"@type":"Answer","text":"Trigger native builds only on version tags or a custom pipeline, and ship web-only changes as Capgo live updates. The Capgo CLI build needed command tells your pipeline whether native dependencies changed since the last release on a channel."}},{"@type":"Question","name":"Does Apple require a specific Xcode version for uploads?","acceptedAnswer":{"@type":"Answer","text":"Yes. Since April 28, 2026, apps uploaded to App Store Connect must be built with Xcode 26 and the iOS 26 SDK or later. A self-hosted Mac runner must be upgraded by you; Capgo Build keeps its build machines on the required Xcode."}}]}]}</script>
