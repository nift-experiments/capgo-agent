<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-put-a-web-app-on-the-app-store/#newsarticle","url":"https://capgo.app/blog/how-to-put-a-web-app-on-the-app-store/","headline":"How to Put a Web App on the App Store in 11 Steps","description":"How to put a web app on the App Store and Google Play in 11 steps with Capacitor: native shell, plugins, accounts, signing, testing, review, live updates.","image":["https://capgo.app/capacitor-guide.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To put a web app on the App Store and Google Play, wrap your built web app in a native project with Capacitor, add a few native features, create Apple and Google developer accounts, sign and build the iOS and Android binaries, test them with real users, prepare the store listings and submit for review. Your existing HTML, CSS and JavaScript keeps running inside a native WebView, so you do not rewrite the app.\nBelow are the 11 steps in the order that avoids waiting, with commands for Capacitor 8 and the store rules that apply in October 2026.\nWhat you need\n\nA web app that builds to static files (React, Vue, Angular, Svelte, Next.js static export, Nuxt generate, plain HTML, or an app made with an AI builder such as Lovable or Bolt).\nNode.js 22 or later (Capacitor 8 requirement) and Bun or another package manager.\nAndroid Studio for Android builds.\nXcode 26 on macOS for iOS builds, or a cloud build service if you do not have a Mac.\n99 USD per year for Apple and 25 USD once for Google.\n\nRealistic timeline\n\n\n\nPhase\nTypical time\nCan run in parallel?\n\n\n\n\nDeveloper account enrollment\nHours (individual) to 2 weeks (organization with new D-U-N-S)\nYes, start on day one\n\n\nCapacitor setup and first device run\n1 day\n\n\n\nMobile polish and native features\n3 days to 3 weeks\n\n\n\nSigning and first builds\n1 day\n\n\n\nGoogle Play closed test (new personal accounts)\n14 days minimum, then production access review\nYes, with iOS TestFlight\n\n\nStore listing\n1 to 2 days\nYes\n\n\nApp Review\nApple usually 1 to 2 days, Google from hours to several days\n\n\n\n\nStep 1: Start developer account enrollment today\nAccount verification is the step you cannot speed up, so do it before coding.\n\nApple Developer Program: 99 USD per year. Individuals need an Apple Account with two-factor authentication and their legal name. Organizations also need a D-U-N-S number, a company website and a work email on that domain.\nGoogle Play Console: 25 USD once. Organizations need a D-U-N-S number. Expect ID verification.\n\nIf you enroll on Google Play as an individual, your account is subject to the closed testing rule (Step 9). Full walkthrough: how to create Apple and Google Play developer accounts.\nStep 2: Make the web app ready for a phone\nCapacitor runs your app in a WebView. Things that are fine in a browser tab feel wrong in an app:\n\nStatic build output. Capacitor loads files from the app bundle. Server-side rendering does not run on the phone. Use your framework’s static output (next build with output: 'export', nuxt generate, Vite build). API calls go to your backend over HTTPS as before.\nClient-side routing that works from a file origin. Use history routing (Capacitor serves the app from https://localhost on Android and capacitor://localhost on iOS, so it works) and make sure deep URLs fall back to index.html.\nCORS. Add the Capacitor origins to your API’s allowed origins: capacitor://localhost (iOS) and https://localhost (Android).\nTouch, not hover. Remove hover-only menus. Make tap targets at least 44 x 44 points.\nSafe areas. Add viewport-fit=cover to the viewport meta tag and pad headers and bottom bars with env(safe-area-inset-top) and env(safe-area-inset-bottom).\nOffline and slow networks. Show a proper state instead of a blank screen. Reviewers test on flaky Wi-Fi.\nNo “download our app” banners and no links that send users to your website to do core tasks.\n\n&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" /&gt;\nStep 3: Add Capacitor\nFrom your web project root:\nbun add @capacitor/core\nbun add -d @capacitor/cli\nbunx cap init \"My App\" com.example.myapp --web-dir dist\nbun add @capacitor/ios @capacitor/android\nbun run build\nbunx cap add ios\nbunx cap add android\nUse the real output folder for --web-dir: dist for Vite, out for Next.js static export, .output/public for Nuxt generate, build for Create React App, dist/&lt;project&gt;/browser for Angular.\nThe bundle ID (com.example.myapp) is permanent once the app is on the stores. Use a reverse domain you control.\nYour capacitor.config.ts now looks like:\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.myapp',\n  appName: 'My App',\n  webDir: 'dist',\n};\n\nexport default config;\nCapacitor 8 creates the iOS project with Swift Package Manager by default, so you do not need CocoaPods. Every time you change web code:\nbun run build\nbunx cap sync\nRun it:\nbunx cap run ios\nbunx cap run android\nCommit the ios/ and android/ folders. They are source code you will edit (permissions, icons, signing). For more background, see how easy it is to make a web app into a mobile app with Capacitor, and if you built with an AI tool, our Lovable to mobile guide.\nStep 4: Add native features that justify an app\nApple’s guideline 4.2 (Minimum Functionality) rejects apps that are just a website in a shell. You do not need dozens of native features, but you need the app to behave like an app. Common, useful additions:\n\n\n\nFeature\nPlugin\n\n\n\n\nPush notifications\n@capacitor/push-notifications\n\n\nNative Google, Apple and Facebook sign-in\n@capgo/capacitor-social-login\n\n\nFace ID / fingerprint unlock\n@capgo/capacitor-native-biometric\n\n\nCamera and photos\n@capacitor/camera\n\n\nIn-app purchases and subscriptions\n@capgo/capacitor-native-purchases\n\n\nNative share sheet\n@capacitor/share\n\n\nHaptics\n@capacitor/haptics\n\n\nStatus bar and splash screen\n@capacitor/status-bar, @capacitor/splash-screen\n\n\nRate the app prompt\n@capgo/capacitor-in-app-review\n\n\nLive updates\n@capgo/capacitor-updater\n\n\n\nExample: show the native share sheet instead of a “copy link” button.\nimport { Share } from '@capacitor/share';\nimport { Capacitor } from '@capacitor/core';\n\nexport async function shareLink(url: string, title: string) {\n  if (Capacitor.isNativePlatform()) {\n    await Share.share({ title, url });\n  } else {\n    await navigator.clipboard.writeText(url);\n  }\n}\nIf you sell digital content or subscriptions, plan payments now. Apple and Google require their in-app purchase systems for digital goods in most cases. In the US App Store, apps may also link to external web checkout after the 2025 court ruling; other regions have their own rules. Physical goods and services (deliveries, rides) can use Stripe or any payment provider. See in-app purchases with Capacitor.\nThe full catalog of Capgo plugins is on the plugins page.\nStep 5: Icons, splash screen and permission strings\nGenerate all icon and splash sizes from two source images:\nbun add -d @capacitor/assets\n# assets/icon.png 1024x1024, assets/splash.png 2732x2732\nbunx capacitor-assets generate\nOn iOS, every permission you use needs a usage description in ios/App/App/Info.plist, or the app crashes when it asks and Apple rejects it:\n&lt;key&gt;NSCameraUsageDescription&lt;/key&gt;\n&lt;string&gt;Take a photo of your receipt to attach it to an expense.&lt;/string&gt;\n&lt;key&gt;NSPhotoLibraryUsageDescription&lt;/key&gt;\n&lt;string&gt;Choose receipt photos from your library.&lt;/string&gt;\nWrite specific reasons. “This app needs the camera” gets rejected.\nOn Android, plugins add most permissions to the manifest themselves. Remove permissions you do not use; Google asks you to justify sensitive ones.\nAlso add a privacy manifest (PrivacyInfo.xcprivacy) if your code uses required-reason APIs. See the privacy manifest guide for Capacitor.\nStep 6: Set up signing\niOS. You need an Apple Distribution certificate (with its private key, usually exported as .p12) and an App Store Connect provisioning profile for your bundle ID. Xcode can create them automatically, or you can create them yourself, even without a Mac. Read iOS certificates and provisioning profiles explained; the iOS certificate generator handles the CSR step in the browser.\nAndroid. Create an upload keystore and keep it backed up. Google Play uses Play App Signing, so Google holds the final app signing key and you sign uploads with yours.\nkeytool -genkeypair -v -keystore upload-keystore.jks -alias upload \\\n  -keyalg RSA -keysize 2048 -validity 10000\nOr use the Android keystore generator.\nStep 7: Build the release binaries\nLocally\niOS (on a Mac with Xcode 26, required for App Store uploads since April 2026):\n\nbunx cap open ios\nSelect the App target, set the version and build number, pick your team under Signing &amp; Capabilities.\nChoose Any iOS Device (arm64), then Product &gt; Archive.\nIn the Organizer, Distribute App &gt; App Store Connect &gt; Upload.\n\nAndroid:\nbun run build\nbunx cap sync android\ncd android\n./gradlew bundleRelease\nThe AAB is in android/app/build/outputs/bundle/release/. Configure signingConfigs in android/app/build.gradle with your keystore, loading passwords from environment variables.\nMake sure targetSdkVersion is 36. Since August 31, 2026 Google Play requires new apps and updates to target Android 16 (API 36), which is the Capacitor 8 default.\nIn the cloud\nIf you do not have a Mac, or you want builds reproducible from CI, Capgo Build builds both platforms on hosted machines and can upload directly to TestFlight and Google Play:\nbunx @capgo/cli@latest build credentials save --appId com.example.myapp --platform ios\nbunx @capgo/cli@latest build credentials save --appId com.example.myapp --platform android\nbunx @capgo/cli@latest build request com.example.myapp --platform ios --path .\nbunx @capgo/cli@latest build request com.example.myapp --platform android --path .\nCredentials are used only for the build and are not stored on Capgo servers. See the Capgo Build docs.\nStep 8: Distribute to testers\nPut the build on real phones before anyone at Apple or Google sees it.\n\niOS: upload to TestFlight. Internal testers (up to 100 team members) get it right after processing; external testers (up to 10,000) after a short Beta App Review.\nAndroid: create an internal testing release in Play Console and share the opt-in link.\n\nTest sign-up and login, payments in sandbox, push notifications, offline behavior, the keyboard covering inputs, and back-button behavior on Android. Details for each option: how to distribute iOS and Android apps to testers.\nStep 9: Run Google Play’s closed test (new personal accounts)\nIf your Play account is a personal account created after November 13, 2023, you cannot publish to production until you have run a closed test with at least 12 testers opted in for 14 consecutive days. Then you apply for production access in the Play Console dashboard, which Google usually reviews within a week.\nStart this as soon as you have a usable Android build. Use a Google Group as the tester list so people can join themselves. Ship updates during the 14 days and collect feedback, since Google asks what you learned. Organization accounts are exempt.\nStep 10: Prepare the store listings and submit\nYou need for both stores: app name, descriptions, screenshots in the accepted sizes, icon, privacy policy URL, privacy disclosures (Apple App Privacy and Google Data safety), age rating questionnaire, support contact, and a demo account if the app has a login. Google also needs a 1024 x 500 feature graphic. Specs and limits: how to prepare your App Store and Google Play listing.\nSubmitting on iOS: in App Store Connect, create the version, select the TestFlight build, fill in App Review Information (demo account, notes), and click Add for Review, then Submit.\nSubmitting on Android: create a production release with the AAB (or promote the tested one from a testing track), complete every App content declaration, set countries, and send for review.\nThe rejections that hit web apps most often:\n\n4.2 Minimum Functionality: the app is just your website. Add native value and remove browser-like UI.\nLogin required but no demo account, or the account does not work.\nNo privacy-focused login option when you offer Google or Facebook login on iOS. Guideline 4.8 requires an equivalent option that limits data collection; Sign in with Apple is the usual choice.\nNo account deletion inside the app when users can create accounts.\nDigital purchases through Stripe where in-app purchase is required.\nBroken iPad layout because the project supports iPad by default.\nMissing or vague permission strings.\n\nOur first-time app review guide and iOS app submission guide go through each in detail.\nStep 11: Ship updates without waiting for review\nAfter launch, most of your changes will still be in the web code. Instead of a new store build for every fix, add live updates. The Capgo updater downloads new web bundles from Capgo and applies them on the next launch, with automatic rollback if the new bundle fails to start.\nbun add @capgo/capacitor-updater\nbunx cap sync\nbunx @capgo/cli@latest init\nCall notifyAppReady() when your app has started so the updater knows the bundle is healthy:\nimport { CapacitorUpdater } from '@capgo/capacitor-updater';\n\nCapacitorUpdater.notifyAppReady();\nThen each release of web code is one command:\nbun run build\nbunx @capgo/cli@latest bundle upload --channel production\nBoth stores allow this for interpreted code as long as the update does not change the app’s main purpose or bypass their payment rules. Native changes (new plugins, new permissions, Capacitor upgrades) still go through the stores. Read more on Capgo live updates and the updater docs.\nAdd the plugin before your first store submission. It has to be in the binary users install, otherwise your first live update can only reach users after a second store release.\nFinally, automate: build and upload on every tag from GitHub Actions or GitLab CI, push live updates on every merge to main, and keep native releases for native changes.\nPre-launch checklist\n\n Apple and Google accounts approved, agreements accepted\n App works offline or shows a clear offline state\n Safe areas, keyboard and Android back button handled\n At least a few native features that a website cannot offer\n Icons, splash, permission strings, privacy manifest\n Distribution certificate, App Store profile, upload keystore backed up\n Target SDK 36 on Android, built with Xcode 26 on iOS\n TestFlight and Play internal testing done on real devices\n Google Play closed test finished (personal accounts)\n Listings complete on both stores, demo account added\n In-app account deletion if users can sign up\n Live updates plugin included in the first binary\n\nTroubleshooting\nWhite screen on launch. webDir points to the wrong folder or you forgot bunx cap sync after building. Check ios/App/App/public and android/app/src/main/assets/public contain index.html.\nAPI calls fail only in the app. CORS: allow capacitor://localhost and https://localhost. Also check you are not calling http:// URLs, which iOS blocks by default.\nRoutes 404 after refresh or deep link. Use a router that falls back to index.html, or hash routing for older setups.\nXcode signing errors. See the error list in iOS certificates and provisioning profiles explained.\nGradle build fails after upgrading. Capacitor 8 needs Android Studio Otter (2025.2.1) or newer and JDK 21, as listed in the Capacitor 8 upgrade guide. For other Gradle errors, see how to resolve Android build errors in Capacitor.\nGoogle Play upload rejected for target SDK. Set targetSdkVersion = 36 in android/variables.gradle.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-put-a-web-app-on-the-app-store/"},"keywords":"web app to app store, convert web app to mobile app, put web app on app store, web app to ios app, web app to android app, capacitor, publish web app google play, wrap web app native","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-put-a-web-app-on-the-app-store/#faqpage","url":"https://capgo.app/blog/how-to-put-a-web-app-on-the-app-store/","mainEntity":[{"@type":"Question","name":"Can I put my web app on the App Store?","acceptedAnswer":{"@type":"Answer","text":"Yes. Wrap the built web app in a native iOS and Android shell with Capacitor, add native features where they make sense, sign the app, and submit it through App Store Connect and Google Play Console. Apple rejects apps that are only a website in a frame, so the app must feel like an app."}},{"@type":"Question","name":"Do I need a Mac to publish an iOS app?","acceptedAnswer":{"@type":"Answer","text":"You need macOS and Xcode to build the iOS binary, but it does not have to be your computer. Cloud build services such as Capgo Build run Xcode on hosted Macs, so you can build, sign and upload to TestFlight from Windows or Linux."}},{"@type":"Question","name":"How long does it take to get a web app on the App Store?","acceptedAnswer":{"@type":"Answer","text":"The code work can take a few days to a few weeks. Calendar time is often longer: Apple organization enrollment can take one to two weeks, new personal Google Play accounts must run a 14-day closed test with 12 testers, and first reviews take one to several days."}},{"@type":"Question","name":"Will Apple reject an app built with Capacitor?","acceptedAnswer":{"@type":"Answer","text":"Not for using Capacitor. Apple rejects apps that offer little beyond a website (guideline 4.2), that sell digital goods without the required in-app purchase options, or that crash and have broken flows. Many large apps in the App Store are Capacitor apps."}},{"@type":"Question","name":"Can I update the app without going through review again?","acceptedAnswer":{"@type":"Answer","text":"For changes to your web code, yes. Live update tools like Capgo replace the JavaScript, HTML and CSS bundle on installed apps, which Apple and Google allow as long as you do not change the app's primary purpose. Native code changes still need a new store release."}}]}]}</script>
