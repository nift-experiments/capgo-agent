<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"SoftwareApplication","@id":"https://capgo.app/plugins/capacitor-textinteraction/#softwareapplication","name":"Text Interaction Capacitor plugin","description":"Disable text selection and the iOS magnifier lens in Capacitor WebViews. Install @capgo/capacitor-textinteraction, see the API, examples and FAQ.","url":"https://capgo.app/plugins/capacitor-textinteraction/","image":"https://capgo.app/capgo_social.png","applicationCategory":"DeveloperApplication","operatingSystem":"iOS","downloadUrl":"https://www.npmjs.com/package/@capgo/capacitor-textinteraction","offers":{"@type":"Offer","price":"0","priceCurrency":"USD","availability":"https://schema.org/InStock"}},{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},{"@type":"BreadcrumbList","@id":"https://capgo.app/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"WebPage","@id":"https://capgo.app/","url":"https://capgo.app/","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@type":"WebPage","@id":"https://capgo.app/plugins/","url":"https://capgo.app/plugins/","name":"Plugins"}},{"@type":"ListItem","position":3,"item":{"@type":"WebPage","@id":"https://capgo.app/plugins/capacitor-textinteraction/","url":"https://capgo.app/plugins/capacitor-textinteraction/","name":"Text Interaction"}}]},{"@type":"FAQPage","@id":"https://capgo.app/plugins/capacitor-textinteraction/#faqpage","url":"https://capgo.app/plugins/capacitor-textinteraction/","mainEntity":[{"@type":"Question","name":"How do I disable text selection in a Capacitor iOS app?","acceptedAnswer":{"@type":"Answer","text":"Install @capgo/capacitor-textinteraction, run bunx cap sync, then call TextInteraction.toggle({ enabled: false }). The plugin sets isTextInteractionEnabled to false on the WKWebView, which turns off text selection and the magnifier lens for the whole WebView."}},{"@type":"Question","name":"Why is CSS user-select: none not enough on iOS?","acceptedAnswer":{"@type":"Answer","text":"user-select and -webkit-touch-callout stop most selection in page content, but the WKWebView can still show the magnifier lens and selection behavior on long-press, and every element you forget to style stays selectable. The plugin switches text interaction off at the WebView level, so one call covers every screen."}},{"@type":"Question","name":"Can users still type in inputs while text interaction is disabled?","acceptedAnswer":{"@type":"Answer","text":"No. While text interaction is disabled, text inputs, textareas and contenteditable elements stop working. Call TextInteraction.toggle({ enabled: true }) before showing a form or search field, and disable it again when the user leaves that screen."}},{"@type":"Question","name":"Does the plugin work on Android or the web?","acceptedAnswer":{"@type":"Answer","text":"No. Text interaction toggling is iOS only. On Android the call resolves with success set to false and changes nothing. On the web the call throws an unimplemented error, so guard it with Capacitor.getPlatform() === \"ios\"."}},{"@type":"Question","name":"Which iOS and Capacitor versions are supported?","acceptedAnswer":{"@type":"Answer","text":"The native API needs iOS 14.5 or later. Plugin major versions follow Capacitor: use plugin v8 with Capacitor 8 and plugin v7 with Capacitor 7."}},{"@type":"Question","name":"Does the setting persist after the app restarts?","acceptedAnswer":{"@type":"Answer","text":"The setting lives on the WebView configuration, so it stays in effect across page navigations until you call toggle again. A fresh app launch creates a new WebView with text interaction enabled, so call toggle again at startup if you want it off by default."}},{"@type":"Question","name":"How do I install the Text Interaction plugin in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"Run \"bun add @capgo/capacitor-textinteraction\" (or \"npm install @capgo/capacitor-textinteraction\"), then run \"bunx cap sync\" so the iOS and Android projects pick up the native code. Import it from \"@capgo/capacitor-textinteraction\" in your app code."}},{"@type":"Question","name":"Does @capgo/capacitor-textinteraction work with React, Vue and Angular?","acceptedAnswer":{"@type":"Answer","text":"Yes. Text Interaction is a Capacitor package, so it works with any web framework that runs inside Capacitor, including Ionic, React, Vue, Angular, Svelte and plain JavaScript."}},{"@type":"Question","name":"Which Capacitor version does @capgo/capacitor-textinteraction support?","acceptedAnswer":{"@type":"Answer","text":"Capgo plugins follow Capacitor's major version: use the plugin major version that matches your Capacitor major version (for example plugin v8 with Capacitor 8). The compatibility table in the GitHub README lists the maintained versions."}},{"@type":"Question","name":"Is @capgo/capacitor-textinteraction free and open source?","acceptedAnswer":{"@type":"Answer","text":"Yes. The source code is public on GitHub at https://github.com/Cap-go/capacitor-textinteraction/ and the package is free to install from npm. Bug reports and pull requests are welcome."}},{"@type":"Question","name":"Can I update code that uses Text Interaction without an App Store review?","acceptedAnswer":{"@type":"Answer","text":"Installing or upgrading the plugin changes native code, so it needs a new store build. After that, JavaScript, HTML and CSS changes that call the plugin can ship instantly with Capgo live updates."}}]}]}</script>
