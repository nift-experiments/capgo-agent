<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/capacitor-electron-desktop-app/#newsarticle","url":"https://capgo.app/blog/capacitor-electron-desktop-app/","headline":"Build a Desktop App with Capacitor and Electron (2026)","description":"Turn your Capacitor app into a desktop app with Electron: secure shell setup, plugin strategy, packaging for macOS, Windows, Linux, and live updates.","image":["https://capgo.app/capgo_banner.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To build a desktop app from a Capacitor app, wrap the same web build (webDir) in an Electron shell: a main process that opens a BrowserWindow, a preload script that exposes a small desktop API, and electron-builder to produce installers for macOS, Windows, and Linux. Your UI and business logic stay shared with iOS and Android, and desktop-only features live in the Electron main process.\nThis guide covers the current state of Capacitor on Electron in 2026, a secure setup that works with Capacitor 8, how plugins behave, packaging and signing, and how to ship web updates without new installers.\nThe state of Capacitor on Electron in 2026\nFor years the default answer was @capacitor-community/electron, which plugged Electron into the Capacitor CLI as a platform. That project is now marked unmaintained in its own README. Its last npm release, 5.0.1, shipped in September 2023, requires Capacitor 5.4 or later, and was built against Electron 26. Electron has shipped many major versions since, and only the latest three majors receive security fixes.\nYou can still use it on old projects, but for a Capacitor 8 app the comparison looks like this:\n\n\n\nApproach\nPros\nCons\n\n\n\n\nYour own Electron shell (this guide)\nCurrent Electron, full control, no extra abstraction\nYou write about 60 lines of main and preload code\n\n\n@capacitor-community/electron\nFamiliar cap commands\nUnmaintained, pinned to old Capacitor and Electron\n\n\n\nThe shell approach is less work than it sounds, because Capacitor already produces a static web build. Electron only needs to load it.\nHow plugins behave in Electron\nElectron’s renderer is Chromium, so your Capacitor app runs there like it runs in a browser. Capacitor’s core detects no native bridge and falls back to each plugin’s web implementation.\n\n\n\nPlugin type\nWorks in Electron?\nWhat to do\n\n\n\n\nPlugin with a web implementation (Preferences, Share, Clipboard, many Capgo plugins)\nYes, using the web version\nTest the web behavior\n\n\nNative-only plugin (no web implementation)\nNo, rejects as unimplemented\nWrite an Electron equivalent behind a preload API\n\n\nPure JS libraries\nYes\nNothing\n\n\n\nCapacitor.getPlatform() returns 'web' in this setup and Capacitor.isNativePlatform() returns false. We will expose an explicit desktop flag from the preload script so your code can branch cleanly.\nPrerequisites\n\nA Capacitor app whose bun run build outputs a static folder (the webDir in capacitor.config.ts, often dist or www).\nBun and a current LTS Node.js, since Electron tooling still runs on Node.\nFor macOS distribution, an Apple Developer ID certificate. For Windows, a code signing certificate.\n\nStep 1: Install Electron and the packager\nbun add -d electron electron-builder\nAdd an electron/ folder at the project root:\nmy-app/\n  capacitor.config.ts\n  dist/              # web build, shared with iOS and Android\n  electron/\n    main.ts\n    preload.ts\n  electron-builder.yml\nStep 2: Make the web build load from disk\nElectron loads files with the file:// protocol in production. Two settings matter:\n\nRelative asset paths. With Vite, set base: './' so the built index.html references ./assets/... instead of /assets/....\nRouting. Deep links like /settings do not exist as files. Use hash routing for the desktop build, or make sure your router only navigates client-side after loading index.html.\n\n// vite.config.ts\nimport { defineConfig } from 'vite';\n\nexport default defineConfig({\n  base: './',\n});\nRelative paths also work on iOS and Android, so you do not need a separate build.\nStep 3: Write the main process\n// electron/main.ts\nimport { app, BrowserWindow, ipcMain, shell } from 'electron';\nimport path from 'node:path';\n\nconst isDev = !app.isPackaged;\n\nasync function createWindow() {\n  const win = new BrowserWindow({\n    width: 1280,\n    height: 800,\n    minWidth: 800,\n    minHeight: 600,\n    show: false,\n    webPreferences: {\n      preload: path.join(__dirname, 'preload.js'),\n      contextIsolation: true,\n      nodeIntegration: false,\n      sandbox: true,\n    },\n  });\n\n  win.once('ready-to-show', () =&gt; win.show());\n\n  // Open external links in the default browser, never inside the app.\n  // Only allow https: so a script cannot launch file: or other protocol handlers.\n  win.webContents.setWindowOpenHandler(({ url }) =&gt; {\n    try {\n      if (new URL(url).protocol === 'https:') void shell.openExternal(url).catch(() =&gt; {});\n    } catch {\n      // invalid URL: ignore\n    }\n    return { action: 'deny' };\n  });\n\n  if (isDev) {\n    await win.loadURL('http://localhost:5173');\n    win.webContents.openDevTools({ mode: 'detach' });\n  } else {\n    await win.loadFile(path.join(__dirname, '..', '..', 'dist', 'index.html'));\n  }\n}\n\nipcMain.handle('desktop:get-version', () =&gt; app.getVersion());\n\napp.whenReady().then(createWindow);\n\napp.on('window-all-closed', () =&gt; {\n  if (process.platform !== 'darwin') app.quit();\n});\n\napp.on('activate', () =&gt; {\n  if (BrowserWindow.getAllWindows().length === 0) createWindow();\n});\nKeep contextIsolation: true, nodeIntegration: false, and sandbox: true. Your web app may load third-party scripts, and none of them should get Node.js access.\nStep 4: Expose a small desktop API from the preload\n// electron/preload.ts\nimport { contextBridge, ipcRenderer } from 'electron';\n\ncontextBridge.exposeInMainWorld('desktop', {\n  isElectron: true,\n  platform: process.platform,\n  getVersion: () =&gt; ipcRenderer.invoke('desktop:get-version') as Promise&lt;string&gt;,\n});\nType it in your web code and use it the same way you would use a plugin:\n// src/desktop.ts\ndeclare global {\n  interface Window {\n    desktop?: {\n      isElectron: boolean;\n      platform: string;\n      getVersion: () =&gt; Promise&lt;string&gt;;\n    };\n  }\n}\n\nexport const isDesktop = () =&gt; Boolean(window.desktop?.isElectron);\nEach native-only feature you need on desktop becomes one ipcMain.handle in the main process and one function in the preload. Validate arguments in the main process, since the renderer is untrusted.\nStep 5: Build and run\nCompile the Electron files with Bun. The preload runs sandboxed, so bundle it as a single CommonJS file:\n{\n  \"main\": \"electron/dist/main.js\",\n  \"scripts\": {\n    \"build\": \"vite build\",\n    \"electron:compile\": \"bun build electron/main.ts --outdir electron/dist --target node --format cjs --external electron &amp;&amp; bun build electron/preload.ts --outdir electron/dist --target node --format cjs --external electron\",\n    \"electron:dev\": \"bun run electron:compile &amp;&amp; electron .\",\n    \"electron:pack\": \"bun run build &amp;&amp; bun run electron:compile &amp;&amp; electron-builder\"\n  }\n}\nDuring development, start your dev server in one terminal (bun run dev) and bun run electron:dev in another. You get hot reload in the desktop window.\nStep 6: Package installers with electron-builder\n# electron-builder.yml\nappId: com.example.myapp\nproductName: My App\ndirectories:\n  output: release\nfiles:\n  - dist/**/*\n  - electron/dist/**/*\n  - package.json\nmac:\n  target: [dmg, zip]\n  category: public.app-category.productivity\n  hardenedRuntime: true\nwin:\n  target: [nsis]\nlinux:\n  target: [AppImage, deb]\n  category: Utility\nRun bun run electron:pack. electron-builder builds for the OS you run it on. Use a matrix of macOS, Windows, and Linux runners in CI to produce all three.\n\n\n\nOS\nCommon targets\nSigning\n\n\n\n\nmacOS\n.dmg, .zip\nDeveloper ID certificate plus notarization, or Gatekeeper blocks the app\n\n\nWindows\nNSIS .exe, MSI\nCode signing certificate to avoid SmartScreen warnings\n\n\nLinux\nAppImage, .deb, .rpm\nOptional\n\n\n\nElectron apps are larger than mobile builds because they include Chromium and Node.js. Expect installers around 80 to 150 MB depending on targets.\nStep 7: Ship web updates without new installers\nMost changes in a Capacitor app are web changes. On mobile you can ship those with Capgo live updates. On desktop, @capgo/electron-updater does the same job with the same model: channels, a built-in bundle, downloaded bundles, and automatic rollback if the new bundle does not call notifyAppReady().\nbun add @capgo/electron-updater\nUpdate the main process to let the updater pick the bundle to load:\n// electron/main.ts (production branch)\nimport { ElectronUpdater, setupIPCHandlers, setupEventForwarding } from '@capgo/electron-updater';\n\nconst updater = new ElectronUpdater({\n  appId: 'com.example.myapp',\n  autoUpdate: true,\n});\n\n// inside createWindow(), instead of loading dist/index.html directly\nconst builtinPath = path.join(__dirname, '..', '..', 'dist', 'index.html');\nawait updater.initialize(win, builtinPath);\nsetupIPCHandlers(updater);\nsetupEventForwarding(updater, win);\nawait win.loadFile(updater.getCurrentBundlePath());\nAdd the updater bridge to the same preload file:\n// electron/preload.ts (next to the desktop API)\nimport { exposeUpdaterAPI } from '@capgo/electron-updater/preload';\n\nexposeUpdaterAPI();\nAnd confirm a healthy launch from the web app, only on desktop:\nimport { isDesktop } from './desktop';\n\nif (isDesktop()) {\n  const { requireUpdater } = await import('@capgo/electron-updater/renderer');\n  await requireUpdater().notifyAppReady();\n}\nUpload a new bundle with the same CLI you use for mobile:\nbun run build\nbunx @capgo/cli@latest bundle upload --channel=production\nWeb updates cannot change Electron itself, the main process, or the preload. For those, ship a new installer with a binary auto-updater. Our guide on Electron auto-updates covers that path, and the electron-updater plugin page and docs cover every option.\nTroubleshooting\nBlank window in the packaged app. Assets use absolute paths. Set base: './' and rebuild. Open DevTools in the packaged app to confirm 404s on file:///assets/....\nRoutes show a blank page after reload. The router tried to load /route from disk. Switch to hash routing for desktop.\nrequire is not defined or preload errors. The sandboxed preload cannot load arbitrary packages at runtime. Bundle it into one file, as in the compile script above.\nA plugin call rejects with “not implemented on web”. That plugin has no web implementation. Add an IPC handler in the main process and call it through window.desktop.\nmacOS says the app is damaged or from an unidentified developer. The app is not signed and notarized. Configure a Developer ID certificate and notarization in electron-builder.\nUpdates roll back right after install. notifyAppReady() was not called within the timeout (10 seconds by default). Call it early in your app startup.\nWrap-up\nYou do not need a dedicated Capacitor platform package to reach the desktop. A short Electron main process, a preload that exposes a typed API, relative asset paths, and electron-builder give you installers for all three operating systems from the same web build. Add @capgo/electron-updater and the desktop app gets the same live update workflow as your iOS and Android builds. If you are still choosing a desktop runtime, read our Electron vs Tauri comparison.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/capacitor-electron-desktop-app/"},"keywords":"Capacitor Electron, Capacitor desktop app, Electron Capacitor, Ionic desktop app, capacitor-community electron, Electron live updates, electron-builder Capacitor","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/capacitor-electron-desktop-app/#faqpage","url":"https://capgo.app/blog/capacitor-electron-desktop-app/","mainEntity":[{"@type":"Question","name":"Is @capacitor-community/electron still maintained?","acceptedAnswer":{"@type":"Answer","text":"No. Its README marks it as unmaintained, and its last npm release, 5.0.1, dates from September 2023 and targets Capacitor 5 and Electron 26. For a Capacitor 8 app, a small Electron shell you own is the safer choice."}},{"@type":"Question","name":"Do Capacitor plugins work in Electron?","acceptedAnswer":{"@type":"Answer","text":"Plugins with a web implementation work, because the Electron renderer is Chromium. Plugins that only have iOS and Android code do not. Replace those with Electron main-process code exposed through a preload script."}},{"@type":"Question","name":"What does Capacitor.getPlatform() return in Electron?","acceptedAnswer":{"@type":"Answer","text":"With a plain Electron shell it returns 'web', since there is no Capacitor native bridge. Expose your own flag from the preload script to detect the desktop build."}},{"@type":"Question","name":"Can I ship live updates to an Electron app?","acceptedAnswer":{"@type":"Answer","text":"Yes. @capgo/electron-updater downloads new web bundles from Capgo, with channels and automatic rollback, using the same bundle upload command as the mobile app."}},{"@type":"Question","name":"Do I need a separate build for each operating system?","acceptedAnswer":{"@type":"Answer","text":"Yes. Electron packages per OS and CPU architecture. Build macOS on a Mac for signing and notarization, and use CI runners for Windows and Linux."}}]}]}</script>
