<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/self-hosted-capgo/#newsarticle","url":"https://capgo.app/blog/self-hosted-capgo/","headline":"Self hosted Capgo","description":"Self-hosting Capgo allows you to deploy Capacitor live updates to your users without having to use the Capgo cloud service.","image":["https://capgo.app/self-hosted-capgo.webp"],"datePublished":"2023-09-20T00:00:00.000Z","dateModified":"2026-08-25T01:16:42.000Z","inLanguage":"en","articleBody":"This article provides a step-by-step guide on how to self-host Capgo, as well as a discussion of the benefits and challenges of self-hosting.\nIntroduction\nSelf Hosting is a form of running your own website or application by setting up a server and network yourself. Instead of using a Platform as a Service or a Public Cloud Provider, those who choose to self-host will run their own networks and be responsible for the maintenance and uptime in addition to building their website or application.\nThe easiest way to get started with Capgo is with our official managed service in the cloud, but if you’re happy to manage your own, you can also self-host Capgo on your server.\nWhat is self hosting?\nSelf-hosting, in the context of the digital realm, refers to the practice of running your own servers or hosting infrastructure to manage and control your online presence and services. Instead of relying on third-party hosting providers, individuals and organizations choose to set up and manage their servers, websites, applications, and data storage on their terms.\nWhy do you choose self-hosting?\nThere are many reasons why people choose to self-host. Some of the most common benefits include:\n\n\nPrivacy and control: Self-hosting gives you complete control over your data and privacy. You don’t have to worry about third-party providers tracking your activity or selling your data.\n\n\nCost savings: Self-hosting can be more cost-effective in the long run, especially if you’re using a lot of resources or running multiple services.\n\n\nCustomization: Self-hosting gives you the flexibility to customize your applications and services to meet your specific needs.\n\n\nLearning and experimentation: Self-hosting can be a great way to learn about Linux, system administration, and other technical topics. It can also be a fun way to experiment with new software and services.\n\n\nIndependence: Self-hosting reduces your dependency on external providers. You’re not at the mercy of their terms of service, pricing changes, or potential service disruptions. This independence can be crucial for businesses and individuals who rely on their online presence for critical functions.\n\n\nWhat’s the difference between Capgo Cloud and Capgo Self-Hosted?\nThere is only one version of Capgo. Both my Cloud and my Self-Hosted products are completely equal. There’s no premium and exclusive commercial version with a better or more complete feature set.\nYou get the same dashboard, same actionable metrics and same commitment to respecting the privacy of your visitors with both.\nI started developing Capgo in December 2018, and I launched the SaaS subscription business in May 2019. The project is very much alive, actively developed and fast-growing. It is robust and battle-tested too.\nHere are the differences between Capgo Cloud and Capgo Self-Hosted:\n\n\n\n \nCloud\nSelf-hosted\n\n\n\n\nHosting\nEasy and convenient. It takes 2 minutes to start sending your first update, high availability, backups, security, and maintenance all done for you by me. I manage everything for you so you don’t have to worry about anything.\nYou do it all yourself. You need to get a server, and you need to manage your infrastructure. You are responsible for installation, maintenance, upgrades, server capacity, uptime, backup, security, stability, consistency, loading time and so on.\n\n\nStorage\nAll visitor data is exclusively processed on EU-owned cloud infrastructure. I keep your site data on a secure, encrypted and server in Germany. This ensures that your site data is protected by the strict European Union data privacy laws and ensures compliance with GDPR. Your website data never leaves the EU.\nYou have full control and can host your Capgo on any server in any country that you wish. Host it on a server in your basement or host it with any cloud provider wherever you want, even those that are not GDPR compliant.\n\n\nRaw data\nYou see all your site stats and metrics on my modern-looking, simple to use and fast loading dashboard. You can only see the stats aggregated in the dashboard.\nAre you an analyst and want access to the raw data? Hosting Capgo yourself gives you that option. Take the data directly from the database and import it to a data analysis tool of your choice.\n\n\nCosts\nThere’s a cost associated with providing an updater service, so I charge a subscription fee.\nYou only need to pay for your server and whatever cost there is associated with running a server. You never have to pay any fees to me, only to your cloud provider.\n\n\nPremium Support\nReal support delivered by real human beings who build and maintain Capgo.\nPremium support is not included. Self-hosted release is community supported only.\n\n\nReleases\nContinuously developed and improved with new features and updates multiple times per week.\nIt’s a long term release published twice per year, so the latest features won’t be immediately available as they’re battled-tested in the cloud first.\n\n\n\nHow to self-host Capgo\nWe mainly use Supabase in Capgo, to self host you just need to follow the Supabase self-hosting documentation.\nUsing the CLI with self-hosted capgo\nTo use the CLI with self-hosted capgo edit the capacitor.config.ts from your app directory and set it like this:\nconst config: CapacitorConfig = {\n  appId: 'com.demo.app',\n  appName: 'demoApp',\n  webDir: 'dist',\n  bundledWebRuntime: false,\n  plugins: {\n    CapacitorUpdater : {\n      localHost: \"http://localhost:5173\",\n      localWebHost: \"http://localhost:5173\",\n      localSupa: \"http://localhost:54321\",\n      localSupaAnon: \"see_notes\",\n    },\n  },\n};\nNote: To get localSupaAnon please follow this tutorial and copy the anon key into localSupaAnon\nUsing the capacitor updater with self-hosted capgo\nRequirement\nCloned capgo\nTo use the capacitor updater with self-hosted capgo edit the capacitor.config.ts from your app directory and set it like this:\nconst config: CapacitorConfig = {\n  appId: 'com.demo.app',\n  appName: 'demoApp',\n  webDir: 'dist',\n  bundledWebRuntime: false,\n  plugins: {\n    CapacitorUpdater : {\n      statsUrl: \"https://localhost:54321/functions/v1/stats\",\n      channelUrl: \"https://localhost:54321/functions/v1/channel_self\",\n      updateUrl: \"https://localhost:54321/functions/v1/updates\"\n    },\n  },\n};\nThis will enable you to use local capgo in development. However, by default, this is not enough.\n\nYou do need to setup HTTPS for Both os to be able to test\n\nConclusion\nIn conclusion, self-hosting Capgo can be a good option for organizations that have the resources and expertise to do so. It offers a number of benefits, including control over the update process, security, and compliance. However, it is important to carefully weigh the benefits and challenges before deciding whether to self-host.\nIf you are considering self-hosting Capgo, I recommend that you start by reading the Capgo self-hosting documentation. This will give you a good understanding of the requirements and risks of self-hosting.\nKeep going from Self hosted Capgo\nIf you are using Self hosted Capgo to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Anik Dhabal Babu","url":"https://x.com/anikdhabal","image":"https://avatars.githubusercontent.com/u/81948346?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/self-hosted-capgo/"},"keywords":"mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Solution"}</script>
