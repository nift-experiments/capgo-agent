<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/capacitor-community-sqlite-alternative/#newsarticle","url":"https://capgo.app/blog/capacitor-community-sqlite-alternative/","headline":"Alternative to @capacitor-community/sqlite in 2026","description":"Looking for an alternative to @capacitor-community/sqlite? Compare it with Capgo Fast SQL and migrate your Capacitor SQLite code and user data step by step.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"The main alternative to @capacitor-community/sqlite on Capacitor 8 is @capgo/capacitor-fast-sql: a native SQLite plugin for iOS, Android and the web that keeps SQLCipher optional and sends query data over a local HTTP channel instead of the Capacitor bridge. This guide compares the two honestly, says when to stay on the community plugin, and walks through migrating both your code and your users’ existing databases.\nWhy teams look for an alternative\n@capacitor-community/sqlite has been the default SQLite plugin for Capacitor for years and it is still maintained (8.1.1 shipped in August 2026). The reasons people move are specific:\n\nBridge serialization. Every result goes through the Capacitor bridge as JSON. That is fine for small queries, and noticeable when you load thousands of rows for sync or search.\nSQLCipher is always included. The plugin depends on SQLCipher on iOS and Android even if you never encrypt. That adds native size and means your binary contains encryption code you have to account for in export compliance answers.\nWeb storage model. On the web it uses the jeep-sqlite component: sql.js in memory, persisted to IndexedDB when you call saveToStore(). You must remember to save, and the whole database lives in memory.\nA large API surface. Connection wrappers, consistency checks, read-only and non-conformed connections, sync tables, JSON import and export. Powerful, but a lot to learn for “run SQL”.\nOne passphrase per app. Encryption uses a single secret stored by the plugin (setEncryptionSecret), shared by every encrypted database in the app.\n\nSide-by-side comparison\n\n\n\n\n@capacitor-community/sqlite 8.1\n@capgo/capacitor-fast-sql 8.2\n\n\n\n\nPlatforms\niOS, Android, Web, Electron\niOS, Android, Web\n\n\nData path\nCapacitor bridge\nLocal HTTP server with a per-connection token (native)\n\n\nWeb engine\njeep-sqlite (sql.js + IndexedDB, manual saveToStore)\nOfficial @sqlite.org/sqlite-wasm with OPFS, writes go to the file\n\n\nEncryption\nSQLCipher always bundled, one plugin-managed passphrase\nOptional SQLCipher, key passed per database on connect()\n\n\nSwift Package Manager\nYes (Package.swift)\nYes (Package.swift)\n\n\nSchema versioning\nupgradeStatements / addUpgradeStatement\nYour own, usually PRAGMA user_version\n\n\nJSON import/export, sync tables\nYes\nNo\n\n\nPrepopulated database from assets\ncopyFromAssets()\nCopy the file yourself before connect()\n\n\nKey-value helper\nNo\nKeyValueStore\n\n\nBLOBs\nYes\nYes, as Uint8Array\n\n\nORM support\nTypeORM built-in capacitor driver\nCustom drivers (Kysely works well)\n\n\nExtra native setup\nWeb: copy sql-wasm.wasm\niOS NSAllowsLocalNetworking, Android localhost cleartext rule\n\n\nMaintainer\nCapacitor community\nCapgo\n\n\n\nWhen to stay on the community plugin\nBe practical. Stay if:\n\nyou ship an Electron build,\nyou use TypeORM (its capacitor driver is written against the community plugin, see TypeORM with Capacitor),\nyou rely on JSON import/export or sync tables and do not want to rebuild them,\nyour queries are small and the app works well today.\n\nWhen Fast SQL is the better fit\nMove if:\n\nyou load or write large datasets (sync engines, offline catalogs, search indexes, CRDT logs),\nyou want encryption only for some databases, with keys from the Keychain or Keystore,\nyou do not want SQLCipher in an app that does not need it,\nyou want a real SQLite file on the web through OPFS instead of an in-memory copy,\nyou want a simple API: connect, query, run, transaction.\n\nFor a full walkthrough of Fast SQL itself, see How to use SQLite in a Capacitor app.\nStep 1: install Fast SQL next to the old plugin\nKeep the community plugin installed for one release so you can migrate existing data.\nbun add @capgo/capacitor-fast-sql\nbunx cap sync\nNative configuration Fast SQL needs:\n\niOS: NSAppTransportSecurity &gt; NSAllowsLocalNetworking = true in Info.plist.\nAndroid: a network_security_config.xml that permits cleartext to localhost and 127.0.0.1, referenced from the manifest.\nEncryption: net.zetetic:sqlcipher-android in the Android app module and the CapgoCapacitorFastSql/SQLCipher pod on iOS. Details in encrypting SQLite in Capacitor.\nWeb: Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp headers for OPFS.\n\nStep 2: map the API\nOpening a database\nBefore:\nimport { CapacitorSQLite, SQLiteConnection } from '@capacitor-community/sqlite';\n\nconst sqlite = new SQLiteConnection(CapacitorSQLite);\nconst db = await sqlite.createConnection('app', false, 'no-encryption', 1, false);\nawait db.open();\nAfter:\nimport { FastSQL } from '@capgo/capacitor-fast-sql';\n\nconst db = await FastSQL.connect({ database: 'app', walMode: true, performancePresets: true });\nFastSQL.connect() returns the existing connection if the database is already open, so there is no isConnection / retrieveConnection dance.\nMethod mapping\n\n\n\nCommunity plugin\nFast SQL\n\n\n\n\ncreateConnection() + open()\nFastSQL.connect({ database })\n\n\ncloseConnection(name)\nFastSQL.disconnect(name)\n\n\ndb.query(sql, values) returns { values }\ndb.query(sql, params) returns rows\n\n\ndb.run(sql, values) returns { changes: { changes, lastId } }\ndb.run(sql, params) returns { rowsAffected, insertId }\n\n\ndb.execute(multiStatementString)\nOne db.execute(sql) per statement, or db.executeBatch([...])\n\n\ndb.executeSet(set)\ndb.executeBatch(ops) with { statement, params }\n\n\nbeginTransaction / commitTransaction / rollbackTransaction\ndb.transaction(async (tx) =&gt; ...) or beginTransaction() / commit() / rollback()\n\n\naddUpgradeStatement / upgradeStatements\nA PRAGMA user_version migration runner\n\n\ncopyFromAssets()\nCopy a bundled .db into Directory.Data before the first connect()\n\n\nsetEncryptionSecret() + mode: 'secret'\nencrypted: true, encryptionKey on connect()\n\n\ninitWebStore() / saveToStore()\nNot needed, OPFS persists writes\n\n\n\nQueries and writes\nBefore:\nconst res = await db.query('SELECT * FROM notes WHERE pinned = ?', [1]);\nconst notes = res.values ?? [];\n\nconst { changes } = await db.run('INSERT INTO notes (title) VALUES (?)', ['Hello']);\nconst id = changes?.lastId;\nAfter:\nconst notes = await db.query('SELECT * FROM notes WHERE pinned = ?', [1]);\n\nconst { insertId } = await db.run('INSERT INTO notes (title) VALUES (?)', ['Hello']);\nBoth plugins return rows as objects keyed by column name.\nMulti-statement execute\nThe community execute() accepts a string with several statements separated by ;. Fast SQL prepares one statement per call. Split your SQL, or better, keep statements as an array:\nconst schema = [\n  'CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL)',\n  'CREATE INDEX IF NOT EXISTS idx_notes_title ON notes (title)',\n];\n\nawait db.executeBatch(schema.map((statement) =&gt; ({ statement })));\nDo not split on ; with a naive split(';') if any statement contains a trigger body or a string literal with a semicolon.\nUpgrade statements to user_version\nThe community plugin stores the schema version in PRAGMA user_version too. If you keep the same version numbers, your existing users’ databases are already at the right version after the file migration in step 3.\nimport type { SQLConnection } from '@capgo/capacitor-fast-sql';\n\n// Same content as your old upgrade statements, index 0 = version 1\nconst versions: string[][] = [\n  ['CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL)'],\n  ['ALTER TABLE notes ADD COLUMN pinned INTEGER NOT NULL DEFAULT 0'],\n];\n\nexport async function migrate(db: SQLConnection) {\n  const [{ user_version }] = await db.query('PRAGMA user_version');\n  for (let v = Number(user_version); v &lt; versions.length; v++) {\n    await db.transaction(async (tx) =&gt; {\n      for (const statement of versions[v]) await tx.execute(statement);\n      await tx.execute(`PRAGMA user_version = ${v + 1}`);\n    });\n  }\n}\nCheck the actual user_version on an existing install before relying on this. Log it from the old plugin in your current release if you are not sure.\nPrepopulated databases\nThe community plugin’s copyFromAssets() copies bundled databases on first launch. With Fast SQL, put the file where the plugin looks before connecting. Fast SQL stores &lt;name&gt;.db in Documents on iOS and in the app’s files directory on Android, which are both Directory.Data in @capacitor/filesystem:\nimport { Directory, Filesystem } from '@capacitor/filesystem';\nimport { FastSQL } from '@capgo/capacitor-fast-sql';\n\nasync function openCatalog() {\n  const exists = await Filesystem.stat({ path: 'catalog.db', directory: Directory.Data })\n    .then(() =&gt; true)\n    .catch(() =&gt; false);\n\n  if (!exists) {\n    const blob = await (await fetch('/assets/catalog.db')).blob();\n    const base64 = await new Promise&lt;string&gt;((resolve) =&gt; {\n      const reader = new FileReader();\n      reader.onloadend = () =&gt; resolve((reader.result as string).split(',')[1]);\n      reader.readAsDataURL(blob);\n    });\n    await Filesystem.writeFile({ path: 'catalog.db', data: base64, directory: Directory.Data });\n  }\n  return FastSQL.connect({ database: 'catalog', readOnly: true });\n}\nFor large files, download them in chunks or ship a compressed file and use the file plugin’s native copy instead of base64 in JavaScript.\nStep 3: migrate existing user data\nUsers who update your app have a database created by the community plugin. It lives at a different path with a different name:\n\n\n\n\nCommunity plugin\nFast SQL\n\n\n\n\niOS\nDocuments/&lt;name&gt;SQLite.db (default iosDatabaseLocation)\nDocuments/&lt;name&gt;.db\n\n\nAndroid\ndatabases/&lt;name&gt;SQLite.db\nfiles/&lt;name&gt;.db\n\n\n\nOption A: copy the file (unencrypted databases)\nFastest, and it keeps everything: indexes, triggers, user_version.\nimport { CapacitorSQLite, SQLiteConnection } from '@capacitor-community/sqlite';\nimport { Directory, Filesystem } from '@capacitor/filesystem';\nimport { Preferences } from '@capacitor/preferences';\n\nexport async function moveCommunityDatabase(name: string): Promise&lt;void&gt; {\n  const done = await Preferences.get({ key: `sqlite-moved:${name}` });\n  if (done.value === '1') return;\n\n  const sqlite = new SQLiteConnection(CapacitorSQLite);\n  const exists = (await sqlite.isDatabase(name)).result;\n  if (exists) {\n    const conn = await sqlite.createConnection(name, false, 'no-encryption', 1, false);\n    await conn.open();\n    await conn.execute('PRAGMA wal_checkpoint(TRUNCATE)', false).catch(() =&gt; undefined);\n    const { url } = await conn.getUrl();\n    await sqlite.closeConnection(name, false);\n\n    if (url) {\n      await Filesystem.copy({ from: url, to: `${name}.db`, toDirectory: Directory.Data });\n    }\n  }\n  await Preferences.set({ key: `sqlite-moved:${name}`, value: '1' });\n}\nCall it before the first FastSQL.connect({ database: name }). Notes:\n\ngetUrl() (iOS and Android) returns the database file URL. Passing a full file:// URL with no directory lets the Filesystem plugin read from any path inside your sandbox.\nClosing the connection and checkpointing first makes sure no recent writes are left in a -wal file.\nKeep the old file for one release and delete it later with the community connection’s delete() method once you are confident. Then remove the community plugin.\n\nOption B: copy rows in JavaScript (encrypted databases, or a schema change)\nWhen the source is encrypted with the community plugin’s stored secret, the simplest safe path is to let that plugin decrypt and copy rows into a new Fast SQL database. This also lets you encrypt with a new per-database key from secure storage.\nimport { CapacitorSQLite, SQLiteConnection } from '@capacitor-community/sqlite';\nimport { FastSQL } from '@capgo/capacitor-fast-sql';\nimport { Preferences } from '@capacitor/preferences';\n\nexport async function copyRows(name: string, target: { encryptionKey?: string }) {\n  // Record which destination mode was migrated, so a later call with a different target fails loudly\n  const mode = target.encryptionKey ? 'encrypted' : 'plain';\n  const done = await Preferences.get({ key: `sqlite-copied:${name}` });\n  if (done.value === mode) return;\n  if (done.value) throw new Error(`${name} was already copied as ${done.value}, not ${mode}`);\n\n  const sqlite = new SQLiteConnection(CapacitorSQLite);\n  const src = await sqlite.createConnection(name, true, 'secret', 1, false);\n  await src.open();\n\n  try {\n    const dst = await FastSQL.connect({\n      database: name,\n      encrypted: Boolean(target.encryptionKey),\n      encryptionKey: target.encryptionKey,\n    });\n\n    const objects = ((await src.query(\n      `SELECT type, name, sql FROM sqlite_master\n       WHERE sql IS NOT NULL AND name NOT LIKE 'sqlite_%'`,\n    )).values ?? []) as { type: string; name: string; sql: string }[];\n    const tables = objects.filter((o) =&gt; o.type === 'table');\n    const others = objects.filter((o) =&gt; o.type !== 'table');\n    const version = (await src.query('PRAGMA user_version')).values?.[0]?.user_version ?? 0;\n\n    await dst.transaction(async (tx) =&gt; {\n      for (const t of tables) await tx.execute(t.sql);\n      for (const t of tables) {\n        const rows = (await src.query(`SELECT * FROM \"${t.name}\"`)).values ?? [];\n        if (!rows.length) continue;\n        const cols = Object.keys(rows[0]);\n        const statement = `INSERT INTO \"${t.name}\" (${cols.map((c) =&gt; `\"${c}\"`).join(', ')}) VALUES (${cols.map(() =&gt; '?').join(', ')})`;\n        await tx.executeBatch(rows.map((r) =&gt; ({ statement, params: cols.map((c) =&gt; r[c]) })));\n      }\n      for (const o of others) await tx.execute(o.sql);\n      await tx.execute(`PRAGMA user_version = ${Number(version)}`);\n    });\n\n    // Only mark the copy as done once the transaction has committed\n    await Preferences.set({ key: `sqlite-copied:${name}`, value: mode });\n  } finally {\n    await sqlite.closeConnection(name, false);\n  }\n}\nUse 'no-encryption' and false in createConnection if the source is not encrypted. The community plugin requires iosIsEncryption / androidIsEncryption in capacitor.config for its encrypted modes, which you already have if you used them. For large tables, page through with WHERE rowid &gt; ? ORDER BY rowid LIMIT 5000.\nBoth plugins use SQLCipher 4 defaults, so an encrypted file may also open in Fast SQL directly with the same passphrase. The community plugin manages that passphrase internally, though, and row copying avoids depending on that detail.\nStep 4: remove the old plugin\nAfter one or two releases with the migration in place:\nbun remove @capacitor-community/sqlite jeep-sqlite\nbunx cap sync\nRemove sql-wasm.wasm from your assets and any jeep-sqlite setup in main.ts. Removing the plugin also removes its SQLCipher dependency, so if you do not opt into Fast SQL’s encryption, the iOS and Android binaries get smaller.\nData migration code is JavaScript, so it can ship with Capgo live updates, but the release that adds Fast SQL is a native change and needs a store build. Ship the native build first. Capgo Build can produce it in the cloud if you do not keep a Mac around (App Store uploads require Xcode 26 or later since April 2026).\nTroubleshooting\nFast SQL connects but every query fails on iOS. NSAllowsLocalNetworking is missing from the app’s Info.plist, or the app was not rebuilt after adding it.\nAndroid: CLEARTEXT communication to localhost not permitted. Add the localhost domain-config to your network security config. If you already had one for SSL pinning, merge them.\nOnly part of my schema was created. You passed a multi-statement string to execute(). Split it into an array.\nINSERT ... RETURNING returns nothing on Android. In Fast SQL 8.2, Android returns rows only for statements starting with SELECT, PRAGMA or EXPLAIN. Use insertId from run().\nBooleans do not match on Android reads. Pass 1/0 instead of true/false in query parameters. Android binds read-query parameters as text.\nThe copied database is empty. The community plugin was configured with a custom iosDatabaseLocation, or the source name differs. Log the URL returned by getUrl().\nWeb data from the old plugin is gone. The community plugin stored web data in IndexedDB through jeep-sqlite, Fast SQL uses OPFS. Re-sync web clients from your backend, or export with the old plugin’s exportToJson and import rows into Fast SQL.\nOther options\n\n@capgo/capacitor-data-storage-sqlite if what you really need is a string key-value store backed by SQLite. See key-value storage in Capacitor.\nAn ORM or query builder on top: Kysely works with Fast SQL through a short custom driver. Drizzle currently fits the community plugin better.\n\nThe full Fast SQL API is in the plugin docs and on the plugin page.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/capacitor-community-sqlite-alternative/"},"keywords":"capacitor community sqlite alternative, capacitor-community/sqlite, capacitor sqlite plugin, capacitor fast sql, migrate capacitor sqlite, ionic sqlite alternative","articleSection":"Alternatives"},{"@type":"FAQPage","@id":"https://capgo.app/blog/capacitor-community-sqlite-alternative/#faqpage","url":"https://capgo.app/blog/capacitor-community-sqlite-alternative/","mainEntity":[{"@type":"Question","name":"What is the best alternative to @capacitor-community/sqlite?","acceptedAnswer":{"@type":"Answer","text":"@capgo/capacitor-fast-sql is the closest general-purpose alternative on Capacitor 8. It covers iOS, Android and web (official SQLite Wasm with OPFS), keeps SQLCipher optional, and moves query data over a local HTTP channel instead of the Capacitor bridge. If you depend on Electron or TypeORM's built-in capacitor driver, the community plugin is still the better fit."}},{"@type":"Question","name":"Can I keep my existing user data when switching SQLite plugins?","acceptedAnswer":{"@type":"Answer","text":"Yes. For unencrypted databases, close the community connection and copy the file it reports through getUrl() to the location Fast SQL uses. For encrypted ones, or if you want a fresh schema, open both plugins and copy table by table in JavaScript. Run the migration once and record that it finished."}},{"@type":"Question","name":"Does @capacitor-community/sqlite support Swift Package Manager?","acceptedAnswer":{"@type":"Answer","text":"Yes. Version 8.1.1 ships a Package.swift that depends on SQLCipher.swift, so it can be used with SPM-based Capacitor 8 projects. Fast SQL also ships a Package.swift."}},{"@type":"Question","name":"Is Fast SQL a drop-in replacement for the community plugin?","acceptedAnswer":{"@type":"Answer","text":"No. The API is different: one connect() call instead of createConnection plus open, query/run/execute on the connection, and no built-in upgradeStatements or JSON import/export. The mapping is mechanical and is listed in this guide."}},{"@type":"Question","name":"Why does the community plugin make my app bigger?","acceptedAnswer":{"@type":"Answer","text":"It bundles SQLCipher on iOS and Android whether or not you encrypt anything. Fast SQL only adds SQLCipher when you opt in, so apps without encryption ship with the system SQLite."}}]}]}</script>
