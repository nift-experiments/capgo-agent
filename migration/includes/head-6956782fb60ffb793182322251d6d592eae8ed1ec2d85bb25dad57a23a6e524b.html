<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/use-cocoapods-with-capacitor-8/#newsarticle","url":"https://capgo.app/blog/use-cocoapods-with-capacitor-8/","headline":"How to Use CocoaPods with Capacitor 8 (and When Not To)","description":"Use CocoaPods with Capacitor 8: create a CocoaPods iOS project, manage the Podfile, fix pod install errors, and plan for the CocoaPods trunk read-only date.","image":["https://capgo.app/capacitor-app-spm-migration-guide.jpg"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To use CocoaPods with Capacitor 8, create the iOS platform with bunx cap add ios --packagemanager CocoaPods, install CocoaPods (Homebrew or a Gemfile with Bundler), and let bunx cap sync ios manage the Podfile and run pod install. Capacitor 8 still fully supports CocoaPods. Only the default for new projects changed to Swift Package Manager.\nCocoaPods is no longer the long-term direction, and its trunk goes read-only on December 2, 2026. So the real question is when it’s still the right choice, how to keep it working, and how to leave it cleanly. This guide covers all three.\nWhen CocoaPods is still the right choice\nStay on, or pick, CocoaPods when one of these is true:\n\nA plugin you need has no Package.swift. In an SPM project the CLI warns “Some installed Capacitor plugins are not compatible with SPM” and leaves that plugin out, so it fails at runtime with “plugin is not implemented”.\nA vendor SDK is distributed only as a pod. Some analytics, payment and identity SDKs still ship CocoaPods-only, or ship an xcframework you’d have to wrap yourself.\nA Cordova plugin relies on pods. Capacitor generates a Swift package for Cordova plugins in SPM projects, but complex ones with &lt;podspec&gt; dependencies tend to work better with CocoaPods.\nYou rely on podspec subspecs to pick SDK variants. SPM has package traits now, and Capacitor supports them experimentally since CLI 8.3 (see SPM package traits in Capacitor), but the plugin has to define traits first.\nA large, customized Xcode project where a migration is not worth the risk this release cycle.\n\nPackage identity collisions used to be another reason. Since CLI 8.4 you can work around them in SPM with experimental.ios.spm.packageOptions (symlink or moduleAliases) in your Capacitor config.\nIf none of these apply, use SPM. It needs no Ruby toolchain, no Podfile and no .xcworkspace.\nCocoaPods vs SPM in Capacitor 8\n\n\n\n\nCocoaPods\nSwift Package Manager\n\n\n\n\nDefault for new cap add ios\nNo\nYes\n\n\nExtra tooling\nRuby + CocoaPods gem\nNone, built into Xcode\n\n\nProject to open\nios/App/App.xcworkspace\nios/App/App.xcodeproj\n\n\nPlugin requirement\n.podspec\nPackage.swift\n\n\nGenerated file\ndef capacitor_pods block in Podfile\nios/App/CapApp-SPM/Package.swift\n\n\nOptional features\nSubspecs\nPackage traits (experimental in Capacitor)\n\n\nFuture\nTrunk read-only from Dec 2, 2026\nApple-supported\n\n\n\nInstall CocoaPods\nPick one approach and use it everywhere, including CI.\nHomebrew (simplest for one developer):\nbrew install cocoapods\npod --version\nBundler (pins the version for the whole team, recommended for CI). Create a Gemfile in the project root or in ios/App:\nsource 'https://rubygems.org'\ngem 'cocoapods', '~&gt; 1.16'\nbundle install\nWhen the Capacitor CLI finds a Gemfile that mentions CocoaPods, it runs bundle exec pod install instead of pod install. If pod lives somewhere unusual, set CAPACITOR_COCOAPODS_PATH to the binary.\nCreate a Capacitor 8 app with CocoaPods\nbun add @capacitor/ios\nbun run build\nbunx cap add ios --packagemanager CocoaPods\nbunx cap open ios\ncap open ios opens App.xcworkspace. Always build from the workspace. Opening App.xcodeproj directly gives you No such module 'Capacitor'.\nThe Podfile, explained\nThis is the Podfile Capacitor 8 generates:\nrequire_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'\n\nplatform :ios, '15.0'\nuse_frameworks!\n\ninstall! 'cocoapods', :disable_input_output_paths =&gt; true\n\ndef capacitor_pods\n  pod 'Capacitor', :path =&gt; '../../node_modules/@capacitor/ios'\n  pod 'CapacitorCordova', :path =&gt; '../../node_modules/@capacitor/ios'\nend\n\ntarget 'App' do\n  capacitor_pods\n  # Add your Pods here\nend\n\npost_install do |installer|\n  assertDeploymentTarget(installer)\nend\nWhat you can and can’t touch:\n\ndef capacitor_pods ... end belongs to the CLI. On every sync it replaces the whole block with one pod line per plugin, pointing to the plugin’s folder in node_modules. Anything you add inside is lost.\nAdd your own pods under target 'App', after capacitor_pods.\nassertDeploymentTarget raises any pod with a deployment target below 15.0 up to 15.0, which avoids Xcode warnings about unsupported targets. Keep it, and add your own post_install logic inside the same block.\nplatform :ios must be at least 15.0 for Capacitor 8.\n\nExample with an extra pod and a build setting fix:\ntarget 'App' do\n  capacitor_pods\n  pod 'GoogleMLKit/BarcodeScanning', '~&gt; 7.0'\nend\n\npost_install do |installer|\n  assertDeploymentTarget(installer)\n  installer.pods_project.targets.each do |target|\n    if target.respond_to?(:product_type) &amp;&amp; target.product_type == 'com.apple.product-type.bundle'\n      target.build_configurations.each do |config|\n        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n      end\n    end\n  end\nend\nThe loop disables code signing for resource bundle targets. It fixes Signing for \"X\" requires a development team on pods that ship resource bundles. Only add it if you hit that error.\nDay-to-day commands\n# After installing or removing a plugin\nbunx cap sync ios\n\n# Use the exact versions in Podfile.lock (good for CI)\nbunx cap sync ios --deployment\n\n# Refresh the spec repo when a new pod version isn't found\ncd ios/App &amp;&amp; pod repo update &amp;&amp; pod install\n\n# Update one pod past its locked version\ncd ios/App &amp;&amp; pod update FirebaseMessaging\ncap sync ios also runs xcodebuild clean on the project after pod install, so you don’t need a manual clean after adding plugins.\nCommit Podfile and Podfile.lock. Don’t commit ios/App/Pods/. It’s regenerated by pod install.\nSwitching an existing app from SPM to CocoaPods\nThere’s no reverse migration command. Do it by hand:\n\nCommit, then copy ios/ somewhere safe.\nDelete ios/.\nRun bunx cap add ios --packagemanager CocoaPods.\nReapply native changes: Info.plist keys, entitlements and capabilities, signing team, bundle identifier, app icons and splash assets, URL schemes, extensions (widgets, notification service), and any custom Swift in AppDelegate.\nbunx cap sync ios and build.\n\nDiffing the old and new ios/App/App folders is the fastest way to catch what you missed.\nFixing common CocoaPods errors\nCocoaPods could not find compatible versions for pod \"X\". Either your local spec repo is stale or two pods require incompatible versions. Run pod install --repo-update in ios/App. If it still fails, read the dependency chain in the error, find the plugin with the strict pin, upgrade it or patch its podspec.\nThe sandbox is not in sync with the Podfile.lock. Run 'pod install'. The Pods folder doesn’t match the lock file, usually after switching branches. Run bunx cap sync ios.\n[!] Unable to find a specification for 'X'. The spec repo cache is stale or the pod name is wrong. Run pod repo update.\nUnable to find compatibility version string for object version '70' (or 77). Your Xcode project uses a newer format than your CocoaPods/xcodeproj gem understands. Update CocoaPods to the latest release. If you can’t, back up project.pbxproj and set objectVersion to a value your CocoaPods supports.\nSandbox: rsync(...) deny(1) file-write-create. Xcode’s user script sandboxing blocks the CocoaPods embed script. In Build Settings, set User Script Sandboxing (ENABLE_USER_SCRIPT_SANDBOXING) to No for the App target.\nNo such module 'Capacitor'. You opened App.xcodeproj. Open App.xcworkspace, or run bunx cap open ios.\npod: command not found in CI. Install CocoaPods in the job, or use Bundler with a cached vendor/bundle. Without it, the CLI logs “Skipping pod install because CocoaPods is not installed” and the build fails later.\nMore iOS build errors are covered in the Capacitor iOS troubleshooting guide.\nThe CocoaPods trunk read-only date\nThe CocoaPods maintainers announced that trunk, the central spec repository, becomes read-only on December 2, 2026, after a test run in early November 2026. What that means for a Capacitor app:\n\nExisting builds keep working. Every published podspec stays available.\nNo new versions through trunk. SDKs you pull from trunk (Firebase, Google ML Kit, vendor SDKs) stop getting updates there. Security fixes and new iOS SDK support will only ship through SPM or other channels.\nCapacitor plugins themselves are not affected directly. They’re installed from npm and referenced by :path in the Podfile. Their transitive pod dependencies are.\n\nTreat CocoaPods as a bridge. List which dependency keeps you on it, and revisit when that dependency adds SPM support.\nMoving off CocoaPods\nWhen you’re ready:\nbunx cap spm-migration-assistant\nIt runs pod deintegrate, removes the Podfile, Podfile.lock and App.xcworkspace, creates CapApp-SPM, and writes a debug.xcconfig. You then add CapApp-SPM as a local package in Xcode and set debug.xcconfig as the Debug configuration file. The full walkthrough is in how to migrate your Capacitor app to SPM, and the trade-offs are covered in SPM vs CocoaPods for Capacitor.\nPlugin authors who need to add SPM support should read migrate a Capacitor plugin to SPM.\nIf managing Ruby, CocoaPods and Xcode versions on build machines is the painful part, Capgo Build builds CocoaPods and SPM projects in the cloud on current Xcode.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/use-cocoapods-with-capacitor-8/"},"keywords":"CocoaPods Capacitor, Capacitor 8 CocoaPods, cap add ios packagemanager CocoaPods, Podfile Capacitor, pod install error, CocoaPods trunk read-only, SPM vs CocoaPods","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/use-cocoapods-with-capacitor-8/#faqpage","url":"https://capgo.app/blog/use-cocoapods-with-capacitor-8/","mainEntity":[{"@type":"Question","name":"Is CocoaPods still supported in Capacitor 8?","acceptedAnswer":{"@type":"Answer","text":"Yes. Capacitor 8 supports both CocoaPods and Swift Package Manager. Only the default for new iOS platforms changed to SPM. Existing CocoaPods apps keep working, and you can create a new one with bunx cap add ios --packagemanager CocoaPods."}},{"@type":"Question","name":"What happens to my app when CocoaPods trunk becomes read-only?","acceptedAnswer":{"@type":"Answer","text":"The CocoaPods team plans to make trunk read-only on December 2, 2026. Existing pod versions stay installable, so builds keep working. No new versions are published through trunk afterwards, so dependencies such as SDKs pulled from trunk stop receiving updates there. Capacitor plugins installed from npm use local paths and are not affected directly."}},{"@type":"Question","name":"Can one Capacitor app use SPM for some plugins and CocoaPods for others?","acceptedAnswer":{"@type":"Answer","text":"Not through the Capacitor CLI. The CLI manages plugins with one package manager per iOS project. In an SPM project, plugins without a Package.swift are skipped with a warning. If you depend on a CocoaPods-only plugin, the whole iOS project needs CocoaPods until that plugin adds SPM support."}},{"@type":"Question","name":"How do I switch an existing Capacitor app from SPM back to CocoaPods?","acceptedAnswer":{"@type":"Answer","text":"There is no automatic command. Back up the ios folder, delete it, run bunx cap add ios --packagemanager CocoaPods, then reapply your native changes such as Info.plist keys, entitlements, signing, app icons and extensions."}},{"@type":"Question","name":"Should I run pod install myself?","acceptedAnswer":{"@type":"Answer","text":"Usually not. bunx cap sync ios rewrites the Capacitor section of the Podfile and runs pod install for you, using bundle exec when a Gemfile is present. Run pod commands yourself only for repo updates or targeted pod update calls."}}]}]}</script>
