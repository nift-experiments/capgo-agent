<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/build-and-deploy-ios-apps-with-gitea-actions/#newsarticle","url":"https://capgo.app/blog/build-and-deploy-ios-apps-with-gitea-actions/","headline":"Build and Deploy iOS Apps with Gitea Actions","description":"Build, sign, and upload iOS apps to TestFlight from Gitea Actions: a self-hosted Mac runner with act_runner, or cloud builds from a Linux runner.","image":["https://capgo.app/build_result.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"Gitea Actions can build iOS apps, but only on a Mac you register yourself, because Gitea has no hosted runners and Xcode only runs on macOS. The two practical setups are a Mac running act_runner in host mode, or a normal Linux runner that sends the iOS build to a cloud build service. This guide walks through both for a Capacitor app, with workflow files you can drop into .gitea/workflows/.\nTeams pick Gitea because they want their code on infrastructure they control. That should not change just because the app needs Xcode. Both setups below keep your source on your server.\nHow Gitea Actions runs jobs\nGitea Actions uses a GitHub Actions compatible syntax, and jobs run on act_runner instances that you register against your Gitea server. Each runner advertises labels such as ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest. The part after the colon decides how jobs run:\n\ndocker://image runs the job in a container. This is the default for Linux runners.\nhost runs the job directly on the machine, with whatever is installed there.\n\nmacOS cannot run in a Docker container, so a Mac runner has to use a host label. That has consequences we will get to.\nTwo compatibility notes before you copy a workflow from GitHub:\n\nGitea reads .gitea/workflows/ and falls back to .github/workflows/ when the first folder does not exist.\nuses: actions/checkout@v4 works because Gitea resolves actions from GitHub by default (the DEFAULT_ACTIONS_URL setting). Air-gapped instances need to mirror the actions they use and reference them by full URL.\n\nOption 1: A Mac runner with act_runner\nRegister the Mac\nDownload the act_runner binary for macOS (arm64 for Apple Silicon) from the Gitea releases page, then get a registration token from Site Administration &gt; Actions &gt; Runners (instance-wide), or from the organization or repository settings.\n./act_runner register --no-interactive \\\n  --instance https://gitea.example.com \\\n  --token &lt;registration_token&gt; \\\n  --name mac-mini-01 \\\n  --labels macos-arm64:host\n\n./act_runner daemon\nRun the daemon as a launch agent under a dedicated user so it restarts after reboots and has its own login keychain.\nInstall the toolchain on the host\nHost mode means the job uses the Mac’s own tools. Install:\n\nXcode 26 (required for App Store Connect uploads since April 28, 2026) and run sudo xcodebuild -license accept\nNode.js 22 or newer and Bun (Capacitor 8 requires Node 22)\nRuby and fastlane, or use a Gemfile with bundle exec\nCocoaPods, only if your iOS project still uses it. New Capacitor 8 projects use Swift Package Manager.\n\nThe workflow\n# .gitea/workflows/ios-mac.yaml\nname: iOS release (Mac runner)\n\non:\n  push:\n    tags:\n      - 'v*'\n\njobs:\n  ios:\n    runs-on: macos-arm64\n    env:\n      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}\n      APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}\n      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}\n      APP_STORE_CONNECT_TEAM_ID: ${{ vars.APP_STORE_CONNECT_TEAM_ID }}\n      PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}\n    steps:\n      - uses: actions/checkout@v4\n      - run: bun install --frozen-lockfile\n      - run: bun run build\n      - run: bunx cap sync ios\n      - name: Decode signing files\n        run: |\n          echo \"${{ secrets.IOS_CERTIFICATE_BASE64 }}\" | base64 --decode &gt; dist.p12\n          echo \"${{ secrets.IOS_PROFILE_BASE64 }}\" | base64 --decode &gt; profile.mobileprovision\n      - run: bundle exec fastlane ios beta\n      - name: Clean up\n        if: always()\n        run: rm -f dist.p12 profile.mobileprovision\nThe beta lane imports the certificate into a temporary keychain, switches the project to manual signing, bumps the build number from TestFlight, archives, and uploads. A full Fastfile for a Capacitor project is in Build and deploy iOS apps with Bitbucket Pipelines; it works unchanged on Gitea. For the fastlane background, see the GitHub Actions iOS guide.\nThe cost of host mode\nThe act_runner documentation is direct about this: host jobs are not isolated. In practice:\n\nEvery job shares the same user, disk, and keychain. A job that dies halfway can leave a temporary keychain or a stale provisioning profile that breaks the next one.\nAny workflow that targets the label runs code on that Mac with that user’s access. Only register host runners for repositories you trust, and avoid running them on pull requests from forks.\nDerivedData, archives, and simulator runtimes grow until the disk is full.\nXcode upgrades are on you, and Apple raises the minimum SDK every spring.\nOne Mac builds one job at a time. Release day queues.\n\nIf your team runs Macs already and someone owns them, this works. If not, the next option removes the Mac from your infrastructure.\nOption 2: Build iOS from a Linux runner with Capgo Build\nCapgo Build compiles and signs Capacitor apps on Capgo-managed Macs. Your Gitea job stays on the Linux runner you already have. It checks out the code, builds the web layer, runs cap sync ios, and calls build request. The Capgo CLI uploads the prepared native project, streams the Xcode logs back into the Gitea job log, and exits non-zero on failure.\nThis model fits self-hosted Gitea well:\n\nNo inbound access. Capgo does not clone your repository. Your runner pushes the prepared project out over HTTPS, so a Gitea server behind a firewall or VPN works without changes.\nNo repository token. There is no Git connection to configure on the Capgo side.\nYour web source stays home. Only the native ios/ folder, Capacitor config, and the native parts of plugins are uploaded. src/, .git/, and .env files are not.\n\nOne-time setup\nOn a developer machine:\nbunx @capgo/cli@latest login\nbunx @capgo/cli@latest app add\nbunx @capgo/cli@latest build init --platform ios\nbuild init creates or reuses your distribution certificate and App Store provisioning profile and stores the App Store Connect API key. Run one build locally to confirm everything signs:\nbun run build &amp;&amp; bunx cap sync ios\nbunx @capgo/cli@latest build request com.example.app --platform ios --build-mode release\nThen export the credentials:\nbunx @capgo/cli@latest build credentials manage --appId com.example.app --platform ios\n# select \"Export to .env\"\nAdd secrets to Gitea\nOpen Repository Settings &gt; Actions &gt; Secrets and add each key from the exported file, plus your Capgo API key:\n\n\n\nSecret\nPurpose\n\n\n\n\nCAPGO_TOKEN\nCapgo API key with upload permission\n\n\nBUILD_CERTIFICATE_BASE64\nDistribution certificate (.p12)\n\n\nP12_PASSWORD\nCertificate password\n\n\nCAPGO_IOS_PROVISIONING_MAP_BASE64\nProvisioning profile mapping\n\n\nAPPLE_KEY_ID\nApp Store Connect API key ID\n\n\nAPPLE_ISSUER_ID\nApp Store Connect issuer ID\n\n\nAPPLE_KEY_CONTENT\nBase64 .p8 key\n\n\nAPP_STORE_CONNECT_TEAM_ID\nApple team ID\n\n\n\nGitea rejects secret and variable names that start with GITEA_ or GITHUB_, so keep these names as they are. Put non-secret values such as the app ID under Variables and read them with ${{ vars.NAME }}. Secrets set at the organization level are shared by every repository in it, which is handy when you ship several apps from one Apple team. Delete the exported file when you are done.\nRelease on tag push\n# .gitea/workflows/ios-release.yaml\nname: iOS release\n\non:\n  push:\n    tags:\n      - 'v*'\n\njobs:\n  release-ios:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: oven-sh/setup-bun@v2\n      - run: bun install --frozen-lockfile\n      - run: bun run build\n      - run: bunx cap sync ios\n      - name: Build, sign, and upload to TestFlight\n        env:\n          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}\n          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}\n          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}\n          CAPGO_IOS_PROVISIONING_MAP_BASE64: ${{ secrets.CAPGO_IOS_PROVISIONING_MAP_BASE64 }}\n          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}\n          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}\n          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}\n        run: |\n          bunx @capgo/cli@latest build request ${{ vars.APP_ID }} \\\n            --platform ios \\\n            --build-mode release \\\n            --ios-distribution app_store \\\n            --store-release-name \"${{ gitea.ref_name }}\"\nNotes:\n\n${{ gitea.ref_name }} is the tag name. The github.* context also works as an alias, which helps when you port workflows.\nGitea sets CI=true in every job, so the Capgo CLI never waits for interactive input.\nCapgo increments the build number from the latest TestFlight build, so two tags in a row never collide.\nWithout --submit-to-store-review, the build lands in TestFlight and stops. Add the flag when you want CI to submit for App Review too.\n\nReleasing is now git tag v2.3.0 &amp;&amp; git push origin v2.3.0. Anyone who can push a v* tag can ship, so add a protected tag rule for v* under Settings &gt; Tags and limit it to release managers.\nAd hoc builds for testers\nFor QA builds that install directly on registered devices, build in ad hoc mode and get a download link:\n# .gitea/workflows/ios-adhoc.yaml\nname: iOS ad hoc build\n\non:\n  workflow_dispatch:\n\njobs:\n  adhoc:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: oven-sh/setup-bun@v2\n      - run: bun install --frozen-lockfile &amp;&amp; bun run build\n      - run: bunx cap sync ios\n      - name: Ad hoc build\n        env:\n          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}\n          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}\n          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}\n          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}\n          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}\n          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}\n        run: |\n          echo \"${{ secrets.ADHOC_PROFILE_BASE64 }}\" | base64 --decode &gt; adhoc.mobileprovision\n          bunx @capgo/cli@latest build request ${{ vars.APP_ID }} \\\n            --platform ios \\\n            --ios-distribution ad_hoc \\\n            --ios-provisioning-profile ./adhoc.mobileprovision \\\n            --output-upload --output-retention 3d \\\n            --output-record /tmp/build.json\n          bunx @capgo/cli@latest build last-output --path /tmp/build.json --field outputUrl\nAd hoc builds need an ad hoc provisioning profile that lists the test devices. Store that profile base64-encoded as a secret (ADHOC_PROFILE_BASE64 above), decode it in the job, and pass it with --ios-provisioning-profile. CLI flags take precedence over environment variables, so this overrides the App Store profile for this build only. Collect UDIDs with the iOS UDID finder. For most testers, TestFlight internal testing is simpler, because it does not need UDIDs.\nManual release approval\nGitHub lets you require reviewers on an environment. Gitea Actions does not implement environment protection rules, so a job that names an environment will not pause for approval. Two patterns work instead:\n\nProtected tags. Only release managers can push v* tags, and the tag workflow ships.\nBuild, then promote. Build on every push to main with --ios-distribution ad_hoc or upload to TestFlight internal testing only, then use a workflow_dispatch workflow (available in current Gitea releases) to rebuild the approved commit with --submit-to-store-review.\n\nShip web changes without a new binary\nMost commits to a Capacitor app only change JavaScript, CSS, and HTML. Rebuilding iOS for those wastes minutes and App Review time. With Capgo live updates, one job can pick the right path:\n      - name: Live update or native build\n        env:\n          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}\n          # plus the iOS signing secrets from above\n        run: |\n          if bunx @capgo/cli@latest build needed ${{ vars.APP_ID }} --channel production; then\n            bunx @capgo/cli@latest bundle upload ${{ vars.APP_ID }} --channel production\n          else\n            bunx cap sync ios\n            bunx @capgo/cli@latest build request ${{ vars.APP_ID }} --platform ios --build-mode release\n          fi\nbuild needed exits 0 when native dependencies match what is live on the channel, and 1 when a new binary is required. Also force the native path when files under ios/ or capacitor.config.* change, since those are not part of the dependency comparison. See Auto choose live update or native build.\nMac runner vs cloud build\n\n\n\n\nact_runner on your Mac\nCapgo Build from Linux\n\n\n\n\nHardware\nYou buy and host it\nNone\n\n\nXcode upgrades\nManual, per machine\nHandled by Capgo\n\n\nIsolation between jobs\nNone in host mode\nFresh build environment per job\n\n\nParallel builds\nOne per Mac\nMultiple, from any runner\n\n\nSigning files\nIn Gitea secrets, decoded on the Mac\nIn Gitea secrets, sent per build\n\n\nWorks behind a firewall\nYes\nYes, outbound HTTPS only\n\n\nNative Swift apps (no Capacitor)\nYes\nNo, Capacitor apps only\n\n\nBuild time limit\nYours to set\n10 minutes per build\n\n\n\nTroubleshooting\n\n\n\nSymptom\nFix\n\n\n\n\nJob stays queued forever\nNo online runner has the label in runs-on. Check the runner list and label spelling.\n\n\nuses: actions/checkout@v4 fails to download\nThe runner cannot reach GitHub. Mirror the action on your Gitea and reference it by full URL.\n\n\nSecret value is empty in the job\nThe name starts with GITEA_/GITHUB_, or the secret is defined on another repository.\n\n\nsecurity: SecKeychainItemImport: MAC verification failed\nWrong .p12 password, or a .p12 created by OpenSSL 3 without -legacy. Re-export it.\n\n\nNo profiles for 'com.example.app' were found\nThe profile in secrets does not match the bundle ID or certificate. Re-run build init and re-export.\n\n\nUpload rejected for SDK version\nThe Mac runner still has an Xcode older than 26.\n\n\ncap sync ios warns about CocoaPods on Linux\nExpected. The Capgo build machine installs pods.\n\n\n\nFor more failure modes, see CI/CD for Capacitor: common pitfalls and the Capgo Build troubleshooting guide.\nSummary\nGitea Actions handles iOS fine once you decide where Xcode runs. A host-mode Mac runner gives you full control and full responsibility. A Linux job that calls Capgo Build keeps your Gitea setup unchanged, needs no inbound access, and turns a TestFlight release into a tag push. Whichever you choose, keep signing material in Gitea secrets, protect your release tags, and ship web-only changes as live updates so the native pipeline only runs when it has to.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/build-and-deploy-ios-apps-with-gitea-actions/"},"keywords":"Gitea Actions iOS, Gitea iOS build, act_runner macOS, Gitea TestFlight, Forgejo Actions iOS, Capacitor iOS CI/CD, Capgo Build","articleSection":"CI/CD"},{"@type":"FAQPage","@id":"https://capgo.app/blog/build-and-deploy-ios-apps-with-gitea-actions/#faqpage","url":"https://capgo.app/blog/build-and-deploy-ios-apps-with-gitea-actions/","mainEntity":[{"@type":"Question","name":"Does Gitea Actions have hosted macOS runners?","acceptedAnswer":{"@type":"Answer","text":"No. Gitea Actions runs jobs on runners you register yourself with act_runner. To build iOS you either register a Mac with a host label, or keep the job on a Linux runner and send the build to a cloud service that owns Macs."}},{"@type":"Question","name":"Which folder does Gitea read workflows from?","acceptedAnswer":{"@type":"Answer","text":"Gitea reads .gitea/workflows first. If that folder does not exist, it falls back to .github/workflows, so most GitHub workflow files can be reused with small changes. Forgejo uses .forgejo/workflows with the same fallback idea."}},{"@type":"Question","name":"Does a cloud build need access to my private Gitea server?","acceptedAnswer":{"@type":"Answer","text":"Not with Capgo Build. Your runner checks out the code, builds the web layer, runs cap sync, and uploads the prepared native project. Capgo never pulls from your Gitea instance, so no inbound firewall rule or repository token is needed."}},{"@type":"Question","name":"Can I require approval before an upload to TestFlight?","acceptedAnswer":{"@type":"Answer","text":"Gitea does not implement GitHub's environment protection rules. Split the work instead: build on push without uploading, then run a manually dispatched workflow to ship, and protect version tags so only release managers can push them."}},{"@type":"Question","name":"Does this work for Capacitor apps that use Cordova plugins?","acceptedAnswer":{"@type":"Answer","text":"Yes. Capgo Build compiles the synced Capacitor native project, which includes any Cordova plugins Capacitor installed. Capgo Build's docs cover Capacitor projects, so pure Cordova apps build on a Mac runner with the Cordova CLI, and can still get Capgo live updates through @capgo/cordova-updater."}}]}]}</script>
