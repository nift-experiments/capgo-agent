n":3,"item":{"@type":"WebPage","@id":"https://capgo.app/tools/ios-certificate-generator/","url":"https://capgo.app/tools/ios-certificate-generator/","name":"iOS Certificate Generator"}}]},{"@type":"FAQPage","@id":"https://capgo.app/tools/ios-certificate-generator/#faqpage","url":"https://capgo.app/tools/ios-certificate-generator/","mainEntity":[{"@type":"Question","name":"What does this iOS certificate generator create?","acceptedAnswer":{"@type":"Answer","text":"It creates a Certificate Signing Request (.csr) and the matching RSA 2048-bit private key (.pem). Upload the CSR to Apple Developer to get your Apple Distribution or Apple Development certificate (.cer), then combine the .cer with the private key into a .p12 file for Xcode, fastlane, CI, or Capgo Cloud Build."}},{"@type":"Question","name":"What is a Certificate Signing Request (CSR)?","acceptedAnswer":{"@type":"Answer","text":"A CSR is a small file that contains your public key and identity details (name, email, country), signed with your private key. Apple uses it to issue a signing certificate bound to that key. The private key never goes to Apple, which is why you must keep the .pem file this tool gives you."}},{"@type":"Question","name":"Can I create an iOS distribution certificate without a Mac?","acceptedAnswer":{"@type":"Answer","text":"Yes. Generate the CSR and private key here, upload the CSR in the Apple Developer portal from any browser, download the .cer, and convert it to .p12 with the converter in step 2 of this page. Everything works from Windows, Linux, or macOS, so Keychain Access is not required at any step."}},{"@type":"Question","name":"Which certificate type should I choose in Apple Developer?","acceptedAnswer":{"@type":"Answer","text":"Choose Apple Development to run builds on registered test devices from Xcode. Choose Apple Distribution to sign builds for the App Store, TestFlight, and ad hoc distribution. The same CSR works for either type; the type is selected in Apple Developer, not in this tool."}},{"@type":"Question","name":"Is the private key stored on the server?","acceptedAnswer":{"@type":"Answer","text":"No. In step 1, the CSR and private key are generated on demand by a stateless Capgo endpoint over HTTPS and returned straight to your browser with Cache-Control: no-store; they are never written to a database or kept after the response. Step 2, the .cer to .p12 converter, runs entirely in your browser and uploads nothing. If your policy requires local key generation, use the equivalent OpenSSL command on this page."}},{"@type":"Question","name":"Why do I need to convert the .cer file to .p12?","acceptedAnswer":{"@type":"Answer","text":"The .cer file Apple gives you only contains the public certificate. Signing an app also requires the private key, so build tools expect a .p12 file that bundles the certificate and private key behind a password."}},{"@type":"Question","name":"How do I convert a .cer to .p12?","acceptedAnswer":{"@type":"Answer","text":"Use step 2 on this page: select the .cer from Apple (DER or PEM), select the private key .pem used to create the CSR, enter a password, and select Build .p12 file. The browser checks that the certificate matches the key and builds a 3DES-encrypted .p12 that macOS Keychain, Xcode, and fastlane accept. Nothing is uploaded. You can also copy the .p12 as base64 for CI secrets."}},{"@type":"Question","name":"Do I need an Apple Developer account?","acceptedAnswer":{"@type":"Answer","text":"Yes. Uploading a CSR and issuing signing certificates requires a paid Apple Developer Program membership (99 USD per year, or the Enterprise program for in-house distribution). The CSR itself can be generated without an account."}},{"@type":"Question","name":"How long is an iOS signing certificate valid?","acceptedAnswer":{"@type":"Answer","text":"Apple Development and Apple Distribution certificates are valid for one year. Apps already live on the App Store keep working after the certificate expires or is revoked, but you need a new certificate and provisioning profile to sign the next build."}},{"@type":"Question","name":"Can I reuse the same CSR or private key?","acceptedAnswer":{"@type":"Answer","text":"You can, but a fresh key pair per certificate is safer and easier to rotate. What you must not do is mix them: a .cer only works with the exact private key that created its CSR. If the key is lost, revoke the certificate and generate a new CSR."}},{"@type":"Question","name":"Can I use this CSR for push notification (APNs) certificates?","acceptedAnswer":{"@type":"Answer","text":"Yes. Apple asks for a CSR when you create an APNs SSL certificate too. For new apps, an APNs authentication key (.p8) is usually simpler because it never expires and works for all your apps."}}]},{"@type":"HowTo","@id":"https://capgo.app/tools/ios-certificate-generator/#howto","name":"How to create an iOS distribution certificate without a Mac","description":"Generate a CSR and private key, issue an Apple certificate, and convert it to a .p12 file for Xcode, fastlane, CI, or cloud builds.","step":[{"@type":"HowToStep","position":1,"name":"Generate the CSR and private key","text":"Enter your name, email, and two-letter country code in the form above and select Generate CSR and private key. Download both files and keep the private key safe.","url":"https://capgo.app/tools/ios-certificate-generator/#step-1"},{"@type":"HowToStep","position":2,"name":"Create the certificate in Apple Developer","text":"Sign in to developer.apple.com, open Certificates, Identifiers & Profiles, select the plus button, and choose Apple Distribution or Apple Development.","url":"https://capgo.app/tools/ios-certificate-generator/#step-2"},{"@type":"HowToStep","position":3,"name":"Upload the CSR and download the .cer","text":"Upload the ios-certificate-request.csr file, continue, and download the issued certificate, usually named distribution.cer or development.cer.","url":"https://capgo.app/tools/ios-certificate-generator/#step-3"},{"@type":"HowToStep","position":4,"name":"Convert the .cer to a .p12 file","text":"Use the .cer to .p12 converter in step 2 of this page: select the .cer and the private key, set a password, and download the .p12. It runs in your browser, or use the OpenSSL command instead.","url":"https://capgo.app/tools/ios-certificate-generator/#step-4"},{"@type":"HowToStep","position":5,"name":"Create a provisioning profile","text":"In Apple Developer, create an App Store, ad hoc, or development provisioning profile for your App ID and select the new certificate.","url":"https://capgo.app/tools/ios-certificate-generator/#step-5"},{"@type":"HowToStep","position":6,"name":"Sign and ship your app","text":"Import the .p12 and profile into Xcode, fastlane, your CI secrets, or Capgo Cloud Build, then build and upload your app to TestFlight or the App Store.","url":"https://capgo.app/tools/ios-certificate-generator/#step-6"}],"totalTime":"PT10M","tool":[{"@type":"HowToTool","name":"Web browser"},{"@type":"HowToTool","name":"Apple Developer account"},{"@type":"HowToTool","name":"OpenSSL"}]},{"@type":"WebPage","@id":"https://capgo.app/tools/ios-certificate-generator/#webpage","name":"iOS Certificate Generator: CSR and .p12 Without a Mac","description":"Free iOS certificate generator. Create an Apple CSR and private key, then convert the .cer to .p12 in your browser. No Mac or Keychain Access needed.","url":"https://capgo.app/tools/ios-certificate-generator/"}]}</script>
