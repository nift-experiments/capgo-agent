<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/automatic-capacitor-ios-build-codemagic/#newsarticle","url":"https://capgo.app/blog/automatic-capacitor-ios-build-codemagic/","headline":"Automatic Capacitor IOS build with Codemagic","description":"How to set up a CI/CD pipeline for your IOS Ionic app using Codemagic and Codemagic in 5 mins (2024)","image":["https://capgo.app/Codemagic_ios.webp"],"datePublished":"2024-07-24T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Continuous Delivery for iOS using Codemagic\nPrerequisites\nBefore continuing with the tutorial…\n\niOS developer program membership.\nDesire to read 😆…\n\nImportant about the price\n\nhttps://codemagic.io/pricing/\nThe service is ‘free’ up to 500 macOS M1 minutes / month, depending on the chosen machine.\nWe are going to use a macOS M1 machine, you can see in the screenshot its price and limits (prices as of the creation of the tutorial, they could undergo changes in the future)\n🔴 Once warned of requirements and prices, if you like, we continue…\n\n📣 In the post we assume that we have the app created in iTunes connect, we do have the certificates of the Apple ecosystem, everything will be setup by Codemagic!\n\nLet’s dive in 🤿\nSteps to follow in the post\n\nUsing App Store Connect API with Codemagic\nRequirements\nCreating an App Store Connect API Key\nUsing an App Store Connect API Key\nCopy Fastlane files\nConfigure Codemagic\n\n1. Using App Store Connect API with Codemagic\n\nStarting February 2021, two-factor authentication or two-step verification is required for all users to sign in to App Store Connect. This extra layer of security for your Apple ID helps ensure that you’re the only person who can access your account.\nFrom Apple Support\n\n\nGetting started with match requires you to revoke your existing certificates. But no worry, you will have the new one directly.\n\nRequirements\nTo be able to use App Store Connect API, Codemagic needs three things.\n\nIssuer ID.\nKey ID.\nKey file or Key content.\n\nCreating an App Store Connect API Key\nTo generate keys, you must have Admin permission in App Store Connect. If you don’t have that permission, you can direct the relevant person to this article and follow the following instructions.\n1 — Log in to App Store Connect.\n2 — Select Users and Access.\n\n3 — Select the API Keys tab.\n\n4 — Click Generate API Key or the Add (+) button.\n\n5 —  Enter the name for the key and select an access level. We recommend choosing App Manager access rights, read more about Apple Developer Program role permissions here\n\n6 — Click Generate.\n\nAn API key’s access cannot be limited to specific apps.\n\nThe new key’s name, key ID, a download link, and other information appear on the page.\n\nGrab all three necessary information here:\n&lt;1&gt; Issue ID.\n&lt;2&gt; Key ID.\n&lt;3&gt; Click “Download API Key” to download your API private key. The download link appears only if the private key has not yet been downloaded. Apple does not keep a copy of the private key. So, you can download it only once.\n\n🔴 Store your private key in a safe place. You should never share your keys, store keys in a code repository, or include keys in client-side code.\n\nAdding the App Store Connect API key to Codemagic\n\n\nOpen your Codemagic Team settings,\n\n\nSelect code signing identities\n\nAnd the upload the certificate\n\n\n\nClick the Add key button.\n\n\nEnter the App Store Connect API key name. This is a human readable name for the key that will be used to refer to the key later in application settings.\n\n\nEnter the Issuer ID and Key ID values.\n\n\nClick on Choose a .p8 file or drag the file to upload the App Store Connect API key downloaded earlier.\n\n\nClick Save.\n\n\nNow we can manage Codemagic with the App Store Connect API key, great!\n2. Create certificates and provisioning profiles\nCertificates\nOpen XCode and go to Settings &gt; Accounts &gt; Apple ID &gt; Teams and select your team.\n\nClick on Manage certificates &gt; + and select Apple Distribution.\n\nThen you can create a new certificate.\nThen you need to go to keychain to download the certificate as a .p12 file.\nTo do so, you need to go to keychain switch to the login keychain and then the tab My Certificates.\n\nThen you can select the certificate you want to download. (Look by the date of the certificate)\nAnd then right-click on the certificate and select Export.\nChoose the file format Personal Information Exchange (.p12).\nThat will download the certificate as a .p12 file.\nProvisioning profiles\nOpen Apple Developer and select the right team.\nThen create a new profile, by clicking on +\n\nAnd select App Store Connect.\n\nThen you need to select the right app, be careful you cannot use wildcard otherwise signing will fail.\n\nSelect the right certificate you created before (look for the date of expiration it should same day and month as today) and click on Continue.\n\nFinally enter the name of the profile and click on Generate.\n\nThe name will be used to identify the profile in Codemagic.\n\n\nYou can download the profile as a .mobileprovision file.\n\nAdding the Code signing certificate\nCodemagic lets you upload code signing certificates as PKCS#12 archives containing both the certificate and the private key which is needed to use it. When uploading, Codemagic will ask you to provide the certificate password (if the certificate is password-protected) along with a unique Reference name, which can then be used in the codemagic.yaml configuration to fetch the specific file.\n\nUpload certificate\nGenerate new certificate\nFetch from Developer Portal\n\n\nOpen your Codemagic Team settings, go to codemagic.yaml settings &gt; Code signing identities.\nOpen iOS certificates tab.\nUpload the certificate file by clicking on Choose a .p12 or .pem file or by dragging it into the indicated frame.\nEnter the Certificate password and choose a Reference name.\nClick Add certificate\n\nAdding the provisioning profile\nCodemagic allows you to upload a provisioning profile to be used for the application or to fetch a profile from the Apple Developer Portal.\nThe profile’s type, team, bundle id, and expiration date are displayed for each profile added to Code signing identities. Furthermore, Codemagic will let you know whether a matching code signing certificate is available in Code signing identities (a green checkmark in the Certificate field) or not.\n3. Setup Codemagic\nConfigure Codemagic secrets\nEver wonder where the values of the ENV are coming from? Well, it’s not a secret anymore – it’s from your project’s secret. 🤦\n4. Configure Codemagic workflow file\nCreate a file named codemagic.yml at the root of your project and add the following.\nworkflows:\n  ionic-capacitor-ios-workflow:\n    name: Capacitor iOS Workflow\n    max_build_duration: 120\n    instance_type: mac_mini_m1\n    integrations:\n      app_store_connect: CodeMagic\n    environment:\n      ios_signing:\n        distribution_type: app_store\n        bundle_identifier: YOUR_BUNDLE_IDENTIFIER\n      vars:\n        XCODE_WORKSPACE: ios/App/App.xcworkspace\n        XCODE_SCHEME: App\n        APP_STORE_APP_ID: YOUR_APP_STORE_APP_ID\n      node: v20.14.0\n      xcode: 15.4\n      cocoapods: default\n    triggering:\n      events:\n        - tag\n      tag_patterns:\n        - pattern: '*'\n          include: true\n    scripts:\n      - name: Install dependencies\n        script: |\n          npm install\n      - name: Cocoapods installation\n        script: |\n          cd ios/App &amp;&amp; pod install\n      - name: Update dependencies and copy web assets to native project\n        script: |\n          npm run build\n          npx cap sync ios\n      - name: Set up code signing settings on Xcode project\n        script: |\n          xcode-project use-profiles\n      - name: Increment build number\n        script: |\n          cd $CM_BUILD_DIR/ios/App\n          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number \"$APP_ID\")\n          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))\n      - name: Build ipa for distribution\n        script: |\n          xcode-project build-ipa \\\n            --workspace \"$XCODE_WORKSPACE\" \\\n            --scheme \"$XCODE_SCHEME\"\n    artifacts:\n      - build/ios/ipa/*.ipa\n      - /tmp/xcodebuild_logs/*.log\n      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app\n      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM\n    publishing:\n      email:\n        recipients:\n          - YOUR_EMAIL\n        notify:\n          success: true # To not receive a notification when a build succeeds\n          failure: false # To not receive a notification when a build fails\n      app_store_connect:\n        auth: integration\n        # Configuration related to TestFlight (optional)\n        # Note: This action is performed during post-processing.\n        submit_to_testflight: true\n        # Configuration related to App Store (optional)\n        # Note: This action is performed during post-processing.\n        submit_to_app_store: false\nThis workflow should be triggered manually or after each GitHub tag, if you need to automatize tag please, refer to Automatic build and release with GitHub actions first.\nThen this workflow will pull your NodeJS deps, install them and build your JavaScript app.\n\nEach time you send a new tag, a release will be built in TestFlight.\n\nYour App doesn’t need to use Ionic, only Capacitor base is mandatory, it can have old Cordova module, but Capacitor JS plugin should be preferred.\n5. Trigger workflow\nTrigger the workflow\nPush the new commits to the branch main or development to trigger the workflow.\n\nAfter a few minutes, the build should be available in your App Store Connect dashboard.\n\nStart manually\nYou can start the workflow manually.\nFirst select the app you want to build, then click on Start new build.\n\nThen select the branch you want to build.\n\nAnd click on Start new build.\nThen go you the build list\n\nAnd click on the build to see the result.\n\nCan deploy from local machine\nYes, you can, and it is effortless.\nYou can use Xcode to build and sign your app, as always.\nThanks\nThis blog is based on the following articles:\n\nContinuous delivery for IOS using Codemagic and GitHub actions\nCodemagic Documentation\nThis GitHub message from @mrogunlana\n\nKeep going from Automatic Capacitor IOS build with Codemagic\nIf you are using Automatic Capacitor IOS build with Codemagic to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/automatic-capacitor-ios-build-codemagic/"},"keywords":"Codemagic, CI/CD, iOS, automatic build, automatic release, mobile app updates","articleSection":"CI/CD"}</script>
