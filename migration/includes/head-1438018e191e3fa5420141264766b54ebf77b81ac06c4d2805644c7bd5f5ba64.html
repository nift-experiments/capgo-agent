<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/ios-certificates-and-provisioning-profiles-explained/#newsarticle","url":"https://capgo.app/blog/ios-certificates-and-provisioning-profiles-explained/","headline":"iOS Certificates and Provisioning Profiles Explained","description":"iOS certificates and provisioning profiles explained: certificate and profile types, how they fit together, .p12 files, UDIDs, expiry and signing errors.","image":["https://capgo.app/certificates.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"iOS code signing uses two pieces. A certificate proves who built the app, and a provisioning profile says which app it is, which devices may run it and which capabilities it can use. Xcode refuses to build for a device, and App Store Connect refuses uploads, unless the certificate, its private key and a matching profile all line up.\nThis guide explains every piece, which combination you need for development, ad hoc, TestFlight, App Store and enterprise builds, how to create them with or without a Mac, and how to fix the errors you will hit.\nWhy Apple requires code signing\nApple only lets iPhones run code that Apple can trace back to a known developer. Signing gives Apple three guarantees:\n\nIdentity: the binary was signed by a member of a specific Apple Developer team.\nIntegrity: nobody modified the binary after signing. Changing one byte breaks the signature.\nAuthorization: the app is allowed on this device, with these entitlements (push, iCloud, Sign in with Apple, App Groups and so on).\n\nCertificates provide the first two. Provisioning profiles provide the third.\nThe building blocks\n\n\n\nPiece\nWhat it is\nFile\nWho owns it\n\n\n\n\nPrivate key\nSecret half of a key pair, generated on your machine\ninside Keychain or .key / .pem\nYou. Apple never sees it\n\n\nCSR\nCertificate Signing Request containing your public key\n.certSigningRequest / .csr\nTemporary\n\n\nCertificate\nApple-signed public key tied to your team\n.cer\nApple issues, you download\n\n\nSigning identity\nCertificate + private key together\n.p12 when exported\nYou\n\n\nApp ID\nYour bundle identifier plus enabled capabilities\nDeveloper portal record\nTeam\n\n\nDevice\nA registered iPhone or iPad UDID\nDeveloper portal record\nTeam\n\n\nProvisioning profile\nBundle of App ID, allowed certificates, devices, entitlements\n.mobileprovision\nTeam\n\n\n\nThe most common confusion: a .cer file is useless on its own. Signing needs the private key that created the CSR. If you lose that key, you create a new certificate.\nCertificate types\nApple Development\nUsed to run builds on your own devices from Xcode during development. Development certificates belong to an individual developer, and Apple labels them with the computer name. Each developer on the team can have their own.\nApple Distribution\nUsed to sign builds for Ad Hoc distribution, TestFlight and the App Store. Distribution certificates belong to the team, and only the Account Holder or Admin roles can create them. Apple limits how many a team can hold, so share one through a secure store rather than letting every developer create their own.\nYou may still see iOS Development and iOS Distribution in older accounts. Those are the pre-Xcode 11 types. Apple Development and Apple Distribution replace them and work across iOS, iPadOS, macOS, tvOS, watchOS and visionOS.\nOther certificate types you may meet\n\nDeveloper ID Application / Installer: for Mac apps distributed outside the Mac App Store. Not used for iOS.\nApple Push Notification service SSL: legacy push certificates. Prefer an APNs Auth Key (.p8), which does not expire yearly and works for every app in the team. See our APNs certificates guide.\nApple Pay Merchant Identity, Pass Type ID, Website Push ID: specific services.\n\nProvisioning profile types\n\n\n\nProfile type\nCertificate\nDevices\nUsed for\n\n\n\n\niOS App Development\nApple Development\nRegistered devices only\nRunning from Xcode, debugging\n\n\nAd Hoc\nApple Distribution\nRegistered devices only (up to 100 per device family per membership year)\nInstalling release builds on testers’ devices via a link or file\n\n\nApp Store Connect\nApple Distribution\nAny device, through Apple\nTestFlight and App Store\n\n\nIn-House\nEnterprise distribution certificate\nAny device in the organization\nApple Developer Enterprise Program only\n\n\n\nA profile is tied to one App ID. If your app has extensions (a widget, a notification service extension, a share extension), each target has its own bundle ID and needs its own profile.\nHow the pieces fit together\nWhen Xcode or a build service signs your Capacitor app it checks:\n\nThe bundle ID in your target (for example com.example.app) matches the App ID in the profile.\nThe certificate used to sign is one of the certificates listed in the profile.\nThe private key for that certificate is available in the keychain.\nFor development and ad hoc builds, the device’s UDID is in the profile.\nThe entitlements file (push, associated domains, App Groups) is a subset of what the App ID and profile allow.\n\nIf any check fails you get a signing error, not a runtime crash, which is good: you find out before shipping.\nWhich combination do I need?\n\n\n\nGoal\nCertificate\nProfile\nDevice registration\n\n\n\n\nRun on my own iPhone from Xcode\nApple Development\niOS App Development\nYes\n\n\nSend a build to a few testers without TestFlight\nApple Distribution\nAd Hoc\nYes, every tester’s UDID\n\n\nBeta test with TestFlight\nApple Distribution\nApp Store Connect\nNo\n\n\nRelease on the App Store\nApple Distribution\nApp Store Connect\nNo\n\n\nInternal employee app, no App Store\nEnterprise\nIn-House\nNo\n\n\n\nTestFlight uses the same signing as the App Store. There is no separate TestFlight profile. You upload one build and decide in App Store Connect whether it goes to testers, to review, or both.\nCreating certificates and profiles\nOption 1: let Xcode manage signing\nFor local development this is the easiest. Open ios/App/App.xcworkspace (or the .xcodeproj when your Capacitor 8 project uses Swift Package Manager), select the App target, open Signing &amp; Capabilities, tick Automatically manage signing and pick your team. Xcode creates the development certificate, registers the connected device and generates profiles for you.\nAutomatic signing becomes painful in CI, because the build machine needs access to the team account and creates certificates on its own. Most teams switch to manual signing, or to a build service with API-key-based signing, for release builds.\nOption 2: create them manually on a Mac\n\nOpen Keychain Access &gt; Certificate Assistant &gt; Request a Certificate From a Certificate Authority. Enter your email, choose Saved to disk. This creates the private key in your keychain and a .certSigningRequest file.\nIn the Apple Developer portal go to Certificates, Identifiers &amp; Profiles &gt; Certificates &gt; +, choose Apple Distribution (or Apple Development) and upload the CSR.\nDownload the .cer and double-click it. Keychain Access pairs it with the private key.\nTo export for CI: in Keychain Access, under My Certificates, right-click the certificate, choose Export, save as .p12 with a strong password.\n\nOption 3: create them without a Mac\nYou can do the whole flow with OpenSSL on Linux or Windows:\n# 1. Private key and CSR\nopenssl genrsa -out ios_distribution.key 2048\nopenssl req -new -key ios_distribution.key -out ios_distribution.csr \\\n  -subj \"/emailAddress=you@example.com/CN=Example Inc/C=US\"\n\n# 2. Upload ios_distribution.csr in the Apple Developer portal,\n#    download the certificate as distribution.cer\n\n# 3. Convert the .cer (DER) to PEM\nopenssl x509 -in distribution.cer -inform DER -out distribution.pem -outform PEM\n\n# 4. Build the .p12 (signing identity)\nopenssl pkcs12 -export -inkey ios_distribution.key -in distribution.pem \\\n  -out ios_distribution.p12 -legacy\nThe -legacy flag matters with OpenSSL 3: without it, the .p12 uses encryption algorithms that macOS keychain tools reject with an “invalid password” error even when the password is correct.\nIf you prefer not to install OpenSSL, the iOS certificate generator creates the CSR and private key for you. They come from a stateless Capgo endpoint that does not store them, and only its .cer to .p12 converter runs fully in your browser. If your policy requires the key to be generated on your machine, use the OpenSSL commands above.\nCreating the profile\n\nIdentifiers &gt; +: register an App ID with your exact bundle ID and enable the capabilities you use (Push Notifications, Sign in with Apple, Associated Domains…).\nDevices &gt; +: for development and ad hoc profiles, register each tester’s UDID. Testers can get it on the phone itself with the iOS UDID finder, no Mac or cable needed.\nProfiles &gt; +: choose the profile type, the App ID, the certificate(s) and the devices. Name it clearly, for example com.example.app AppStore 2026.\nDownload the .mobileprovision file.\n\nIf you add a device or a capability later, you must regenerate and redownload the profile. Existing profiles do not update themselves.\nInspecting a profile\nA .mobileprovision file is a signed plist. On macOS you can read it:\nsecurity cms -D -i App_Store.mobileprovision &gt; profile.plist\n/usr/libexec/PlistBuddy -c \"Print :Name\" profile.plist\n/usr/libexec/PlistBuddy -c \"Print :ExpirationDate\" profile.plist\n/usr/libexec/PlistBuddy -c \"Print :Entitlements\" profile.plist\n/usr/libexec/PlistBuddy -c \"Print :ProvisionedDevices\" profile.plist\nOn Linux, openssl smime -inform der -verify -noverify -in App_Store.mobileprovision prints the plist.\nTo check what a built .ipa was signed with:\nunzip -q App.ipa -d ipa\ncodesign -dvv ipa/Payload/App.app\ncodesign -d --entitlements :- ipa/Payload/App.app\nExpiry and renewal\n\nCertificates are valid for one year from creation.\nProvisioning profiles expire after one year, or earlier if the certificate they include expires or is revoked.\nApp Store apps keep working after the distribution certificate expires. Apple re-signs App Store downloads. You only need a new certificate to upload new builds.\nAd Hoc and development builds stop launching once their profile expires. Testers see the app crash on launch.\nTestFlight builds expire 90 days after upload, independent of the certificate.\nEnterprise apps stop working on every device when the enterprise certificate expires or is revoked. Renew before expiry.\nDevice slots reset once per membership year. Removing a device does not free its slot until the next membership year starts.\n\nPut the certificate expiry date in a shared calendar. Our certificate management guide covers monitoring and rotation in more depth.\nCommon errors and fixes\n“No signing certificate ‘iOS Distribution’ found” or “Signing certificate is invalid”: the private key is not in this keychain. Import the .p12, or create a new certificate if nobody has the key.\n“Provisioning profile doesn’t include signing certificate”: the profile was created with a different certificate. Edit the profile in the portal, tick the current certificate, regenerate and download.\n“Provisioning profile doesn’t include the currently selected device”: register the UDID, then regenerate the profile. Not needed for TestFlight or App Store.\n“Provisioning profile doesn’t support the Push Notifications capability”: enable the capability on the App ID, then regenerate the profile. Profiles are snapshots.\n“A valid provisioning profile for this executable was not found” on install: the device is not in the ad hoc profile, or the profile expired.\nApp installs then closes immediately: on iOS 16 and later, development and ad hoc builds require Developer Mode on the device. See how to enable Developer Mode on iOS.\nExtensions fail to sign: each extension target needs its own App ID and profile. Check every target in Signing &amp; Capabilities, not just App.\n“Invalid password” when importing a .p12 made on Linux: rebuild it with openssl pkcs12 -export ... -legacy.\nUpload rejected for SDK version: since April 2026 App Store Connect requires builds made with Xcode 26 and the iOS 26 SDK. Update Xcode or your CI image. Capacitor 8 already requires Xcode 26.\nGood practices for teams\n\nOne Apple Distribution certificate per team, stored as a .p12 in a password manager or secrets store, with the password stored separately.\nNever email .p12 files or commit them to git.\nUse App Store Connect API keys (.p8) for uploads instead of Apple ID passwords.\nName profiles with bundle ID, type and year.\nRevoke certificates of people who leave the team.\nKeep a written list of every bundle ID, extension and capability the app uses.\n\nCloud signing for Capacitor apps\nYou do not need a Mac on every developer’s desk to ship iOS builds. Capgo Build builds Capacitor apps on Capgo’s macOS machines using a .p12 and profile you provide. Credentials are used only for the build and not stored on Capgo servers. Save them once from the CLI:\nbunx @capgo/cli@latest build credentials save --appId com.example.app --platform ios\nbunx @capgo/cli@latest build request com.example.app --platform ios --path .\nThe Capgo Build iOS docs list the exact credential options, including App Store Connect API keys for TestFlight upload and ad_hoc mode for tester builds.\nOnce your first build is in TestFlight, you can ship JavaScript and asset changes to users with Capgo live updates without re-signing a new binary for every fix. Native code changes and new capabilities still require a signed build through the store.\nNext steps\n\nNeed accounts first? How to create Apple and Google Play developer accounts.\nReady to hand builds to testers? How to distribute iOS and Android apps to testers.\nSubmitting? Read our iOS app submission guide.\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/ios-certificates-and-provisioning-profiles-explained/"},"keywords":"ios certificates, provisioning profiles, ios code signing, apple distribution certificate, apple development certificate, ad hoc provisioning profile, p12 certificate, create ios certificate without mac, udid","articleSection":"iOS"},{"@type":"FAQPage","@id":"https://capgo.app/blog/ios-certificates-and-provisioning-profiles-explained/#faqpage","url":"https://capgo.app/blog/ios-certificates-and-provisioning-profiles-explained/","mainEntity":[{"@type":"Question","name":"What is the difference between a certificate and a provisioning profile?","acceptedAnswer":{"@type":"Answer","text":"A certificate proves who signed the app; it pairs a public key Apple issued with a private key you keep. A provisioning profile says what the signed app is allowed to do: which App ID it is, which certificates may sign it, which devices can run it, and which entitlements it has. Every iOS build needs both."}},{"@type":"Question","name":"Can I create an iOS certificate without a Mac?","acceptedAnswer":{"@type":"Answer","text":"Yes. Generate a certificate signing request (CSR) and private key with OpenSSL or a browser tool such as the Capgo iOS certificate generator, upload the CSR in the Apple Developer portal, download the .cer, and combine it with the private key into a .p12 using OpenSSL."}},{"@type":"Question","name":"Why does TestFlight need an App Store profile and not Ad Hoc?","acceptedAnswer":{"@type":"Answer","text":"TestFlight builds go through App Store Connect, which only accepts builds signed with an Apple Distribution certificate and an App Store Connect provisioning profile. Ad Hoc profiles are for installing directly on registered devices outside of Apple's distribution."}},{"@type":"Question","name":"What happens when my distribution certificate expires?","acceptedAnswer":{"@type":"Answer","text":"Apps already live on the App Store keep working. You just cannot sign new builds with it, so create a new certificate and regenerate profiles. Ad Hoc and development builds stop launching when their provisioning profile expires."}},{"@type":"Question","name":"I moved to a new Mac and Xcode says the signing identity is missing. Why?","acceptedAnswer":{"@type":"Answer","text":"The private key for your certificate stayed in the old Mac's keychain. Export the identity as a .p12 from Keychain Access on the old Mac and import it on the new one, or revoke the certificate and create a new one."}}]}]}</script>
