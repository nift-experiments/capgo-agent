<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/automatic-capacitor-ios-build-github-action/#newsarticle","url":"https://capgo.app/blog/automatic-capacitor-ios-build-github-action/","headline":"Automatic Capacitor IOS build with GitHub actions with certificate","description":"How to set up a CI/CD pipeline for your IOS Ionic app using fastlane and GitHub Actions in 5 mins (2024)","image":["https://capgo.app/fastlane_ios.webp"],"datePublished":"2024-08-04T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Setting up CI/CD for Capacitor apps can be complex and time-consuming. Here’s what you need to know:\nRecommended for New Builds: Use Capgo Build\n\nWe now recommend using Capgo Build with the Capgo CLI for native Capacitor builds.\nThis Fastlane guide is kept for teams maintaining existing GitHub Actions pipelines, but new iOS builds should use the Capgo CLI so you do not have to maintain Fastlane, Xcode runners, certificates, and upload scripts yourself.\n\nCapgo Build for CI/CD by Capgo\nSkip the Fastlane, Xcode runner, certificate, provisioning profile, and upload-script maintenance. Capgo Build runs signed native iOS builds from your existing CI/CD pipeline:\n\nWorks with your pipeline: Trigger Capgo Build from GitHub Actions, GitLab CI, Jenkins, or local scripts after your web build and npx cap sync.\nSigning from CI secrets: Keep App Store Connect keys, certificates, provisioning profiles, passwords, and team IDs in your own CI secrets.\nNo native runner upkeep: Capgo Build provides maintained Apple build environments, so you do not have to manage macOS runners, Xcode images, or Fastlane lanes.\nArtifacts and submission: Download signed artifacts for QA or submit release builds through the Capgo CLI.\n\nPricing\n\nCapgo plans start at $12/month\nIncludes OTA updates and about 15 native builds per month\nExtra build minutes are billed by minute through credits\n\nSet up Capgo Build in CI/CD\nManual Setup Guide\nHere’s what you need to do:\nContinuous Delivery for iOS using Fastlane and GitHub Actions and certificate\nPrerequisites\nBefore continuing with the tutorial:\n\nMake sure you have Fastlane installed on your development machine.\nEnsure that you are part of iOS developer program membership.\n\nImportant information about the price\n\nhttps://github.com/features/actions\nThe service is ‘free’ up to the limit, depending on the chosen machine.\nWe are going to use a macOS machine, you can see in the screenshot its price and limits (prices as of the creation of the tutorial, they could undergo changes in the future)\nOnce warned of requirements and prices, let’s continue.\n\nNote: In the post I assume that you have the app created in App Store Connect. The important information will be copied by Fastlane!\n\nWhat will you learn in the tutorial\nSteps to follow in the post\n\nUsing App Store Connect API with Fastlane\n\nRequirements:\n\nCreating an App Store Connect API Key\nUsing an App Store Connect API Key\n\n\n\n\nCopy Fastlane files\nConfigure GitHub Actions\n\n1. Using App Store Connect API with Fastlane\n\nStarting February 2021, two-factor authentication or two-step verification is required for all users to sign in to App Store Connect. This extra layer of security for your Apple ID helps ensure that you’re the only person who can access your account.\nFrom Apple Support\n\nRequirements\nIn order for Fastlane to be able to use App Store Connect API to upload your app, you need to provide the following three things:\n\nIssuer ID\nKey ID\nKey file or Key content\n\nObtaining an App Store Connect API Key\nTo generate keys, you must have Admin permission in App Store Connect. If you don’t have that permission, you can direct the relevant person to this article.\n\n\nLog in to App Store Connect.\n\n\nSelect Users and Access.\n\n\n\n3 — Select the Integration tab.\n\n\nClick Generate API Key or the Add (+) button.\n\n\n\nEnter a name for the key. The name is for your reference only and is not part of the key itself.\n\n\n6 — Under Access, select the role for the key. The roles that apply to keys are the same roles that apply to users on your team. See role permissions. We recommend to select App manager.\n\nClick Generate.\n\n\nAn API key’s access cannot be limited to specific apps.\n\nThe new key’s name, key ID, a download link, and other information appear on the page.\n\nYou can grab all three necessary information here.\n&lt;1&gt; Issue ID. (APPLE_ISSUER_ID secret)\n&lt;2&gt; Key ID. (APPLE_KEY_ID secret)\n&lt;3&gt; Click “Download API Key” to download your API private key. The download link appears only if the private key has not yet been downloaded. Apple does not keep a copy of the private key. So, you can download it only once.\n\n🔴 Store your private key in a safe place. You should never share your keys, store keys in a code repository, or include keys in client-side code.\n\nUsing an App Store Connect API Key\nThe API Key file (p8 file that you download), the key ID, and the issuer ID are required in order to create the JWT token for authorization. There are multiple ways that this information can be passed into Fastlane. I chose to use the Fastlane’s new action app_store_connect_api_key. You can learn other ways in Fastlane documentation. I show this method because I think it is the easiest way to work with most CI out there, where you can set environment variables.\nPlease convert the p8 file that you download to Base64 and store it as a secret (APPLE_KEY_CONTENT).\nbase64 -i APPLE_KEY_CONTENT.p8 | pbcopy\nNow we can manage the App Store Connect with Fastlane using the API key, great!\n2. Certificates\nOpen XCode and go to Settings &gt; Accounts &gt; Apple ID &gt; Teams and select your team.\n\nClick on Manage certificates.\nIf you haven’t already created a certificate, you can create a new certificate.\nClick on + and select Apple Distribution\n\nThen you need to go to keychain to download the certificate as a .p12 file.\nTo do so, you need to go to keychain switch to the login keychain and then the tab My Certificates.\n\nThen you can select the certificate you want to download. (Look by the date of the certificate)\nAnd then right-click on the private key on the certificate and select Export.\nChoose the file format Personal Information Exchange (.p12).\nThat will download the certificate as a .p12 file.\nPlease open the file in a terminal and use the following command to convert it to Base64:\nbase64 -i BUILD_CERTIFICATE.p12 | pbcopy\nThis will become your BUILD_CERTIFICATE_BASE64 secret. Also, when asked, please provide the password of the certificate. This password will be your P12_PASSWORD secret.\n3. Provisioning profiles\nOpen Apple Developer and select the right team.\nThen create a new profile, by clicking on +\n\nAnd select App Store Connect.\n\nThen you need to select the right app, be careful you cannot use wildcard otherwise signing will fail.\n\nSelect the right certificate you created before (look for the date of expiration it should same day and month as today) and click on Continue.\n\nFinally enter the name of the profile and click on Generate.\n\nThe name will be used to identify the profile in Fastlane, under the value of APPLE_PROFILE_NAME.\n\n\nYou can download the profile as a .mobileprovision file.\n\nPlease convert the profile to Base64 and store it as a secret (BUILD_PROVISION_PROFILE_BASE64).\nbase64 -i BUILD_PROVISION_PROFILE.mobileprovision | pbcopy\n4. Copy Fastlane files\nFastlane is a Ruby library created to automate common mobile development tasks. Using Fastlane, you can configure custom “lanes” which bundle a series of “actions” that perform tasks that you’d normally perform using Android studio. You can do a lot with Fastlane, but for the purposes of this tutorial, we’ll be using only a handful of core actions.\nCreate the Fastlane folder at the root of your Capacitor/Ionic project and add the Fastfile there:\n\nFolder: &lt;project-root&gt;/fastlane/\nFile: &lt;project-root&gt;/fastlane/Fastfile\n\nThis is the same level as package.json, capacitor.config.*, and the ios/ folder. Do not create it inside ios/App/.\nplatform :ios do\n  desc 'Export ipa and submit to TestFlight'\n  lane :beta do\n    keychain_info = { keychain_name: \"ios-build-#{Time.now.to_i}.keychain\", keychain_password: SecureRandom.uuid }\n    \n    begin\n      setup_signing(keychain_info)\n      bump_build_number\n      build_app_with_signing(keychain_info)\n      submit_to_testflight\n    ensure\n      cleanup_keychain(keychain_info)\n    end\n  end\n\n  private_lane :setup_signing do |options|\n    create_keychain(\n      name: options[:keychain_name],\n      password: options[:keychain_password],\n      unlock: true,\n      timeout: 0,\n      lock_when_sleeps: false, \n      add_to_search_list: true\n    )\n    import_cert(options)\n    install_profile\n    update_project_settings\n  end\n\n  lane :bump_build_number do\n\t\tfile = File.read('../package.json')\n\t\tdata_hash = JSON.parse(file)\n\t\tapi_key = app_store_connect_api_key(\n      key_id: ENV['APPLE_KEY_ID'],\n      issuer_id: ENV['APPLE_ISSUER_ID'],\n      key_content: ENV['APPLE_KEY_CONTENT'],\n      is_key_content_base64: true,\n      duration: 1200,\n      in_house: false\n    )\n\t\tbuild_num = app_store_build_number(\n      api_key: api_key,\n\t\t\tapp_identifier: ENV['BUNDLE_IDENTIFIER'],\n\t\t\tlive: false\n    )\n\t\tbuild_num = build_num + 1\n\t\tUI.message(\"Bumped build number to #{build_num}\")\n\t\tincrement_build_number(\n\t\t\tbuild_number: build_num,\n\t\t\txcodeproj: \"./ios/App/App.xcodeproj\",\n\t\t\tskip_info_plist: true\n\t\t)\n\tend\n\n  private_lane :import_cert do |options|\n    cert_path = \"#{Dir.tmpdir}/build_certificate.p12\"\n    File.write(cert_path, Base64.decode64(ENV['BUILD_CERTIFICATE_BASE64']))\n    import_certificate(\n      certificate_path: cert_path,\n      certificate_password: ENV['P12_PASSWORD'] || \"\",\n      keychain_name: options[:keychain_name],\n      keychain_password: options[:keychain_password],\n      log_output: true\n    )\n    File.delete(cert_path)\n  end  \n  \n  private_lane :cleanup_keychain do |options|\n    delete_keychain(\n      name: options[:keychain_name]\n    )\n  end  \n\n  private_lane :install_profile do\n    profile_path = \"#{Dir.tmpdir}/build_pp.mobileprovision\"\n    File.write(profile_path, Base64.decode64(ENV['BUILD_PROVISION_PROFILE_BASE64']))\n    UI.user_error!(\"Failed to create provisioning profile at #{profile_path}\") unless File.exist?(profile_path)\n    ENV['PROVISIONING_PROFILE_PATH'] = profile_path\n    install_provisioning_profile(path: profile_path)\n    File.delete(profile_path)\n  end\n\n  private_lane :update_project_settings do\n    update_code_signing_settings(\n      use_automatic_signing: false,\n      path: \"./ios/App/App.xcodeproj\",\n      code_sign_identity: \"iPhone Distribution\",\n      profile_name: ENV['APPLE_PROFILE_NAME'],\n      bundle_identifier: ENV['BUNDLE_IDENTIFIER'],\n      team_id: ENV['APP_STORE_CONNECT_TEAM_ID']\n    )\n    update_project_team(\n      path: \"./ios/App/App.xcodeproj\",\n      teamid: ENV['APP_STORE_CONNECT_TEAM_ID']\n    )\n  end\n\n  private_lane :build_app_with_signing do |options|\n    unlock_keychain(\n      path: options[:keychain_name],\n      password: options[:keychain_password],\n      set_default: false\n    )\n    build_app(\n      workspace: \"./ios/App/App.xcworkspace\",\n      scheme: \"App\",\n      configuration: \"Release\",\n      export_method: \"app-store\",\n      output_name: \"App.ipa\",\n      export_options: {\n        provisioningProfiles: {\n          ENV['BUNDLE_IDENTIFIER'] =&gt; ENV['APPLE_PROFILE_NAME']\n        }\n      },\n      xcargs: \"-verbose\",\n      buildlog_path: \"./build_logs\",\n      export_xcargs: \"-allowProvisioningUpdates\",\n    )\n  end   \n\n  private_lane :submit_to_testflight do\n    api_key = app_store_connect_api_key(\n      key_id: ENV['APPLE_KEY_ID'],\n      issuer_id: ENV['APPLE_ISSUER_ID'],\n      key_content: ENV['APPLE_KEY_CONTENT'],\n      is_key_content_base64: true,\n      duration: 1200,\n      in_house: false\n    )\n    pilot(\n      api_key: api_key,\n      skip_waiting_for_build_processing: true,\n      skip_submission: true,\n      distribute_external: false,\n      notify_external_testers: false,\n      ipa: \"./App.ipa\"\n    )\n  end\nend\n5. Setting up secrets\nGitHub Actions uses the repository secrets you configure in the next step. You only need a local .env file if you want to run or test Fastlane from your own machine.\nFor local testing, create &lt;project-root&gt;/fastlane/.env next to the Fastfile. Do not commit this file. Add fastlane/.env to your .gitignore first (or verify it is already ignored). Here is an example:\nAPP_STORE_CONNECT_TEAM_ID=UVTJ336J2D\nBUNDLE_IDENTIFIER=ee.forgr.testfastlane\n# See previous section for these secrets\nBUILD_CERTIFICATE_BASE64=\nBUILD_PROVISION_PROFILE_BASE64=\nAPPLE_KEY_ID=\nAPPLE_ISSUER_ID=\nAPPLE_KEY_CONTENT=\nP12_PASSWORD=\nAPPLE_PROFILE_NAME=\nGetting the APP_STORE_CONNECT_TEAM_ID\nGo to Developer Center and scroll down to Membership details section.\nThe Team ID is the value you need to set in the APP_STORE_CONNECT_TEAM_ID secret.\n\n  \n\nGetting the BUNDLE_IDENTIFIER\n\nOpen Xcode\nDouble click on the App in the project navigator\nThen click on the tab Signing and Capabilities\nCopy the value of the Bundle identifier. This is the value you need to set in the BUNDLE_IDENTIFIER secret.\n\n\n  \n\n6. Build Processing\nIn GitHub Actions, you are billed based on the minutes you have used for running your CI/CD workflow. From my experience, it takes about 10–15 minutes before a build can be processed in App Store Connect.\nFor private projects, the estimated cost per build can go up to $0.08/min x 15 mins = $1.2, or more, depending on the configuration and dependencies of your project.\nIf you’re concerned about costs for private projects, you can set skip_waiting_for_build_processing to true. This will save build minutes by not waiting for App Store Connect to finish processing the build.\nHowever, there is a tradeoff - you’ll need to manually update your app’s compliance information in App Store Connect before you can distribute the build to users.\nThis optimization is mainly useful for private projects where build minutes cost money. For public/free projects, the build minutes are free so there’s no need to enable this setting. See GitHub’s pricing page for more details.\n7. Setup GitHub Actions\nConfigure GitHub secrets\nPlease copy the secrets from the .env file and paste them into the GitHub repository secrets.\nGo to Settings &gt; Secrets and variables &gt; Actions &gt; New repository secret\n\n  \n\n2. BUILD_CERTIFICATE_BASE64 - Base64 encoded certificate.\n3. BUILD_PROVISION_PROFILE_BASE64 - Base64 encoded provisioning profile.\n4. BUNDLE_IDENTIFIER - your app’s bundle identifier.\n5. APPLE_KEY_ID — App Store Connect API Key 🔺Key ID.\n6. APPLE_ISSUER_ID — App Store Connect API Key 🔺Issuer ID.\n7. APPLE_KEY_CONTENT — App Store Connect API Key 🔺 Key content of .p8, check it\n8. Configure GitHub workflow file\nCreate a GitHub workflow directory.\ncd .github/workflows\nInside the workflow folder, create a file named build-upload-ios.ymland add the following.\nname: Build source code on ios\n\non:\n  push:\n    tags:\n      - '*'\n\njobs:\n  build_ios:\n    runs-on: macOS-latest\n    steps:\n      - uses: actions/checkout@v6\n      - name: Set Node.js\n        uses: actions/setup-node@v6\n        with:\n          node-version: 24\n          cache: npm\n      - name: Install dependencies\n        id: install_code\n        run: npm ci\n      - name: Build\n        id: build_code\n        run: npm run build\n      - uses: actions/cache@v5\n        with:\n          path: ios/App/Pods\n          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}\n          restore-keys: |\n            ${{ runner.os }}-pods-\n      - name: Sync\n        id: sync_code\n        run: npx cap sync\n      - uses: ruby/setup-ruby@v1\n        with:\n          ruby-version: '3.0'\n          bundler-cache: true\n      - uses: maierj/fastlane-action@v3.1.0\n        env:\n          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}\n          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}\n          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}\n          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}\n          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}\n          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}\n          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}\n          APPLE_PROFILE_NAME: ${{ secrets.APPLE_PROFILE_NAME }}\n        with:\n          lane: ios beta\n      - name: Upload release bundle\n        uses: actions/upload-artifact@v6\n        with:\n          name: ios-release\n          path: ./App.ipa\n          retention-days: 10\nThis workflow should be triggered after each GitHub tag, if you need to automatize tag please, refer to Automatic build and release with GitHub actions first.\nThen this workflow will pull your NodeJS deps, install them and build your JavaScript app.\n\nEach time you send a new commit, a release will be built in TestFlight.\n\nYour App doesn’t need to use Ionic, only Capacitor base is mandatory., it can have old Cordova module, but Capacitor JS plugin should be preferred.\n8. Trigger the workflow\nCreate a Commit\nMake a commit, you should see the active workflow in the repository.\nTrigger the workflow\nPush the new commits to the branch main or development to trigger the workflow.\n\nAfter a few minutes, the build should be available in your App Store Connect dashboard.\n\n9. Can I deploy from local machine?\nYes, you can, and it is effortless.\nYou can use Xcode to build and sign your app, as always.\nRelated Articles\nCI/CD Setup Guides\n\nAutomatic Capacitor Android Build with GitHub Actions - Complete Android CI/CD setup\nAutomatic Build and Release with GitHub Actions - Full CI/CD pipeline tutorial\nManage Dev and Prod Builds with GitHub Actions - Environment management\nAutomatic Capacitor iOS Build with Match - Alternative using Fastlane Match\n\nAlternative CI/CD Platforms\n\nBuild with GitLab CI - GitLab alternative\nBuild with CodeMagic - CodeMagic setup guide\n\nLive Updates &amp; Deployment\n\nCapgo Live Updates Documentation - Add OTA updates to your app\nCI/CD Integration with Capgo - Integrate live updates in your pipeline\n\nThanks\nThis blog is based on the following articles:\n\nContinuous delivery for IOS using Fastlane and GitHub actions\nFastlane Documentation\nThis GitHub message from @mrogunlana\nThis GitHub documentation\n\nKeep going from Automatic Capacitor IOS build with GitHub actions with certificate\nIf you are using Automatic Capacitor IOS build with GitHub actions with certificate to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/automatic-capacitor-ios-build-github-action/"},"keywords":"Fastlane, CI/CD, iOS, automatic build, automatic release, mobile app updates","articleSection":"CI/CD"}</script>
