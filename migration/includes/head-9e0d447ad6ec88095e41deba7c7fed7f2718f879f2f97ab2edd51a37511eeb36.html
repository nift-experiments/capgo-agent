<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/google-fit-to-health-connect-migration-in-capacitor/#newsarticle","url":"https://capgo.app/blog/google-fit-to-health-connect-migration-in-capacitor/","headline":"Google Fit to Health Connect Migration in Capacitor","description":"Migrate a Capacitor app from Google Fit to Health Connect before the Fit APIs end in 2026: data type mapping, permissions, queries, and Play review.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"The Google Fit to Health Connect migration means replacing every Fit API call in your Capacitor app with Health Connect on Android, and with HealthKit on iOS if you ship there too. Google stopped new Fit sign-ups on May 1, 2024, and supports the Fit APIs only until the end of 2026. This guide maps Fit data types and calls to Health Connect, shows the replacement code with @capgo/capacitor-health, and covers the Play Console review that comes with health permissions.\nGoogle Fit deprecation timeline\n\n\n\nDate\nWhat happened\n\n\n\n\nMay 1, 2024\nNo new developer sign-ups for Google Fit APIs\n\n\n2024 to 2026\nExisting Fit integrations keep working, Google directs developers to Health Connect\n\n\n2026\nFit APIs, including the REST API, are deprecated\n\n\nEnd of 2026\nEnd of support. Google has not published an exact shutdown day\n\n\n\nGoogle’s migration FAQ says there is no alternative to the Fit REST API with the same shape: on-device apps move to Health Connect, and cloud integrations move to the account-based Google Health API. If you see a precise shutdown date quoted somewhere, check it against Google’s own FAQ before planning around it.\nWhat changes when you move to Health Connect\n\n\n\n\nGoogle Fit\nHealth Connect\n\n\n\n\nWhere data lives\nGoogle account, in the cloud\nOn the device\n\n\nAuth\nOAuth 2.0 with fitness scopes, Google Sign-In\nAndroid runtime permissions per data type\n\n\nSetup\nCloud project, OAuth client, SHA-1 fingerprints\nManifest permissions, privacy policy screen\n\n\nAvailability\nAny Android device with Play services\nBuilt into Android 14+, an app from Google Play on older versions\n\n\nHistory\nFull account history\nLast 30 days by default, older data with READ_HEALTH_DATA_HISTORY\n\n\nWeb/server access\nREST API\nNone (use Google Health API for cloud)\n\n\niOS\nNot supported\nNot supported, use HealthKit\n\n\nStore review\nOAuth verification for sensitive scopes\nPlay Console Health Connect declaration\n\n\n\nThe biggest product change is the device-centric model. Health Connect data on one phone is not visible on another. If your app shows history across devices, sync readings to your own backend.\nMap Fit data types to Health Connect\n\n\n\nGoogle Fit data type\nHealth Connect record\n@capgo/capacitor-health type\n\n\n\n\ncom.google.step_count.delta\nStepsRecord\nsteps\n\n\ncom.google.distance.delta\nDistanceRecord\ndistance\n\n\ncom.google.calories.expended\nTotalCaloriesBurnedRecord / ActiveCaloriesBurnedRecord\ntotalCalories / calories\n\n\ncom.google.calories.bmr\nBasalMetabolicRateRecord\nbasalCalories\n\n\ncom.google.heart_rate.bpm\nHeartRateRecord\nheartRate\n\n\ncom.google.weight\nWeightRecord\nweight\n\n\ncom.google.height\nHeightRecord\nheight\n\n\ncom.google.body.fat.percentage\nBodyFatRecord\nbodyFat\n\n\ncom.google.sleep.segment\nSleepSessionRecord with stages\nsleep\n\n\ncom.google.oxygen_saturation\nOxygenSaturationRecord\noxygenSaturation\n\n\ncom.google.blood_pressure\nBloodPressureRecord\nbloodPressure\n\n\ncom.google.blood_glucose\nBloodGlucoseRecord\nbloodGlucose\n\n\ncom.google.body.temperature\nBodyTemperatureRecord\nbodyTemperature\n\n\ncom.google.hydration\nHydrationRecord\ndietaryWater\n\n\ncom.google.nutrition\nNutritionRecord\ndietaryEnergyConsumed (energy only)\n\n\ncom.google.activity.segment and Sessions API\nExerciseSessionRecord\nworkouts (read via queryWorkouts)\n\n\n\nFit types without a direct equivalent\n\nHeart Points (com.google.heart_minutes) and Move Minutes (com.google.active_minutes) were Google Fit scores. Health Connect stores raw data, not these scores. Recompute your own metric from heart rate and exercise sessions.\nActivity samples with per-second activity types are replaced by exercise sessions with segments.\nLocation samples inside workouts become ExerciseRoute data in Health Connect, which needs a separate permission and is not exposed by the plugin.\nCadence, speed and power exist in Health Connect (StepsCadenceRecord, SpeedRecord, PowerRecord) but are not covered by the plugin’s types. If you depend on them, a small custom native method is the fastest path.\n\nAudit before you write code: list every DataType and every API you call (History, Recording, Sessions, Sensors, Config, REST), and mark each one as mapped, recomputed, or dropped.\nStep 1: Remove Google Fit\nDelete the Fit integration from your Android project and JavaScript:\n\nRemove com.google.android.gms:play-services-fitness and, if only used for Fit, play-services-auth from build.gradle.\nRemove the Fit OAuth client from Google Cloud and the fitness scopes from your consent screen.\nUninstall the old community Google Fit Capacitor plugin you used, then run bunx cap sync.\n\nKeep the Fit code in a branch until the new version is live, so you can export historical data if users ask.\nStep 2: Install the health plugin\nbun add @capgo/capacitor-health\nbunx cap sync\n@capgo/capacitor-health supports Capacitor 8, uses Health Connect on Android and HealthKit on iOS, and requires Android minSdk 26.\nAndroid setup\nThe plugin merges the Health Connect read and write permissions for its supported types into your manifest, plus the &lt;queries&gt; entry for the Health Connect package and the permission rationale activity. You need to:\n\nProvide a privacy policy. Health Connect opens it from the permission sheet. Either add android/app/src/main/assets/public/privacypolicy.html, or set a URL in android/app/src/main/res/values/strings.xml:\n\n&lt;string name=\"health_connect_privacy_policy_url\"&gt;https://example.com/privacy&lt;/string&gt;\n\nTrim permissions. Google Play reviews every Health Connect permission you declare. If you only read steps and heart rate, remove the rest with tools:node=\"remove\":\n\n&lt;uses-permission\n    android:name=\"android.permission.health.WRITE_BLOOD_GLUCOSE\"\n    tools:node=\"remove\" /&gt;\n\nAdd history access if you need it. Health Connect limits reads to roughly the last 30 days unless the user grants READ_HEALTH_DATA_HISTORY:\n\n&lt;uses-permission android:name=\"android.permission.health.READ_HEALTH_DATA_HISTORY\" /&gt;\niOS setup\nEnable the HealthKit capability in Xcode and add usage strings to Info.plist:\n&lt;key&gt;NSHealthShareUsageDescription&lt;/key&gt;\n&lt;string&gt;Show your steps and workouts in the app.&lt;/string&gt;\n&lt;key&gt;NSHealthUpdateUsageDescription&lt;/key&gt;\n&lt;string&gt;Save the workouts you record in the app.&lt;/string&gt;\nStep 3: Check availability\nGoogle Fit worked anywhere Play services existed. Health Connect may be missing on Android 13 and older, or need an update.\nimport { Health } from '@capgo/capacitor-health';\n\nexport async function ensureHealthAvailable() {\n  const result = await Health.isAvailable();\n  if (result.available) return true;\n\n  // On Android, send the user to install or update Health Connect\n  if (result.platform === 'android') {\n    await Health.openHealthConnectSettings();\n  }\n  console.warn('Health store unavailable:', result.reason);\n  return false;\n}\nShow a short explanation screen before redirecting. Users who never heard of Health Connect are confused when the Play Store opens unprompted.\nStep 4: Replace OAuth with permissions\nThe Fit flow was: Google Sign-In, request fitness scopes, then call APIs. The new flow is a single permission sheet:\nconst status = await Health.requestAuthorization({\n  read: ['steps', 'distance', 'calories', 'heartRate', 'sleep', 'workouts'],\n  write: ['weight'],\n  requestHistoryAccess: true, // Android only\n});\n\nif (status.readDenied.length &gt; 0) {\n  // explain what will not work and offer openHealthConnectSettings()\n}\nif (status.historyAccessAvailable === false) {\n  // provider too old: only the last 30 days are readable\n}\nPermissions are per data type and the user can grant any subset. Use checkAuthorization with the same options on every app start, because users can revoke access in Health Connect settings at any time. On iOS, HealthKit hides read denials for privacy, so an empty result can mean “no data” or “no access”.\nStep 5: Replace History API reads\nA Fit readData call for raw samples becomes readSamples:\nconst end = new Date();\nconst start = new Date(end.getTime() - 24 * 60 * 60 * 1000);\n\nconst { samples } = await Health.readSamples({\n  dataType: 'heartRate',\n  startDate: start.toISOString(),\n  endDate: end.toISOString(),\n  limit: 500,\n  ascending: true,\n});\n\nfor (const s of samples) {\n  console.log(s.startDate, s.value, s.unit, s.sourceName, s.deviceType);\n}\nsourceName and, on Android, deviceType (watch, phone, chestStrap, and so on) replace Fit’s data source objects. Use them to prefer watch data over phone data when both exist.\nStep 6: Replace bucketed and aggregate reads\nFit’s bucketByTime plus aggregate becomes queryAggregated:\nconst { samples: daily } = await Health.queryAggregated({\n  dataType: 'steps',\n  startDate: new Date(Date.now() - 7 * 86_400_000).toISOString(),\n  endDate: new Date().toISOString(),\n  bucket: 'day',          // 'hour' | 'day' | 'week' | 'month'\n  aggregation: 'sum',\n});\n\nconst { samples: hr } = await Health.queryAggregated({\n  dataType: 'heartRate',\n  bucket: 'hour',\n  aggregation: ['min', 'average', 'max'],\n  startDate: new Date(Date.now() - 86_400_000).toISOString(),\n  endDate: new Date().toISOString(),\n});\n// hr[i].values.min, hr[i].values.average, hr[i].values.max\nAlways aggregate steps instead of summing raw samples. Health Connect deduplicates overlapping data from several apps during aggregation, and raw sums often double count when a watch and a phone both record steps.\nStep 7: Replace the Sessions API\nFit sessions map to exercise sessions:\nconst { workouts, anchor } = await Health.queryWorkouts({\n  workoutType: 'running',\n  startDate: new Date(Date.now() - 30 * 86_400_000).toISOString(),\n  endDate: new Date().toISOString(),\n  limit: 50,\n});\n\nfor (const w of workouts) {\n  console.log(w.workoutType, w.duration, w.totalDistance, w.totalEnergyBurned);\n}\n// pass `anchor` back to fetch the next page\nRequest workouts in read permissions first. The plugin reads workouts but does not write exercise sessions, so if your app records workouts, write the underlying samples (distance, calories, heart rate) and keep the session itself in your backend, or add a native method for ExerciseSessionRecord.\nStep 8: Replace inserts\nFit’s insertData becomes saveSample:\nawait Health.saveSample({\n  dataType: 'weight',\n  value: 72.4, // kilograms\n  startDate: new Date().toISOString(),\n});\n\nawait Health.saveSample({\n  dataType: 'bloodPressure',\n  value: 120,\n  systolic: 120,\n  diastolic: 80,\n  startDate: new Date().toISOString(),\n});\nValues must use the default unit of each type (kilograms, meters, kilocalories, bpm). The metadata option is ignored by Health Connect.\nStep 9: Pass Google Play review\nHealth permissions trigger extra review:\n\nIn Play Console, open App content and complete the Health apps declaration and the Health Connect permissions form. Justify every permission you request.\nMake sure the privacy policy linked in Play Console and the one shown in the Health Connect sheet describe health data use.\nUpdate the Data safety form: health and fitness data, collected or not, shared or not.\nSubmit a build that only declares the permissions you justified. Extra declared permissions are the most common rejection.\n\nPlan for review to take longer than a normal update. Ship the migration as its own release, not mixed with unrelated features.\nStep 10: Migrate user expectations\n\nTell users their history now comes from Health Connect, and that older data may be limited to 30 days until they grant history access.\nIf your app used Fit as its cloud sync, move that responsibility to your backend now.\nRemove “Connect Google Fit” buttons and rename them “Connect Health Connect” on Android and “Connect Apple Health” on iOS.\n\nTroubleshooting\nisAvailable() returns false on Android 13: Health Connect is not installed or outdated. Call openHealthConnectSettings().\nThe permission sheet never appears: the permission is not declared in the merged manifest, or you removed it with tools:node=\"remove\". Check android/app/build/intermediates/merged_manifests.\nReads return only 30 days: request requestHistoryAccess: true and declare READ_HEALTH_DATA_HISTORY.\nStep totals are higher than Google Fit: you summed raw samples. Use queryAggregated.\nEmpty results on iOS: either no data or read permission denied. HealthKit does not tell you which.\nPlay Console rejects the update: remove undeclared or unjustified Health Connect permissions and resubmit with a clear justification.\nShip the migration in stages\nThe native part (plugin, manifest, HealthKit capability) needs a store release. After that, queries, UI and data mapping are JavaScript, which you can iterate on with Capgo live updates while users test the new flow. If you also read live sensor data, see our guide to building a heart rate monitor with Capacitor, and the health plugin docs for every data type.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/google-fit-to-health-connect-migration-in-capacitor/"},"keywords":"google fit to health connect, google fit deprecation, health connect capacitor, capacitor health plugin, google fit api shutdown 2026, ionic health connect, healthkit capacitor, capacitor google fit migration","articleSection":"Migration"},{"@type":"FAQPage","@id":"https://capgo.app/blog/google-fit-to-health-connect-migration-in-capacitor/#faqpage","url":"https://capgo.app/blog/google-fit-to-health-connect-migration-in-capacitor/","mainEntity":[{"@type":"Question","name":"When do the Google Fit APIs stop working?","acceptedAnswer":{"@type":"Answer","text":"Google closed new developer sign-ups on May 1, 2024, and states that the Google Fit APIs, including the REST API, are deprecated in 2026 and supported until the end of 2026. Google has not published an exact turn-off day, so finish the migration well before December 2026."}},{"@type":"Question","name":"What replaces Google Fit in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"Health Connect for on-device data on Android, and HealthKit on iOS. The @capgo/capacitor-health plugin wraps both behind one API, so the same readSamples, queryAggregated, queryWorkouts and saveSample calls work on both platforms."}},{"@type":"Question","name":"Can I read old Google Fit data through Health Connect?","acceptedAnswer":{"@type":"Answer","text":"Not directly. Health Connect only holds data that apps wrote to it. The Google Fit app syncs much of its data to Health Connect when the user enables it, but cloud history from the Fit REST API is not imported automatically. Export what you need from Fit before the shutdown and store it on your backend."}},{"@type":"Question","name":"Do I still need a Google Cloud project and OAuth for Health Connect?","acceptedAnswer":{"@type":"Answer","text":"No. Health Connect is an on-device store with Android runtime permissions. You remove the Fit OAuth client, the fitness scopes and the play-services-fitness dependency. You do need a Health Connect declaration in Play Console instead."}},{"@type":"Question","name":"Does Health Connect work on iOS or the web?","acceptedAnswer":{"@type":"Answer","text":"No. Health Connect is Android only. On iOS, use HealthKit, which @capgo/capacitor-health supports with the same API. There is no web equivalent; for web or server access Google points to the cloud-based Google Health API."}}]}]}</script>
