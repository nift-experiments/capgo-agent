<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/migrating-cordova-to-capacitor/#newsarticle","url":"https://capgo.app/blog/migrating-cordova-to-capacitor/","headline":"Migrating a Web App from Cordova to Capacitor: A Step-by-Step Guide","description":"This step-by-step guide will help you migrate your web app from Cordova to Capacitor, covering all sections and making it easy to read and follow.","image":["https://capgo.app/migrating-cordova-to-capacitor.webp"],"datePublished":"2023-06-07T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Migrating a Web App Using Cordova to Capacitor: A Step-by-Step Guide\nThis guide will help you migrate your web app from Cordova to Capacitor, making it easy to read and follow. We’ll cover all sections and provide a step-by-step approach.\nIntroduction to Cordova and Capacitor\nCordova and Capacitor are both tools that enable web developers to create native applications for various platforms using HTML, CSS, and JavaScript. While they share similarities, there are key differences in their approach to native project management, plugin management, and CLI/version management.\nMigration Strategy\nMigrating from Cordova to Capacitor can be done gradually or as a complete replacement, depending on the complexity of your app. Capacitor is backward-compatible with Cordova, allowing you to switch your existing web apps to it whenever you’re ready.\nTo assist with migration, consider using the Ionic VS Code Extension and auditing your existing Cordova plugins. You can continue to use Cordova plugins if needed, or replace them with Capacitor equivalents.\nStep-by-Step Migration Guide\nFollow these steps to migrate your web app from Cordova to Capacitor:\n\n\nWork in a separate code branch: It’s recommended to work in a separate code branch when applying these changes.\n\n\nInitialize your app with Capacitor: Open your project in the terminal and follow the guides for adding Capacitor to a web app or adding Capacitor to an Ionic app. Use the information from your Cordova config.xml file for the app name and Bundle ID.\n\n\nBuild your web app: Build your web project at least once before adding any native platforms. This ensures that the www folder is properly configured in the Capacitor configuration file.\n\n\nAdd platforms: Run npx cap add ios and npx cap add android to add the iOS and Android platforms. These will create separate native project folders at the root of your project.\n\n\nGenerate icons and splash screens: If you have existing icon and splash screen images, use the cordova-res tool to generate and copy them into the native projects.\n\n\nAudit and migrate existing Cordova plugins: Review your existing Cordova plugins and replace them with Capacitor equivalents if possible. Remove any unnecessary plugins.\n\n\nRemove Cordova plugin: After replacing or removing a Cordova plugin, uninstall the plugin and run npx cap sync to remove the plugin code from the native project.\n\n\nApply additional permissions: Map between plugin.xml and required settings on iOS and Android to apply any necessary permissions.\n\n\nConfigure preferences: Manually add preferences from config.xml to the Capacitor configuration file.\n\n\nHandle platform-specific configurations: Configure elements from config.xml for each platform (iOS and Android) as needed.\n\n\nChange the scheme for serving content: If necessary, change the scheme used for serving content in your app to avoid data loss.\n\n\nTest and remove Cordova: Test your migrated app to ensure all changes have been applied correctly. Once satisfied, you can remove Cordova from your project or leave it if you plan to continue using Cordova plugins.\n\n\nCongratulations! You’ve successfully migrated your web app from Cordova to Capacitor. To learn more about using Cordova plugins in a Capacitor project or the Capacitor development workflow, visit the official Capacitor documentation.\nLive Updates with Our Capgo Service\nWe’re proud to offer Capgo, our solution that enables live updates for your Capacitor apps, allowing you to deliver Over-The-Air (OTA) updates at a fair price. This feature is particularly useful for making quick fixes, deploying new features, and ensuring your users always have the latest version of your app without waiting for app store approval.\nHow Our Capgo Service Works\nCapgo is a cloud-based service that allows you to deploy live updates to your Capacitor apps. It consists of a web dashboard and a native SDK that you can integrate into your app. The SDK checks for updates on startup or at specific intervals and downloads them in the background. When an update is available, the SDK will prompt the user to install it. If the user accepts, the update will be installed and applied immediately.\nBenefits of Capgo Live Updates\n\nFaster updates: Deploy updates instantly without waiting for app store approval.\nReduced Apple Store dependence: Bypass app store restrictions and limitations.\nImproved user experience: Keep users engaged with the latest features and bug fixes without requiring them to manually update the app.\n\nHow to Implement Capgo Live Updates\nTo implement Capgo live updates in your Capacitor project, follow these steps:\n\nSign up for a Capgo account.\nInstall the Capgo SDK in your project.\nConfigure your app to check for updates on startup or at specific intervals.\nDeploy updates to your app using the Capgo dashboard.\n\nConclusion\nWe hope this guide has helped you migrate your web app from Cordova to Capacitor. If you have any questions or need assistance with the migration process, feel free to contact us on our discord server.\nKeep going from Migrating a Web App from Cordova to Capacitor: A Step-by-Step Guide\nIf you are using Migrating a Web App from Cordova to Capacitor: A Step-by-Step Guide to plan migration and enterprise operations, connect it with Capgo Enterprise for the product workflow in Capgo Enterprise, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, Capgo Alternatives for the product workflow in Capgo Alternatives, Capgo Consulting for the product workflow in Capgo Consulting, and Capgo Premium Support for the product workflow in Capgo Premium Support.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/migrating-cordova-to-capacitor/"},"keywords":"Cordova, Capacitor, migration, mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Migration"}</script>
