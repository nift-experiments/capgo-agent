<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/android-scoped-storage-in-capacitor-apps/#newsarticle","url":"https://capgo.app/blog/android-scoped-storage-in-capacitor-apps/","headline":"Android Scoped Storage in Capacitor Apps","description":"Android scoped storage in Capacitor apps explained: what changed in Android 10 to 14, which permissions still work, MediaStore, SAF, and safe directories.","image":["https://capgo.app/capacitor-guide.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"Android scoped storage limits what a Capacitor app can read and write outside its own folders. Since Android 10, and fully since Android 11, an app can freely use its private directories, can add files to shared collections through MediaStore, and needs the user to pick anything else through the Storage Access Framework. This guide explains what changed per Android version, which Capacitor Directory values still work, and how to save, import and export files the supported way on Capacitor 8.\nWhat changed, version by version\n\n\n\nAndroid\nAPI\nChange that matters for Capacitor apps\n\n\n\n\n10\n29\nScoped storage introduced. Apps can opt out with requestLegacyExternalStorage=\"true\" while targeting API 29\n\n\n11\n30\nScoped storage enforced for apps targeting 30+. requestLegacyExternalStorage ignored. WRITE_EXTERNAL_STORAGE no longer grants anything. MANAGE_EXTERNAL_STORAGE introduced. Tree picker cannot select Download root or volume root\n\n\n12\n31-32\nNo major storage change\n\n\n13\n33\nREAD_EXTERNAL_STORAGE replaced by READ_MEDIA_IMAGES, READ_MEDIA_VIDEO, READ_MEDIA_AUDIO. No permission grants access to other apps’ documents\n\n\n14\n34\nPartial photo access with READ_MEDIA_VISUAL_USER_SELECTED\n\n\n15 and 16\n35-36\nNo new storage model, Play policy on photo and video permissions enforced\n\n\n\nCapacitor 8 targets API 36, so your app always runs with full scoped storage on modern devices. There is no flag to get the old behavior back.\nWhat broke in older Capacitor code\nCode written for Capacitor 2 or 3, or ported from Cordova, often fails silently on new devices:\n\nFilesystem.writeFile({ directory: Directory.Documents }) or Directory.ExternalStorage to “save to the phone”. On Android 11+ these paths point to shared storage, and writes fail or the file cannot be read back after reinstall.\nReading arbitrary paths such as /storage/emulated/0/Download/file.pdf from a path typed in a setting or received from a server.\nRequesting READ_EXTERNAL_STORAGE to list the user’s documents. On Android 13+ the permission does nothing for non-media files.\nUsing Filesystem.requestPermissions() and assuming granted means the app can write anywhere.\nBuilding file paths from a content:// URI returned by a picker.\n\nWhat still works without any permission\nYour app’s own directories are unaffected by scoped storage and need no permission:\n\n\n\nCapacitor Directory\nAndroid path\nVisible to user\nRemoved on uninstall\n\n\n\n\nData, Library, LibraryNoCloud\n/data/data/&lt;package&gt;/files\nNo\nYes\n\n\nCache\n/data/data/&lt;package&gt;/cache\nNo\nYes\n\n\nExternal\n/storage/emulated/0/Android/data/&lt;package&gt;/files\nOnly via USB or some file managers\nYes\n\n\nExternalCache\n/storage/emulated/0/Android/data/&lt;package&gt;/cache\nSame\nYes\n\n\nDocuments\nShared Documents folder\nYes\nNo\n\n\nExternalStorage\nShared storage root\nYes\nNo\n\n\n\nThe first four rows are safe. Documents and ExternalStorage are the legacy rows: since Android 11 your app can only see files there that it created itself, and after a reinstall it loses access even to those. Treat them as unsupported for new code.\nExternal is useful for large files (offline video, maps) because it may live on a bigger partition, and files there are not part of Auto Backup. Since Android 11, other apps cannot read Android/data, so it is still private in practice.\nSaving files the user can find: MediaStore\nWhen the user taps “Download” on an invoice, they expect it in the Downloads folder. On Android 10+, apps can insert files into the shared Downloads, Pictures, Movies, Music and Documents collections through MediaStore without any permission.\n@capgo/capacitor-file-sharer wraps this in save():\nbun add @capgo/capacitor-file-sharer\nbunx cap sync\nimport { FileSharer } from '@capgo/capacitor-file-sharer';\nimport { Filesystem, Directory } from '@capacitor/filesystem';\n\nconst { uri } = await Filesystem.getUri({ path: 'exports/invoice-1042.pdf', directory: Directory.Data });\n\nconst result = await FileSharer.save({\n  filename: 'invoice-1042.pdf',\n  path: uri,\n  contentType: 'application/pdf',\n  android: {\n    saveDirectory: 'downloads',     // 'downloads' | 'pictures' | 'movies' | 'music' | 'documents'\n    relativePath: 'MyApp/Invoices', // subfolder, Android 10+\n  },\n});\n\nconsole.log(result.uri); // content:// URI of the saved file\nOn iOS the same call opens the share sheet, where the user picks “Save to Files”, so one code path covers both platforms.\nOn Android 9 and lower, writing to shared storage still needs WRITE_EXTERNAL_STORAGE. Declare it only for those versions:\n&lt;uses-permission\n    android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\n    android:maxSdkVersion=\"28\" /&gt;\nCapacitor 8 supports Android 7 (API 24) and up, so if you still ship to Android 7 to 9 devices, keep that line.\nPhotos and videos\nFor media, prefer the platform flows over writing files yourself. @capacitor/camera writes to the gallery with saveToGallery: true, and only needs legacy storage permissions on old Android versions. See our guide to taking and editing photos in Capacitor.\nReading user files: pickers instead of permissions\nScoped storage expects the user to choose files. The Android picker returns a content:// URI that your app can read even though it has no storage permission.\nimport { CapgoFilePicker } from '@capgo/capacitor-file-picker';\nimport { Filesystem, Directory } from '@capacitor/filesystem';\n\nconst { files } = await CapgoFilePicker.pickFiles({ types: ['application/pdf'], limit: 1 });\nconst picked = files[0];\n\n// Copy into app storage right away: picker grants can expire\nawait Filesystem.copy({\n  from: picked.path!,\n  to: `imports/${picked.name}`,\n  toDirectory: Directory.Data,\n});\nFor photos and videos, @capgo/capacitor-file-picker’s pickMedia and @capacitor/camera’s chooseFromGallery use the Android Photo Picker on Android 13+, which needs no permission at all.\nAvoid READ_MEDIA_* permissions\nGoogle Play’s photo and video permissions policy only allows READ_MEDIA_IMAGES and READ_MEDIA_VIDEO for apps whose core purpose needs broad gallery access, such as gallery apps or photo editors. Everyone else must use the picker and declare that in Play Console. If a plugin you use declares these permissions, remove them from the merged manifest:\n&lt;uses-permission\n    android:name=\"android.permission.READ_MEDIA_IMAGES\"\n    tools:node=\"remove\" /&gt;\n&lt;uses-permission\n    android:name=\"android.permission.READ_MEDIA_VIDEO\"\n    tools:node=\"remove\" /&gt;\nAdd xmlns:tools=\"http://schemas.android.com/tools\" to the &lt;manifest&gt; tag first.\nFolder access with the Storage Access Framework\nSome apps need ongoing access to a folder: a notes app syncing to a user folder, an export folder for a field app. The Storage Access Framework (SAF) lets the user grant a folder with ACTION_OPEN_DOCUMENT_TREE:\nconst { path } = await CapgoFilePicker.pickDirectory();\n// On Android: a content://com.android.externalstorage.documents/tree/... URI\nThree things to know:\n\nThe result is a tree URI, not a path. You cannot pass it to Filesystem.writeFile. Files inside are created and read through DocumentsContract or DocumentFile in native code.\nAccess does not survive a restart unless your app calls takePersistableUriPermission on the URI. Add a small native method if you need that:\n\n@PluginMethod\npublic void persist(PluginCall call) {\n    Uri uri = Uri.parse(call.getString(\"uri\"));\n    getContext().getContentResolver().takePersistableUriPermission(\n        uri, Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\n    call.resolve();\n}\n\nSome folders cannot be granted. On Android 11+, the picker refuses the root of internal storage, the root of the Download folder, and Android/data and Android/obb. Ask users to create or pick a subfolder.\n\nPersisted grants are limited in number per app, and the user can revoke them in system settings or by clearing app data. Check access with getPersistedUriPermissions() on start and ask again when it is gone.\nAll files access: MANAGE_EXTERNAL_STORAGE\n&lt;uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" /&gt;\nThis permission gives the old “read and write everything” behavior, but it is not a runtime prompt. The user must enable it on a dedicated settings screen, and Google Play reviews it manually. Accepted use cases are file managers, backup and restore, antivirus, document management, on-device file search, and a few others where broad access is the core feature. A note-taking app, a PDF viewer that opens files from Downloads, or an app that “just needs to save exports” will be rejected.\nIf you distribute outside Play (enterprise MDM, sideloaded kiosk devices), it is an option. Otherwise, design around MediaStore and SAF.\nHow other plugins fit\n\n\n\nPlugin\nScoped storage impact\n\n\n\n\n@capacitor/filesystem\nFine with app directories. Documents and ExternalStorage are legacy on Android 11+. requestPermissions() only matters for those directories on old Android\n\n\n@capacitor/camera\nUses the system camera and Photo Picker, no storage permission except saveToGallery on Android 9 and older\n\n\n@capacitor/share\nShares through a FileProvider. Only paths listed in res/xml/file_paths.xml can be shared\n\n\n@capgo/capacitor-file-sharer\nUses its own FileProvider and MediaStore for save(), no config needed\n\n\n@capgo/capacitor-downloader\nDownloads into app external storage, then use save() to export\n\n\n@capgo/capacitor-file-picker\nPicker based, no permission on Android 13+\n\n\n@capgo/capacitor-photo-library\nIts manifest adds READ_MEDIA_* for full library reading, subject to the Play policy above. pickMedia() uses the system picker and needs no permission, so if that is all you use, remove READ_MEDIA_* with tools:node=\"remove\"\n\n\n\nWhich directory to use\n\nApp data, settings, databases: Directory.Data\nTemporary files and share exports: Directory.Cache\nLarge re-downloadable media: Directory.External on Android, Directory.LibraryNoCloud on iOS\nA file the user wants in Downloads or Pictures: MediaStore via FileSharer.save()\nA file the user brings into the app: picker, then copy into Directory.Data\nA folder the user wants the app to keep writing to: SAF tree URI with a persisted grant\n\nFor the full read and write API, see the Capacitor file handling guide.\nMigrating an existing app\n\nSearch your code for Directory.Documents, Directory.ExternalStorage, /storage/emulated, and requestLegacyExternalStorage.\nMove app-owned files to Directory.Data or Directory.External. On first launch of the new version, copy any old files you can still read, then delete them.\nReplace “save to device” features with FileSharer.save().\nReplace path inputs with a picker.\nAdd android:maxSdkVersion to legacy storage permissions and remove READ_MEDIA_* unless you need it.\nTest on Android 10, 11, 13 and 15 or 16 devices or emulators. Behavior differs exactly at those boundaries.\n\npreserveLegacyExternalStorage=\"true\" in the &lt;application&gt; tag keeps legacy access for apps updated from a version that used requestLegacyExternalStorage, until the app is reinstalled. It only helps during a one-time migration step, so do not rely on it.\nTroubleshooting\nEACCES (Permission denied) writing to /storage/emulated/0/...: you are writing to shared storage directly. Use MediaStore or an app directory.\nFile saved with Directory.Documents is gone after reinstall: the app lost ownership of it. Use MediaStore for user files.\nFileNotFoundException reading a content:// URI later: the temporary grant expired. Copy the file when it is picked, or persist the grant for tree URIs.\nPlay Console warning about photo and video permissions: a plugin added READ_MEDIA_IMAGES or READ_MEDIA_VIDEO. Remove them with tools:node=\"remove\" if you do not need them.\nrequestPermissions() returns granted but writes still fail: on Android 11+ the legacy storage permission is granted but meaningless for shared storage.\nKeep native and web parts in sync\nStorage rules are native configuration, so changes to the manifest or plugins need a store release, which Capgo Build can produce in the cloud. The file logic around them (paths, folder names, export flows) is JavaScript you can update with Capgo live updates.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/android-scoped-storage-in-capacitor-apps/"},"keywords":"android scoped storage capacitor, capacitor WRITE_EXTERNAL_STORAGE, capacitor filesystem android 11, MANAGE_EXTERNAL_STORAGE capacitor, capacitor save file to downloads, storage access framework capacitor, READ_MEDIA_IMAGES capacitor","articleSection":"Android"},{"@type":"FAQPage","@id":"https://capgo.app/blog/android-scoped-storage-in-capacitor-apps/#faqpage","url":"https://capgo.app/blog/android-scoped-storage-in-capacitor-apps/","mainEntity":[{"@type":"Question","name":"Do I still need WRITE_EXTERNAL_STORAGE in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"Only for Android 9 and older. On Android 10+ it does not grant write access to shared storage, and on Android 11+ it has no effect at all. Declare it with android:maxSdkVersion=\"28\" (or 29 if you rely on requestLegacyExternalStorage) and save shared files through MediaStore or the system picker instead."}},{"@type":"Question","name":"Why can't Capacitor Filesystem write to Directory.Documents on Android 11?","acceptedAnswer":{"@type":"Answer","text":"Directory.Documents and Directory.ExternalStorage map to shared storage on Android. Since Android 11, apps that target API 30+ can only access files there that they created themselves, and requestLegacyExternalStorage is ignored. Use Directory.Data or Directory.External for app files, and MediaStore or SAF for user-visible files."}},{"@type":"Question","name":"Can the user grant my app access to the whole Downloads folder?","acceptedAnswer":{"@type":"Answer","text":"No. On Android 11 and newer, the system folder picker (ACTION_OPEN_DOCUMENT_TREE) does not allow selecting the root of the Download folder, the root of the storage volume, or Android/data and Android/obb. Users can grant a subfolder, or pick individual files from Downloads."}},{"@type":"Question","name":"Should I request MANAGE_EXTERNAL_STORAGE?","acceptedAnswer":{"@type":"Answer","text":"Almost never. It gives All files access, but Google Play only allows it for apps whose core function needs broad file access, such as file managers, backup and restore apps, antivirus apps, and document management apps. Other apps get rejected. Use MediaStore and SAF instead."}},{"@type":"Question","name":"Does scoped storage affect iOS?","acceptedAnswer":{"@type":"Answer","text":"No. Scoped storage is an Android concept. iOS apps have always been sandboxed and reach user files only through the document picker, the share sheet, or the Files app integration."}}]}]}</script>
