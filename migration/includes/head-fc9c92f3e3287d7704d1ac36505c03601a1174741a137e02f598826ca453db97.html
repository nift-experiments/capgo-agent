<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-sign-in-with-google-using-capacitor/#newsarticle","url":"https://capgo.app/blog/how-to-sign-in-with-google-using-capacitor/","headline":"How to Sign In with Google Using Capacitor (2026)","description":"Set up Google Sign-In in a Capacitor 8 app: client IDs, SHA-1, iOS URL scheme, Android Credential Manager, ID token checks, and fixes for error 28444.","image":["https://capgo.app/social_login_plugin_blog.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To add Google Sign-In to a Capacitor app, create a Web, an iOS and one or more Android OAuth client IDs in Google Cloud, install @capgo/capacitor-social-login, call SocialLogin.initialize({ google: { webClientId, iOSClientId } }), then SocialLogin.login({ provider: 'google' }). Android uses Google’s Credential Manager, iOS uses the Google Sign-In SDK, and the web uses Google Identity Services. All three return an ID token you verify on your server.\nThis guide walks through every step for Capacitor 8 in October 2026, including the parts that usually break: SHA-1 fingerprints, the Play App Signing key, and the iOS URL scheme.\nHow Google Sign-In works in a Capacitor app\n\n\n\nPlatform\nNative API used by the plugin\nClient ID passed to the plugin\nOther console setup\n\n\n\n\nAndroid\nCredential Manager (androidx.credentials)\nWeb client ID as webClientId\nAndroid client with package name and SHA-1\n\n\niOS\nGoogle Sign-In SDK\niOS client ID as iOSClientId\nReversed client ID URL scheme in Info.plist\n\n\nWeb\nGoogle Identity Services\nWeb client ID as webClientId\nAuthorized JavaScript origins\n\n\n\nGoogle blocks OAuth inside embedded WebViews with the disallowed_useragent error, which is why loading Google’s login page inside your Capacitor WebView does not work. The plugin uses the native account picker instead.\nStep 1: Configure Google Cloud\nCreate a project and the Google Auth Platform\n\nOpen Google Cloud Console and create a project, or pick an existing one. All client IDs must live in the same project.\nOpen Google Auth Platform (the screen formerly called “OAuth consent screen”).\nUnder Branding, set the app name users will see, a support email, and your domains and privacy policy URL.\nUnder Audience, choose External for consumer apps. While the app is in Testing, only the accounts listed under Test users can sign in.\nUnder Data Access, keep the default openid, email and profile scopes unless you need more.\n\nYou do not need to publish to production or pass verification for the basic scopes. Sensitive scopes (Calendar, Drive, Gmail) need verification before public release.\nCreate the client IDs\nGo to Google Auth Platform &gt; Clients (or APIs &amp; Services &gt; Credentials) and create:\n\n\n\nClient type\nWhat to enter\nWhere the ID goes\n\n\n\n\nWeb application\nAuthorized JavaScript origins for your web build (for example https://app.example.com, http://localhost:5173)\nwebClientId\n\n\niOS\nYour bundle ID, plus App Store ID and Team ID once you have them\niOSClientId\n\n\nAndroid (debug)\nPackage name plus debug SHA-1\nConsole only\n\n\nAndroid (release)\nPackage name plus upload key SHA-1\nConsole only\n\n\nAndroid (Play)\nPackage name plus Play App Signing SHA-1\nConsole only\n\n\n\nGet the SHA-1 values:\n# Debug key and any signing config in build.gradle\ncd android &amp;&amp; ./gradlew signingReport\n\n# From a signed APK you actually install\nkeytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk\nFor Play Store builds, copy the SHA-1 from Play Console &gt; Test and release &gt; App integrity &gt; App signing key certificate. If you need a release keystore first, the Android keystore generator creates one in the browser. Our Google client ID guide goes deeper on the console screens.\nStep 2: Install the plugin\nbun add @capgo/capacitor-social-login\nbunx cap sync\nDisable providers you do not use so their SDKs stay out of the binary:\n// capacitor.config.ts\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.app',\n  appName: 'Example',\n  webDir: 'dist',\n  plugins: {\n    SocialLogin: {\n      providers: {\n        google: true,\n        apple: true,\n        facebook: false,\n        twitter: false,\n      },\n    },\n  },\n};\n\nexport default config;\nRun bunx cap sync after changing providers.\nStep 3: iOS configuration\nAdd the reversed client ID URL scheme\nOpen the iOS client in Google Cloud and copy the iOS URL scheme, which looks like com.googleusercontent.apps.1234567890-abcdef. Add it to ios/App/App/Info.plist before the closing &lt;/dict&gt;:\n&lt;key&gt;CFBundleURLTypes&lt;/key&gt;\n&lt;array&gt;\n  &lt;dict&gt;\n    &lt;key&gt;CFBundleURLSchemes&lt;/key&gt;\n    &lt;array&gt;\n      &lt;string&gt;com.googleusercontent.apps.1234567890-abcdef&lt;/string&gt;\n    &lt;/array&gt;\n  &lt;/dict&gt;\n&lt;/array&gt;\nIf you already have a CFBundleURLTypes array for deep links, add a new &lt;dict&gt; entry to it instead of creating a second key.\nLet the Google SDK handle the callback URL\nIn ios/App/App/AppDelegate.swift, import the SDK and route the URL to it before Capacitor:\nimport GoogleSignIn // add at the top of the file\n\n// Replace the generated application(_:open:options:) method\nfunc application(_ app: UIApplication, open url: URL,\n                 options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -&gt; Bool {\n    if GIDSignIn.sharedInstance.handle(url) {\n        return true\n    }\n    return ApplicationDelegateProxy.shared.application(app, open: url, options: options)\n}\nKeep the ApplicationDelegateProxy call so @capacitor/app still receives your other deep links.\nStep 4: Android configuration\nBasic sign-in with the default scopes works without native changes. If you request extra scopes or use offline mode, the plugin needs to receive activity results, so MainActivity must implement the plugin’s marker interface:\npackage com.example.app;\n\nimport android.content.Intent;\nimport com.getcapacitor.BridgeActivity;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginHandle;\nimport ee.forgr.capacitor.social.login.GoogleProvider;\nimport ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;\nimport ee.forgr.capacitor.social.login.SocialLoginPlugin;\n\npublic class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {\n\n    @Override\n    public void onActivityResult(int requestCode, int resultCode, Intent data) {\n        super.onActivityResult(requestCode, resultCode, data);\n        if (requestCode &gt;= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN\n                &amp;&amp; requestCode &lt; GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {\n            PluginHandle handle = getBridge().getPlugin(\"SocialLogin\");\n            if (handle == null) return;\n            Plugin plugin = handle.getInstance();\n            if (plugin instanceof SocialLoginPlugin) {\n                ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);\n            }\n        }\n    }\n\n    @Override\n    public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}\n}\nWithout it, calls with scopes reject with “You CANNOT use scopes without modifying the main activity”.\nFor the emulator, use a system image with the Google Play label and sign in to a Google account in device settings. Images without Play services return NoCredentialException.\nStep 5: Web configuration\nAdd every origin you serve the web build from to the Web client’s Authorized JavaScript origins, including the port (http://localhost:5173). Call initialize early: the plugin injects Google’s script tag and the login fails if it runs before the script is ready.\nStep 6: Initialize and sign in\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nconst WEB_CLIENT_ID = '1234567890-web.apps.googleusercontent.com';\nconst IOS_CLIENT_ID = '1234567890-ios.apps.googleusercontent.com';\n\nexport async function initAuth() {\n  await SocialLogin.initialize({\n    google: {\n      webClientId: WEB_CLIENT_ID, // Android + web\n      iOSClientId: IOS_CLIENT_ID, // iOS\n      iOSServerClientId: WEB_CLIENT_ID, // same as webClientId, required for offline mode on iOS\n      mode: 'online',\n    },\n  });\n}\n\nexport async function signInWithGoogle() {\n  try {\n    const { result } = await SocialLogin.login({\n      provider: 'google',\n      options: {},\n    });\n\n    if (result.responseType !== 'online' || !result.idToken) {\n      throw new Error('Expected an ID token from Google');\n    }\n\n    const res = await fetch('https://api.example.com/auth/google', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ idToken: result.idToken }),\n    });\n    return res.json();\n  } catch (error: any) {\n    if (error?.code === 'USER_CANCELLED') return null;\n    throw error;\n  }\n}\nThe online response contains:\n\n\n\nField\nNotes\n\n\n\n\nidToken\nOpenID Connect JWT. Send this to your server\n\n\naccessToken\nFor calling Google APIs from the client. Can be null on Android when only default scopes are requested\n\n\nprofile\nemail, name, givenName, familyName, imageUrl, id\n\n\nresponseType\n'online'\n\n\n\nAndroid-only display options\nThe options object accepts style: 'bottom' for the bottom sheet UI, plus filterByAuthorizedAccounts and autoSelectEnabled for returning users. Leave filterByAuthorizedAccounts off if you support Family Link accounts. forceRefreshToken: true asks Android for a fresh access token instead of a cached one.\nRequesting extra scopes\nconst { result } = await SocialLogin.login({\n  provider: 'google',\n  options: {\n    scopes: ['https://www.googleapis.com/auth/calendar.readonly'],\n  },\n});\nRemember the MainActivity change on Android, and add the scope under Data Access in Google Cloud.\nOnline vs offline mode\n\n\n\n\nOnline (default)\nOffline\n\n\n\n\nReturns\nID token, access token, profile\nserverAuthCode only\n\n\nBackend needed\nOnly to verify the token\nYes, to exchange the code\n\n\nGoogle refresh token\nStays with Google SDK on device\nStored on your server\n\n\nUse when\nYou only need to know who the user is\nYour server calls Google APIs while the user is away\n\n\nlogout, isLoggedIn, refresh\nSupported\nNot supported\n\n\n\nOffline mode on iOS requires iOSServerClientId, and on Android it requires the MainActivity change.\nLogout and session checks\nawait SocialLogin.isLoggedIn({ provider: 'google' }); // { isLoggedIn: boolean }\nawait SocialLogin.logout({ provider: 'google' });\nOn Android, logout also clears the Credential Manager state, so the account picker appears again next time.\nStep 7: Verify the ID token on your server\nimport { OAuth2Client } from 'google-auth-library';\n\nconst client = new OAuth2Client();\n\nexport async function verifyGoogleToken(idToken: string) {\n  const ticket = await client.verifyIdToken({\n    idToken,\n    audience: [\n      '1234567890-web.apps.googleusercontent.com',\n      '1234567890-ios.apps.googleusercontent.com',\n    ],\n  });\n  const payload = ticket.getPayload();\n  if (!payload) throw new Error('Empty token payload');\n\n  return {\n    googleUserId: payload.sub,\n    email: payload.email,\n    emailVerified: payload.email_verified === true,\n    name: payload.name,\n  };\n}\nUse sub as the stable user key. Only link an existing account by email when email_verified is true. Accepting both client IDs as audience keeps tokens from every platform valid. Then issue your own session. If you use a managed backend, follow Supabase with Capacitor Social Login or the Firebase Google guide.\nTroubleshooting\n\n\n\nError\nCause\nFix\n\n\n\n\n[28444] Developer console is not set up correctly\nPackage name, SHA-1 or webClientId mismatch\nUse the Web client ID, register the SHA-1 of the installed build, keep all clients in one project\n\n\nWorks in debug, fails from Play Store\nPlay re-signs the app\nAdd an Android client with the Play App Signing SHA-1\n\n\n[16] Account reauth failed\nCached account state is stale, account not a test user, or user disabled the app\nThe plugin retries once automatically. Check test users, External audience, and Play signing SHA-1\n\n\nNoCredentialException\nNo Google account on device, or emulator without Play services\nUse a Google Play system image and sign in\n\n\nUSER_CANCELLED right after picking an account\nUsually still a SHA-1 or client ID mismatch\nFix console setup before treating it as a real cancel\n\n\niOS crash: “missing support for the following URL schemes”\nReversed client ID missing in Info.plist\nAdd the com.googleusercontent.apps... scheme\n\n\nWeb: “The given origin is not allowed for the given client ID”\nOrigin missing on the Web client\nAdd the exact origin, including port\n\n\naccess_denied with “app has not completed the Google verification process”\nAccount is not a test user while in Testing\nAdd it under Audience &gt; Test users\n\n\nGoogle login screen interrupted on iOS\n@capacitor/privacy-screen covers the SDK view\nCall PrivacyScreen.disable() before login\n\n\n\nOn Android, filter Logcat by GoogleProvider. The plugin logs the package name, signing SHA-1 and a masked webClientId, which you can compare against the console in a minute.\nShipping and maintaining\nConsole changes can take a few hours to propagate, so do not rotate client IDs on release day. Once the native setup is in a store build, client-side changes such as scopes, error handling or the backend URL can go out through Capgo live updates. If your team does not have a Mac for iOS releases, Capgo Build builds and signs the iOS binary in the cloud.\nRelated guides\n\nHow to sign in with Apple using Capacitor, which you will need on iOS if Google is your main login.\nHow to add authentication to a Capacitor app for choosing between social login, OIDC, passkeys and Better Auth.\nSocial Login plugin page and the Google Android setup docs.\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-sign-in-with-google-using-capacitor/"},"keywords":"google sign in capacitor, capacitor google login, ionic google auth, credential manager capacitor, google id token, capacitor social login, 28444 developer console is not set up correctly","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-sign-in-with-google-using-capacitor/#faqpage","url":"https://capgo.app/blog/how-to-sign-in-with-google-using-capacitor/","mainEntity":[{"@type":"Question","name":"Why do I need a web client ID for Google Sign-In on Android?","acceptedAnswer":{"@type":"Answer","text":"Android Credential Manager issues the ID token for a server audience, and that audience is the Web application client ID. The Android client ID is never passed to the plugin. It only tells Google that an app with a given package name and SHA-1 is allowed to request tokens for your project."}},{"@type":"Question","name":"Do I need a backend for Google Sign-In in Capacitor?","acceptedAnswer":{"@type":"Answer","text":"Not to sign the user in. Online mode returns an ID token and profile directly to the app. You still need a server, or a service like Firebase or Supabase, to verify the ID token before you trust the user. Offline mode, which returns a serverAuthCode for long-lived server access to Google APIs, always requires a backend."}},{"@type":"Question","name":"Why does Google Sign-In work in debug but fail after publishing to Google Play?","acceptedAnswer":{"@type":"Answer","text":"Google Play re-signs your app with the Play App Signing key, so the SHA-1 on users' devices differs from your upload or debug key. Create an extra Android OAuth client with the SHA-1 from Play Console > App integrity > App signing key certificate."}},{"@type":"Question","name":"Can I request extra Google scopes like Calendar or Drive?","acceptedAnswer":{"@type":"Answer","text":"Yes. Pass them in options.scopes when calling login. On Android, custom scopes require the MainActivity change described in this guide, otherwise the plugin rejects the call. Sensitive and restricted scopes also require Google verification before you can ship to the public."}},{"@type":"Question","name":"Does this work with Firebase Authentication or Supabase?","acceptedAnswer":{"@type":"Answer","text":"Yes. Take result.idToken from the plugin and pass it to signInWithCredential in Firebase or signInWithIdToken in Supabase. Use the Web client ID as webClientId, since that is the audience those services expect."}}]}]}</script>
