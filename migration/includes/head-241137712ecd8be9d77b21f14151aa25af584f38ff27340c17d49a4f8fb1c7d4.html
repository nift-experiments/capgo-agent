<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/transistorsoft-background-geolocation-alternative/#newsarticle","url":"https://capgo.app/blog/transistorsoft-background-geolocation-alternative/","headline":"Transistorsoft Background Geolocation Alternative","description":"A free, open source Transistorsoft background geolocation alternative for Capacitor 8: features, licensing, setup, geofencing and a migration guide.","image":["https://capgo.app/blog-images/how-to-add-geolocation-targeting-to-ota-updates.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"If you are looking for a Transistorsoft background geolocation alternative for Capacitor, the closest free option is @capgo/background-geolocation. It is MIT licensed, ships for Capacitor 8, tracks location in the background on iOS and Android, supports native geofencing, and can POST locations to your server from native code. It does not copy every Transistorsoft feature, so this guide covers what you gain, what you give up, and how to migrate.\nWhy teams look for a Transistorsoft alternative\nThe Transistorsoft SDK is a mature product that has powered fleet, delivery and fitness apps for years. People rarely leave it because it is broken. They leave for these reasons:\nRelease builds now need a key on both platforms\nAccording to the Transistorsoft changelog, version 9.0.0 moved to a JWT based license key and started requiring a key on iOS too. Before v9, only Android release builds were locked. Keys from v8 and earlier do not work with v9, so upgrading the plugin also means generating new keys from their dashboard.\nTheir shop sells perpetual licenses per app identifier, from one key up to 100 keys, with one year of updates included. Add-ons such as polygon geofencing are now encoded into the same key. For one app this is a reasonable price. For an agency with 20 white label apps, or a company that ships separate staging and production bundle IDs, the license becomes a line item someone has to manage every year.\nThe core engine is a binary\nThe Capacitor wrapper is open, but the location engine ships as a prebuilt iOS framework and an Android library from Maven. When something odd happens on a specific Android OEM, you cannot read or patch the code that decides when to record a fix. Some teams accept that. Teams with strict audit requirements, or who just want to step through the code in Xcode, often do not.\nConfiguration surface\nThe plugin exposes a very large configuration object: motion detection, scheduling, odometer, SQLite persistence, HTTP sync templates, headless tasks and more. If you need all of it, that is great. If you need “send my position every 30 seconds while the driver is on shift”, it is a lot of settings to understand.\nWhat @capgo/background-geolocation does\nThe Capgo plugin started from the long history of the Cordova background geolocation forks and the lightweight community Capacitor plugin. The goal is accurate fixes, reliable background operation and native geofencing, without a license.\nCurrent features in the 8.x line:\n\nForeground and background location updates through a single start() call with a callback.\ndistanceFilter and minIntervalMs to control how often points arrive.\nNative HTTP POST of every location to a url you configure, with custom headers and updateHeaders() for token rotation.\nNative circular geofences with enter and exit events, and a native webhook for transitions.\ncheckPermissions() and requestPermissions() that distinguish iOS When In Use from Always.\nopenSettings() for users who denied permission.\nsetPlannedRoute() to play a sound when the user leaves a planned route.\nOptional Android networkFallback that fills GPS gaps with network locations.\nA web implementation for development and browser testing.\n\nFeature comparison\n\n\n\nCapability\nTransistorsoft (v9)\n@capgo/background-geolocation\n\n\n\n\nLicense\nPaid key for release builds, per app ID\nMIT, free\n\n\nSource\nWrapper open, engine binary\nFully open source\n\n\nCapacitor 8\nYes\nYes\n\n\nBackground tracking\nYes\nYes\n\n\nMotion detection state machine\nYes\nNo\n\n\nNative HTTP upload\nYes, with SQLite queue and batching\nYes, best effort POST, no on-disk queue\n\n\nGeofencing\nYes, polygon as add-on\nCircular geofences on iOS and Android\n\n\nGeofence events sent to your server\nYes, via HTTP sync\nYes, native webhook\n\n\nTracking after app is swiped away (Android)\nYes\nYes, with url set\n\n\nTracking after reboot\nYes (startOnBoot)\nNo\n\n\nScheduling, odometer\nYes\nNo\n\n\n\nThe honest summary: Transistorsoft is the better fit when the app must decide on its own when to track, survive reboots and buffer weeks of points offline. The Capgo plugin is the better fit when the user or your app explicitly starts tracking, and you want accurate fixes with no license and readable code.\nInstall and configure\nbun add @capgo/background-geolocation\nbunx cap sync\niOS\nAdd the usage strings and the location background mode to ios/App/App/Info.plist:\n&lt;key&gt;NSLocationWhenInUseUsageDescription&lt;/key&gt;\n&lt;string&gt;We use your location to show your route.&lt;/string&gt;\n&lt;key&gt;NSLocationAlwaysAndWhenInUseUsageDescription&lt;/key&gt;\n&lt;string&gt;We use your location in the background to record your route while the phone is locked.&lt;/string&gt;\n&lt;key&gt;UIBackgroundModes&lt;/key&gt;\n&lt;array&gt;\n  &lt;string&gt;location&lt;/string&gt;\n&lt;/array&gt;\nRemember that App Store uploads require Xcode 26 since April 2026. If your CI image is older, the upload will be rejected even if the build succeeds. Capgo Build runs on current Xcode images if you do not want to maintain Macs.\nAndroid\nThe plugin uses a foreground service with a persistent notification while tracking in the background. On Android 13 and newer, it requests POST_NOTIFICATIONS after location is granted so that notification can be shown.\nSet useLegacyBridge in capacitor.config.ts. Without it, location callbacks to the WebView can stop after about five minutes in the background:\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.tracker',\n  appName: 'Tracker',\n  webDir: 'dist',\n  android: {\n    useLegacyBridge: true,\n  },\n};\n\nexport default config;\nYou can customize the notification channel name, icon and color through strings.xml keys documented in the plugin docs.\nStart tracking\nimport { BackgroundGeolocation } from '@capgo/background-geolocation';\n\nexport async function startShift(token: string) {\n  await BackgroundGeolocation.start(\n    {\n      backgroundTitle: 'Shift in progress',\n      backgroundMessage: 'Your location is shared with dispatch until you end the shift.',\n      requestPermissions: true,\n      stale: false,\n      distanceFilter: 25,\n      url: 'https://api.example.com/v1/locations',\n      headers: { Authorization: `Bearer ${token}` },\n      minIntervalMs: 30_000,\n    },\n    (location, error) =&gt; {\n      if (error) {\n        if (error.code === 'NOT_AUTHORIZED') {\n          BackgroundGeolocation.openSettings();\n        }\n        console.error(error);\n        return;\n      }\n      if (location) {\n        // Update the UI while the WebView is alive\n        console.log(location.latitude, location.longitude, location.accuracy);\n      }\n    },\n  );\n}\n\nexport async function endShift() {\n  await BackgroundGeolocation.stop();\n}\nTwo options matter more than they look:\n\nbackgroundMessage is what turns on background updates, on both platforms. Without it, updates are only guaranteed in the foreground. On Android it is also the text of the foreground service notification.\nurl sends each point from native code with a \"source\": \"native\" field in the body. That path does not depend on the WebView, which is what keeps data flowing when Android throttles the WebView or iOS suspends JavaScript. On Android, setting url also makes the service sticky, so points keep reaching your server after the app is swiped away. You need both options for reliable background tracking.\n\nWhen the access token expires, rotate it without restarting the session:\nawait BackgroundGeolocation.updateHeaders({\n  headers: { Authorization: `Bearer ${newToken}` },\n});\nGeofencing\nTransistorsoft users often rely on its geofencing. The Capgo plugin covers circular regions with native APIs on both platforms:\nimport { BackgroundGeolocation } from '@capgo/background-geolocation';\n\nawait BackgroundGeolocation.setupGeofencing({\n  url: 'https://api.example.com/v1/geofence-events',\n  headers: { Authorization: 'Bearer &lt;token&gt;' },\n  notifyOnEntry: true,\n  notifyOnExit: true,\n  payload: { driverId: 'd-381' },\n  backgroundLocation: true, // Android only, needs ACCESS_BACKGROUND_LOCATION in your manifest\n});\n\nawait BackgroundGeolocation.addGeofence({\n  identifier: 'depot-north',\n  latitude: 48.8584,\n  longitude: 2.2945,\n  radius: 200,\n  payload: { depotId: 'north' },\n});\n\nawait BackgroundGeolocation.addListener('geofenceTransition', (event) =&gt; {\n  console.log(event.identifier, event.transition, event.payload);\n});\niOS geofencing needs Always authorization. On Android 10 and newer, background geofencing needs ACCESS_BACKGROUND_LOCATION, which the plugin does not add for you. Only add it if your app has Google Play approval for background location. If your geofences behave strangely on iOS, read our guide on why geofences do not trigger on iOS.\nMigrating from Transistorsoft\nThe APIs are different, so plan a small rewrite of your location service rather than a search and replace.\n\n\n\nTransistorsoft concept\nCapgo equivalent\n\n\n\n\nready(config) + start()\nstart(options, callback)\n\n\nonLocation listener\nThe start() callback\n\n\nstop()\nstop()\n\n\ndistanceFilter\ndistanceFilter\n\n\nurl, headers HTTP sync\nurl, headers, updateHeaders()\n\n\naddGeofence / onGeofence\naddGeofence / geofenceTransition\n\n\nremoveGeofence(s)\nremoveGeofence / removeAllGeofences\n\n\ngetGeofences\ngetMonitoredGeofences\n\n\nPermission helpers\ncheckPermissions / requestPermissions\n\n\nMotion detection, schedule, odometer\nImplement in your app logic or on the server\n\n\n\nSteps that work well in practice:\n\nWrap location access behind a small service in your app (startTracking, stopTracking, onPoint). Most apps already have one.\nImplement the service with the Capgo plugin behind a feature flag or a separate build.\nMake your backend accept the plugin’s location JSON. The body matches the Location type (latitude, longitude, accuracy, speed, bearing, time and so on) plus source.\nRemove the Transistorsoft plugin, its license keys, extra Gradle variables and the background modes you no longer need.\nTest on real devices with the screen locked for at least 30 minutes, on one Pixel, one Samsung and one iPhone at minimum.\n\nNative plugin changes need a new store build. Once that build is live, you can keep shipping JavaScript fixes to your tracking UI with Capgo live updates without another review cycle.\nWhere the Capgo plugin is not enough\nBe clear on these before you switch:\n\nNo persistent queue. Native POSTs are best effort. If the device is offline, failed points are logged and dropped. If you cannot lose a point, also store points locally in the callback (for example with SQLite) and sync them from the app, or keep Transistorsoft.\nNo restart after reboot. Tracking resumes the next time the user opens the app.\nNo automatic motion detection. The app decides when to start and stop.\niOS termination. If the user force quits on iOS, standard location updates stop. That is an OS rule, not a plugin limitation.\n\nFor more context on what Capacitor can run while the app is backgrounded, see how background tasks work in Capacitor.\nTroubleshooting\nUpdates stop after a few minutes on Android. Check useLegacyBridge: true, confirm the foreground service notification is visible, and disable battery optimization for the app during testing on aggressive OEMs. Use the url option so delivery does not depend on the WebView.\nNo updates in the background on iOS. Confirm UIBackgroundModes contains location, that you passed backgroundMessage, and that you called start() while the app was in the foreground. Our guide on why iOS stops background location updates walks through every cause.\nNOT_AUTHORIZED error. The user denied location. Call openSettings() after explaining why the app needs it.\nJumpy points indoors. Raise distanceFilter, ignore points with large accuracy values, and on Android consider networkFallback: true only if coarse fixes are acceptable.\nMock locations in a delivery app. Each Location has a simulated flag. For stricter checks, add @capgo/capacitor-mock-location-detector.\nChoosing\nPick Transistorsoft if you need motion based auto start, reboot persistence, an offline queue and polygon geofences, and the license cost fits. Pick @capgo/background-geolocation if your tracking is session based, you want readable code and no per app license, and you are fine owning queueing in your app. If you are replacing several paid native SDKs at once, the Ionic enterprise plugin alternatives page lists the other Capgo replacements.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/transistorsoft-background-geolocation-alternative/"},"keywords":"transistorsoft background geolocation alternative, capacitor background geolocation, background location capacitor, capacitor geofencing, @capgo/background-geolocation, free background geolocation plugin","articleSection":"Alternatives"},{"@type":"FAQPage","@id":"https://capgo.app/blog/transistorsoft-background-geolocation-alternative/#faqpage","url":"https://capgo.app/blog/transistorsoft-background-geolocation-alternative/","mainEntity":[{"@type":"Question","name":"Is there a free alternative to Transistorsoft background geolocation for Capacitor?","acceptedAnswer":{"@type":"Answer","text":"Yes. @capgo/background-geolocation is MIT licensed and free for release builds on iOS and Android. It covers background tracking, native geofencing, native HTTP POST of locations and permission handling for Capacitor 8."}},{"@type":"Question","name":"Does Transistorsoft background geolocation need a license in production?","acceptedAnswer":{"@type":"Answer","text":"Since version 9, Transistorsoft requires a license key for release builds on both iOS and Android. Debug builds work without a key. Version 8 keys do not work with version 9."}},{"@type":"Question","name":"Can @capgo/background-geolocation keep tracking after the user swipes the app away?","acceptedAnswer":{"@type":"Answer","text":"On Android, when you set the url option, the foreground service is sticky and keeps POSTing locations natively after the process is killed. On iOS, the system stops standard location updates when the user terminates the app, which no plugin can override."}},{"@type":"Question","name":"Does the Capgo plugin support geofencing?","acceptedAnswer":{"@type":"Answer","text":"Yes. It exposes setupGeofencing, addGeofence, removeGeofence, removeAllGeofences, getMonitoredGeofences and a geofenceTransition event, plus an optional native webhook for transitions that happen while the WebView is suspended."}}]}]}</script>
