<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/automatic-capacitor-android-build-gitlab/#newsarticle","url":"https://capgo.app/blog/automatic-capacitor-android-build-gitlab/","headline":"Automatic Capacitor Android build with GitLab","description":"How to set up a CI/CD pipeline for your Android Ionic app using fastlane and GitLab in 5 mins","image":["https://capgo.app/android_app_gitlab.webp"],"datePublished":"2023-09-27T00:00:00.000Z","dateModified":"2026-08-25T01:16:42.000Z","inLanguage":"en","articleBody":"Automatic Android Builds with GitLab CI\nSetting up CI/CD for Capacitor apps can be complex and time-consuming. Here’s what you need to know:\nPrerequisites\nBefore starting, you’ll need to set up:\n\nA GitLab account with admin access\nYour app already published on Google Play Store with proper signing\nAndroid signing key and keystore files\nGoogle Cloud Console project with Play Store API enabled\nService account with proper permissions\nUnderstanding of GitLab CI/CD workflows\nKnowledge of Fastlane configuration\nTime to maintain and debug the pipeline\n\nCapgo Build for CI/CD by Capgo\nSkip the Fastlane, Gradle runner, keystore, and upload-script maintenance. Capgo Build runs signed native Android builds from your existing CI/CD pipeline:\n\nWorks with your pipeline: Trigger Capgo Build from GitLab CI, GitHub Actions, Jenkins, or local scripts after your web build and npx cap sync.\nSigning from CI secrets: Keep Android keystores, key aliases, passwords, and Play Console service account JSON in your own CI secrets.\nNo native runner upkeep: Capgo Build provides maintained Android build environments, so you do not have to manage SDK images, Gradle cache issues, or Fastlane lanes.\nArtifacts and submission: Download signed artifacts for QA or submit release builds through the Capgo CLI.\n\nPricing\n\nCapgo plans start at $12/month\nIncludes OTA updates and about 15 native builds per month\nExtra build minutes are billed by minute through credits\n\nSet up Capgo Build in CI/CD\nManual Setup Guide\nHere’s what you need to do:\nSteps to follow in the post\n\nCopy Fastlane files\nStoring your secrets in GitLab encrypted secrets\nCreating &amp; storing your Google Play service account key\nStoring your Android signing key\nSet up your GitLab workflow .yml file\n\n1. Copy Fastlane files\nFastlane is a Ruby library created to automate common mobile development tasks. Using Fastlane, you can configure custom “lanes” which bundle a series of “actions” that perform tasks that you’d normally perform using Android studio. You can do a lot with Fastlane, but for the purposes of this tutorial, we’ll be using only a handful of core actions.\nCreate a Fastlane folder at the root of your project and copy the following files:\nFastlane\ndefault_platform(:android)\n\nKEYSTORE_KEY_ALIAS = ENV[\"KEYSTORE_KEY_ALIAS\"]\nKEYSTORE_KEY_PASSWORD = ENV[\"KEYSTORE_KEY_PASSWORD\"]\nKEYSTORE_STORE_PASSWORD = ENV[\"KEYSTORE_STORE_PASSWORD\"]\n\nplatform :android do\n    desc \"Deploy a beta version to the Google Play\"\n    private_lane :verify_changelog_exists do |version_code: |\n      changelog_path = \"android/metadata/en-US/changelogs/#{version_code}.txt\"\n      UI.user_error!(\"Missing changelog file at #{changelog_path}\") unless File.exist?(changelog_path)\n      UI.message(\"Changelog exists for version code #{version_code}\")\n    end\n\n    private_lane :verify_upload_to_staging do |version_name: |\n      UI.message \"Skipping staging verification step\"\n    end\n    lane :beta do\n\t\t\t\tkeystore_path = \"#{Dir.tmpdir}/build_keystore.keystore\"\n\t\t\t\tFile.write(keystore_path, Base64.decode64(ENV['ANDROID_KEYSTORE_FILE']))\n\t\t\t\tjson_key_data = Base64.decode64(ENV['PLAY_CONFIG_JSON'])\n\t\t\t\tprevious_build_number = google_play_track_version_codes(\n\t\t\t\t\tpackage_name: ENV['DEVELOPER_PACKAGE_NAME'],\n\t\t\t\t\ttrack: \"internal\",\n\t\t\t\t\tjson_key_data: json_key_data,\n\t\t\t\t)[0]\n\n\t\t\t\tcurrent_build_number = previous_build_number + 1\n\t\t\t\tsh(\"export NEW_BUILD_NUMBER=#{current_build_number}\")\n        gradle(\n          task: \"clean bundleRelease\",\n          project_dir: 'android/',\n          print_command: false,\n          properties: {\n            \"android.injected.signing.store.file\" =&gt; \"#{keystore_path}\",\n            \"android.injected.signing.store.password\" =&gt; \"#{KEYSTORE_STORE_PASSWORD}\",\n            \"android.injected.signing.key.alias\" =&gt; \"#{KEYSTORE_KEY_ALIAS}\",\n            \"android.injected.signing.key.password\" =&gt; \"#{KEYSTORE_KEY_PASSWORD}\",\n\t\t\t\t\t\t'versionCode' =&gt; current_build_number\n          })\n        upload_to_play_store(\n\t\t\t\t\tpackage_name: ENV['DEVELOPER_PACKAGE_NAME'],\n\t\t\t\t\tjson_key_data: json_key_data,\n          track: 'internal',\n          release_status: 'completed',\n          skip_upload_metadata: true,\n          skip_upload_changelogs: true,\n          skip_upload_images: true,\n          skip_upload_screenshots: true,\n        )\n    end\n    lane :build do\n      gradle(\n        task: \"clean bundleRelease\",\n        project_dir: 'android/',\n        print_command: false,\n        properties: {\n          \"android.injected.signing.store.file\" =&gt; \"#{keystore_path}\",\n          \"android.injected.signing.store.password\" =&gt; \"#{KEYSTORE_STORE_PASSWORD}\",\n          \"android.injected.signing.key.alias\" =&gt; \"#{KEYSTORE_KEY_ALIAS}\",\n          \"android.injected.signing.key.password\" =&gt; \"#{KEYSTORE_KEY_PASSWORD}\",\n        })\n    end\n    lane :prod_release do\n      build_gradle = File.read(\"../android/app/build.gradle\")\n\n      verify_changelog_exists(version_code: build_gradle.match(/versionCode (\\d+)/)[1])\n      verify_upload_to_staging(version_name: build_gradle.match(/versionName '([\\d\\.]+)'/)[1])\n\n      supply(\n        track_promote_to: 'beta',\n        skip_upload_apk: true,\n        skip_upload_aab: true,\n        skip_upload_metadata: false,\n        skip_upload_changelogs: false,\n        skip_upload_images: false,\n        skip_upload_screenshots: false\n      )\n    end\nend\nStoring Your Secrets in GitLab CI/CD Variables\nGitLab provides a way to store encrypted CI/CD variables, similar to GitHub’s repository secrets. To store your sensitive information securely.\n\nGo to your GitLab project’s Settings.\nNavigate to CI/CD &gt; Variables\nAdd the following variables:\n\n\nANDROID_KEYSTORE_FILE:  the base64-encoded .jks or .keystore file used to sign your Android builds. This will either be the keystore file associated with your upload key (if using Play App Signing), or your app signing key.\nKEYSTORE_KEY_PASSWORD: the password associated with the keystore file\nKEYSTORE_KEY_ALIAS: the key store alias\nKEYSTORE_STORE_PASSWORD: the private key password\nDEVELOPER_PACKAGE_NAME: your android app ID like com.example.app\nPLAY_CONFIG_JSON: The base64-encoded service account key JSON.\n\nCreating a Google Play Service Account Key\nTo generate the PLAY_CONFIG_JSON secret, follow these steps:\n\nGo to the Google Cloud Console\nCreate a new project or select an existing one\nEnable the Google Play Android Developer API\nCreate a service account:\n\nGo to “IAM &amp; Admin” &gt; “Service Accounts”\nClick “Create Service Account”\nGive it a name and description\nClick “Create and Continue”\nSkip role assignment and click “Done”\n\n\nGenerate a JSON key:\n\nFind your service account in the list\nClick the three dots menu &gt; “Manage keys”\nClick “Add Key” &gt; “Create new key”\nChoose JSON format\nClick “Create”\n\n\nGrant the service account access to your app in the Play Console:\n\nGo to Play Console\nNavigate to “Users and permissions”\nClick “Invite new users”\nEnter the service account email (ends with @*.iam.gserviceaccount.com)\nGrant “Release to production” permission\nClick “Invite user”\n\n\nConvert the JSON key to base64:\nbase64 -i path/to/your/service-account-key.json | pbcopy\n\nAdd the base64-encoded string as the PLAY_CONFIG_JSON variable in GitLab\n\nSet Up Your GitLab CI/CD Pipeline\nCreate a .gitlab-ci.yml file at the root of your project to define your CI/CD pipeline. Below is an example of how you can structure your pipeline:\n\nimage: mingc/android-build-box:latest\n\nstages:\n  - build\n  - upload_to_capgo\n  - build_and_upload_android\n\nbuild:\n  stage: build\n  tags:\n    - saas-linux-xlarge-amd64\n  cache:\n    - key:\n        files:\n          - bun.lockb\n      paths:\n        - .node_modules/\n  script:\n    - npm install\n    - npm run build\n  artifacts:\n    paths:\n      - node_modules/\n      - dist/\n  only:\n    - master\n\nupload_to_capgo:\n  stage: upload_to_capgo\n  tags:\n    - saas-linux-xlarge-amd64\n  script:\n    - npx @capgo/cli@latest bundle upload -a $CAPGO_TOKEN -c dev\n  dependencies:\n    - build\n  when: manual\n  only:\n    - master\n\nbuild_and_upload_android:\n  tags:\n    - saas-linux-xlarge-amd64\n  stage:    build_and_upload_android\n  cache:\n    - key:\n        files:\n          - android/gradle/wrapper/gradle-wrapper.properties\n      paths:\n        - ~/.gradle/caches/\n  script:\n    - npx cap sync android\n    - npx cap copy android\n    - bundle exec fastlane android beta # We do create a tag for the build to trigger XCode cloud builds\n  dependencies:\n    - build\n  when: manual\n  only:\n    - master\nTrigger the Pipeline\nWhenever you push a new tag to your GitLab repository, GitLab CI/CD will automatically trigger the defined pipeline, which will build and deploy your Android app using Fastlane.\nMake sure to adjust the paths and dependencies according to your project’s structure and requirements. This setup will help you automate the deployment of your Android app on GitLab CI/CD.\nConclusion\nBy configuring GitLab CI/CD with the mingc/android-build-box Docker image, you can automate the Android app build process, making your development workflow more efficient and reliable. This automation frees up your time to focus on the core aspects of app development, ultimately helping you deliver high-quality Android apps more efficiently.\nKeep going from Automatic Capacitor Android build with GitLab\nIf you are using Automatic Capacitor Android build with GitLab to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Anik Dhabal Babu","url":"https://x.com/anikdhabal","image":"https://avatars.githubusercontent.com/u/81948346?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/automatic-capacitor-android-build-gitlab/"},"keywords":"Fastlane, CI/CD, Android, automatic build, automatic release, mobile app updates","articleSection":"CI/CD"}</script>
