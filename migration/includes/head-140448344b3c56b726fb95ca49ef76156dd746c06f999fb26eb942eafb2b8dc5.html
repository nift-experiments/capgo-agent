bPage","@id":"https://capgo.app/tools/ios-udid-finder/","url":"https://capgo.app/tools/ios-udid-finder/","name":"iOS UDID Finder"}}]},{"@type":"FAQPage","@id":"https://capgo.app/tools/ios-udid-finder/#faqpage","url":"https://capgo.app/tools/ios-udid-finder/","mainEntity":[{"@type":"Question","name":"What is a UDID?","acceptedAnswer":{"@type":"Answer","text":"A UDID (Unique Device Identifier) is a permanent identifier Apple assigns to every iPhone, iPad, and iPod touch. Developers register UDIDs in Apple Developer so a device can install development and ad hoc builds. Recent devices use a 25-character format such as 00008110-001A2B3C4D5E6F7G, older ones a 40-character hexadecimal string."}},{"@type":"Question","name":"How do I find my iPhone UDID without a computer?","acceptedAnswer":{"@type":"Answer","text":"Open this page in Safari on the iPhone, tap Download UDID profile, then open Settings, tap Profile Downloaded, and install it. Safari then opens a result page with your UDID and a copy button. No Mac, PC, iTunes, Finder, or Xcode is needed."}},{"@type":"Question","name":"Why can I not see my UDID in the iPhone Settings app?","acceptedAnswer":{"@type":"Answer","text":"Apple does not show the UDID anywhere in Settings, and since iOS 7 apps cannot read it either. The only on-device way is a profile-service request like this one, which asks iOS to share the UDID with the page you opened."}},{"@type":"Question","name":"Why do I need to install a profile?","acceptedAnswer":{"@type":"Answer","text":"The configuration profile is Apple’s standard Profile Service mechanism. It only asks iOS for device attributes (UDID, product, version, serial, IMEI, MEID, device name), sends them back to this site, and then shows them to you. It does not install certificates, change settings, or give remote access to the device."}},{"@type":"Question","name":"Is it safe? Is my device data stored?","acceptedAnswer":{"@type":"Answer","text":"Capgo signs the profile and only requests read-only identifiers. The device details are passed to the result page in the redirect link and in a backup cookie that expires after five minutes. When the result page loads, it removes the details from the address bar and clears the cookie. They are not saved to a database or shared with third parties."}},{"@type":"Question","name":"How do I remove the profile after getting my UDID?","acceptedAnswer":{"@type":"Answer","text":"The profile only collects identifiers and is not kept as a permanent configuration profile. If it ever shows up, go to Settings, General, VPN & Device Management, tap the Capgo profile, and select Remove Profile."}},{"@type":"Question","name":"Do I need a UDID for TestFlight?","acceptedAnswer":{"@type":"Answer","text":"No. TestFlight testers are invited by email or a public link, and no UDID registration is needed. You need the UDID for development builds, ad hoc distribution, and tools that install builds directly on a registered device."}},{"@type":"Question","name":"How do I register a UDID in Apple Developer?","acceptedAnswer":{"@type":"Answer","text":"Go to Certificates, Identifiers & Profiles, open Devices, select the plus button, enter a device name and the UDID, and save. Then edit or regenerate your development or ad hoc provisioning profile so it includes the new device, and rebuild the app."}},{"@type":"Question","name":"Can I find a UDID on Windows or Mac instead?","acceptedAnswer":{"@type":"Answer","text":"Yes. On a Mac, connect the device, select it in Finder, and click the text under the device name until the UDID appears, or open Xcode, Window, Devices and Simulators. On Windows, the same click trick works in iTunes or the Apple Devices app. This page avoids the cable and computer entirely."}},{"@type":"Question","name":"Does it work on iPad and with browsers other than Safari?","acceptedAnswer":{"@type":"Answer","text":"It works on iPhone, iPad, and iPod touch. Use Safari, because iOS only lets Safari hand configuration profiles to the Settings app. Devices managed by an MDM may block profile installation; in that case ask your administrator or use Finder or Xcode."}}]},{"@type":"HowTo","@id":"https://capgo.app/tools/ios-udid-finder/#howto","name":"How to find your iPhone or iPad UDID without a Mac","description":"Get the UDID of an iPhone or iPad directly on the device with Safari and a configuration profile.","step":[{"@type":"HowToStep","position":1,"name":"Open this page in Safari on the device","text":"Use the physical iPhone or iPad whose UDID you need. Chrome and other iOS browsers cannot pass profiles to Settings, so use Safari.","url":"https://capgo.app/tools/ios-udid-finder/#step-1"},{"@type":"HowToStep","position":2,"name":"Download the UDID profile","text":"Tap Download UDID profile and choose Allow when iOS asks to download a configuration profile.","url":"https://capgo.app/tools/ios-udid-finder/#step-2"},{"@type":"HowToStep","position":3,"name":"Install it from Settings","text":"Open the Settings app, tap Profile Downloaded near the top, select Install, and enter your device passcode to confirm.","url":"https://capgo.app/tools/ios-udid-finder/#step-3"},{"@type":"HowToStep","position":4,"name":"Copy your UDID","text":"Safari opens the result page with the UDID, model, iOS version, and serial number. Tap Copy next to the UDID and send it to your developer.","url":"https://capgo.app/tools/ios-udid-finder/#step-4"}],"totalTime":"PT1M","tool":[{"@type":"HowToTool","name":"iPhone or iPad"},{"@type":"HowToTool","name":"Safari"}]},{"@type":"WebPage","@id":"https://capgo.app/tools/ios-udid-finder/#webpage","name":"iOS UDID Finder: Find Your iPhone UDID Without a Mac","description":"Free iPhone UDID finder. Get your iPhone or iPad UDID in seconds from Safari, without iTunes, Finder, Xcode, or a Mac, plus model, serial, and iOS version.","url":"https://capgo.app/tools/ios-udid-finder/"}]}</script>
