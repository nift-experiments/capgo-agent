<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/upgrade-capacitor-plugin-to-capacitor-8/#newsarticle","url":"https://capgo.app/blog/upgrade-capacitor-plugin-to-capacitor-8/","headline":"How to Upgrade a Capacitor Plugin to Capacitor 8","description":"Upgrade a Capacitor plugin to Capacitor 8: peer dependencies, SDK 36, AGP 8.13, Kotlin 2.2 compilerOptions, Java 21, iOS 15, Package.swift and release steps.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To upgrade a Capacitor plugin to Capacitor 8, run bunx @capacitor/plugin-migration-v7-to-v8@latest from the plugin root, then review the diff: Capacitor dependencies move to 8.x, Android targets SDK 36 with minSdk 24, AGP 8.13 and Gradle 8.14.3, Kotlin goes to 2.2.20 with compilerOptions, and iOS moves to a 15.0 deployment target with capacitor-swift-pm 8. Finish by building the example app on both platforms and publishing a new major version.\nThis guide is for plugin maintainers. App teams should follow How to Upgrade Your Capacitor App to Capacitor 8.\nWhat changes for plugin authors\n\n\n\nFile\nChange\n\n\n\n\npackage.json\n@capacitor/core peer to &gt;=8.0.0, dev deps @capacitor/cli, core, android, ios to ^8.0.0\n\n\nandroid/build.gradle\ncompileSdk = 36, minSdkVersion = 24, targetSdkVersion = 36, AndroidX bumps\n\n\nandroid/build.gradle (buildscript)\nAGP 8.13.0, google-services 4.4.4, Kotlin 2.2.20\n\n\nandroid/gradle/wrapper/gradle-wrapper.properties\nGradle 8.14.3\n\n\nAll Gradle files\n= assignment syntax, kotlinOptions replaced by compilerOptions\n\n\n*.podspec\ns.ios.deployment_target = '15.0'\n\n\nPackage.swift\n.iOS(.v15) and capacitor-swift-pm from: \"8.0.0\"\n\n\n\nPlatform tooling you need locally and in CI: Node.js 22+, Xcode 26+, Android Studio Otter (2025.2.1) or later, and a JDK 21.\nOption 1: run the official migration tool\nFrom the plugin root, on a clean git tree:\nbunx @capacitor/plugin-migration-v7-to-v8@latest\nThe tool:\n\nUpdates the Capacitor dependencies and sets your package version to 8.0.0.\nUpdates dev tooling that the official template uses: @capacitor/docgen, Rollup, TypeScript, @types/node, and Prettier (from v2 to v3 if you use @ionic/prettier-config, plus prettier-plugin-java).\nDeletes node_modules/@capacitor and package-lock.json, then runs npm install. If you use Bun, that step fails with a warning. Run bun install yourself afterwards and commit bun.lock.\nRegenerates the Gradle wrapper with ./gradlew wrapper --gradle-version 8.14.3.\nRewrites build.gradle: SDK levels, AndroidX versions, AGP, Kotlin version, Java 21 compatibility, and kotlinOptions to compilerOptions.\nRaises the podspec deployment target from 14.0 to 15.0, and in Package.swift sets .iOS(.v15) and from: \"8.0.0\" for capacitor-swift-pm.\n\nWhen a string it expects is missing, it logs Unable to find \"...\" in &lt;file&gt;. Try updating it manually. Every one of those lines is a manual step for you. Plugins with custom Gradle logic, non-standard folders or renamed files produce the most of them.\nIf Prettier moved from v2 to v3, run your format and lint scripts after the migration. The formatting diff can be large, so commit it separately from the functional changes.\nOption 2: upgrade manually\nUse this when the tool can’t parse your files, or when you want to review each change. The steps follow the official plugin upgrade guide.\n1. Dependencies\n{\n  \"devDependencies\": {\n    \"@capacitor/android\": \"^8.0.0\",\n    \"@capacitor/cli\": \"^8.0.0\",\n    \"@capacitor/core\": \"^8.0.0\",\n    \"@capacitor/ios\": \"^8.0.0\"\n  },\n  \"peerDependencies\": {\n    \"@capacitor/core\": \"&gt;=8.0.0\"\n  }\n}\n2. Android SDK levels and Gradle syntax\nandroid {\n    namespace = \"com.example.plugin\"\n    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36\n    defaultConfig {\n        minSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24\n        targetSdkVersion = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36\n    }\n    lintOptions {\n        abortOnError = false\n    }\n}\nKeep the project.hasProperty(...) ? rootProject.ext... : default pattern. It lets the host app’s variables.gradle control the values, which avoids the “compile against version 36” class of errors in apps.\nThe = syntax applies to properties only. Method calls like mavenCentral() stay unchanged, and maven { url = \"...\" } needs the =.\n3. AndroidX defaults\nOnly bump libraries your plugin actually uses. The Capacitor 8 defaults are:\next {\n    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'\n    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'\n    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'\n    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'\n    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.17.0'\n    androidxActivityVersion = project.hasProperty('androidxActivityVersion') ? rootProject.ext.androidxActivityVersion : '1.11.0'\n    androidxWebkitVersion = project.hasProperty('androidxWebkitVersion') ? rootProject.ext.androidxWebkitVersion : '1.14.0'\n}\nOthers from the official list: androidxCoordinatorLayoutVersion 1.3.0, androidxFragmentVersion 1.8.9, firebaseMessagingVersion 25.0.1, androidxBrowserVersion 1.9.0, androidxMaterialVersion 1.13.0, androidxExifInterfaceVersion 1.4.1, coreSplashScreenVersion 1.2.0.\n4. AGP and the Gradle wrapper\nbuildscript {\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.13.0'\n    }\n}\ncd android\n./gradlew wrapper --distribution-type all --gradle-version 8.14.3\nIf your plugin uses Firebase or other Google Services, set com.google.gms:google-services to 4.4.4.\n5. Java 21 and Kotlin 2.2\nJava 21 is recommended for AGP 8.13 and SDK 36. Java 17 still works for the plugin itself.\ncompileOptions {\n    sourceCompatibility = JavaVersion.VERSION_21\n    targetCompatibility = JavaVersion.VERSION_21\n}\nFor Kotlin plugins, update the default version and move jvmTarget out of kotlinOptions. Kotlin 2.2 makes the old block an error:\nimport org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\nbuildscript {\n    ext.kotlin_version = project.hasProperty(\"kotlin_version\") ? rootProject.ext.kotlin_version : '2.2.20'\n}\n\nandroid {\n    // remove: kotlinOptions { jvmTarget = '17' }\n}\n\nkotlin {\n    compilerOptions {\n        jvmTarget = JvmTarget.JVM_21\n    }\n}\nKeep jvmTarget and targetCompatibility on the same Java version, or Gradle stops with an “Inconsistent JVM-target compatibility” error. If you still apply kotlin-android-extensions, remove it. Use kotlin-parcelize for @Parcelize and view binding for synthetic view access.\n6. iOS deployment target\nPodspec:\ns.ios.deployment_target = '15.0'\nPackage.swift:\nplatforms: [.iOS(.v15)],\ndependencies: [\n    .package(url: \"https://github.com/ionic-team/capacitor-swift-pm.git\", from: \"8.0.0\")\n],\nUse from:, not branch: or exact:. The app’s generated CapApp-SPM package pins capacitor-swift-pm to the exact version of @capacitor/ios the app installed, and a range lets SPM resolve your plugin against it.\nPlugins with the old Xcode project layout also need the deployment target raised in the project’s Build Settings and in ios/Podfile (platform :ios, '15.0').\nIf your plugin has no Package.swift yet, do that next. Apps created with Capacitor 8 default to SPM and will skip your plugin with a “not compatible with SPM” warning. Follow How to Migrate a Capacitor Plugin to Swift Package Manager.\nOption 3: let an agent do it\nThe open Capgo Skills include capacitor-plugin-upgrade-v7-to-v8, capacitor-plugin-upgrades for multi-version jumps, and capacitor-plugin-spm-support. Install with bunx skills add Cap-go/capgo-skills and ask your agent to upgrade the plugin. The skill runs the official tool, then handles the steps the tool logs as skipped. Review the diff the same way you would review a teammate’s PR.\nWhich approach to use\n\n\n\nApproach\nGood fit\nWatch out for\n\n\n\n\nMigration tool\nPlugins generated from the official template\nSkipped steps on customized files, npm install step with Bun\n\n\nManual\nHeavily customized Gradle or Xcode setup\nEasy to miss one AndroidX or Kotlin change\n\n\nAgent + skill\nMany plugins to upgrade, or mixed layouts\nYou still own the review\n\n\n\nStart with the tool in almost every case. Its log tells you exactly what’s left.\nVerify before you publish\n\nbun install &amp;&amp; bun run build (or your verify script).\nAndroid: cd android &amp;&amp; ./gradlew clean build test. Build with JDK 21.\niOS with CocoaPods: cd ios &amp;&amp; pod install &amp;&amp; xcodebuild -workspace Plugin.xcworkspace -scheme Plugin -destination generic/platform=iOS (new layout plugins use xcodebuild -scheme &lt;YourPackageName&gt; -destination generic/platform=iOS).\niOS with SPM: swift package resolve, then build the scheme.\nInstall the plugin in a fresh Capacitor 8 app (bunx cap add ios gives you SPM by default) and in a CocoaPods app. Call every public method on a real device.\nRun bunx cap doctor in the test app.\n\nRelease\n\nBump to a new major (the tool uses 8.0.0). Raising minSdk and the iOS floor is a breaking change for consumers.\nWrite a short BREAKING.md or changelog entry: new peer range, minSdk 24, iOS 15, Java 21 for builds, any API behavior changes.\nKeep a 7.x branch if you still ship fixes for Capacitor 7 users, and publish those under a dist-tag such as latest-7.\nUpdate the README install section and the compatibility table.\n\nCapgo maintains a large set of plugins on this cycle, with each @capgo/* major tracking a Capacitor major. You can browse them in the plugin directory.\nTroubleshooting\ninvalid source release: 21. Gradle is running on JDK 17 or older. Use the JDK 21 bundled with Android Studio Otter and set JAVA_HOME in CI.\nUnsupported class file major version 65. The opposite problem: you run JDK 21 with an old Gradle wrapper that can’t read Java 21 class files. Regenerate the wrapper at 8.14.3.\nNamespace not specified. AGP 8+ requires namespace = \"...\" in the plugin’s android block. Older plugins only had a package attribute in AndroidManifest.xml. Move it to Gradle and remove package from the manifest.\n'compileDebugJavaWithJavac' task (current target is 21) and 'compileDebugKotlin' task (current target is 17). Your Kotlin jvmTarget doesn’t match targetCompatibility. Set both to 21 or both to 17.\nErrors mentioning proguard-android.txt with AGP 9. Some apps already run AGP 9. Switch to proguard-android-optimize.txt so your plugin builds in those apps too. Details are in fix Capacitor plugin build errors with AGP 9.\nSPM: product 'Capacitor' required by package ... not found. Your Package.swift dependency line has a typo or uses a version that doesn’t exist. Use from: \"8.0.0\" against https://github.com/ionic-team/capacitor-swift-pm.git.\n16 KB page size warnings in Play Console. If your plugin ships native .so libraries, rebuild them with 16 KB alignment. See Android 16 KB page size and Capacitor plugins.\nOnce the plugin is on 8, the next step is getting ready for 9. Preparing for Capacitor 9 lists the changes plugin teams can make now without breaking Capacitor 8 users.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/upgrade-capacitor-plugin-to-capacitor-8/"},"keywords":"upgrade Capacitor plugin to Capacitor 8, Capacitor plugin migration, plugin-migration-v7-to-v8, Capacitor 8 plugin, Kotlin 2.2 compilerOptions, Package.swift, capacitor-swift-pm 8","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/upgrade-capacitor-plugin-to-capacitor-8/#faqpage","url":"https://capgo.app/blog/upgrade-capacitor-plugin-to-capacitor-8/","mainEntity":[{"@type":"Question","name":"Which peer dependency range should a Capacitor 8 plugin declare?","acceptedAnswer":{"@type":"Answer","text":"The official guide uses >=8.0.0 for @capacitor/core in peerDependencies and ^8.0.0 for the Capacitor devDependencies. Many maintainers prefer ^8.0.0 for the peer to avoid claiming support for Capacitor 9 before testing it. Pick one deliberately and document it."}},{"@type":"Question","name":"Does the Capacitor 8 plugin upgrade require Swift Package Manager support?","acceptedAnswer":{"@type":"Answer","text":"No. A CocoaPods-only plugin still works in CocoaPods apps after you bump its podspec to iOS 15. But new Capacitor 8 apps default to SPM, and SPM apps cannot load a plugin without a Package.swift, so adding SPM support is strongly recommended."}},{"@type":"Question","name":"Is Java 21 mandatory for Capacitor 8 plugins?","acceptedAnswer":{"@type":"Answer","text":"Building any Capacitor 8 app requires a JDK 21 because @capacitor/android compiles with Java 21. For your plugin's own sourceCompatibility, Java 21 is recommended and Java 17 is still accepted, as long as your jvmTarget matches."}},{"@type":"Question","name":"What version number should my plugin use after the upgrade?","acceptedAnswer":{"@type":"Answer","text":"Ship a new major version. The peer dependency change and minSdk 24 / iOS 15 floors are breaking for consumers. The official migration tool sets the plugin version to 8.0.0, which also makes the supported Capacitor major obvious."}}]}]}</script>
