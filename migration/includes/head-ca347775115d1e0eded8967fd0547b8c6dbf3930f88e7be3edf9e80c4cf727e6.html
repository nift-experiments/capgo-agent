<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/capacitor-community-contacts-alternative/#newsarticle","url":"https://capgo.app/blog/capacitor-community-contacts-alternative/","headline":"Capacitor Community Contacts Alternative","description":"An alternative to the @capacitor-community/contacts plugin: update contacts, groups, pagination and permission-free picking, with a full migration guide.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"If you need a Capacitor community contacts alternative, the most complete drop-in replacement is @capgo/capacitor-contacts. It covers what @capacitor-community/contacts does (read, create, delete and pick contacts) and adds updating a contact without changing its ID, pagination, groups, accounts, native contact screens, and permission-free picking on Android, which matters for Google Play’s 2027 contacts policy. This guide compares both and maps every call so you can migrate in an afternoon.\nWhy look for an alternative\n@capacitor-community/contacts is maintained and has a Capacitor 8 release. It is a fine choice for simple read and create flows. Teams usually outgrow it for these reasons:\n\nNo update method. You can create and delete contacts, but not edit one. Delete and recreate gives the contact a new ID, which breaks any reference you stored and can lose data the plugin does not read.\nNo pagination. getContacts returns the whole address book in one call. On a device with 5,000 contacts and photos, that is slow and memory heavy.\nPicking needs the permission on Android. The Android pickContact requests the contacts permission group before opening the picker, then reads the contact from the address book. Under Google Play’s Contacts Permissions policy, apps targeting Android 17 can only keep READ_CONTACTS for core features.\nNo groups, accounts or native screens. No way to list groups, choose the account a new contact is saved to, or open the system “new contact” form.\n\nFeature comparison\n\n\n\nFeature\n@capacitor-community/contacts 8.0\n@capgo/capacitor-contacts 8.1\n\n\n\n\nRead one / all contacts\ngetContact, getContacts\ngetContactById, getContacts\n\n\nField selection\nprojection object\nfields array\n\n\nPagination\nNo\nlimit, offset\n\n\nCount contacts\nNo\ncountContacts\n\n\nCreate\ncreateContact\ncreateContact\n\n\nUpdate in place\nNo\nupdateContactById\n\n\nDelete\ndeleteContact\ndeleteContactById\n\n\nPick one contact\npickContact\npickContact\n\n\nPick several\nNo\npickContacts({ multiple: true })\n\n\nPick one phone/email/address without permission\nNo\npickContacts({ property })\n\n\nGroups\nNo\ngetGroups, getGroupById, createGroup, deleteGroupById\n\n\nAccounts\nNo\ngetAccounts\n\n\nNative create / view / edit screens\nNo\ndisplayCreateContact, displayContactById, displayUpdateContactById\n\n\nSeparate read and write permission states\nNo (single alias)\nreadContacts, writeContacts\n\n\niOS limited access state\nlimited\nlimited\n\n\nOpen settings\nNo\nopenSettings\n\n\n\nInstall\nbun add @capgo/capacitor-contacts\nbunx cap sync\nThe plugin does not add permissions to your Android manifest. Add only what you use:\n&lt;!-- Needed for getContacts, getContactById, countContacts, groups, accounts --&gt;\n&lt;uses-permission android:name=\"android.permission.READ_CONTACTS\" /&gt;\n&lt;!-- Needed for createContact, updateContactById, deleteContactById, groups writes --&gt;\n&lt;uses-permission android:name=\"android.permission.WRITE_CONTACTS\" /&gt;\nOn iOS, add NSContactsUsageDescription to Info.plist if you read or write the address book. Picking does not need it.\nMigration guide, call by call\nPermissions\n// Before\nimport { Contacts } from '@capacitor-community/contacts';\nconst perm = await Contacts.requestPermissions();\nif (perm.contacts !== 'granted') return;\n\n// After\nimport { CapacitorContacts } from '@capgo/capacitor-contacts';\nconst status = await CapacitorContacts.requestPermissions({ permissions: ['readContacts'] });\nif (status.readContacts !== 'granted' &amp;&amp; status.readContacts !== 'limited') {\n  await CapacitorContacts.openSettings();\n  return;\n}\nOn iOS 18 and later, users can grant access to a subset of contacts. The plugin reports that as limited. Treat it as granted and only expect the shared contacts.\nRead all contacts\n// Before: whole address book, projection object\nconst { contacts } = await Contacts.getContacts({\n  projection: { name: true, phones: true, emails: true },\n});\nconst first = contacts[0];\nconsole.log(first.name?.display, first.phones?.[0]?.number);\n\n// After: fields array, paginated\nconst pageSize = 200;\nlet offset = 0;\nfor (;;) {\n  const { contacts } = await CapacitorContacts.getContacts({\n    fields: ['displayName', 'givenName', 'familyName', 'phoneNumbers', 'emailAddresses'],\n    limit: pageSize,\n    offset,\n  });\n  render(contacts);\n  if (contacts.length &lt; pageSize) break;\n  offset += pageSize;\n}\n\ndeclare function render(list: unknown[]): void;\nUse countContacts() first if you want to show a progress bar.\nRead one contact\n// Before\nconst { contact } = await Contacts.getContact({\n  contactId: id,\n  projection: { name: true, phones: true },\n});\n\n// After\nconst { contact } = await CapacitorContacts.getContactById({\n  id,\n  fields: ['displayName', 'phoneNumbers'],\n});\nif (!contact) console.log('Not found');\nCreate a contact\n// Before\nconst { contactId } = await Contacts.createContact({\n  contact: {\n    name: { given: 'Ada', family: 'Lovelace' },\n    phones: [{ type: PhoneType.Mobile, number: '+44 20 7946 0000' }],\n    emails: [{ type: EmailType.Work, address: 'ada@example.com' }],\n  },\n});\n\n// After\nconst { id } = await CapacitorContacts.createContact({\n  contact: {\n    givenName: 'Ada',\n    familyName: 'Lovelace',\n    phoneNumbers: [{ type: 'MOBILE', value: '+44 20 7946 0000' }],\n    emailAddresses: [{ type: 'WORK', value: 'ada@example.com' }],\n  },\n});\ndisplayName is read only in the Capgo plugin. Write givenName and familyName, and the device formats the display name.\nUpdate a contact (new)\nawait CapacitorContacts.updateContactById({\n  id,\n  contact: {\n    givenName: 'Ada',\n    familyName: 'King',\n    jobTitle: 'Analyst',\n    phoneNumbers: [{ type: 'MOBILE', value: '+44 20 7946 0000' }],\n  },\n});\nThe ID stays the same, so any reference you saved still works. Read the contact first and send back the fields you want to keep, so you do not clear something by accident.\nIf you prefer to let the user edit, open the system editor:\nawait CapacitorContacts.displayUpdateContactById({ id });\nDelete a contact\n// Before\nawait Contacts.deleteContact({ contactId: id });\n\n// After\nawait CapacitorContacts.deleteContactById({ id });\nPick a contact\n// Before: requests the contacts permission on Android first\nconst { contact } = await Contacts.pickContact({\n  projection: { name: true, phones: true },\n});\n\n// After: one phone number, no permission on Android or iOS\nimport { ContactProperty } from '@capgo/capacitor-contacts';\n\nconst { contacts } = await CapacitorContacts.pickContacts({\n  property: ContactProperty.PhoneNumber,\n});\nconst phone = contacts[0]?.phoneNumbers?.[0]?.value;\nIf you need the full contact record from the picker, call pickContact() without property. On Android that returns the full contact only when READ_CONTACTS is granted.\nField mapping\n\n\n\nCommunity payload\nCapgo Contact\n\n\n\n\ncontactId\nid\n\n\nname.display\ndisplayName (read only)\n\n\nname.given / middle / family\ngivenName / middleName / familyName\n\n\nname.prefix / suffix\nnamePrefix / nameSuffix\n\n\norganization.company\norganizationName\n\n\norganization.jobTitle\njobTitle\n\n\nbirthday { day, month, year }\nbirthday { day, month, year }\n\n\nnote\nnote\n\n\nphones[].number\nphoneNumbers[].value\n\n\nemails[].address\nemailAddresses[].value\n\n\nurls[] (strings)\nurlAddresses[].value\n\n\npostalAddresses[].region / postcode\npostalAddresses[].state / postalCode\n\n\nimage.base64String\nphoto (base64 string)\n\n\n\nType values change too: the Capgo plugin uses uppercase strings such as 'MOBILE', 'HOME', 'WORK' for phones and emails.\nMigrate one screen at a time\nThe two plugins register under different native names (Contacts and CapacitorContacts), so they can be installed together while you move call sites. A small adapter keeps the rest of your app unchanged:\nimport { CapacitorContacts } from '@capgo/capacitor-contacts';\n\nexport interface AppContact {\n  id: string;\n  name: string;\n  phones: string[];\n}\n\nexport async function listContacts(limit = 200, offset = 0): Promise&lt;AppContact[]&gt; {\n  const { contacts } = await CapacitorContacts.getContacts({\n    fields: ['displayName', 'phoneNumbers'],\n    limit,\n    offset,\n  });\n  return contacts.map((c) =&gt; ({\n    id: c.id ?? '',\n    name: c.displayName ?? '',\n    phones: (c.phoneNumbers ?? []).map((p) =&gt; p.value),\n  }));\n}\nWhen the last call site is moved, remove the community plugin, run bunx cap sync, and check the merged Android manifest to confirm only the permissions you need remain.\nTroubleshooting\ngetContacts returns an empty list on iOS. The user granted limited access and shared no contacts, or denied access. Check readContacts and offer openSettings().\nCreated contact does not show in a specific account on Android. Pass an account (from getAccounts()) in the contact you create.\nPhotos make lists slow. Do not request photo in list views. Load it with getContactById when the user opens a contact.\nPlay Console flags READ_CONTACTS. Move invite and share flows to pickContacts({ property }) and remove the permission if nothing else needs it.\nShip it\nSwapping plugins is a native change, so it needs a store build. Capgo Build can produce iOS and Android builds in the cloud. After that, fixes to your contact screens are JavaScript and can go out with Capgo live updates. The full API is in the contacts plugin docs.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/capacitor-community-contacts-alternative/"},"keywords":"capacitor community contacts alternative, @capacitor-community/contacts, capacitor contacts plugin, update contact capacitor, ionic contacts plugin, @capgo/capacitor-contacts","articleSection":"Alternatives"},{"@type":"FAQPage","@id":"https://capgo.app/blog/capacitor-community-contacts-alternative/#faqpage","url":"https://capgo.app/blog/capacitor-community-contacts-alternative/","mainEntity":[{"@type":"Question","name":"Can @capacitor-community/contacts update an existing contact?","acceptedAnswer":{"@type":"Answer","text":"No. Version 8.0.0 exposes getContact, getContacts, createContact, deleteContact and pickContact. To change a contact you would delete and recreate it, which changes its ID. @capgo/capacitor-contacts has updateContactById, which keeps the ID."}},{"@type":"Question","name":"Is @capgo/capacitor-contacts free?","acceptedAnswer":{"@type":"Answer","text":"Yes. It is open source and published on npm. Version 8 targets Capacitor 8."}},{"@type":"Question","name":"Can I migrate one screen at a time?","acceptedAnswer":{"@type":"Answer","text":"Yes. Both plugins register under different native names (Contacts and CapacitorContacts), so they can be installed side by side during migration. Remove the old one once every call site is moved, and check that your manifest still declares the permissions you need."}},{"@type":"Question","name":"Do I need READ_CONTACTS to pick a contact on Android?","acceptedAnswer":{"@type":"Answer","text":"Not with @capgo/capacitor-contacts if you pass the property option to pickContacts. It returns one phone number, email or postal address without any permission. The community plugin requests the contacts permission before opening its picker."}}]}]}</script>
