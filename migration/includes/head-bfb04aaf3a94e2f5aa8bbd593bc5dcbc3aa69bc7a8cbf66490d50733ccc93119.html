<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-sign-in-with-okta-using-capacitor/#newsarticle","url":"https://capgo.app/blog/how-to-sign-in-with-okta-using-capacitor/","headline":"How to Sign In with Okta Using Capacitor","description":"Connect Okta to a Capacitor 8 app with OIDC and PKCE: create the native app integration, set redirect URIs, refresh tokens, logout, and fix Okta errors.","image":["https://capgo.app/login.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To sign in with Okta in a Capacitor app, create an OIDC Native Application in the Okta Admin Console, register a sign-in redirect URI such as com.example.app://oauth/okta, and run the authorization code flow with PKCE in a system browser. With @capgo/capacitor-social-login you configure Okta once with your issuer and client ID, then call SocialLogin.login({ provider: 'oauth2', options: { providerId: 'okta' } }).\nThis guide covers the Okta app integration, authorization server policies, the plugin code for iOS, Android and web, token refresh, user profile, logout, and the Okta errors that show up most often. It targets Capacitor 8 as of October 2026.\nWhat you need\n\nAn Okta org (Workforce Identity or Customer Identity) with admin access to create app integrations.\nA Capacitor 8 app.\nYour Capacitor appId, which you will reuse as the redirect scheme.\nOptionally, a backend API that validates Okta access tokens.\n\nHow Okta login works in a Capacitor app\nYour app never shows a password form. It opens the Okta sign-in page in a secure browser, Okta handles MFA and policies, then redirects back to your app with a code. The app exchanges the code plus the PKCE verifier for tokens.\n\n\n\nPlatform\nBrowser\nWhat you configure\n\n\n\n\niOS\nASWebAuthenticationSession\nNothing in Info.plist\n\n\nAndroid\nChrome Custom Tabs with androidUseCustomTabs: true (WebView by default)\nIntent filter for the redirect scheme\n\n\nWeb\nPopup or redirect\nTrusted Origin for CORS\n\n\n\nPrefer Custom Tabs on Android. Okta Verify, FastPass and passkeys behave better in the system browser than in an embedded WebView, and SSO cookies are shared with Chrome.\nStep 1: Create the Okta app integration\n\nIn the Okta Admin Console, go to Applications &gt; Applications &gt; Create App Integration.\nChoose OIDC - OpenID Connect and Native Application.\nName it, then under Grant type keep Authorization Code and tick Refresh Token if users should stay signed in.\nSign-in redirect URIs: com.example.app://oauth/okta. Add https://app.example.com/auth/callback if you ship a web build.\nSign-out redirect URIs: com.example.app://oauth/logout (and the web URL if needed).\nAssignments: pick who can use the app. Users who are not assigned get an error at sign-in.\nSave, then copy the Client ID. Under Client Credentials, client authentication should be None and Require PKCE should be on.\n\nOkta requires native redirect URIs to use a private-use scheme in reverse-domain form. Your bundle ID or application ID fits.\nCheck the authorization server\nGo to Security &gt; API &gt; Authorization Servers. Most setups use the default custom authorization server, issuer https://your-org.okta.com/oauth2/default.\n\n\n\nIssuer\nUse when\n\n\n\n\nhttps://your-org.okta.com/oauth2/default (custom)\nYour own API validates access tokens, you need custom scopes or claims\n\n\nhttps://your-org.okta.com (org)\nYou only need ID tokens or call Okta APIs\n\n\n\nOpen the server’s Access Policies tab. There must be a policy assigned to your app (or All clients) with a rule that allows the Authorization Code grant, and Refresh Token if you use it. A missing rule produces “Policy evaluation failed for this request”.\nTrusted Origins for web\nIf you run the same code on the web, add your web origin under Security &gt; API &gt; Trusted Origins with CORS checked. Without it, the browser blocks the token request.\nStep 2: Install the plugin\nbun add @capgo/capacitor-social-login\nbunx cap sync\nIf Okta is the only provider, turn off the bundled social SDKs in capacitor.config.ts:\nplugins: {\n  SocialLogin: {\n    providers: { google: false, facebook: false, apple: false, twitter: false },\n  },\n},\nStep 3: Add the Android redirect intent filter\nIn android/app/src/main/AndroidManifest.xml, inside the MainActivity activity:\n&lt;intent-filter&gt;\n    &lt;action android:name=\"android.intent.action.VIEW\" /&gt;\n    &lt;category android:name=\"android.intent.category.DEFAULT\" /&gt;\n    &lt;category android:name=\"android.intent.category.BROWSABLE\" /&gt;\n    &lt;data android:scheme=\"com.example.app\" android:host=\"oauth\" /&gt;\n&lt;/intent-filter&gt;\nMainActivity must stay android:launchMode=\"singleTask\", which is the Capacitor default, so the redirect arrives in the running activity.\nStep 4: Initialize Okta\nimport { Capacitor } from '@capacitor/core';\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nconst OKTA_ISSUER = 'https://your-org.okta.com/oauth2/default';\nconst isWeb = Capacitor.getPlatform() === 'web';\n\nexport async function initAuth() {\n  await SocialLogin.initialize({\n    oauth2: {\n      okta: {\n        appId: 'YOUR_OKTA_CLIENT_ID',\n        authorizationBaseUrl: `${OKTA_ISSUER}/v1/authorize`,\n        accessTokenEndpoint: `${OKTA_ISSUER}/v1/token`,\n        resourceUrl: `${OKTA_ISSUER}/v1/userinfo`,\n        redirectUrl: isWeb\n          ? 'https://app.example.com/auth/callback'\n          : 'com.example.app://oauth/okta',\n        scope: 'openid profile email offline_access',\n        pkceEnabled: true,\n        logoutUrl: `${OKTA_ISSUER}/v1/logout`,\n        postLogoutRedirectUrl: isWeb\n          ? 'https://app.example.com/'\n          : 'com.example.app://oauth/logout',\n        androidUseCustomTabs: true,\n      },\n    },\n  });\n}\nShorter alternative: set issuerUrl: OKTA_ISSUER and drop the endpoint URLs. The plugin loads /.well-known/openid-configuration and fills them in. Teams migrating from Ionic Auth Connect can use SocialLoginAuthConnect with the okta preset (issuer, clientId, redirectUrl), covered in the migration guide.\nStep 5: Sign in and read the profile\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nexport async function signInWithOkta() {\n  try {\n    const { result } = await SocialLogin.login({\n      provider: 'oauth2',\n      options: { providerId: 'okta' },\n    });\n\n    const profile = result.resourceData as {\n      sub: string;\n      email?: string;\n      name?: string;\n      preferred_username?: string;\n    } | null;\n\n    return {\n      accessToken: result.accessToken?.token,\n      idToken: result.idToken,\n      refreshToken: result.refreshToken,\n      scopes: result.scope,\n      profile,\n    };\n  } catch (error: any) {\n    if (error?.code === 'USER_CANCELLED') return null;\n    throw error;\n  }\n}\nresourceData holds the JSON returned by the /userinfo endpoint, so you get the profile without another request. To read the ID token claims for display, use SocialLogin.decodeIdToken({ idToken }). That call does not verify the signature.\nLogin options worth knowing:\n\nloginHint pre-fills the username.\nprompt: 'login' forces re-authentication even with an active Okta session.\nadditionalParameters: { idp: '0oa...' } routes straight to a specific identity provider configured in Okta.\n\nOn web with flow: 'redirect', call SocialLogin.handleRedirectCallback() on the callback page to finish the exchange.\nStep 6: Validate Okta tokens on your API\nimport { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst ISSUER = 'https://your-org.okta.com/oauth2/default';\nconst jwks = createRemoteJWKSet(new URL(`${ISSUER}/v1/keys`));\n\nexport async function verifyOktaAccessToken(token: string) {\n  const { payload } = await jwtVerify(token, jwks, {\n    issuer: ISSUER,\n    audience: 'api://default', // the Audience value of your authorization server\n  });\n  return payload; // payload.uid is the Okta user ID, payload.sub the login\n}\nFind the audience on the authorization server’s Settings tab. Do not validate access tokens from the org authorization server in your API. Okta does not support that.\nStep 7: Refresh tokens\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nexport async function ensureFreshOktaToken() {\n  const { isLoggedIn } = await SocialLogin.isLoggedIn({ provider: 'oauth2', providerId: 'okta' });\n  if (!isLoggedIn) {\n    await SocialLogin.refresh({ provider: 'oauth2', options: { providerId: 'okta' } });\n  }\n  const { accessToken } = await SocialLogin.getAuthorizationCode({ provider: 'oauth2', providerId: 'okta' });\n  return accessToken;\n}\nIf the refresh token is expired or revoked, refresh rejects. Catch that and send the user back to signInWithOkta().\nCheck the Refresh Token section of the app integration. With Rotate token after every use, each refresh returns a new refresh token and the old one stops working after a short grace period. The plugin replaces its stored copy automatically. If you hold the refresh token yourself (for example in the Keychain through @capgo/capacitor-native-biometric setData), use SocialLogin.refreshToken({ provider: 'oauth2', providerId: 'okta', refreshToken }) and save the returned value.\nStep 8: Sign out\nawait SocialLogin.logout({ provider: 'oauth2', providerId: 'okta' });\nThe plugin clears its stored tokens, then opens /v1/logout with id_token_hint and post_logout_redirect_uri. Okta ends the session and redirects to your sign-out URI, which must be listed in the app integration. On mobile the logout page opens in the system browser.\nTo also revoke the refresh token server-side, call Okta’s /v1/revoke endpoint from your backend or the app before logging out. See our token revocation guide for the pattern.\nTroubleshooting\n\n\n\nError\nCause\nFix\n\n\n\n\ninvalid_request: The 'redirect_uri' parameter must be a Login redirect URI in the client app settings\nRedirect not registered\nAdd the exact URI to Sign-in redirect URIs\n\n\nUser is not assigned to the client application\nMissing assignment\nAssign the user or group under Assignments\n\n\nPolicy evaluation failed for this request\nNo access policy rule for this client or grant\nAdd a policy and rule on the authorization server\n\n\ninvalid_client at token endpoint\nApp is Web or SPA type, or auth method is not None\nUse a Native app with client authentication None\n\n\nNo refresh token\nRefresh Token grant off, offline_access missing, or rule blocks it\nEnable grant, add scope, allow it in the rule\n\n\nAPI rejects token with bad issuer\nToken came from org server\nUse the custom authorization server issuer\n\n\nWeb: CORS error on /v1/token\nOrigin not trusted\nAdd a Trusted Origin with CORS\n\n\nAndroid stays in browser after login\nIntent filter mismatch\nMatch scheme and host to redirectUrl\n\n\n\nTurn on logsEnabled: true in the provider config while debugging to see the authorize URL and token responses in the native logs.\nRolling out Okta changes\nEnterprise customers often change policies or claims after launch. Client-side changes like scopes, claim handling or error screens can ship with Capgo live updates instead of a full store review. The native pieces (intent filter, new scheme) still require a new build.\nRelated guides\n\nHow to sign in with Auth0 using Capacitor\nHow to sign in with Microsoft Entra ID using Capacitor\nHow to add authentication to a Capacitor app\nOkta integration docs for the Social Login plugin\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-sign-in-with-okta-using-capacitor/"},"keywords":"okta capacitor, capacitor okta login, ionic okta, okta pkce mobile, okta oidc native app, okta refresh token capacitor, capacitor enterprise sso","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-sign-in-with-okta-using-capacitor/#faqpage","url":"https://capgo.app/blog/how-to-sign-in-with-okta-using-capacitor/","mainEntity":[{"@type":"Question","name":"Do I need an Okta client secret for a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"No. Create an OIDC Native Application, which is a public client. Client authentication is set to None and PKCE protects the code exchange. A secret shipped in an app bundle is not a secret."}},{"@type":"Question","name":"Which Okta issuer URL should I use?","acceptedAnswer":{"@type":"Answer","text":"Use a custom authorization server issuer such as https://your-org.okta.com/oauth2/default when your own API validates the access tokens. The org authorization server (https://your-org.okta.com) only issues access tokens for Okta's own APIs, so your backend cannot validate them."}},{"@type":"Question","name":"How do I get a refresh token from Okta?","acceptedAnswer":{"@type":"Answer","text":"Enable the Refresh Token grant type on the app integration, request the offline_access scope, and make sure the access policy rule on your authorization server allows the refresh token grant. Okta can rotate refresh tokens on every use, so save the new one each time."}},{"@type":"Question","name":"Why do users get 'User is not assigned to the client application'?","acceptedAnswer":{"@type":"Answer","text":"Okta only lets assigned users or groups sign in to an app integration. Open the app in the Admin Console, go to Assignments, and assign the users or a group such as Everyone."}}]}]}</script>
