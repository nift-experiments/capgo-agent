<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-prepare-app-store-and-google-play-listing/#newsarticle","url":"https://capgo.app/blog/how-to-prepare-app-store-and-google-play-listing/","headline":"How to Prepare Your App Store and Google Play Listing","description":"Prepare your App Store and Google Play listing: screenshot sizes, icon specs, metadata limits, privacy labels, Data safety, age ratings and a checklist.","image":["https://capgo.app/app_info.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"An App Store and Google Play listing needs the same core material: an icon, screenshots in the sizes each store accepts, a name and descriptions within strict character limits, a privacy policy URL, a privacy disclosure (Apple’s App Privacy labels and Google’s Data safety form), and an age rating questionnaire. Missing any one of these blocks submission, so prepare them while your app is still in development.\nBelow are the current requirements for both stores, what reviewers check, and a checklist you can work through in an afternoon.\nEverything you need at a glance\n\n\n\nAsset\nApp Store\nGoogle Play\n\n\n\n\nApp name\n30 characters\n30 characters\n\n\nSubtitle / short description\nSubtitle, 30 characters\nShort description, 80 characters\n\n\nDescription\n4,000 characters\nFull description, 4,000 characters\n\n\nKeywords\n100 bytes, comma separated\nNone (the description is indexed)\n\n\nPromotional text\n170 characters, editable anytime\nNone\n\n\nWhat’s New\n4,000 characters\nRelease notes, 500 characters per language\n\n\nIcon\n1024 x 1024 PNG, no transparency, in the app binary\n512 x 512 32-bit PNG, max 1 MB, uploaded to Play Console\n\n\nFeature graphic\nNone\n1024 x 500 JPEG or 24-bit PNG, required\n\n\nScreenshots\n1 to 10 per display size\n2 to 8 per device type\n\n\nPreview video\nUp to 3 app previews per size, 15 to 30 seconds\nOne YouTube URL\n\n\nPrivacy policy URL\nRequired\nRequired\n\n\nPrivacy disclosure\nApp Privacy (“nutrition labels”)\nData safety section\n\n\nAge rating\nApple questionnaire\nIARC questionnaire\n\n\nSupport URL\nRequired\nContact email required, website optional\n\n\nReview login\nDemo account in App Review Information\nCredentials in App access\n\n\n\nApp icon\nApple. The App Store icon is a 1024 x 1024 PNG, square, without transparency and without rounded corners (iOS masks it). In Capacitor apps it lives in ios/App/App/Assets.xcassets/AppIcon.appiconset. Xcode 26 also supports layered icons made with Icon Composer for the Liquid Glass look on iOS 26, but a single 1024 image is still accepted.\nGoogle. Play needs a separate 512 x 512 32-bit PNG upload, up to 1 MB. Google applies the rounded mask and shadow itself, so upload a full-bleed square. The in-app launcher icon is separate and should be an adaptive icon.\nGenerate all native icon and splash sizes from one source image:\nbun add -d @capacitor/assets\nmkdir -p assets\n# put icon.png (1024x1024) and splash.png (2732x2732) in ./assets\nbunx capacitor-assets generate\nRules both stores enforce: no badges like “Free” or “#1”, no screenshots of other brands’ devices or logos, nothing that imitates another app.\nScreenshots\nScreenshots are the biggest factor in whether someone installs. Most people never read the description.\nApp Store screenshot sizes\n\n\n\nDisplay\nRequired?\nPortrait size (px)\n\n\n\n\niPhone 6.9”\nRequired (preferred)\n1260 x 2736, also 1290 x 2796 or 1320 x 2868\n\n\niPhone 6.5”\nRequired only if no 6.9” set\n1284 x 2778 or 1242 x 2688\n\n\niPhone 6.1” and smaller\nOptional, scaled from larger sizes\n1170 x 2532 and others\n\n\niPad 13”\nRequired if the app runs on iPad\n2064 x 2752 or 2048 x 2732\n\n\niPad 11”\nOptional\n1488 x 2266 and others\n\n\n\nLandscape uses the same numbers swapped. Formats are PNG or JPEG, no alpha channel. You can upload 1 to 10 screenshots per size and 0 to 3 app previews.\nA common Capacitor surprise: new projects support iPad by default. If you do not want to make iPad screenshots, set the target’s Supported Destinations to iPhone only before your first upload. If you ship iPad support, reviewers test on iPad and reject broken layouts.\nGoogle Play screenshot sizes\n\n2 to 8 screenshots per device type (phone, 7-inch tablet, 10-inch tablet, Chromebook, Wear OS, Android XR, TV, Automotive).\nJPEG or 24-bit PNG, no alpha.\nEach side between 320 and 3840 pixels; the long side at most twice the short side.\nFor phones, use at least 1080 x 1920 (portrait) or 1920 x 1080 (landscape) and at least four screenshots, otherwise the app is not eligible for some featured placements.\nTablet screenshots are needed if you want to appear as tablet-optimized.\n\nHow to capture them\n\nRun the app on a simulator of the right size. In the iOS Simulator use an iPhone 17 Pro Max for 6.9” and press Cmd+S. On Android, use an emulator with a 1080 x 1920 or higher screen and the camera button in the emulator toolbar.\nFill the app with realistic demo data. Empty states sell nothing.\nHide debug UI and make the status bar clean (xcrun simctl status_bar booted override --time 9:41 --batteryState charged --batteryLevel 100).\nAdd a short caption above each screenshot that states the benefit, not the feature name.\nKeep the first two screenshots the strongest. They show in search results.\n\nTools like Figma templates, Fastlane snapshot/screengrab or online screenshot frame generators can produce the framed versions in every size.\nNever use screenshots that show content the app cannot do, and do not include Google Play badges in App Store screenshots (or the reverse).\nName, subtitle and descriptions\nApp Store\n\nName (30 characters): brand plus a short descriptor if it fits, for example “Acme: Expense Tracker”.\nSubtitle (30 characters): the main benefit. Indexed for search.\nKeywords (100 bytes): comma separated, no spaces after commas, no words already in the name or subtitle, no competitor brand names, singular forms are enough.\nPromotional text (170 characters): shown above the description, changeable without a new version. Use it for current offers or news.\nDescription (4,000 characters): not indexed for search on the App Store, so write it for people. Open with what the app does in one sentence.\n\nGoogle Play\n\nTitle (30 characters): no emojis, ALL CAPS or words like “best”, “free” or “#1” unless part of the brand.\nShort description (80 characters): shown on the listing above the fold.\nFull description (4,000 characters): indexed for search. Mention your main keywords naturally a few times; keyword stuffing gets listings rejected.\n\nFor more on writing metadata and the mistakes that hurt ranking, see App Store metadata: what developers must know.\nPrivacy policy\nBoth stores require a public privacy policy URL. It must:\n\nBe reachable without login and not be a PDF download.\nName the developer or company as in the store listing.\nList what data you collect, why, who you share it with, how long you keep it, and how users can request deletion.\nMatch what you declare in the privacy labels and Data safety form.\n\nAlso link the policy inside the app (settings or account screen). If users can create accounts, both stores require in-app account deletion; Google also requires a web link where users can request deletion without reinstalling the app. Our account deletion guide and privacy policy guide for Android apps go deeper.\nApple App Privacy labels\nIn App Store Connect, open the app and go to App Privacy. You answer:\n\nDo you or your third-party partners collect data from this app?\nFor each data type (contact info, location, identifiers, usage data, diagnostics, financial info…): what it is used for, whether it is linked to the user’s identity, and whether it is used for tracking.\n\n“Tracking” has a narrow meaning: linking data from your app with data from other companies’ apps or websites for advertising, or sharing it with data brokers. If you track, you also need the App Tracking Transparency prompt.\nThe labels must match your privacy manifest (PrivacyInfo.xcprivacy) and those of the SDKs you include. See our privacy manifest guide for Capacitor apps.\nYou can update App Privacy answers at any time without a new build.\nGoogle Play Data safety\nIn Play Console go to Policy and programs &gt; App content &gt; Data safety. You declare:\n\nWhich data types the app collects and which it shares with third parties.\nWhether data is encrypted in transit.\nWhether users can request deletion.\nFor each type: purpose (app functionality, analytics, ads, fraud prevention…) and whether collection is optional.\n\nGoogle can reject updates when the declaration does not match what the app does, for example an SDK sending the advertising ID while you declared no identifiers.\nMost Data safety mistakes come from SDKs. Make a table of every native SDK and plugin in package.json, ios/App/Podfile or Package.swift, and android/app/build.gradle, then read each vendor’s Data safety guidance.\nAge rating\nApple. In App Information &gt; Age Rating you answer questions about violence, sexual content, profanity, gambling, user-generated content, messaging, ads, and more. Apple’s ratings are 4+, 9+, 13+, 16+ and 18+. Apps with unmoderated user-generated content or open web access get higher ratings. Answer honestly; Apple checks. See our App Store age ratings guide.\nGoogle. In App content &gt; Content rating, fill out the IARC questionnaire. It produces ratings for each region (ESRB, PEGI, USK and others) at once. You must also complete Target audience and content; choosing an audience that includes children brings in the Families policy requirements.\nOther App content declarations on Google Play\nBefore you can publish, Play Console asks for all of these under App content:\n\nPrivacy policy\nApp access (login credentials for reviewers if anything is behind a login)\nAds (does the app contain ads?)\nContent rating\nTarget audience and content\nData safety\nGovernment app declaration\nFinancial features declaration\nHealth apps declaration\nAdvertising ID usage (if your target SDK requires it)\n\nReview access and notes\nIf any part of the app needs a login, provide a working demo account for both stores. The account must not expire, must not require 2FA to a phone you control, and must reach every feature, including paid ones. In App Store Connect, add it under App Review Information; on Google Play, under App access. Add a short note explaining non-obvious features, hardware requirements, or where to find in-app purchases. Our first-time app review guide covers what reviewers look for.\nLocalization\nBoth stores let you localize name, descriptions, keywords (Apple) and screenshots per language. Localizing only the metadata, even when the app UI is English, often improves conversion in non-English markets. Apple also indexes some secondary locales per country (for example, Spanish (Mexico) metadata is indexed in the US store), which effectively gives you extra keyword space.\nWhat you can change after release\n\n\n\nField\nApp Store\nGoogle Play\n\n\n\n\nDescription\nNew version required\nAnytime, reviewed\n\n\nPromotional text\nAnytime\nn/a\n\n\nKeywords\nNew version required\nn/a\n\n\nScreenshots\nNew version required\nAnytime, reviewed\n\n\nName / subtitle\nNew version required\nAnytime, reviewed\n\n\nPrivacy labels / Data safety\nAnytime\nAnytime, reviewed\n\n\n\nOn iOS, a new version normally means a new binary. With Capgo live updates you can ship JavaScript and UI fixes without a store review, but store metadata changes still go through App Store Connect.\nCommon reasons listings get blocked\n\nPrivacy policy URL returns 404 or requires login.\nScreenshots show a different app version, placeholder content, or another platform’s UI.\niPad support enabled but no iPad screenshots, or a broken iPad layout.\nData safety says “no data collected” while an analytics SDK runs.\nDemo account missing or expired.\nKeyword stuffing in the Google Play description.\nName or icon too close to an existing app or brand.\nMissing support URL or contact email.\n\nChecklist\n\n 1024 x 1024 iOS icon in the app, 512 x 512 Play icon uploaded\n Play feature graphic 1024 x 500\n iPhone 6.9” (or 6.5”) screenshots, iPad 13” if supporting iPad\n At least four 1080p phone screenshots for Google Play\n Name, subtitle, short description within limits\n Keywords (App Store) chosen, no duplicates with name\n Description and release notes written\n Privacy policy URL live and linked in the app\n App Privacy labels and privacy manifest match\n Data safety form complete, SDKs reviewed\n Age rating questionnaires done on both stores\n Play App content declarations complete\n Demo account and review notes added\n Support URL and contact email set\n\nOnce the listing is ready, upload a build to testers first. How to distribute iOS and Android apps to testers covers TestFlight, Play testing tracks and alternatives.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-prepare-app-store-and-google-play-listing/"},"keywords":"app store listing, google play store listing, app store screenshot sizes, google play screenshot size, app store metadata limits, app privacy labels, google play data safety, app store age rating, feature graphic size","articleSection":"App Store"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-prepare-app-store-and-google-play-listing/#faqpage","url":"https://capgo.app/blog/how-to-prepare-app-store-and-google-play-listing/","mainEntity":[{"@type":"Question","name":"What screenshot sizes does the App Store require in 2026?","acceptedAnswer":{"@type":"Answer","text":"For iPhone, upload 6.9-inch screenshots (1260 x 2736 portrait; 1290 x 2796 and 1320 x 2868 are also accepted) or, if you do not have those, 6.5-inch screenshots at 1284 x 2778. For iPad apps, upload 13-inch screenshots at 2064 x 2752. Smaller sizes are scaled automatically. You can upload 1 to 10 screenshots per size, in PNG or JPEG without transparency."}},{"@type":"Question","name":"What screenshot size does Google Play need?","acceptedAnswer":{"@type":"Answer","text":"Each side must be between 320 and 3840 pixels and the long side cannot be more than twice the short side. Upload 2 to 8 per device type as JPEG or 24-bit PNG. For phones use at least 1080 x 1920 so the app can be featured. You also need a 512 x 512 icon and a 1024 x 500 feature graphic."}},{"@type":"Question","name":"Do I need a privacy policy if my app collects no data?","acceptedAnswer":{"@type":"Answer","text":"Yes. Apple requires a privacy policy URL for every app, and Google requires one for every app on Google Play. If you collect nothing, say so clearly, and remember that crash reporting, analytics and ad SDKs usually collect data."}},{"@type":"Question","name":"Do third-party SDKs count in privacy labels and Data safety?","acceptedAnswer":{"@type":"Answer","text":"Yes. Both stores hold you responsible for data collected by every SDK in your app, including Firebase, analytics, crash reporting, ads and payment libraries. Check each vendor's disclosure documentation and declare what they collect."}},{"@type":"Question","name":"Can I change my description without a new build?","acceptedAnswer":{"@type":"Answer","text":"On Google Play you can edit the full listing anytime; changes are reviewed. On the App Store, promotional text can change anytime, but the description, keywords and screenshots can only change when you submit a new app version for review."}}]}]}</script>
