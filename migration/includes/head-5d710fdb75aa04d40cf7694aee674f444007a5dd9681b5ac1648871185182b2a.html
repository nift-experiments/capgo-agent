<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/troubleshooting-capacitor-ios-build-errors/#newsarticle","url":"https://capgo.app/blog/troubleshooting-capacitor-ios-build-errors/","headline":"Capacitor iOS Troubleshooting: Common Errors and Fixes","description":"Fix common Capacitor iOS issues: No such module Capacitor, plugin not implemented, SPM and CocoaPods errors, signing, blank screens and upload errors.","image":["https://capgo.app/xcode-run.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"Most Capacitor iOS problems fall into five groups: wrong toolchain, dependency resolution (SPM or CocoaPods), compile errors from plugins, code signing, and runtime issues such as “plugin is not implemented” or a blank WebView. Start with bunx cap doctor, confirm you have Xcode 26 selected, run bunx cap sync ios, and read the first error in the Xcode build log, not the last.\nThis guide lists the errors we see most in Capacitor 8 projects, what causes each one, and the fix. For Android, see the Capacitor Android troubleshooting guide.\nQuick triage checklist\nRun these before chasing a specific error:\nbunx cap doctor            # Capacitor, CLI and plugin versions should match\nnode -v                    # 22 or later for Capacitor 8\nxcodebuild -version        # 26.x\nxcode-select -p            # should point to the Xcode you expect\nbun run build &amp;&amp; bunx cap sync ios\n\nVersions: @capacitor/core, @capacitor/ios and @capacitor/cli must share the same major. Mismatches cause odd compile and runtime errors. See fix Capacitor version mismatch errors.\nOne Xcode: if you have several Xcode versions, xcode-select -p decides which one the CLI uses. Fix it with sudo xcode-select -s /Applications/Xcode.app.\nWhich package manager: if ios/App/CapApp-SPM exists, the project uses SPM. If ios/App/Podfile exists, it uses CocoaPods.\n\nToolchain errors\nXcode or SDK too old\nSymptoms: value of type 'WKWebView' has no member 'isInspectable', Swift syntax errors inside Capacitor, or compiling for iOS 15.0, but module 'X' has a minimum deployment target of iOS 16.0.\nCapacitor 8 requires Xcode 26. In GitHub Actions, macos-latest doesn’t always point to the image with the newest Xcode. Pin an image that includes Xcode 26 and select it explicitly:\n- run: sudo xcode-select -s /Applications/Xcode_26.0.app\nCheck the runner image docs for the exact path. For the module-minimum error, raise your app’s deployment target to the plugin’s minimum, or use an older plugin version.\nITMS-90725: SDK version issue on upload\nThe build was made with an SDK older than Apple currently accepts. Since April 28, 2026, uploads must be built with Xcode 26 and the iOS 26 SDK. See Apple’s Xcode 26 requirement for Capacitor apps. Capgo Build already builds on Xcode 26 if you don’t want to maintain Mac runners.\nSwift Package Manager errors\nMissing package product 'CapApp-SPM'\nXcode hasn’t resolved the local package, or its cache is stale.\n\nFile &gt; Packages &gt; Reset Package Caches.\nFile &gt; Packages &gt; Resolve Package Versions.\nIf the app was migrated from CocoaPods, check that CapApp-SPM is added under the project’s Package Dependencies tab and linked to the App target.\n\nproduct 'X' required by package 'capapp-spm' target 'CapApp-SPM' not found\nA plugin’s Package.swift uses a package or product name that doesn’t match what the Capacitor CLI generated from its npm name. This is a plugin bug. Update the plugin, or patch it. Plugin authors can find the naming rule in migrate a Capacitor plugin to SPM.\n“Some installed Capacitor plugins are not compatible with SPM”\nThis warning during cap sync means at least one plugin has no Package.swift. It’s left out of the app, so calls to it fail with “not implemented”. Upgrade the plugin, replace it with one that supports SPM, or use CocoaPods for now.\nDuplicate package identity or target name\nTwo plugins share a package identity or a target name (often a generic name like Plugin). Since CLI 8.4 you can fix it from the Capacitor config:\nconst config: CapacitorConfig = {\n  // ...\n  experimental: {\n    ios: {\n      spm: {\n        packageOptions: {\n          '@acme/capacitor-foo': { symlink: true },\n          '@acme/capacitor-bar': { moduleAliases: { Plugin: 'AcmeBarPlugin' } },\n        },\n      },\n    },\n  },\n};\nsymlink makes the CLI reference the plugin through a symlink folder with a unique path. moduleAliases renames a conflicting module for that dependency. Report the conflict upstream too.\nDon’t edit CapApp-SPM/Package.swift\nThe CLI rewrites it on every sync. Local edits disappear. Use the experimental.ios.spm config options instead.\nCocoaPods errors\nNo such module 'Capacitor'\nYou opened App.xcodeproj instead of App.xcworkspace. Use bunx cap open ios. If the workspace is open and the error persists, run bunx cap sync ios to reinstall pods.\nCocoaPods could not find compatible versions for pod \"X\"\nTwo causes:\n\nStale spec repo: run cd ios/App &amp;&amp; pod install --repo-update.\nConflicting pins: two plugins need incompatible versions of the same pod. The error prints the chain. Upgrade the plugin with the strict pin, align versions (for Firebase, keep all Firebase plugins on the same SDK version), or patch the podspec.\n\nIf it keeps failing, delete ios/App/Podfile.lock and ios/App/Pods, then sync again. This also upgrades every pod, so test afterwards.\nThe sandbox is not in sync with the Podfile.lock\nRun bunx cap sync ios. It happens after branch switches or partial installs.\nUnable to find compatibility version string for object version '70'\nYour project.pbxproj uses a format your CocoaPods version can’t read. Update CocoaPods (brew upgrade cocoapods or bump it in your Gemfile). As a last resort, back up the file and lower objectVersion.\nSandbox: rsync(...) deny(1) file-write-create\nXcode’s user script sandboxing blocks the CocoaPods framework embed script. Set Build Settings &gt; User Script Sandboxing to No on the App target.\ncould not find module 'Capacitor' for target 'x86_64-apple-ios-simulator'\nThe simulator build is running for Intel. On Apple Silicon this usually means Xcode runs under Rosetta or an old EXCLUDED_ARCHS[sdk=iphonesimulator*] = arm64 setting is left over from a past workaround. Run Xcode natively, remove that setting from the App target and any post_install hook, then clean and rebuild.\nCompile errors\nCommand PhaseScriptExecution failed with a nonzero exit code\nThis is a wrapper. Expand the failing build phase in the Report navigator and read the script output. Common causes in Capacitor apps:\n\nA Run Script needs node and Xcode can’t find it, because Xcode doesn’t load your shell profile and Node is installed with nvm, fnm or Volta. Use the full path to node in the script, or export PATH at the top of it.\nA crash reporting upload script (Sentry, Crashlytics) is missing credentials in CI.\nCocoaPods embed script blocked by user script sandboxing (see above).\n\n'X' is only available in iOS 16.0 or newer\nA plugin uses an API above your deployment target. Raise the target in Xcode, in the Podfile (platform :ios, '16.0') if you use CocoaPods, and check the plugin’s README for its minimum.\nSwift 6 concurrency errors in a plugin\nMessages like Sending 'x' risks causing data races show up when a plugin or your app target uses Swift 6 language mode. Capacitor 8 doesn’t officially support Swift 6. Keep the App target on Swift 5 language mode until the plugin is updated.\nCode signing\nSigning for \"App\" requires a development team\nOpen App target &gt; Signing &amp; Capabilities and pick a team. In CI, pass DEVELOPMENT_TEAM to xcodebuild or use a signing tool. If the error names a pod resource bundle instead of App, disable signing for bundle targets in the Podfile post_install hook.\nProvisioning profile \"X\" doesn't include the ... entitlement\nYou added a capability (Push Notifications, Associated Domains, Sign in with Apple) without regenerating the profile. Enable it on the App ID in the Apple Developer portal, then refresh profiles. Our iOS certificate generator helps create certificates without a Mac keychain dance, and the UDID finder helps register test devices.\nUnable to install \"App\" on device\nEnable Developer Mode on the device (Settings &gt; Privacy &amp; Security &gt; Developer Mode), trust the developer certificate, and make sure the device’s UDID is in the provisioning profile for development builds.\nRuntime errors\n\"X\" plugin is not implemented on ios\nThe JavaScript side found no native implementation. Check in this order:\n\nThe plugin is in package.json and you ran bunx cap sync ios after installing it.\nFor SPM: the plugin appears in ios/App/CapApp-SPM/Package.swift. If not, it has no Package.swift.\nFor CocoaPods: the plugin appears in the capacitor_pods block of the Podfile and pod install printed no warnings.\nYou don’t have two plugins registering the same JS name (for example two push notification plugins).\nWKAppBoundDomains is not in Info.plist, or if it is, limitsNavigationsToAppBoundDomains is set and localhost is listed. App-bound domains block plugin script injection otherwise.\nClean build folder and rebuild. Stale builds keep old plugin registrations.\n\nBlank white screen on launch\nInspect the WebView with Safari Web Inspector first. Most blank screens are a JavaScript error.\n\nWrong webDir: capacitor.config.ts points to a folder that doesn’t contain index.html. Check ios/App/App/public.\nBuild target too new: your bundler emits syntax older WebKit doesn’t support. iOS 15 is the minimum for Capacitor 8, so target safari15 or later in Vite/esbuild and check your browserslist.\nAbsolute asset paths: a base set to a CDN or subpath in your bundler config breaks local loading.\nLive reload unreachable: the dev server must listen on your LAN IP (--host 0.0.0.0), the phone must be on the same network, and the app needs the Local Network permission (Settings &gt; Privacy &amp; Security &gt; Local Network). Remove server.url from the config before release builds.\nLive update bundle broken: if the app uses OTA updates, a bad bundle can blank the screen. Capgo’s updater rolls back automatically when notifyAppReady() isn’t called in time. See the updater docs.\n\nContent under the notch or home indicator\nAdd viewport-fit=cover to your viewport meta tag and pad with env(safe-area-inset-top) and env(safe-area-inset-bottom). Capacitor 8’s System Bars plugin controls status bar style and visibility on both platforms.\nKeyboard covers inputs\nConfigure the Keyboard plugin resize mode (native, body, ionic or none) and test on a real device. Simulators handle the keyboard differently.\nApp Store Connect errors\n\nITMS-91053: Missing API declaration: your app or a plugin uses a required-reason API without a privacy manifest entry. Add a PrivacyInfo.xcprivacy to the App target with the reasons, and update plugins that ship their own manifest.\nITMS-90725: SDK version issue: rebuild with Xcode 26.\nInvalid Bundle. The bundle ... contains disallowed file 'Frameworks': a framework is embedded inside an extension or another framework. Check Embed settings for app extensions.\n\nHow to debug when the error isn’t listed\n\nSafari Web Inspector for JS errors and network calls. Debug builds are inspectable on iOS 16.4+. For release builds set ios.webContentsDebuggingEnabled: true temporarily.\nXcode console for native logs, including Capacitor’s ⚡️ bridge messages that show each plugin call.\nConsole.app with the device selected for crash and system logs.\nIsolate: create a fresh app with bun create @capacitor/app, add only the suspect plugin, and see if the error reproduces.\n\nThe ultimate guide to debugging Capacitor apps goes deeper into each tool. If the root cause is a plugin bug, a patch is usually the quickest unblock while you wait for a release.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/troubleshooting-capacitor-ios-build-errors/"},"keywords":"Capacitor iOS troubleshooting, Capacitor iOS build error, No such module Capacitor, plugin is not implemented iOS, Capacitor blank screen iOS, CocoaPods error Capacitor, SPM error Capacitor, Xcode 26 Capacitor","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/troubleshooting-capacitor-ios-build-errors/#faqpage","url":"https://capgo.app/blog/troubleshooting-capacitor-ios-build-errors/","mainEntity":[{"@type":"Question","name":"How do I do a full clean rebuild of a Capacitor iOS app?","acceptedAnswer":{"@type":"Answer","text":"Rebuild the web app, run bunx cap sync ios, then in Xcode use Product > Clean Build Folder. For SPM projects also use File > Packages > Reset Package Caches. For CocoaPods delete ios/App/Pods and run bunx cap sync ios again. If errors persist, quit Xcode and delete ~/Library/Developer/Xcode/DerivedData."}},{"@type":"Question","name":"Which Xcode version do I need for Capacitor 8?","acceptedAnswer":{"@type":"Answer","text":"Capacitor 8 requires Xcode 26 or later. Since April 28, 2026, App Store Connect also rejects uploads built with older Xcode versions, so Xcode 26 is required for releases regardless of Capacitor version."}},{"@type":"Question","name":"How do I see console logs from my Capacitor app on iOS?","acceptedAnswer":{"@type":"Answer","text":"Enable the Develop menu in Safari settings, connect the device or start the simulator, then pick the app under Safari > Develop. Debug builds are inspectable by default on iOS 16.4+. For release builds, set ios.webContentsDebuggingEnabled to true in the Capacitor config. Native logs show in the Xcode console."}},{"@type":"Question","name":"Why do my web changes not appear in the iOS app?","acceptedAnswer":{"@type":"Answer","text":"Capacitor copies built web assets into the native project. Run your web build, then bunx cap sync ios or bunx cap copy ios, and run the app again. If you use live updates, the app may also be running a downloaded bundle instead of the built-in one."}},{"@type":"Question","name":"Should I fix CocoaPods errors or migrate to SPM?","acceptedAnswer":{"@type":"Answer","text":"If the error comes from version conflicts or Ruby tooling and all your plugins support SPM, migrating usually removes that whole class of errors. If a plugin you need is CocoaPods-only, fix the CocoaPods issue for now and plan the migration later."}}]}]}</script>
