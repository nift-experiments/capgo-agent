<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-sign-in-with-auth0-using-capacitor/#newsarticle","url":"https://capgo.app/blog/how-to-sign-in-with-auth0-using-capacitor/","headline":"How to Sign In with Auth0 Using Capacitor","description":"Add Auth0 login to a Capacitor 8 app with OIDC and PKCE: Auth0 dashboard setup, callback URLs, API audience, refresh tokens, logout, and troubleshooting.","image":["https://capgo.app/login.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To sign in with Auth0 in a Capacitor app, create a Native application in Auth0, register a custom-scheme callback URL such as com.example.app://oauth/auth0, and run the OpenID Connect authorization code flow with PKCE through a system browser. With @capgo/capacitor-social-login that is one initialize call with your Auth0 endpoints and one SocialLogin.login({ provider: 'oauth2', options: { providerId: 'auth0' } }).\nThis guide covers the Auth0 dashboard settings, the client code for iOS, Android and web, API access tokens, refresh tokens, logout, and the errors you will run into. It is written for Capacitor 8 as of October 2026.\nHow the Auth0 flow works in Capacitor\nAuth0 hosts the login page (Universal Login). Your app never sees the password. The flow is:\n\nThe app generates a PKCE verifier and challenge, then opens https://YOUR_TENANT/authorize in a secure browser.\nThe user signs in (password, social, passkey, MFA, whatever you configured in Auth0).\nAuth0 redirects to your callback URL with a one-time code.\nThe app exchanges the code and the PKCE verifier at /oauth/token for an ID token, an access token and, optionally, a refresh token.\n\nThe browser used depends on the platform:\n\n\n\nPlatform\nBrowser\nCallback handling\n\n\n\n\niOS\nASWebAuthenticationSession\nHandled by the system, no Info.plist change\n\n\nAndroid\nEmbedded WebView by default, or Chrome Custom Tabs with androidUseCustomTabs: true\nCustom Tabs need an intent filter\n\n\nWeb\nPopup (default) or full-page redirect\nhandleRedirectCallback() on the return page\n\n\n\nOn Android, use Custom Tabs. They share cookies with Chrome, support passkeys and password managers, and follow RFC 8252 (OAuth for native apps), which is what Auth0 expects.\nStep 1: Set up the Auth0 application\n\nIn the Auth0 Dashboard, go to Applications &gt; Applications &gt; Create Application.\nPick Native and create it.\nOn the Settings tab, note the Domain (for example example.eu.auth0.com) and the Client ID.\nUnder Credentials, check that the authentication method is None. That is the public-client setting used with PKCE.\n\nCallback and logout URLs\nFill these fields in Settings &gt; Application URIs:\n\n\n\nField\nValue for mobile\nValue for web\n\n\n\n\nAllowed Callback URLs\ncom.example.app://oauth/auth0\nhttps://app.example.com/auth/callback\n\n\nAllowed Logout URLs\ncom.example.app://oauth/logout\nhttps://app.example.com/\n\n\nAllowed Web Origins\nNot needed\nhttps://app.example.com\n\n\n\nComma-separate multiple values. Use your Capacitor appId as the scheme. A reverse-domain scheme avoids collisions with other apps. If you also ship a web build, many teams create a separate Single Page Application in Auth0 for it, so the web and mobile settings do not mix.\nRefresh tokens\nIf users should stay signed in:\n\nIn Settings &gt; Refresh Token Rotation, turn rotation on. Each refresh returns a new refresh token and invalidates the old one.\nSet an absolute and inactivity lifetime that fits your product.\nIf you call your own API, open Applications &gt; APIs &gt; your API &gt; Settings and enable Allow Offline Access.\nRequest the offline_access scope in the app.\n\nAPI audience\nIf your backend validates Auth0 access tokens, create an API under Applications &gt; APIs with an identifier such as https://api.example.com. Pass that identifier as audience. Without it, the access token is only good for Auth0’s /userinfo endpoint.\nStep 2: Install and configure the plugin\nbun add @capgo/capacitor-social-login\nbunx cap sync\nIf Auth0 is your only provider, disable the bundled social SDKs to keep the binary small:\n// capacitor.config.ts\nplugins: {\n  SocialLogin: {\n    providers: { google: false, facebook: false, apple: false, twitter: false },\n  },\n},\nThe generic OAuth2 engine does not depend on those SDKs.\nAndroid intent filter for Custom Tabs\nAdd the callback scheme to MainActivity in android/app/src/main/AndroidManifest.xml:\n&lt;intent-filter&gt;\n    &lt;action android:name=\"android.intent.action.VIEW\" /&gt;\n    &lt;category android:name=\"android.intent.category.DEFAULT\" /&gt;\n    &lt;category android:name=\"android.intent.category.BROWSABLE\" /&gt;\n    &lt;data android:scheme=\"com.example.app\" android:host=\"oauth\" /&gt;\n&lt;/intent-filter&gt;\nThe Capacitor template already sets android:launchMode=\"singleTask\" on MainActivity, which the redirect needs. Keep it.\nStep 3: Initialize the Auth0 provider\nimport { Capacitor } from '@capacitor/core';\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nconst AUTH0_DOMAIN = 'https://example.eu.auth0.com';\nconst isWeb = Capacitor.getPlatform() === 'web';\n\nexport async function initAuth() {\n  await SocialLogin.initialize({\n    oauth2: {\n      auth0: {\n        appId: 'YOUR_AUTH0_CLIENT_ID',\n        authorizationBaseUrl: `${AUTH0_DOMAIN}/authorize`,\n        accessTokenEndpoint: `${AUTH0_DOMAIN}/oauth/token`,\n        resourceUrl: `${AUTH0_DOMAIN}/userinfo`,\n        redirectUrl: isWeb\n          ? 'https://app.example.com/auth/callback'\n          : 'com.example.app://oauth/auth0',\n        scope: 'openid profile email offline_access',\n        pkceEnabled: true,\n        additionalParameters: {\n          audience: 'https://api.example.com',\n        },\n        logoutUrl: `${AUTH0_DOMAIN}/oidc/logout`,\n        postLogoutRedirectUrl: isWeb\n          ? 'https://app.example.com/'\n          : 'com.example.app://oauth/logout',\n        androidUseCustomTabs: true,\n      },\n    },\n  });\n}\nYou can replace the explicit endpoints with issuerUrl: AUTH0_DOMAIN. The plugin then reads /.well-known/openid-configuration. Explicit values win over discovered ones, which helps when you use an Auth0 custom domain.\nIf you are moving from Ionic Auth Connect, the plugin also exports SocialLoginAuthConnect with an auth0 preset that takes domain, clientId, redirectUrl and audience. See the Auth Connect migration guide.\nStep 4: Sign in\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nexport async function signInWithAuth0() {\n  try {\n    const { result } = await SocialLogin.login({\n      provider: 'oauth2',\n      options: { providerId: 'auth0' },\n    });\n\n    return {\n      idToken: result.idToken,\n      accessToken: result.accessToken?.token,\n      expiresAt: result.accessToken?.expires,\n      refreshToken: result.refreshToken,\n      user: result.resourceData, // JSON from /userinfo\n    };\n  } catch (error: any) {\n    if (error?.code === 'USER_CANCELLED') return null;\n    throw error;\n  }\n}\nUseful login options:\n\nprompt: 'login' forces the login page even if Auth0 still has a session cookie.\nloginHint: 'user@example.com' pre-fills the email.\nadditionalParameters: { connection: 'google-oauth2' } skips Universal Login and goes straight to one connection.\nadditionalParameters: { screen_hint: 'signup' } opens the sign-up screen.\n\nWeb redirect callback\nOn web, the default popup flow needs nothing extra. If you use flow: 'redirect', read the result on the callback page:\nconst result = await SocialLogin.handleRedirectCallback();\nif (result?.provider === 'oauth2') {\n  console.log(result.result.idToken);\n}\nhandleRedirectCallback is web only and rejects on iOS and Android.\nStep 5: Read the ID token and call your API\nDecode the ID token on the client only for display:\nconst { claims } = await SocialLogin.decodeIdToken({ idToken: result.idToken! });\nconsole.log(claims.email, claims.name, claims.sub);\ndecodeIdToken does not check the signature. For anything security related, send the access token to your API and validate it there:\nimport { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst jwks = createRemoteJWKSet(new URL('https://example.eu.auth0.com/.well-known/jwks.json'));\n\nexport async function verifyAuth0AccessToken(token: string) {\n  const { payload } = await jwtVerify(token, jwks, {\n    issuer: 'https://example.eu.auth0.com/', // Auth0 issuers end with a slash\n    audience: 'https://api.example.com',\n  });\n  return payload; // payload.sub is the Auth0 user ID\n}\nStep 6: Refresh the access token\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nexport async function getValidAccessToken() {\n  const { isLoggedIn } = await SocialLogin.isLoggedIn({ provider: 'oauth2', providerId: 'auth0' });\n\n  if (!isLoggedIn) {\n    // access token expired: try the stored refresh token\n    try {\n      await SocialLogin.refresh({ provider: 'oauth2', options: { providerId: 'auth0' } });\n    } catch {\n      // refresh token expired, revoked or already rotated: sign in again\n      const loginResult = await signInWithAuth0();\n      if (!loginResult) throw new Error('Sign-in cancelled');\n    }\n  }\n\n  const { accessToken } = await SocialLogin.getAuthorizationCode({\n    provider: 'oauth2',\n    providerId: 'auth0',\n  });\n  return accessToken;\n}\nrefresh rejects when the refresh token is expired or revoked. With rotation on, a refresh token that was already used also fails, so always handle the rejection by sending the user back to sign in.\nrefresh uses the refresh token the plugin saved at login. If you keep the refresh token yourself, call SocialLogin.refreshToken({ provider: 'oauth2', providerId: 'auth0', refreshToken }), which returns the full new token response. With rotation on, store the new refresh token every time.\nThe plugin keeps its token copy in app-private storage. If your security review asks for Keychain or Keystore, store the refresh token with NativeBiometric.setData({ key, value }) from @capgo/capacitor-native-biometric and pass it to refreshToken yourself. Our secure token storage guide compares the options.\nStep 7: Sign out\nawait SocialLogin.logout({ provider: 'oauth2', providerId: 'auth0' });\nThe plugin deletes the stored tokens, then opens logoutUrl with id_token_hint and post_logout_redirect_uri so Auth0 clears its session cookie. Auth0’s /oidc/logout endpoint understands those parameters, and the redirect target must be listed in Allowed Logout URLs.\nOn iOS and Android the end-session page opens in the system browser, so the user briefly leaves the app. If you only want a local logout, omit logoutUrl and pass prompt: 'login' on the next sign-in so a remembered Auth0 session does not log the user straight back in. Setting iosPrefersEphemeralSession: true also avoids shared cookies on iOS, at the cost of no SSO between apps.\nTroubleshooting\n\n\n\nError\nCause\nFix\n\n\n\n\nCallback URL mismatch\nRedirect URL not in Allowed Callback URLs\nCopy the exact value from code to the dashboard, check scheme and host\n\n\nUnauthorized or invalid_client at /oauth/token\nApp type is not Native, or auth method is not None\nRecreate as Native, set token endpoint auth to None\n\n\nNo refreshToken in result\noffline_access missing or API does not allow offline access\nAdd the scope, enable Allow Offline Access, enable rotation\n\n\nAccess token cannot be verified by API\nNo audience sent\nAdd audience in additionalParameters\n\n\nApp does not reopen after login on Android\nIntent filter scheme or host does not match redirectUrl\nMatch com.example.app and oauth exactly\n\n\nOAuth2 provider \"auth0\" not configured\nlogin called before initialize or key mismatch\nAwait initialize at startup, use the same providerId\n\n\nLogout page stays open\npost_logout_redirect_uri not in Allowed Logout URLs\nAdd it, or use local-only logout\n\n\nWeb CORS error on token exchange\nOrigin not in Allowed Web Origins\nAdd the web origin, or use a SPA application for web\n\n\n\nSet logsEnabled: true in the provider config to print the generated URLs and token exchange details while you debug.\nShip auth fixes without a store release\nChanging scopes, the audience or error handling is TypeScript only. With Capgo live updates you can roll those fixes out to users the same day. Native changes such as a new intent filter still need a new binary, which Capgo Build can produce in the cloud.\nRelated guides\n\nHow to sign in with Okta using Capacitor\nHow to sign in with Microsoft Entra ID using Capacitor\nHow to add authentication to a Capacitor app\nGeneric OAuth2 and OIDC provider docs\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-sign-in-with-auth0-using-capacitor/"},"keywords":"auth0 capacitor, capacitor auth0 login, ionic auth0, auth0 pkce mobile, auth0 refresh token capacitor, oidc capacitor, capacitor social login oauth2","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-sign-in-with-auth0-using-capacitor/#faqpage","url":"https://capgo.app/blog/how-to-sign-in-with-auth0-using-capacitor/","mainEntity":[{"@type":"Question","name":"Do I need an Auth0 client secret in my Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"No. Create the application as a Native application, which is a public client with the token endpoint authentication method set to None. The app proves it started the flow with PKCE instead of a secret. Never put a client secret in a mobile or web bundle, since anyone can extract it."}},{"@type":"Question","name":"Why is my Auth0 access token not a JWT?","acceptedAnswer":{"@type":"Answer","text":"Without an audience parameter, Auth0 issues a token meant only for its /userinfo endpoint, which is not a JWT you can validate in your own API. Create an API in the Auth0 dashboard and pass its identifier as the audience in additionalParameters. The access token then becomes a JWT for that API."}},{"@type":"Question","name":"How do I keep users signed in after they close the app?","acceptedAnswer":{"@type":"Answer","text":"Request the offline_access scope, enable Allow Offline Access on your Auth0 API, and turn on refresh token rotation for the application. The plugin stores the tokens and SocialLogin.refresh renews the access token without showing the login page again."}},{"@type":"Question","name":"Can I use Auth0's own SDK instead of a plugin?","acceptedAnswer":{"@type":"Answer","text":"Yes. Auth0 documents a Capacitor setup that uses its SPA SDK with @capacitor/browser and @capacitor/app to catch the callback deep link. It works, but you wire the browser, deep link and token cache yourself. The Social Login plugin handles those parts natively and lets you add Google, Apple or other OIDC providers through the same API."}}]}]}</script>
