<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/cordova-hot-code-push-alternative/#newsarticle","url":"https://capgo.app/blog/cordova-hot-code-push-alternative/","headline":"Cordova Hot Code Push Alternative in 2026","description":"cordova-hot-code-push and CodePush for Cordova are dead. Here is a maintained Cordova hot code push alternative with setup, migration steps and rollback.","image":["https://capgo.app/cordova.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"If you are searching for a Cordova hot code push alternative, it is probably because cordova-hot-code-push-plugin and Microsoft’s CodePush for Cordova both stopped working or stopped being maintained. A maintained option today is @capgo/cordova-updater, a Cordova plugin that brings Capgo live updates to Cordova Android 13+ and Cordova iOS 7+ apps, with channels, rollback and encrypted bundles, without forcing you to migrate to Capacitor first.\nThe state of Cordova live updates in 2026\ncordova-hot-code-push is archived\nThe nordnet/cordova-hot-code-push repository is archived on GitHub. The last code change was in September 2018 and the last npm release of cordova-hot-code-push-plugin is 1.5.3. It was designed for the Cordova platforms and file based WebView loading of that time. Modern Cordova Android serves the app from https://localhost through a path handler, and Cordova iOS uses WKWebView with an app:// scheme. A plugin that assumes file:// loading does not fit that model, and no one is updating it.\nExisting installs may still appear to work if you never update Cordova platforms. That is the trap: you cannot move to a current Cordova Android or Xcode without risking the update mechanism.\nCodePush for Cordova is gone\nMicrosoft archived cordova-plugin-code-push, ended Cordova support in App Center in 2022, and retired the core App Center service, including build, distribution and CodePush, on March 31, 2025. The plugin talked to the CodePush service in App Center, so there is no backend left to serve updates. If you moved to self-hosting the CodePush server, you still depend on an archived client plugin.\nIonic Appflow\ncordova-plugin-ionic connected Cordova apps to Ionic Appflow live updates. Ionic has announced Appflow is being wound down, so teams on it are looking for a replacement too. We cover that path in the Appflow alternative guide.\nWhat a replacement needs\nBefore picking any tool, check it against these requirements:\n\n\n\nRequirement\nWhy it matters\n\n\n\n\nWorks with current Cordova Android and iOS\nStore requirements force platform upgrades: Xcode 26 for App Store uploads since April 2026, and yearly Android target API bumps on Google Play\n\n\nNo dependency on cordova-plugin-ionic-webview\nThat plugin is outdated and conflicts with modern scheme handlers\n\n\nAutomatic rollback\nA bad bundle must not brick the app\n\n\nChannels\nTest on internal users before everyone\n\n\nSigned or encrypted bundles\nPrevents tampering with code delivered over the network\n\n\nVersion targeting\nNever send JavaScript that needs a newer native shell\n\n\nCI friendly CLI\nReleases should be one command in your pipeline\n\n\nMaintained\nCheck recent releases, not just stars\n\n\n\nCapgo for Cordova\n@capgo/cordova-updater uses the same JavaScript API as @capgo/capacitor-updater and the same Capgo Cloud backend. Bundles, channels, stats and signing work the same way for Cordova, Capacitor and Electron clients.\nRequirements\n\nCordova CLI 12+\nCordova Android 13+ (default https://localhost/ scheme)\nCordova iOS 7+ (default app://localhost/ scheme)\ncordova-plugin-ionic-webview removed\n\nCheck your platforms:\ncordova platform ls\nUpgrade if needed:\ncordova platform rm android &amp;&amp; cordova platform add android@latest\ncordova platform rm ios &amp;&amp; cordova platform add ios@latest\nInstall\nCreate the app in Capgo (dashboard or CLI), then add the plugin with your app ID:\nbunx @capgo/cli@latest login\nbunx @capgo/cli@latest app add com.example.app --name \"My Cordova App\"\n\ncordova plugin add @capgo/cordova-updater --variable APP_ID=com.example.app\ncordova prepare android ios\nYou can set more options at install time. These are plugin variables, so run cordova prepare after changing them:\ncordova plugin add @capgo/cordova-updater \\\n  --variable APP_ID=com.example.app \\\n  --variable DEFAULT_CHANNEL=production \\\n  --variable AUTO_UPDATE=atBackground \\\n  --variable APP_READY_TIMEOUT=10000\nAUTO_UPDATE defaults to atBackground, which downloads updates in the background and applies them the next time the app is backgrounded. Other modes include atInstall, onLaunch and off for fully manual control.\nTell the plugin the app started correctly\nThis is the one line you cannot skip. Call notifyAppReady() on every launch after deviceready. If a new bundle does not call it within APP_READY_TIMEOUT milliseconds, the plugin marks it as failed and rolls back to the last working bundle.\ndocument.addEventListener('deviceready', async () =&gt; {\n  const { Updater } = cordova.plugins;\n  await Updater.notifyAppReady();\n}, false);\nCall it after your app has actually rendered, not at the very top of your script, so a bundle that crashes during startup is detected.\nManual update flow\nIf you set AUTO_UPDATE=off, you control when to check, download and apply:\ndocument.addEventListener('deviceready', async () =&gt; {\n  const { Updater } = cordova.plugins;\n  await Updater.notifyAppReady();\n\n  const latest = await Updater.getLatest();\n  if (latest.url &amp;&amp; !latest.error) {\n    const bundle = await Updater.download({\n      url: latest.url,\n      version: latest.version,\n      checksum: latest.checksum,\n    });\n    // Applied on next background/restart\n    await Updater.next({ id: bundle.id });\n  }\n});\nTypeScript types ship with the package:\nimport type { UpdaterPlugin } from '@capgo/cordova-updater';\n\ndeclare const cordova: { plugins: { Updater: UpdaterPlugin } };\nPublish an update\nBuild your www folder and upload it:\nbun run build\nbunx @capgo/cli@latest bundle upload com.example.app --path ./www --channel production\nPut that in CI after your tests. The live updates page shows channel rollouts, stats and rollback from the dashboard.\nMigrating from cordova-hot-code-push\n\nRemove the old plugin and its config. Delete cordova-hot-code-push-plugin, the chcp section in config.xml, and the cordova-hcp CLI and chcp.json / chcp.manifest generation from your build.\nRemove cordova-plugin-ionic-webview if present, and test that the app runs on the default Cordova WebView.\nUpgrade Cordova platforms to Android 13+ and iOS 7+.\nInstall @capgo/cordova-updater and add notifyAppReady().\nRelease a new store build. Old installs keep the old plugin. Only the new binary contains the Capgo updater.\nUpload your first bundle to a test channel, check it on devices, then promote to production.\n\nUsers who do not update from the store stay on the old mechanism until they do. Keep your old update server online during the transition if it still works, or accept that those users get no OTA updates until they install the new binary.\nMigrating from CodePush for Cordova\n\nReplace codePush.sync() calls with notifyAppReady() and either automatic mode or the getLatest / download / next flow.\nReplace deployment keys with channels (DEFAULT_CHANNEL).\nReplace code-push release-cordova with bunx @capgo/cli@latest bundle upload.\nRemove the CodePushDeploymentKey preferences from config.xml.\n\nFor a step by step version aimed at App Center users, see the App Center migration guide.\nSecurity and store rules\n\nEncryption and signing. Set PUBLIC_KEY at install time and use the CLI’s encryption keys, so devices only accept bundles signed for your app.\nApple and Google policies. Both allow updating interpreted code such as JavaScript over the air, as long as you do not change the app’s purpose or add features that would need review. Native code, new plugins and permission changes need a store release.\nVersion targeting. If a bundle needs a native plugin that only exists in a newer binary, target it to that native version. The Capgo docs on live update compatibility explain how.\n\nTroubleshooting\nBundle downloads but the app shows the old version. You are still using cordova-plugin-ionic-webview, or a custom scheme. Remove it and use the defaults.\nApp rolls back after every update. notifyAppReady() is not called, or it is called after an error. Check the console on the device and confirm the call runs on every start.\niOS build fails after platform upgrade. Cordova iOS 7+ needs a current Xcode. App Store uploads require Xcode 26. You can generate signing assets with the iOS certificate generator. Once you move to Capacitor, Capgo Build can produce signed iOS builds in the cloud without a local Mac.\nUpdates work on Android but not iOS. Check that the iOS scheme in config.xml is the default app scheme with localhost hostname.\nShould you move to Capacitor instead?\nYou do not have to. Capgo for Cordova exists so you can keep shipping while you decide. Capacitor brings a maintained native layer, Swift Package Manager on iOS, and a larger plugin ecosystem. When you are ready, keep the same Capgo app ID and channels and swap the client plugin. Our Cordova to Capacitor migration guide walks through it.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/cordova-hot-code-push-alternative/"},"keywords":"cordova hot code push alternative, cordova-hot-code-push-plugin, cordova codepush alternative, cordova live update, cordova ota update, @capgo/cordova-updater","articleSection":"Alternatives"},{"@type":"FAQPage","@id":"https://capgo.app/blog/cordova-hot-code-push-alternative/#faqpage","url":"https://capgo.app/blog/cordova-hot-code-push-alternative/","mainEntity":[{"@type":"Question","name":"Is cordova-hot-code-push still maintained?","acceptedAnswer":{"@type":"Answer","text":"No. The nordnet/cordova-hot-code-push repository is archived on GitHub, its last code push was in 2018, and the last npm release is 1.5.3. It was built for older Cordova platforms and WebView setups."}},{"@type":"Question","name":"What happened to CodePush for Cordova?","acceptedAnswer":{"@type":"Answer","text":"Microsoft archived cordova-plugin-code-push, ended Cordova support in App Center, and retired the core App Center service, including CodePush, on March 31, 2025. The CodePush service the plugin talked to is gone."}},{"@type":"Question","name":"Do I need cordova-plugin-ionic-webview for Capgo Cordova live updates?","acceptedAnswer":{"@type":"Answer","text":"No, and you should remove it. @capgo/cordova-updater relies on the default Cordova scheme handlers (https://localhost on Android, app://localhost on iOS). The Ionic WebView plugin bypasses them, so downloaded bundles would not load."}},{"@type":"Question","name":"Is it allowed by Apple and Google to update a Cordova app over the air?","acceptedAnswer":{"@type":"Answer","text":"Yes, for interpreted code such as HTML, CSS and JavaScript, as long as the update does not change the app's primary purpose or add features that need review. Native code changes still require a store release."}},{"@type":"Question","name":"Do I have to migrate to Capacitor to use Capgo?","acceptedAnswer":{"@type":"Answer","text":"No. @capgo/cordova-updater works in Cordova Android 13+ and Cordova iOS 7+ apps. If you migrate to Capacitor later, keep the same Capgo app ID and channels and switch the client plugin."}}]}]}</script>
