<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/how-version-work-in-capgo/#newsarticle","url":"https://capgo.app/blog/how-version-work-in-capgo/","headline":"How version work in Capgo","description":"Understand how Capgo manage versions in your Capacitor app, and use it at best. Learn the meaning of major, minor, patch.","image":["https://capgo.app/versioning.webp"],"datePublished":"2022-08-25T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Capgo uses 2 main variables to manage versions in your Capacitor app:\n\nNative version\nJavaScript versions\n\n\n  \n\nAll versions choices are decided server side by Capgo.\nVersioning system\nTo manage version Capgo use the SemVer system. Read the SemVer specification or check Capgo update compatibility with the Semver Tester.\nVersions\nWhere Capgo find the version to compare\n\nYou can override this behavior by setting version key in capacitor.config.json file docs here\nThe native version will be ignored for all platforms.\n\nIOS\nIn IOS the var is set on your project here ios/App/App/Info.plist under the keyCFBundleShortVersionString or ios/App/App.xcodeproj/project.pbxproj under the key MARKETING_VERSION if MARKETING_VERSION was set in your Info.plist file.\nAndroid\nIn Android, the var is set on your project here android/app/build.gradle under the key defaultConfig.versionName\nJavaScript ( Capgo bundle version )\nIn JavaScript, the var can be set in your package.json under the key version\nOtherwise you need to provide it in the upload command.\nDefault behavior\nThis is how Capgo channel will behave if you didn’t change any settings.\n\nThis behavior will be based on the unique channel you made default.\n\nWhen Fresh installation of your Capacitor app\nWhen user did download your Ionic app for the first time and opens the app it contacts Capgo server.\nCurrently, 4 outputs can happen:\n\nThe native bundle version (1.2.3) is lower than Capgo bundle version (1.2.4), Capgo sends his bundle to the user.\nThe native bundle version (1.2.3) is equal to Capgo bundle version (1.2.3), Capgo send “no need to update”.\nThe native bundle version (1.2.4) is higher than Capgo bundle version (1.2.3), Capgo send “no need to update”.\nThe native bundle version (1.2.3) is MAJOR lower than Capgo bundle version (2.2.3), Capgo send “no need to update”.\n\nOther settings\nDisable auto-downgrade under native\nIf you change this setting to false, Capgo will consider is always the trustable source of the version.\nThen the behavior become :\n\nThe native version (1.2.4) is higher than Capgo version (1.2.3)\n\n\nCapgo sends his version to the user.\n\nDisable auto-upgrade strategy\nThere are a couple of strategies you can chose from. You can learn more about it here\nJavaScript bundle version\nThe JavaScript bundle version is the one you send when doing npx @capgo/cli@latest bundle upload --channel production\nIf you didn’t use the option --bundle 1.2.3, Capgo will get the bundle version from your package.json file (in the version key).\nAfter Your Ionic app has installed one version from Capgo, this is this version who will be compared for:\n\nTheir JavaScript bundle version (1.2.3) is lower than Capgo bundle version (1.2.4), Capgo send his bundle to the user.\n\nWith some guard conditions:\n\nIf native bundle version is higher than Capgo version, the Disable auto downgrade under native condition is applied.\nIf native bundle version is MAJOR lower than Capgo version, the Disable auto upgrade above major condition is applied.\n\nApp store update\nWhen you publish your Capacitor JS app on the App Store, what happens is simple.\nYour user will get the new version from the store and remove all local updates in their app by default.\nIf you want to change that behavior, you need to set the setting resetWhenUpdate read more about it here\nThis can only be changed on the app side, not from the cloud like other settings.\nOther settings\nAfter all this behavior, you can have above that some specific one liked to the deviceID.\nIn Capgo, you can decide to override the behavior for each deviceID.\nYon can link one deviceID to:\n\na specific bundle version\na specific channel\n\nThis will bypass all the settings done above.\nLearn more about it in the article below.\nKeep going from How version work in Capgo\nIf you are using How version work in Capgo to plan native plugin work, connect it with Capgo Plugin Directory for the product workflow in Capgo Plugin Directory, Capacitor Plugins by Capgo for the implementation detail in Capacitor Plugins by Capgo, Adding or Updating Plugins for the implementation detail in Adding or Updating Plugins, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, and Capgo Native Builds for the product workflow in Capgo Native Builds.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-version-work-in-capgo/"},"keywords":"mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Tutorial"}</script>
