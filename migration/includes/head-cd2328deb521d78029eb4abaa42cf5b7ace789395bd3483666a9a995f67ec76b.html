<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-scan-a-document-to-pdf-in-a-capacitor-app/#newsarticle","url":"https://capgo.app/blog/how-to-scan-a-document-to-pdf-in-a-capacitor-app/","headline":"How to Scan a Document to PDF in a Capacitor App","description":"Scan a document to PDF in a Capacitor app: capture pages with the native scanner, build one PDF, then save, share, open, or print it on iOS and Android.","image":["https://capgo.app/capgo_plugins.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To scan a document to PDF in a Capacitor app, open the native scanner with @capgo/capacitor-document-scanner, take the JPEG pages it returns, and combine them into one PDF with pdf-lib. From there you write the PDF with @capacitor/filesystem and hand it to the share sheet, a PDF viewer, or the system print dialog. This guide walks through the full flow with code that runs on Capacitor 8, on both iOS and Android.\nHow scan-to-PDF works on iOS and Android\nBoth platforms ship a system document scanner, so you do not need to build edge detection or perspective correction yourself:\n\n\n\n\niOS\nAndroid\n\n\n\n\nNative scanner\nVisionKit VNDocumentCameraViewController\nGoogle ML Kit Document Scanner (Play services)\n\n\nEdge detection and crop\nYes\nYes\n\n\nFilters / cleanup\nVisionKit built-in\nbase, base_with_filter, full modes (stain and finger removal in full)\n\n\nPage limit per session\n24\n1 to 24, default 20\n\n\nCamera permission prompt\nYes, needs NSCameraUsageDescription\nNo, the scanner runs in Play services\n\n\nWorks on emulator / simulator\nNo\nNo\n\n\nOutput from the plugin\nJPEG pages\nJPEG pages\n\n\n\nThe plugin returns images, not a PDF. That is a deliberate split: you control the page size, compression, and file name, and the same PDF code works for photos picked from the gallery or files received from your backend.\nInstall the plugins\nbun add @capgo/capacitor-document-scanner @capacitor/filesystem pdf-lib\nbunx cap sync\nThe scanner plugin follows Capacitor major versions, so plugin v8 targets Capacitor 8. pdf-lib is a pure JavaScript library with no native code, which means it runs in the WebView and needs no sync.\niOS setup\nAdd a camera usage string to ios/App/App/Info.plist. VisionKit opens the camera, and iOS terminates the app if the key is missing:\n&lt;key&gt;NSCameraUsageDescription&lt;/key&gt;\n&lt;string&gt;We use the camera to scan your documents.&lt;/string&gt;\nThe plugin’s Swift package targets iOS 15 or later, which matches the Capacitor 8 minimum. Remember that App Store uploads now require Xcode 26, so build with it before you submit. If you do not own a Mac, Capgo Build can produce the signed iOS binary in the cloud.\nAndroid setup\nNothing to add to AndroidManifest.xml. The ML Kit scanner is a Google Play services module that downloads on first use and handles the camera itself, so your app does not request CAMERA. The device needs Google Play services, which rules out most emulators and de-Googled phones. Plan a fallback (a plain camera capture) if you ship to markets where Play services is missing.\nScan the pages\nStart with a function that opens the scanner and returns the page paths, or null when the user cancels:\nimport {\n  DocumentScanner,\n  ResponseType,\n  ScannerMode,\n  ScanDocumentResponseStatus,\n} from '@capgo/capacitor-document-scanner';\n\nexport async function scanPages(): Promise&lt;string[] | null&gt; {\n  const result = await DocumentScanner.scanDocument({\n    responseType: ResponseType.ImageFilePath,\n    maxNumDocuments: 20,\n    letUserAdjustCrop: true,\n    scannerMode: ScannerMode.Full, // Android only\n    croppedImageQuality: 90,       // Android only\n  });\n\n  if (result.status === ScanDocumentResponseStatus.Cancel) {\n    return null;\n  }\n  return result.scannedImages ?? [];\n}\nA few options are worth knowing:\n\nresponseType: ImageFilePath (default) returns file paths, Base64 returns base64 strings. Prefer file paths for multi-page documents. Base64 strings for 20 high resolution pages can reach tens of megabytes and every byte crosses the Capacitor bridge.\nmaxNumDocuments: set it to 1 for single-page flows like receipts or ID cards.\nreviewCapturedDocument: shows each captured page before continuing, useful when users scan important paperwork.\nbrightness and contrast: post-processing applied to the images. A contrast of 1.2 to 1.5 often helps with faded receipts.\nscannerMode (Android): Full adds ML-based cleanup, Base is faster and keeps the image untouched.\n\nWhere the files land differs per platform. On Android, pages go to the app cache directory. On iOS, the plugin writes them to the app’s Documents directory. Neither location is a good long-term home, so the flow below builds the PDF, stores it where you want it, and deletes the page images.\nCombine the pages into one PDF\npdf-lib can embed JPEGs directly without re-encoding them, so the PDF size stays close to the sum of the page sizes. Read each page through Capacitor.convertFileSrc, which turns a native path into a URL the WebView can fetch:\nimport { Capacitor } from '@capacitor/core';\nimport { PDFDocument } from 'pdf-lib';\n\nconst A4 = { width: 595.28, height: 841.89 }; // points\n\nexport async function pagesToPdf(paths: string[]): Promise&lt;string&gt; {\n  const pdf = await PDFDocument.create();\n  pdf.setTitle('Scanned document');\n  pdf.setCreator('My Capacitor App');\n\n  for (const path of paths) {\n    const bytes = await fetch(Capacitor.convertFileSrc(path)).then((r) =&gt; r.arrayBuffer());\n    const image = await pdf.embedJpg(bytes);\n\n    // Fit the image inside an A4 page, keeping its aspect ratio\n    const scale = Math.min(A4.width / image.width, A4.height / image.height);\n    const width = image.width * scale;\n    const height = image.height * scale;\n\n    const page = pdf.addPage([A4.width, A4.height]);\n    page.drawImage(image, {\n      x: (A4.width - width) / 2,\n      y: (A4.height - height) / 2,\n      width,\n      height,\n    });\n  }\n\n  // Base64 without the data URI prefix, ready for Filesystem.writeFile\n  return pdf.saveAsBase64();\n}\nIf you prefer pages that match the scanned paper exactly, replace the A4 logic with pdf.addPage([image.width, image.height]) and draw the image at full size. Receipts look better this way because they are long and narrow.\nAlternative: render the PDF natively\nIf your app already builds PDFs from HTML (invoices, reports), you can reuse that path with @capgo/capacitor-pdf-generator. It renders an HTML string with the platform’s print engine and returns base64:\nimport { PdfGenerator } from '@capgo/capacitor-pdf-generator';\nimport { Capacitor } from '@capacitor/core';\n\nconst html = `\n  &lt;html&gt;&lt;body style=\"margin:0\"&gt;\n    ${paths\n      .map((p) =&gt; `&lt;img src=\"${Capacitor.convertFileSrc(p)}\" style=\"width:100%;page-break-after:always\" /&gt;`)\n      .join('')}\n  &lt;/body&gt;&lt;/html&gt;`;\n\nconst result = await PdfGenerator.fromData({\n  data: html,\n  documentSize: 'A4',\n  orientation: 'portrait',\n  type: 'base64',\n});\n\nif (result.type === 'base64') {\n  // result.base64 contains the PDF\n}\nThis is handy when you want a cover page, a title, or a footer with a date on each page. For pure image-to-PDF, pdf-lib gives you more control over page geometry and image compression.\nSave the PDF\nWrite the base64 output with @capacitor/filesystem. Pick the directory based on how long the file should live:\n\n\n\nDirectory\nAndroid\niOS\nUse it for\n\n\n\n\nDirectory.Cache\nApp cache, can be cleared by the OS\nLibrary/Caches, can be cleared by the OS\nPDFs you upload or share right away\n\n\nDirectory.Data\nPrivate app files, removed on uninstall\nApp Documents folder, backed up to iCloud\nPDFs your app manages and shows again later\n\n\nDirectory.LibraryNoCloud\nPrivate app files\nLibrary/NoCloud, not backed up\nLarge PDFs you can download again\n\n\n\nOn iOS, Directory.Data and Directory.Documents point to the same folder. Add UIFileSharingEnabled and LSSupportsOpeningDocumentsInPlace to Info.plist if users should see those PDFs in the Files app.\nimport { Filesystem, Directory } from '@capacitor/filesystem';\n\nexport async function savePdf(base64: string, name: string) {\n  const fileName = `${name.replace(/[^a-z0-9-_]/gi, '_')}.pdf`;\n  const { uri } = await Filesystem.writeFile({\n    path: `scans/${fileName}`,\n    data: base64,\n    directory: Directory.Data,\n    recursive: true,\n  });\n  return uri; // file:// URI you can share, open, or print\n}\n\nexport async function deletePages(paths: string[]) {\n  await Promise.all(\n    paths.map((path) =&gt; Filesystem.deleteFile({ path }).catch(() =&gt; undefined)),\n  );\n}\nOn native platforms, writeFile treats a string without an encoding option as base64 and writes the binary bytes. Do not pass Encoding.UTF8 for PDFs, or the file will be corrupt.\nIf the user should be able to find the PDF in their Downloads folder on Android, use @capgo/capacitor-file-sharer’s save() method, which writes to MediaStore Downloads without any storage permission on Android 10+. On iOS the same call opens the share sheet so the user can choose “Save to Files”.\nPut the whole flow together\nexport async function scanToPdf(title: string) {\n  const pages = await scanPages();\n  if (!pages || pages.length === 0) return null;\n\n  try {\n    const base64 = await pagesToPdf(pages);\n    return await savePdf(base64, title);\n  } finally {\n    await deletePages(pages);\n  }\n}\nWire it to a button and show a spinner while pagesToPdf runs. On a mid-range Android phone, 10 pages typically take well under a few seconds since the JPEG data is copied, not decoded.\nShare, open, or print the PDF\nShare with the system share sheet\nimport { FileSharer } from '@capgo/capacitor-file-sharer';\n\nawait FileSharer.share({\n  filename: 'contract.pdf',\n  path: pdfUri,\n  contentType: 'application/pdf',\n  subject: 'Signed contract',\n});\n@capgo/capacitor-file-sharer copies the file into its own cache folder and serves it through its own FileProvider on Android, so you do not need to edit file_paths.xml, even if the PDF lives in Directory.Data. If you use the official @capacitor/share plugin instead, its files option works out of the box only for the cache directory on Android. Other folders must be added to android/app/src/main/res/xml/file_paths.xml.\nOpen in the user’s PDF app\nFor a quick preview, the community file opener hands the file to Quick Look on iOS or to the default PDF viewer on Android:\nbun add @capacitor-community/file-opener\nbunx cap sync\nimport { FileOpener } from '@capacitor-community/file-opener';\n\nawait FileOpener.open({\n  filePath: pdfUri,\n  contentType: 'application/pdf',\n});\nPrint\n@capgo/capacitor-printer opens UIPrintInteractionController on iOS and PrintManager on Android:\nimport { Printer } from '@capgo/capacitor-printer';\n\nawait Printer.printPdf({\n  name: 'Signed contract',\n  path: pdfUri,\n});\nThe name becomes the print job name and the default file name if the user picks “Save as PDF” in the print dialog.\nUpload the PDF\nTo send the PDF to your backend, read it back as a Blob and post it with fetch, or use a native uploader for large files so the upload continues when the app goes to the background:\nimport { Uploader } from '@capgo/capacitor-uploader';\n\nconst { id } = await Uploader.startUpload({\n  filePath: pdfUri,\n  serverUrl: 'https://api.example.com/documents',\n  method: 'POST',\n  headers: { Authorization: `Bearer ${token}` },\n  mimeType: 'application/pdf',\n});\nSee the Capacitor uploader plugin for progress events and multipart uploads.\nMake scanned PDFs searchable\nImage-only PDFs cannot be searched or copied from. If users expect to search their scans:\n\nRun OCR on each page image before you delete it. On-device options include ML Kit Text Recognition on Android and the Vision framework on iOS, both reachable through community Capacitor plugins, or a server-side OCR service.\nStore the recognized text in your database next to the PDF path and search there.\nIf the PDF itself must contain text, generate it server-side with an OCR tool that writes an invisible text layer, such as OCRmyPDF.\n\nFor most apps, step 2 is enough and avoids shipping a second large model in the app.\nTroubleshooting\n“Document scanner is not supported on Android emulators”: expected. Use a physical device with Google Play services.\nThe app crashes on iOS the moment the scanner opens: NSCameraUsageDescription is missing from Info.plist, or the user denied camera access earlier. Check Settings, Privacy, Camera.\nembedJpg throws “SOI not found”: the bytes are not a JPEG. This happens if you passed a base64 data URL where pdf-lib expected raw bytes, or fetched a path that returned an HTML error page. Log Capacitor.convertFileSrc(path) and open it in the Safari or Chrome inspector.\nThe PDF is huge: lower croppedImageQuality (Android) or re-compress pages with @capgo/capacitor-file-compressor before embedding. A quality of 70 to 80 is usually readable for text documents.\nPages appear rotated: rotate inside pdf-lib with page.setRotation(degrees(90)) or let the user fix rotation in the scanner review screen with reviewCapturedDocument: true.\nSharing fails on Android with FileUriExposedException or “Failed to find configured root”: you passed a path outside the folders declared in file_paths.xml to @capacitor/share. Use the file sharer plugin or copy the PDF to Directory.Cache first.\nOld page images fill up storage on iOS: the scanner writes JPEGs to the Documents directory. Delete them after building the PDF, as shown in scanToPdf.\nShipping updates to the scan flow\nMost of this feature lives in TypeScript: the PDF layout, file naming, upload logic, and UI. Changes to those parts do not need a new store release. With Capgo live updates you can ship a fix to the PDF layout or upload endpoint to every user the same day, while native changes (adding the plugin, editing Info.plist) still go through a normal build. The document scanner docs list every option if you need to tune the scanner further.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-scan-a-document-to-pdf-in-a-capacitor-app/"},"keywords":"capacitor document scanner, scan document to pdf capacitor, capacitor pdf, ionic document scanner, visionkit capacitor, ml kit document scanner, capacitor scan to pdf","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-scan-a-document-to-pdf-in-a-capacitor-app/#faqpage","url":"https://capgo.app/blog/how-to-scan-a-document-to-pdf-in-a-capacitor-app/","mainEntity":[{"@type":"Question","name":"How do I scan a document to PDF in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"Call DocumentScanner.scanDocument() from @capgo/capacitor-document-scanner to get one JPEG per page, then combine the pages into a single PDF with pdf-lib (or render them through @capgo/capacitor-pdf-generator), write it with @capacitor/filesystem, and share, open, or print the file."}},{"@type":"Question","name":"Does the Capacitor document scanner work on the Android emulator?","acceptedAnswer":{"@type":"Answer","text":"No. The Android side uses the Google ML Kit document scanner, which is delivered through Google Play services and does not run on emulators. Test on a physical Android device. On iOS, VisionKit also needs a real device with a camera."}},{"@type":"Question","name":"Is the PDF searchable?","acceptedAnswer":{"@type":"Answer","text":"Not by default. The scanner returns images, so the PDF contains one image per page with no text layer. If you need search or copy and paste, run OCR on the images (for example with ML Kit Text Recognition or Apple Vision) and store the text next to the PDF or upload it to a server-side OCR service."}},{"@type":"Question","name":"How many pages can one scan contain?","acceptedAnswer":{"@type":"Answer","text":"The maxNumDocuments option controls it. On Android the plugin clamps it between 1 and 24 and defaults to 20. On iOS VisionKit caps a session at 24 pages. Split longer documents into several scans and merge the PDFs with pdf-lib."}},{"@type":"Question","name":"Can I make the scan-to-PDF flow work on the web?","acceptedAnswer":{"@type":"Answer","text":"The native scanner only runs on iOS and Android. On the web, use a file input with capture=environment or getUserMedia to take a photo, then build the PDF with the same pdf-lib code, which runs in any browser."}}]}]}</script>
