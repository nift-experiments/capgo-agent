<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/developing-cross-platform-apps-with-capacitorjs/#newsarticle","url":"https://capgo.app/blog/developing-cross-platform-apps-with-capacitorjs/","headline":"Developing Cross-Platform Apps with CapacitorJS: A Step-by-Step Guide","description":"Learn how to create cross-platform applications using CapacitorJS with a single JavaScript codebase for Android, iOS, and web (PWA).","image":["https://capgo.app/create_app_with_js.webp"],"datePublished":"2023-12-02T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"In the evolving world of mobile application development, the rise of Progressive Web Applications (PWAs) has paved the way for new cross-platform runtimes. These runtimes enable web-based applications to be present in app stores without relying solely on native code. One such technology that facilitates this is CapacitorJS, which allows developers to deploy a simple website as an application across Android, iOS, and the web using a single JavaScript codebase. This approach significantly reduces development costs and increases coding efficiency.\nThis guide will focus on creating an application using pure JavaScript without any additional frameworks. Despite the challenges of finding resources for pure JavaScript app development in 2021, we’re here to provide you with a comprehensive tutorial on building your application and utilizing native plugins with CapacitorJS.\n‣ Prerequisites\nBefore we begin, ensure you have the following tools installed:\n\nNode.js (v14.16.1) or higher\nNPM (v7.6.2) or higher\nAndroid Studio for Android app development\nXcode for iOS app development (macOS only)\n\n\nNote: iOS app development is only possible on a macOS device.\n\n‣ Setting Up Your Capacitor Project\nTo create a Capacitor application, navigate to your desired folder and execute the following command in your terminal:\nnpm init @capacitor/app\nFollow the prompts to install the package and set up your project. With Capacitor v3, your project directory should look like this:\nwww/\n  css/\n    style.css\n  js/\n    capacitor-welcome.js\n  index.html\n  manifest.json\n.gitignore\ncapacitor.config.json\npackage.json\nREADME.md\nWith the initial setup complete, you’re ready to proceed.\n‣ Project Restructuring\nWe’ll be using Vite to bundle our JavaScript files, so let’s restructure our project accordingly:\n\nCreate a new folder src in the main directory.\nCreate a new script file index.js in src/.\nCreate the Vite config file vite.config.js in the main directory.\nRemove the capacitor-welcome.js file from www/js/.\n\nYour new folder structure should resemble:\nsrc/\n  index.js\nwww/\n  css/\n    style.css\n  js/\n  index.html\n  manifest.json\n.gitignore\ncapacitor.config.json\npackage.json\nREADME.md\nvite.config.js\n‣ Adapting to Pure JavaScript\nLet’s modify some files to work with pure JavaScript:\nwww/index.html\n\nRemove the script imports for Ionic PWA Elements if you’re not releasing the app as a PWA:\n\n&lt;script type=\"module\" src=\"https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.esm.js\"&gt;&lt;/script&gt;\n&lt;script nomodule src=\"https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.js\"&gt;&lt;/script&gt;\n\n\nDelete the &lt;capacitor-welcome&gt; HTML element from the body.\n\n\nUpdate the script import from capacitor.js to js/main.js. This will be our bundled JavaScript file.\n\n\nRemove the js/capacitor-welcome.js import. Your index.html is now ready.\n\n\nvite.config.js\nTo bundle our Node.js modules with Vite, we need a config file specifying the output destination for our bundled script. The following configuration will take the file src/index.js and bundle it for production as www/js/main.js:\nimport { defineConfig } from 'vite';\nimport path from 'node:path';\n\nexport default defineConfig({\n  build: {\n    outDir: path.resolve(__dirname, 'www'),\n    rollupOptions: {\n      input: './src/index.js',\n      output: {\n        format: 'es',\n        file: path.resolve(__dirname, 'www/js/main.js')\n      }\n    }\n  }\n});\ncapacitor.config.json\nIn the capacitor.config.json file, locate the \"bundledWebRuntime\": true property and change it to false. This adjustment ensures that Capacitor does not bundle the files, allowing us to use Vite for that purpose instead.\nWith these changes, your Capacitor application’s basic setup is complete, and you’re ready to start developing your app with pure JavaScript.\n‣ Developing Your App\nNow that the groundwork is laid, you can begin writing your application logic in the src/index.js file. Here, you can import any necessary Node.js modules, define your app’s functionality, and interact with Capacitor’s native plugins.\nRemember to run Vite’s build command to bundle your JavaScript files whenever you make changes:\nvite build\nThis command will generate the main.js file in your www/js directory, which your index.html file will reference.\n‣ Testing and Debugging\nCapacitor provides a convenient way to test your application on various platforms. Use the following commands to open your app in the respective platform’s development environment:\nFor Android:\nnpx cap add android\nnpx cap open android\nFor iOS (macOS only):\nnpx cap add ios\nnpx cap open ios\nFor Web/PWA:\nnpx cap serve\nThese commands will allow you to run your application in Android Studio, Xcode, or your web browser, where you can test and debug as needed.\n‣ Conclusion\nDeveloping cross-platform applications with CapacitorJS using pure JavaScript is a cost-effective and efficient way to create apps for multiple platforms with a single codebase. By following this guide, you’ve set up your project, restructured it for Vite, and prepared your app for development. With this foundation, you’re well on your way to building a robust and versatile application.\nRemember to test thoroughly on all platforms and make use of Capacitor’s native plugins to enhance your app’s functionality. Happy coding!\nKeep going from Developing Cross-Platform Apps with CapacitorJS: A Step-by-Step Guide\nIf you are using Developing Cross-Platform Apps with CapacitorJS: A Step-by-Step Guide to plan native plugin work, connect it with Capgo Plugin Directory for the product workflow in Capgo Plugin Directory, Capacitor Plugins by Capgo for the implementation detail in Capacitor Plugins by Capgo, Adding or Updating Plugins for the implementation detail in Adding or Updating Plugins, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, and Capgo Native Builds for the product workflow in Capgo Native Builds.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/developing-cross-platform-apps-with-capacitorjs/"},"keywords":"Capacitor, cross-platform, PWA, mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Tutorial"}</script>
