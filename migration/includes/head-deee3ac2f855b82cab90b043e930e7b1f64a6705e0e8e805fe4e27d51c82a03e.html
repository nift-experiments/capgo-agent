<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/automatic-build-and-release-with-github-actions/#newsarticle","url":"https://capgo.app/blog/automatic-build-and-release-with-github-actions/","headline":"Automatic build and release app with Github actions","description":"Create your own CI/CD pipeline with Github actions for free, deploy your Ionic Capacitor JS app every time you push to main.","image":["https://capgo.app/github_actions.webp"],"datePublished":"2022-03-23T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"This tutorial focuses on the GitHub hosting, but you can adapt it with little tweak to any other CI/CD platform.\nPreface\nBe sure you have added your Capacitor app first to Capgo, this tutorial just focuses on the upload phase.\nIf you need to add your app to Capgo, you can follow this Tutorial\nCommit convention\nFirst you need to start following the commit convention conventional commits` this will help the tooling understand how to upgrade the version number, it’s 5 min to learn it.\n\nGitHub actions for tag\nThen you have to create your first GitHub action to automatically build and create tag.\nCreate a file at this path: .github/workflows/bump_version.yml\nwith this content:\nname: Bump version\n\non:\n  push:\n    branches:\n      - main\n\njobs:\n  bump-version:\n    if: \"!startsWith(github.event.head_commit.message, 'chore(release):')\"\n    runs-on: ubuntu-latest\n    name: \"Bump version and create changelog with standard version\"\n    steps:\n      - name: Check out\n        uses: actions/checkout@v6\n        with:\n          fetch-depth: 0\n          filter: blob:none\n          token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'\n      - name: Git config\n        run: |\n          git config --local user.name \"github-actions[bot]\"\n          git config --local user.email \"github-actions[bot]@users.noreply.github.com\"\n      - name: Create bump and changelog\n        run: npx capacitor-standard-version\n      - name: Push to origin\n        run: |\n          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)\n          remote_repo=\"https://${GITHUB_ACTOR}:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git\"\n          git pull $remote_repo $CURRENT_BRANCH\n          git push $remote_repo HEAD:$CURRENT_BRANCH --follow-tags --tags\nThis will release a tag for every commit in your main branch. And add a changelog entry for each commit in the main branch in CHANGELOG.md.\nDon’t worry if you don’t have this file, it will be created for you.\nTo make this work, create a PERSONAL ACCESS TOKEN and add it to your GitHub secrets as PERSONAL_ACCESS_TOKEN.\nThis is necessary to let the CI commit the changelog.\nWhen you create the token, choose expiration as never and the scope as repo.\nLastly, set the version in your package.json file, sync it with your Native version number that will facilitate, then next step.\nThis is only necessary the first time, then the tools will keep it up to date.\nYou can now commit this both files and see your first tag appear in GitHub!\nBoth native and web platform will have the version number bump after each commit.\nGitHub actions for build\nCreate a file at this path: .github/workflows/build.yml\nwith this content:\nname: Build source code and send to Capgo\n\non:\n  push:\n    tags:\n      - '*'\n      \njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    name: \"Build code and release\"\n    steps:\n      - name: Check out\n        uses: actions/checkout@v6\n      - name: Install dependencies\n        id: install_code\n        run: npm i\n      - name: Build\n        id: build_code\n        run: npm run build\n        env: # Remove both lines  if you don't need it\n          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }} # Example of env var coming from a secret\n      - name: Create Release\n        id: create_release\n        run: npx @capgo/cli@latest bundle upload -a ${{ secrets.CAPGO_TOKEN }} -c production\nThis will install and build your dependency before sending it to Capgo.\nIf your command for build is different, you can change it in the build_code step.\nTo make this work, you need to get your API key for Capgo, add it in the secret of your GitHub repository as CAPGO_TOKEN.\nYou can now commit this both files and see your first tag appear in GitHub!\nAdd the commit will generate a new build for the production channel.\nYou should add your test in the build step to ensure your code is working.\nGo To your Capgo dashboard and check your build who just appeared, you now have your CI/CD system.\nIf you want to let all of your users get the update whenever it’s available, go to your channel and set it to public.\nYou can also add the native build of your Ionic Capacitor JavaScript app by following this tutorial 👇\nKeep going from Automatic build and release app with Github actions\nIf you are using Automatic build and release app with Github actions to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/automatic-build-and-release-with-github-actions/"},"keywords":"Github actions, CI/CD, automatic build, automatic release, mobile app updates","articleSection":"CI/CD"}</script>
