<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/updating-from-capacitor-4-to-capacitor-5/#newsarticle","url":"https://capgo.app/blog/updating-from-capacitor-4-to-capacitor-5/","headline":"Updating from Capacitor 4 to Capacitor 5: A Step-by-Step Guide","description":"Learn how to update your project from Capacitor 4 to Capacitor 5 with minimal breaking changes, including updating official plugins and required tools.","image":["https://capgo.app/capacitor-5-update.webp"],"datePublished":"2023-06-09T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Compared to previous updates, the transition from Capacitor 4 to Capacitor 5 involves minimal breaking changes. This guide provides step-by-step instructions for updating your project to Capacitor 5, as well as a list of breaking changes for official plugins.\nNote: Capacitor 5 requires NodeJS 16 or higher, as Node 12 has reached end-of-life and Node 14 will reach end-of-life on April 30th, 2023. It is recommended to use the latest LTS version of NodeJS.\n\n\nInstall the latest version of the Capacitor CLI in your project:\nnpm i -D @capacitor/cli@latest\n\n\nRun the following command to let the CLI handle the migration:\nnpx cap migrate\nIf any migration steps cannot be achieved, additional information will be provided in the terminal output. Manual migration steps are listed below.\n\n\nIf you have the VS Code extension installed, check the recommendations section of the extension to find the option to migrate your project to Capacitor 5.\n\n\nUpgrading Capacitor 4 iOS Project to Capacitor 5\n\n\nUpgrade Xcode: Capacitor 5 requires Xcode 14.1+.\n\n\nUpdate .gitignore: Make the following changes to your .gitignore file:\n- App/Podfile.lock\n+ App/output\n\n\nUpdate Assets to use a single app icon: Xcode 14 supports a single app icon of 1024x1024. Clean up your AppIcon.appiconset by removing all unnecessary sizes.\n\n\nUpgrading Capacitor 4 Android Project to Capacitor 5\n\n\nUpgrade Android Studio: Capacitor 5 requires Android Studio Flamingo | 2022.2.1 or newer due to the usage of Gradle 8, which requires Java JDK 17. Java 17 ships with Android Studio Flamingo, so no additional downloads are needed.\n\n\nRun AGP Upgrade Assistant: Android Studio can help with some updates related to Gradle and moving packages into build files. To start, run Tools -&gt; AGP Upgrade Assistant.\n\n\nUpdate Android Project Variables: In your variables.gradle file, update your values to the following new minimums:\nminSdkVersion = 22\ncompileSdkVersion = 33\ntargetSdkVersion = 33\nandroidxActivityVersion = '1.7.0'\nandroidxAppCompatVersion = '1.6.1'\nandroidxCoordinatorLayoutVersion = '1.2.0'\nandroidxCoreVersion = '1.10.0'\nandroidxFragmentVersion = '1.5.6'\ncoreSplashScreenVersion = '1.0.0'\nandroidxWebkitVersion = '1.6.1'\njunitVersion = '4.13.2'\nandroidxJunitVersion = '1.1.5'\nandroidxEspressoCoreVersion = '3.5.1'\ncordovaAndroidVersion = '10.1.1'\n\n\nUpdate Google Services:\n# build.gradle\ndependencies {\n-       classpath 'com.google.gms:google-services:4.3.13'\n+       classpath 'com.google.gms:google-services:4.3.15'\n}\n\n\nUpdate Gradle plugin to 8.0.0:\n# build.gradle\ndependencies {\n-       classpath 'com.android.tools.build:gradle:7.2.1'\n+       classpath 'com.android.tools.build:gradle:8.0.0'\n}\n\n\nUpdate Gradle wrapper to 8.0.2:\n# gradle-wrapper.properties\ndistributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\n- distributionUrl=https\\://services.gradle.org/distributions/gradle-7.4.2-all.zip\n+ distributionUrl=https\\://services.gradle.org/distributions/gradle-8.0.2-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n\n\nDisable Jetifier:\n# gradle.properties\nandroid.useAndroidX=true\n- android.enableJetifier=true\n\n\nMove package to build.gradle:\n# AndroidManifest.xml\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n- &lt;manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n-     package=\"[YOUR_PACKAGE_ID]\"&gt;\n+ &lt;manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"&gt;\n# build.gradle\nandroid {\n+     namespace \"[YOUR_PACKAGE_ID]\"\n      compileSdkVersion rootProject.ext.compileSdkVersion\n\n\nUpdate androidScheme: In Capacitor 6, https will be the default setting for androidScheme for existing apps to better enable Capacitor applications to use the system Autofill feature. To avoid data loss as a result of this change, set the scheme to http now, even if it’s the current default.\n{\n  server: {\n    androidScheme: \"http\"\n  }\n}\n\n\nUpdate Kotlin version: If your project uses Kotlin, update the kotlin_version variable to '1.8.20'.\n\n\nPlugin Functionality Changes\nThe following plugin functionality has been modified or removed. Update your code accordingly:\n\nAction Sheet\nBrowser\nCamera\nDevice\nGeolocation\nGoogle Maps\nLocal Notifications\nPush Notifications\nStatus Bar\n\nAction Sheet\n\nUpdate the androidxMaterialVersion variable to 1.8.0.\n\nBrowser\n\nUpdate the androidxBrowserVersion variable to 1.5.0.\n\nCamera\n\nFor Android 13, add the read media images permission (&lt;uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/&gt;) in AndroidManifest.xml.\nUpdate the androidxMaterialVersion variable to 1.8.0.\nUpdate the androidxExifInterfaceVersion variable to 1.3.6.\n\nDevice\n\nChange DeviceId.uuid to DeviceId.identifier.\nOn iOS 16+, DeviceInfo.name will return a generic device name unless you add the appropriate entitlements.\n\nGeolocation\n\nUpdate the playServicesLocationVersion to 21.0.1.\n\nGoogle Maps\n\nUpdate the following variables:\n\ngoogleMapsPlayServicesVersion to 18.1.0.\ngoogleMapsUtilsVersion to 3.4.0.\ngoogleMapsKtxVersion to 3.4.0.\ngoogleMapsUtilsKtxVersion to 3.4.0.\nkotlinxCoroutinesVersion to 1.6.4.\nandroidxCoreKTXVersion to 1.10.0.\nkotlin_version to 1.8.20.\n\n\n\nLocal Notifications\n\nFor Android 13, a new runtime permission check is required to schedule local notifications when targeting SDK 33. Call checkPermissions() and requestPermissions() accordingly.\n\nPush Notifications\n\nFor Android 13, a new runtime permission check is required to receive push notifications when targeting SDK 33. Call checkPermissions() and requestPermissions() accordingly.\nUpdate the firebaseMessagingVersion variable to 23.1.2.\n\nStatus Bar\n\nOn iOS, the default status bar animation has been changed to FADE.\n\nBy following these steps and updating your code accordingly, you should now have successfully updated your project from Capacitor 4 to Capacitor 5. Make sure to test your application thoroughly to ensure that all features and plugins are working as expected.\nKeep going from Updating from Capacitor 4 to Capacitor 5: A Step-by-Step Guide\nIf you are using Updating from Capacitor 4 to Capacitor 5: A Step-by-Step Guide to plan native plugin work, connect it with Capgo Plugin Directory for the product workflow in Capgo Plugin Directory, Capacitor Plugins by Capgo for the implementation detail in Capacitor Plugins by Capgo, Adding or Updating Plugins for the implementation detail in Adding or Updating Plugins, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, and Capgo Native Builds for the product workflow in Capgo Native Builds.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/updating-from-capacitor-4-to-capacitor-5/"},"keywords":"Capacitor, mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Capacitor"}</script>
