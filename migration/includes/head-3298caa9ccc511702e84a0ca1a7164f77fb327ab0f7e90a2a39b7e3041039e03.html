<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/troubleshooting-capacitor-android-build-errors/#newsarticle","url":"https://capgo.app/blog/troubleshooting-capacitor-android-build-errors/","headline":"Capacitor Android Troubleshooting: Common Errors and Fixes","description":"Fix common Capacitor Android issues: JDK 21 and Gradle errors, compileSdk 36, namespace, Kotlin conflicts, plugin not implemented and blank screens.","image":["https://capgo.app/android-studio-run.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"Most Capacitor Android build failures come from a toolchain mismatch: the wrong JDK, an old Gradle wrapper, or an SDK level that doesn’t match what a dependency needs. For Capacitor 8, use JDK 21, Android Gradle Plugin 8.13.0, Gradle 8.14.3, compileSdk and targetSdk 36 and minSdk 24, then run bunx cap sync android and read the first Gradle error, not the last.\nThis guide lists the Android errors we see most in Capacitor projects, grouped by where they happen: Gradle setup, dependency resolution, compilation, install, and runtime. For iOS, see the Capacitor iOS troubleshooting guide.\nQuick triage checklist\nbunx cap doctor              # core, CLI and android must share the same major\nnode -v                      # 22+ for Capacitor 8\njava -version                # 21 for Capacitor 8\nbun run build &amp;&amp; bunx cap sync android\ncd android &amp;&amp; ./gradlew assembleDebug --stacktrace\nThen confirm the expected values for your Capacitor version:\n\n\n\nSetting\nFile\nCapacitor 7\nCapacitor 8\n\n\n\n\nminSdkVersion\nvariables.gradle\n23\n24\n\n\ncompileSdkVersion / targetSdkVersion\nvariables.gradle\n35\n36\n\n\nAndroid Gradle Plugin\nandroid/build.gradle\n8.7.2\n8.13.0\n\n\nGradle wrapper\ngradle/wrapper/gradle-wrapper.properties\n8.11.1\n8.14.3\n\n\nJDK\nGradle JDK / JAVA_HOME\n21\n21\n\n\nAndroid Studio\n\nLadybug+\nOtter 2025.2.1+\n\n\n\nIf you’re mid-upgrade, follow How to Upgrade Your Capacitor App to Capacitor 8 first.\nGradle and JDK errors\nerror: invalid source release: 21\nGradle runs on JDK 17 or older, but @capacitor/android 8 compiles with Java 21. In Android Studio: Settings &gt; Build, Execution, Deployment &gt; Build Tools &gt; Gradle &gt; Gradle JDK and pick the bundled JDK 21 (JetBrains Runtime). On the command line and in CI:\nexport JAVA_HOME=$(/usr/libexec/java_home -v 21)   # macOS\n# GitHub Actions\n- uses: actions/setup-java@v4\n  with:\n    distribution: temurin\n    java-version: '21'\nUnsupported class file major version 65\nThe reverse problem: you run JDK 21 with a Gradle wrapper too old to read Java 21 class files. Update the wrapper:\ncd android\n./gradlew wrapper --distribution-type all --gradle-version 8.14.3\nMinimum supported Gradle version is 8.13. Current version is 8.11.1\nAGP was updated but the wrapper wasn’t. Each AGP version has a minimum Gradle version, and AGP 8.13 needs Gradle 8.13+. Set the wrapper to 8.14.3 as above.\nThe project is using an incompatible version (AGP 8.13.0) of the Android Gradle plugin\nYour Android Studio is older than the AGP in the project. Install Android Studio Otter or newer.\nSDK location not found\nGradle can’t find the Android SDK. Open the project once in Android Studio (it writes android/local.properties), or set the variable:\nexport ANDROID_HOME=\"$HOME/Library/Android/sdk\"\nDon’t commit local.properties. It contains a machine-specific path.\nCould not resolve all files for configuration / Could not GET https://dl.google.com/...\nNetwork or repository problem. Check proxy settings in ~/.gradle/gradle.properties, make sure google() and mavenCentral() are in repositories, and retry with --refresh-dependencies. Corporate networks often need a mirror.\nJava heap space or GC overhead limit exceeded\nRaise Gradle’s memory in android/gradle.properties:\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nThe Capacitor template ships with -Xmx1536m, which is tight for apps with many plugins.\nDependency and SDK level errors\nDependency 'androidx.core:core:1.17.0' requires libraries and applications that depend on it to compile against version 36 or later\ncompileSdkVersion is below what an AndroidX library needs. Set it to 36 in variables.gradle. If the error names a plugin module, that plugin hardcodes an old value. Upgrade it, or patch its build.gradle.\nManifest merger failed : uses-sdk:minSdkVersion 23 cannot be smaller than version 24 declared in library\nYour app’s minSdkVersion is lower than a dependency’s. Capacitor 8 needs 24. Raise it in variables.gradle.\nDuplicate class kotlin.collections.jdk8.CollectionsJDK8Kt found in modules\nTwo Kotlin standard library artifacts with overlapping classes, usually because one plugin pulls an old kotlin-stdlib-jdk8. Align on one Kotlin version. Set kotlin_version = '2.2.20' in your root build.gradle (plugins read it via rootProject.ext) and upgrade plugins that pin Kotlin 1.x. If needed, force the BOM in android/app/build.gradle:\ndependencies {\n    implementation(platform(\"org.jetbrains.kotlin:kotlin-bom:2.2.20\"))\n}\nDuplicate class com.google.android.gms... or com.google.firebase...\nTwo plugins bring different versions of Play Services or Firebase. Most Capacitor plugins read versions from variables.gradle (for example firebaseMessagingVersion), so define them once there so every plugin uses the same value.\nProject with path ':capacitor-xxx' could not be found in project ':app'\nandroid/capacitor.settings.gradle and android/app/capacitor.build.gradle are out of date. Both are generated. Run bunx cap sync android, then File &gt; Sync Project with Gradle Files.\nCompilation errors\nNamespace not specified. Specify a namespace in the module's build file\nAGP 8+ requires namespace in every Android module. Old plugins only declare package in their AndroidManifest.xml. Upgrade the plugin. If no release exists, patch its android/build.gradle:\nandroid {\n    namespace = \"com.example.plugin\"\n}\nand remove the package attribute from its manifest.\n'compileDebugJavaWithJavac' task (current target is 21) and 'compileDebugKotlin' task (current target is 17) jvm target compatibility should be set to the same Java version\nA Kotlin module (yours or a plugin’s) has a different jvmTarget than its Java targetCompatibility. In Kotlin 2.x, set it with compilerOptions:\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21\n    }\n}\nThe old kotlinOptions {} block is an error in Kotlin 2.2, so plugins still using it need an update or a patch.\nErrors about proguard-android.txt with AGP 9\nIf you already moved to AGP 9, plugins that reference getDefaultProguardFile('proguard-android.txt') fail. The fix is proguard-android-optimize.txt. Full details in fix Capacitor plugin build errors with AGP 9. For Capacitor 8 apps, AGP 8.13 remains the tested version.\ncannot find symbol R.layout.bridge_layout_main\nCapacitor 8 renamed the layout to capacitor_bridge_layout_main. Update the reference in your MainActivity or custom fragment.\nandroid:exported needs to be explicitly specified for element &lt;activity#...&gt;\nApps targeting Android 12+ must set android:exported on every activity, service and receiver with an intent filter. Add android:exported=\"true\" (or false) in your manifest. If the element comes from a plugin manifest, upgrade or patch the plugin.\nInstall errors\nINSTALL_FAILED_UPDATE_INCOMPATIBLE\nAn app with the same ID but a different signing key is installed, usually a release build from the Play Store versus your debug build. Uninstall it first:\nadb uninstall com.example.app\nDevice not listed in Android Studio or adb devices shows unauthorized\nEnable Developer options and USB debugging, accept the RSA prompt on the phone, and use a data-capable cable. adb kill-server &amp;&amp; adb start-server fixes most stuck states.\nPlay Console: “Your app does not support 16 KB memory page sizes”\nA native .so library in your app isn’t 16 KB aligned. Find the plugin that ships it and upgrade. See Android 16 KB page size and Capacitor plugins.\nSigning a release build\nMissing or wrong keystore settings cause Keystore file not found or Failed to read key. Our Android keystore generator creates a keystore and the Gradle signing config. Keep the keystore out of git and back it up. Losing it means you can’t update the app unless you use Play App Signing.\nRuntime errors\n\"X\" plugin is not implemented on android\n\nThe plugin is in package.json and you ran bunx cap sync android after installing it.\nAndroid Studio synced Gradle after the sync (File &gt; Sync Project with Gradle Files).\nThe plugin appears in android/capacitor.settings.gradle.\nThe plugin version matches your Capacitor major. A Capacitor 7 plugin may compile but register differently.\nYou’re not running an old APK. Uninstall and reinstall.\n\nBlank white screen\nOpen chrome://inspect and check the WebView console. Common causes:\n\nnet::ERR_CLEARTEXT_NOT_PERMITTED during live reload: Android blocks plain HTTP. For development only, set server.cleartext: true in the Capacitor config, and remove server.url before release.\nDev server unreachable: bind it to 0.0.0.0, use your LAN IP, keep phone and computer on the same network, or forward the port with bunx cap run android --forwardPorts 5173:5173.\nOld Android System WebView: Capacitor checks android.minWebViewVersion (default 60) and logs an error on older WebViews. Devices that never update the WebView may also fail on modern JavaScript. The WebView version checker plugin can detect outdated WebViews and prompt users to update.\nBuild target too new for the device’s WebView. Lower your bundler target or add polyfills.\nWrong webDir: check android/app/src/main/assets/public contains index.html.\nBroken live update bundle: with Capgo, a bundle that never calls notifyAppReady() is rolled back automatically after the timeout. See the updater docs.\n\nContent behind the status bar or navigation bar\nApps targeting SDK 35+ draw edge-to-edge on Android 15, and Android 16 removed the opt-out for apps targeting SDK 36. Capacitor 8 removed adjustMarginsForEdgeToEdge. Handle insets with the System Bars plugin config and CSS:\nplugins: {\n  SystemBars: {\n    insetsHandling: 'css',\n    initialViewportFitValueHint: 'cover',\n  },\n},\n&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" /&gt;\nbody {\n  padding-top: env(safe-area-inset-top);\n  padding-bottom: env(safe-area-inset-bottom);\n}\nWith insetsHandling: 'css', Capacitor also injects --safe-area-inset-* CSS variables, which helps on older WebViews where env() reports zero.\nWebView reloads when rotating or resizing\nThe activity is being recreated. Check android:configChanges on the main activity includes density (added in Capacitor 8) along with orientation|screenSize|smallestScreenSize|screenLayout|uiMode|navigation.\nOrientation lock ignored on tablets\nOn Android 16+, large screens ignore orientation locks for apps targeting SDK 36. A temporary manifest opt-out exists (android.window.PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY), but Android 17 removes it. Design for both orientations on large screens.\nHow to debug when the error isn’t listed\n\nRead the first error. Run ./gradlew assembleDebug --stacktrace and scroll up to the first FAILURE or What went wrong.\nCheck the dependency tree for version conflicts: ./gradlew :app:dependencies --configuration debugRuntimeClasspath.\nLogcat filtered to your package for native crashes. Capacitor logs plugin calls with the Capacitor tag.\nchrome://inspect for JavaScript errors.\nIsolate with a fresh bun create @capacitor/app project and only the suspect plugin.\n\nMore tools are covered in the ultimate guide to debugging Capacitor apps and how to resolve Android build errors in Capacitor. If your CI machines are the problem rather than the code, Capgo Build runs Android builds with the right JDK and SDK already installed.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/troubleshooting-capacitor-android-build-errors/"},"keywords":"Capacitor Android troubleshooting, Capacitor Android build error, invalid source release 21, Minimum supported Gradle version, plugin is not implemented Android, Capacitor blank screen Android, ERR_CLEARTEXT_NOT_PERMITTED, Capacitor edge-to-edge","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/troubleshooting-capacitor-android-build-errors/#faqpage","url":"https://capgo.app/blog/troubleshooting-capacitor-android-build-errors/","mainEntity":[{"@type":"Question","name":"Which JDK does Capacitor 8 need on Android?","acceptedAnswer":{"@type":"Answer","text":"JDK 21. The @capacitor/android module compiles with Java 21 source and target compatibility, so Gradle must run on a JDK 21. Android Studio Otter bundles one; set it under Settings > Build, Execution, Deployment > Build Tools > Gradle > Gradle JDK, and set JAVA_HOME to a JDK 21 for command-line and CI builds."}},{"@type":"Question","name":"Where do I change minSdk, compileSdk and targetSdk in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"In android/variables.gradle. Capacitor and well-written plugins read minSdkVersion, compileSdkVersion and targetSdkVersion from there. For Capacitor 8 the values are 24, 36 and 36."}},{"@type":"Question","name":"How do I see console logs from a Capacitor Android app?","acceptedAnswer":{"@type":"Answer","text":"Connect the device with USB debugging enabled and open chrome://inspect in Chrome on your computer. Your app's WebView appears there, and you can open DevTools for console, network and DOM. Native logs are in Android Studio's Logcat or adb logcat."}},{"@type":"Question","name":"How do I do a clean rebuild on Android?","acceptedAnswer":{"@type":"Answer","text":"Run your web build, then bunx cap sync android. In the android folder run ./gradlew clean, or use Build > Clean Project in Android Studio. If Gradle state is corrupted, use File > Invalidate Caches / Restart and, as a last resort, delete android/.gradle and android/app/build."}},{"@type":"Question","name":"Why is my app content behind the status bar after upgrading?","acceptedAnswer":{"@type":"Answer","text":"Apps targeting SDK 35 and above are edge-to-edge on Android 15+, and Android 16 removed the opt-out for SDK 36. Capacitor 8 handles insets through the System Bars plugin. Add viewport-fit=cover to your viewport meta tag and pad your layout with env(safe-area-inset-*)."}}]}]}</script>
