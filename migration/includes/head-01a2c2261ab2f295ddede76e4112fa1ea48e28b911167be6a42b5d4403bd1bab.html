<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/appcenter-migration/#newsarticle","url":"https://capgo.app/blog/appcenter-migration/","headline":"Migrating from App Center to Capgo","description":"In this guide, we’ll walk through the complete migration for Capgo Live Updates a Microsoft CodePush alternative.","image":["https://capgo.app/blog-images/appcenter-migration.webp"],"datePublished":"2022-03-22T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Migration Summary\n\nCapgo is a service that helps development teams send live app to deployed apps.\nCapacitor JS apps written in jQuery Mobile, Framework 7, Sencha, KendoUI, Ionic or even your own custom solution can be migrated. An existing Ionic app is not required..\nColt offers equivalent services for App Center Build (build Android/iOS apps). For Test, Diagnostics, and Analytics services.\n\nNote\nIf your app is still using Cordova, it’s necessary to migrate to Capacitor first before migrating to Capgo.\nBuilt by the Ionic team as a spiritual successor to Cordova, Capacitor allows development to move close to the native tooling and capabilities with the goal of providing an even better user experience and performance.\nFortunately, the migration process is easy and the majority of Cordova plugins are backward compatible with Capacitor. Start migrating here.\nAbout Capgo\nCapgo, handles updating apps over time. Development teams can focus completely on the unique features of their app and outsource the complicated app delivery process to Capgo.\nCapgo fills in the gaps between web delivery and mobile.\nCapgo Prerequisites\nLike App Center, Capgo supports apps hosted in Git repositories on Azure DevOps, Bitbucket, GitHub, and GitLab.\nInstall Capgo CLI\nnote\nHave Node and NPM installed on your computer, you need before proceeding. Always use the current LTS version Capgo do not older versions.\nCreate package.json and Capacitor config files\nnote\nBefore you begin, I recommend making changes on a fresh Git branch.\nSince Capgo was created to automate capacitor apps, it requires one file that your app may not have. First, create a capacitor.config.json file. The easiest way to create it is to run in the root of your app:\nnpm install @capacitor/core\nThen, initialize Capacitor using the CLI questionnaire:\nnpx cap init\nThe CLI will ask you a few questions, starting with your app name, and the package ID you would like to use for your app.\nFinally, commit the new files to your project:\ngit add .git commit -m \"added package json and capacitor config\" &amp;&amp; git push\nMigrate the Code\nNow that you have the new required Capgo files in place, you can turn our attention to the actual app itself. Capgo expects the entire built app to be inside a directory named dist.\nIf your built code is not in a dist directory, change this value in the Capacitor config file.\nHere is what the app’s directory structure should look like:\n\nCapgo Configuration\nWith your app ready for Capgo integration, it’s time to sign up, and get your API key to upload your first version! Begin by signing up for a Capgo account.\nOnce you’re logged into Capgo, navigate to the Account page then click on API key, then click on the ‘write’ key to copy it to your clipboard.\nInstall the Capgo SDK\nFrom a command line, directly into the root of your Capacitor app folder, run the following command:\nnpm i @capgo/capacitor-updater &amp;&amp; npx cap sync\nTo install the plugin into your Capacitor app.\nAnd then add to your app this code as replacement of CodePush one:\nimport { CapacitorUpdater } from '@capgo/capacitor-updater'\n\nCapacitorUpdater.notifyAppReady()\nThis will tell the native plugin the installation as succeeded.\nDeploying Live Updates (CodePush Alternative)\nThe Live Update feature works by using the installed Capgo SDK in your native application to listen to a particular Deploy Channel Destination. When a Web build is assigned to a Channel Destination, that update will be deployed to user devices running binaries that are configured to listen to the specified Channel Destination.\nLogin to Capgo CLOUD\nFirst, use the all apikey present in your account to log in with the CLI:\nnpx @capgo/cli@latest login YOURKEY\nAdd your first app\nLet’s get started by first creating the app in Capgo Cloud with the CLI.\nnpx @capgo/cli@latest app add\nThis command will use all variables defined in the Capacitor config file to create the app.\nUpload your first bundle\nRun the command to build your code and send it to Capgo with:\nnpx @capgo/cli@latest bundle upload --channel production\nBy default, the version name will be the one in your package.json file.\nCheck in Capgo if the build is present.\nYou can even test it with my mobile sandbox app.\nMake channel default\nAfter you have sent your app to Capgo, you need to make your channel default to let apps receive updates from Capgo.\nnpx @capgo/cli@latest channel set production -s default\nConfigure app to validate updates\nAdd this config to your main JavaScript file.\nimport { CapacitorUpdater } from '@capgo/capacitor-updater'\n\nCapacitorUpdater.notifyAppReady()\nThen do a npm run build &amp;&amp; npx cap copy to update your app.\nReceive a Live Update on a Device\nFor your application to receive a live update from Deploy, you’ll need to run the app on a device or an emulator. The easiest way to do this is simply to use the following command to launch your local app in an emulator or a device connected to your computer.\nnpx cap run [ios | android]\nOpen the app, put it in the background and open it again, you should see in the logs the app did the update.\nCongrats! 🎉 You have successfully deployed your first Live Update. This is just the start of what you can do with Live Updates. To learn more, view the complete Live Updates docs.\nRemove App Center Dependencies\nNow that we’ve integrated Capgo’s services, you should remove any references to App Center. Besides being a best practice to remove unused code/services, removing the SDK should reduce the size of your apps.\nFirst, open a terminal then uninstall the App Center plugins:\n    cordova plugin remove cordova-plugin-appcenter-analytics cordova-plugin-appcenter-crashes cordova-plugin-code-push\nNext, open config.xml and remove the following preference values. They will look similar to:\n    &lt;preference name=\"APP_SECRET\" value=\"0000-0000-0000-0000-000000000000\" /&gt;&lt;preference name=\"CodePushDeploymentKey\" value=\"YOUR-ANDROID-DEPLOYMENT-KEY\" /&gt;&lt;preference name=\"CodePushPublicKey\" value=\"YOUR-PUBLIC-KEY\" /&gt;\nIf you were using App Center Analytics in your app, remove the following preferences elements: APPCENTER_ANALYTICS_ENABLE_IN_JS and APPCENTER_CRASHES_ALWAYS_SEND.\nRemove the following &lt;access /&gt; elements:\n    &lt;access origin=\"https://codepush.appcenter.ms\" /&gt;&lt;access origin=\"https://codepush.blob.core.windows.net\" /&gt;&lt;access origin=\"https://codepushupdates.azureedge.net\" /&gt;\nRemove the reference to CodePush in the CSP meta tag in the index.html file (https://codepush.appcenter.ms):\n    &lt;meta http-equiv=\"Content-Security-Policy\" content=\"default-src https://codepush.appcenter.ms 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *\" /&gt;\nFinally, within your app, remove any code references to App Center services, such as codePush.sync();.\nNext Steps\nYou’ve migrated from App Center to Capgo, utilizing the Live Updates. This is just the beginning of what you can use Capgo for. Explore the rest of the service includes Channel (multiple environments) and override. Cloud CLI integration, use Capgo inside your CI/CD platform of choice (such as GitHub Action, GitLab, Jenkins, and more).\nAutomatic send app update\nIf your code is hosted on GitHub, you can set up automatic build and release in a few more steps, thanks to GitHub actions.\nI have made a second article to allow you to so.\nCredits\nThanks a lot to Ionic, this article is based on this article rewrote with chat-gpt-3 and adapted.\nKeep going from Migrating from App Center to Capgo\nIf you are using Migrating from App Center to Capgo to plan migration and enterprise operations, connect it with Capgo Enterprise for the product workflow in Capgo Enterprise, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, Capgo Alternatives for the product workflow in Capgo Alternatives, Capgo Consulting for the product workflow in Capgo Consulting, and Capgo Premium Support for the product workflow in Capgo Premium Support.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/appcenter-migration/"},"keywords":"App Center, migration, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Migration"}</script>
