<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-sign-in-with-apple-using-capacitor/#newsarticle","url":"https://capgo.app/blog/how-to-sign-in-with-apple-using-capacitor/","headline":"How to Sign In with Apple Using Capacitor (2026)","description":"Add Sign in with Apple to a Capacitor 8 app on iOS, Android, and web: Apple Developer setup, plugin code, backend token checks, and common errors.","image":["https://capgo.app/social_login_plugin_blog.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To add Sign in with Apple to a Capacitor app, install @capgo/capacitor-social-login, enable the Sign in with Apple capability on your App ID and in Xcode, call SocialLogin.initialize({ apple: {} }), then call SocialLogin.login({ provider: 'apple' }). On iOS this opens the native Apple sheet and returns an identity token. Android and web use Apple’s web OAuth flow, which needs a Services ID and an HTTPS redirect URL.\nThis guide covers Apple Developer setup, the client code for iOS, Android and web, verifying the token on your backend, and the errors you are most likely to hit. It targets Capacitor 8 and Xcode 26, which App Store Connect has required for uploads since April 2026.\nWhat you need before you start\n\n\n\nRequirement\nWhy\n\n\n\n\nPaid Apple Developer Program membership\nApp IDs, Services IDs and Sign in with Apple keys are only available to members\n\n\nA Mac with Xcode 26\nNeeded to build and upload iOS apps in 2026\n\n\nCapacitor 8 project\nPlugin v8 targets Capacitor 8\n\n\nAn HTTPS domain you control\nOnly for Android and web. Apple refuses localhost and plain HTTP return URLs\n\n\nA backend endpoint\nAlways to verify tokens. On Android it also receives Apple’s callback\n\n\n\nIf you do not have signing certificates yet, the iOS certificate generator creates them without a Mac keychain dance.\nHow Sign in with Apple works on each platform\nApple only ships a native SDK for its own platforms, so the flow differs:\n\n\n\nPlatform\nMechanism\nClient ID used\nBackend required for login\n\n\n\n\niOS\nNative ASAuthorizationAppleIDProvider sheet\nYour app’s bundle ID\nNo\n\n\nAndroid\nApple web OAuth in a Chrome Custom Tab, Apple posts to your server, server redirects back into the app\nServices ID\nYes\n\n\nWeb\nApple JS popup\nServices ID\nNo (but verify the token)\n\n\n\nThe audience (aud) of the identity token follows the client ID. Tokens from iOS carry your bundle ID, tokens from Android and web carry the Services ID. Your backend has to accept both.\nStep 1: Configure the Apple Developer account\nEnable the capability on your App ID\n\nOpen Certificates, Identifiers &amp; Profiles and select Identifiers.\nOpen the App ID that matches your Capacitor appId (for example com.example.app). Create it if it does not exist.\nUnder Capabilities, tick Sign in with Apple and save. Leave it as a primary App ID unless you group several apps.\n\nIf you change capabilities on an existing App ID, regenerate the provisioning profiles that use it. Old profiles do not include the new entitlement.\nCreate a Services ID (Android and web only)\n\nIn Identifiers, click + and choose Services IDs.\nUse a description like “Example Web Login” and an identifier like com.example.app.signin. This value becomes the clientId on Android and web.\nOpen the new Services ID, tick Sign in with Apple, and click Configure.\nPick your App ID as the primary App ID.\nAdd your domain under Domains and Subdomains (no scheme, for example auth.example.com).\nAdd the return URLs under Return URLs with the full https:// path, for example https://auth.example.com/apple/callback. For web logins add the page URL that calls the login, with and without a trailing slash.\n\nCreate a Sign in with Apple key (Android and server token exchange)\n\nGo to Keys, click +, tick Sign in with Apple, and click Configure to choose the primary App ID.\nRegister the key and download the .p8 file. Apple lets you download it only once.\nNote the Key ID and your Team ID (shown in the top right of the developer portal and under Membership).\n\nYour server uses the key to sign the client_secret JWT it sends to Apple’s token endpoint.\nRegister email sources if you send email\nUsers can choose Hide My Email, which gives you an @privaterelay.appleid.com address. Apple only forwards mail from domains and addresses you register under Services &gt; Sign in with Apple for Email Communication. Skip this and your password reset and receipt emails silently disappear.\nStep 2: Install the plugin\nbun add @capgo/capacitor-social-login\nbunx cap sync\nThe plugin bundles several providers. If you only use Apple (and maybe Google), turn the others off in capacitor.config.ts so their SDKs are not shipped:\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.app',\n  appName: 'Example',\n  webDir: 'dist',\n  plugins: {\n    SocialLogin: {\n      providers: {\n        apple: true,\n        google: false,\n        facebook: false,\n        twitter: false,\n      },\n    },\n  },\n};\n\nexport default config;\nRun bunx cap sync again after changing this block. A disabled provider is unavailable at runtime, so do not disable one you call. Dropping Facebook also removes the AD_ID permission warnings that its SDK triggers in Google Play Console.\nStep 3: iOS setup\n\nRun bunx cap open ios.\nSelect the App target, open Signing &amp; Capabilities, click + Capability, and add Sign in with Apple.\nMake sure the bundle identifier matches the App ID you configured.\n\nXcode writes com.apple.developer.applesignin into App.entitlements. If you build in CI or with Capgo Build, commit that entitlements file, otherwise the cloud build produces an app that fails with ASAuthorizationError code 1000.\nNo Info.plist URL scheme or AppDelegate change is needed for Apple on iOS.\nStep 4: Android setup\nApple has no Android SDK. The plugin opens Apple’s authorize page in a Custom Tab with your Services ID. Apple then sends the result as a form POST to your HTTPS return URL. Your server exchanges the code, then redirects to a deep link that reopens the app with the tokens.\nAdd the deep link\nIn android/app/src/main/AndroidManifest.xml, inside the MainActivity &lt;activity&gt; element:\n&lt;intent-filter&gt;\n    &lt;action android:name=\"android.intent.action.VIEW\" /&gt;\n    &lt;category android:name=\"android.intent.category.DEFAULT\" /&gt;\n    &lt;category android:name=\"android.intent.category.BROWSABLE\" /&gt;\n    &lt;data android:scheme=\"com.example.app\" android:host=\"apple-login\" /&gt;\n&lt;/intent-filter&gt;\nForward the intent to the plugin\nEdit MainActivity.java so the deep link reaches the plugin:\npackage com.example.app;\n\nimport android.content.Intent;\nimport android.net.Uri;\nimport com.getcapacitor.BridgeActivity;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginHandle;\nimport ee.forgr.capacitor.social.login.SocialLoginPlugin;\n\npublic class MainActivity extends BridgeActivity {\n\n    @Override\n    protected void onNewIntent(Intent intent) {\n        Uri data = intent.getData();\n        if (Intent.ACTION_VIEW.equals(intent.getAction()) &amp;&amp; data != null\n                &amp;&amp; \"apple-login\".equals(data.getHost())) {\n            PluginHandle handle = getBridge().getPlugin(\"SocialLogin\");\n            if (handle != null) {\n                Plugin plugin = handle.getInstance();\n                if (plugin instanceof SocialLoginPlugin) {\n                    ((SocialLoginPlugin) plugin).handleAppleLoginIntent(intent);\n                    return;\n                }\n            }\n        }\n        super.onNewIntent(intent);\n    }\n}\nFiltering on the host keeps your other deep links (password reset, marketing links) working.\nThe callback endpoint\nApple posts code, id_token, state, and on first login a user JSON string to your return URL. The endpoint has to exchange the code and redirect to the app with success=true plus the tokens, which is the contract the plugin parses. A minimal Hono example using jose:\nimport { Hono } from 'hono';\nimport { SignJWT, importPKCS8, createRemoteJWKSet, jwtVerify } from 'jose';\nimport { saveAppleRefreshToken } from './db'; // your own persistence layer\n\nconst app = new Hono();\n\nconst TEAM_ID = process.env.APPLE_TEAM_ID!;\nconst KEY_ID = process.env.APPLE_KEY_ID!;\nconst SERVICE_ID = process.env.APPLE_SERVICE_ID!; // com.example.app.signin\nconst PRIVATE_KEY = process.env.APPLE_PRIVATE_KEY!; // contents of the .p8 file\nconst APP_REDIRECT = 'com.example.app://apple-login';\nconst APPLE_JWKS = createRemoteJWKSet(new URL('https://appleid.apple.com/auth/keys'));\n\nasync function appleClientSecret() {\n  const key = await importPKCS8(PRIVATE_KEY, 'ES256');\n  return new SignJWT({})\n    .setProtectedHeader({ alg: 'ES256', kid: KEY_ID })\n    .setIssuer(TEAM_ID)\n    .setSubject(SERVICE_ID)\n    .setAudience('https://appleid.apple.com')\n    .setIssuedAt()\n    .setExpirationTime('5m')\n    .sign(key);\n}\n\napp.post('/apple/callback', async (c) =&gt; {\n  const form = await c.req.parseBody();\n  const code = String(form.code ?? '');\n  if (!code) {\n    return c.redirect(`${APP_REDIRECT}?success=false`);\n  }\n\n  // `form.user` is only present on the first authorization. Store it now.\n\n  const res = await fetch('https://appleid.apple.com/auth/token', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n    body: new URLSearchParams({\n      client_id: SERVICE_ID,\n      client_secret: await appleClientSecret(),\n      code,\n      grant_type: 'authorization_code',\n      redirect_uri: 'https://auth.example.com/apple/callback',\n    }),\n  });\n  if (!res.ok) {\n    return c.redirect(`${APP_REDIRECT}?success=false`);\n  }\n  const tokens = await res.json();\n\n  // Verify the identity token, then keep the long-lived refresh token on the server.\n  // Only the short-lived tokens go back to the app in the deep link.\n  const { payload } = await jwtVerify(tokens.id_token, APPLE_JWKS, {\n    issuer: 'https://appleid.apple.com',\n    audience: SERVICE_ID,\n  });\n  if (tokens.refresh_token) {\n    await saveAppleRefreshToken(String(payload.sub), tokens.refresh_token);\n  }\n  const params = new URLSearchParams({\n    success: 'true',\n    access_token: tokens.access_token,\n    id_token: tokens.id_token,\n  });\n  return c.redirect(`${APP_REDIRECT}?${params}`);\n});\n\nexport default app;\nThe plugin reads the tokens from the deep link query string, so anything you put there can end up in logs or be read by another app that registers the same custom scheme. Send only the short-lived access_token and id_token, never the refresh token, verify the id_token signature and nonce on your server before trusting it, and use a scheme unique to your app (your reverse bundle ID).\nThe client_secret JWT can live up to six months, but generating a short one per request avoids an expiry outage. Keep the .p8 file in your secret manager, never in the app bundle.\nStep 5: Web setup\nThe web build uses Apple JS with the Services ID. Add the exact page URL that triggers the login to the Services ID return URLs. Apple does not accept localhost, so test web login on a deployed preview domain or through a tunnel with a real hostname.\nStep 6: Initialize and sign in\nInitialize once at app start. Pass the redirectUrl only on Android and web. On iOS, a non-empty redirectUrl makes the plugin POST the result to that URL, which you do not want with the native flow.\nimport { Capacitor } from '@capacitor/core';\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nconst platform = Capacitor.getPlatform();\n\nexport async function initAuth() {\n  await SocialLogin.initialize({\n    apple: {\n      clientId: platform === 'ios' ? 'com.example.app' : 'com.example.app.signin',\n      redirectUrl:\n        platform === 'android'\n          ? 'https://auth.example.com/apple/callback'\n          : platform === 'web'\n            ? 'https://app.example.com/login'\n            : '',\n    },\n  });\n}\nThen trigger the login from a button. Use a random nonce so your server can reject replayed tokens:\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nexport async function signInWithApple() {\n  const nonce = crypto.randomUUID();\n\n  try {\n    const { result } = await SocialLogin.login({\n      provider: 'apple',\n      options: {\n        scopes: ['email', 'name'],\n        nonce,\n      },\n    });\n\n    if (!result.idToken) {\n      throw new Error('Apple did not return an identity token');\n    }\n\n    // Send to your backend. Name and email are only present on the first login.\n    const response = await fetch('https://api.example.com/auth/apple', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({\n        idToken: result.idToken,\n        nonce,\n        givenName: result.profile.givenName,\n        familyName: result.profile.familyName,\n      }),\n    });\n    return response.json();\n  } catch (error: any) {\n    if (error?.code === 'USER_CANCELLED') {\n      return null; // user closed the sheet, not a failure\n    }\n    throw error;\n  }\n}\nThe response gives you:\n\n\n\nField\nContent\n\n\n\n\nresult.idToken\nSigned JWT from Apple, the thing your server verifies\n\n\nresult.profile.user\nApple’s stable user ID (same as the sub claim)\n\n\nresult.profile.email\nEmail or private relay address, when granted\n\n\nresult.profile.givenName / familyName\nOnly on the first authorization\n\n\nresult.accessToken\nWith the default settings this holds the authorization code, not a real access token\n\n\nresult.authorizationCode\nPresent when you initialize with useProperTokenExchange: true\n\n\n\nIf your server needs Apple refresh tokens (for example to call the revoke endpoint when a user deletes their account), set useProperTokenExchange: true in the apple config and exchange authorizationCode on the server.\nStep 7: Verify the identity token on your backend\nNever trust the profile fields the client sends. Verify the JWT signature against Apple’s public keys and check the claims:\nimport { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst appleKeys = createRemoteJWKSet(new URL('https://appleid.apple.com/auth/keys'));\n\nexport async function verifyAppleToken(idToken: string, expectedNonce: string) {\n  const { payload } = await jwtVerify(idToken, appleKeys, {\n    issuer: 'https://appleid.apple.com',\n    audience: ['com.example.app', 'com.example.app.signin'], // bundle ID + Services ID\n  });\n\n  if (payload.nonce !== expectedNonce) {\n    throw new Error('Nonce mismatch');\n  }\n\n  return {\n    appleUserId: payload.sub as string,\n    email: payload.email as string | undefined,\n    emailVerified: payload.email_verified === true || payload.email_verified === 'true',\n  };\n}\nKey the user record on sub, not on email. The email can be a relay address, and users can stop sharing it. After verification, issue your own session token. If you use Supabase or Firebase, they verify the token for you, see Supabase with Capacitor Social Login.\nApp Store rules to keep in mind\n\nGuideline 4.8: if you offer Google, Facebook or another third-party login as the main account system, you must also offer an equivalent privacy-focused option. Sign in with Apple qualifies.\nGuideline 5.1.1(v): apps that let users create accounts must let them delete the account in the app. For Sign in with Apple users, call Apple’s https://appleid.apple.com/auth/revoke endpoint on deletion. See our account deletion guide.\nButton design: use Apple’s approved button styles and make the button at least as prominent as other login buttons.\n\nTroubleshooting\n\n\n\nSymptom\nLikely cause\nFix\n\n\n\n\nASAuthorizationError code 1000 on iOS\nCapability or entitlement missing in the built target\nAdd Sign in with Apple in Xcode, commit App.entitlements, regenerate profiles\n\n\nCode 1001 on iOS\nUser cancelled\nThe plugin rejects with USER_CANCELLED, treat as a non-error\n\n\ninvalid_client on Android or web\nWrong clientId (bundle ID used instead of Services ID) or bad client_secret\nUse the Services ID, check Team ID, Key ID and key contents\n\n\ninvalid_request: Invalid redirect_uri\nReturn URL not registered exactly\nAdd the full https:// URL to the Services ID, match trailing slashes\n\n\nApp does not come back after Android login\nIntent filter scheme or host differs from the server redirect\nCompare com.example.app://apple-login character by character\n\n\napple.android.redirectUrl is null or empty\nNo redirectUrl on Android\nPass your HTTPS callback URL when initializing on Android\n\n\nName and email are null\nNot the first authorization\nRead them from your database. Revoke the app in device settings to test again\n\n\nToken rejected by backend: aud mismatch\nServer only accepts one audience\nAccept both bundle ID and Services ID\n\n\n\nShipping fixes after release\nMost auth bugs live in TypeScript: a wrong client ID per platform, a missing nonce, bad error handling. Those can be shipped to users the same day with Capgo live updates without waiting for App Review. Changes to entitlements, the Android manifest or MainActivity are native and need a new store build.\nWhere to go next\n\nAdd Google next to Apple: How to sign in with Google using Capacitor.\nPick the right mix of methods for your app: How to add authentication to a Capacitor app.\nPlugin reference and platform pages: Social Login docs and the Apple iOS setup page.\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-sign-in-with-apple-using-capacitor/"},"keywords":"sign in with apple capacitor, capacitor apple login, apple sign in ionic, capacitor social login, apple identity token, sign in with apple android, capacitor 8 authentication","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-sign-in-with-apple-using-capacitor/#faqpage","url":"https://capgo.app/blog/how-to-sign-in-with-apple-using-capacitor/","mainEntity":[{"@type":"Question","name":"Do I need a backend to use Sign in with Apple in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"Not on iOS. The native AuthenticationServices sheet returns an identity token directly to your app. On Android you need a small HTTPS endpoint, because Apple only supports a web OAuth flow there and posts the result to a server URL. In every case you should verify the identity token on a server before you trust it."}},{"@type":"Question","name":"Why does Apple only return the user's name and email once?","acceptedAnswer":{"@type":"Answer","text":"Apple sends the name and email only on the first authorization between a given Apple ID and your app. Later sign-ins return just the stable user identifier (the sub claim). Save the name and email on your backend the first time you receive them. To test the first-login path again, remove the app under Settings > [your name] > Sign-In & Security > Sign in with Apple on the test device."}},{"@type":"Question","name":"Is Sign in with Apple mandatory for my iOS app?","acceptedAnswer":{"@type":"Answer","text":"Under App Store Review Guideline 4.8, if your app uses a third-party or social login such as Google or Facebook for the primary account, you must also offer an equivalent login service that limits data collection to name and email, lets users hide their email, and does not track them. Sign in with Apple meets those rules, so most teams simply add it. Apps that only use their own email and password, or an enterprise SSO, are exempt."}},{"@type":"Question","name":"Which Capacitor version does @capgo/capacitor-social-login support?","acceptedAnswer":{"@type":"Answer","text":"The plugin major version follows Capacitor. Version 8.x targets Capacitor 8, which is the current release in October 2026. Older majors exist for Capacitor 7 and earlier, but only the latest major is actively maintained."}},{"@type":"Question","name":"Can I test Sign in with Apple on the iOS Simulator?","acceptedAnswer":{"@type":"Answer","text":"Yes, if the simulator is signed in to an Apple Account, but a physical device is more reliable and is what Apple reviewers use. Make sure the Sign in with Apple capability is present in the target you build, otherwise the request fails immediately with error 1000."}}]}]}</script>
