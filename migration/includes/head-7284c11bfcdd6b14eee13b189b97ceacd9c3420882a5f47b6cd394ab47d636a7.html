<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-sign-in-with-azure-entra-id-using-capacitor/#newsarticle","url":"https://capgo.app/blog/how-to-sign-in-with-azure-entra-id-using-capacitor/","headline":"Sign In with Microsoft Entra ID (Azure AD) in Capacitor","description":"Add Microsoft Entra ID (Azure AD) login to a Capacitor 8 app with PKCE: app registration, redirect URIs, Graph and API scopes, and AADSTS error fixes.","image":["https://capgo.app/login.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To sign in with Microsoft Entra ID (formerly Azure Active Directory) in a Capacitor app, register a public client app in the Entra admin center, add a Mobile and desktop applications redirect URI such as com.example.app://oauth/azure, and run the OpenID Connect authorization code flow with PKCE through the system browser. With @capgo/capacitor-social-login that means one initialize call with the Microsoft identity platform v2.0 endpoints and SocialLogin.login({ provider: 'oauth2', options: { providerId: 'azure' } }).\nThis guide covers the app registration, choosing the right authority, Graph and custom API scopes, token validation, Conditional Access, logout, and the AADSTS errors you will see. It targets Capacitor 8 in October 2026.\nWhat you need\n\nA Microsoft Entra tenant and a role that can create app registrations (Application Developer or higher).\nA Capacitor 8 app and its appId, which you will reuse as the redirect scheme.\nOptionally, a backend API that should accept Entra tokens.\n\nWhy not MSAL.js inside the WebView\nMSAL.js is built for browsers that own their origin and can open popups. In a Capacitor WebView the origin is capacitor://localhost on iOS and https://localhost on Android, popups are blocked, and a full-page redirect would navigate your app away from its own bundle. Microsoft’s guidance for native apps is the system browser with PKCE (RFC 8252), which is what the plugin does:\n\n\n\nPlatform\nBrowser used\nExtra setup\n\n\n\n\niOS\nASWebAuthenticationSession\nNone\n\n\nAndroid\nChrome Custom Tabs with androidUseCustomTabs: true\nIntent filter\n\n\nWeb\nPopup or redirect\nSPA redirect URI\n\n\n\nOn Android, turn Custom Tabs on. The default embedded WebView cannot talk to Microsoft Authenticator, passkeys or the Company Portal, which Conditional Access often relies on.\nStep 1: Register the app in Entra ID\n\nOpen the Microsoft Entra admin center and go to Entra ID &gt; App registrations &gt; New registration.\nEnter a name, such as “Example Mobile”.\nPick Supported account types. This decides the authority you use later.\nSkip the redirect URI for now and click Register.\nOn Overview, copy the Application (client) ID and Directory (tenant) ID.\n\nChoose the authority\n\n\n\nAccount type at registration\nAuthority segment in URLs\n\n\n\n\nSingle tenant (your org only)\nYour tenant ID, for example 8f1c...\n\n\nAny organizational directory\norganizations\n\n\nAny org directory plus personal Microsoft accounts\ncommon\n\n\nPersonal Microsoft accounts only\nconsumers\n\n\n\nUse the tenant ID whenever you can. It produces predictable issuers and avoids accidental sign-ins from other tenants.\nAdd redirect URIs\nGo to Authentication &gt; Add a platform:\n\nMobile and desktop applications: add com.example.app://oauth/azure as a custom redirect URI. Add com.example.app://oauth/logout too if you want a post-logout redirect.\nSingle-page application (only if you ship a web build): add https://app.example.com/auth/callback.\n\nDo not register the mobile URI under Web. Web platform redirects are confidential clients and require a secret at the token endpoint.\nAPI permissions\nAPI permissions already contains Microsoft Graph &gt; User.Read. Add offline_access, openid, profile and email if they are not listed. Some tenants block user consent. In that case an admin must click Grant admin consent, otherwise users see AADSTS65001 or a “Need admin approval” screen.\nExpose a scope for your own API (optional)\nIf your backend should accept the token:\n\nOpen Expose an API and set the Application ID URI, typically api://&lt;client-id&gt;.\nAdd a scope named access_as_user, who can consent: Admins and users.\nIn Manifest, set \"requestedAccessTokenVersion\": 2 so access tokens use the v2.0 issuer format.\n\nStep 2: Install the plugin and add the intent filter\nbun add @capgo/capacitor-social-login\nbunx cap sync\nIn android/app/src/main/AndroidManifest.xml, inside MainActivity:\n&lt;intent-filter&gt;\n    &lt;action android:name=\"android.intent.action.VIEW\" /&gt;\n    &lt;category android:name=\"android.intent.category.DEFAULT\" /&gt;\n    &lt;category android:name=\"android.intent.category.BROWSABLE\" /&gt;\n    &lt;data android:scheme=\"com.example.app\" android:host=\"oauth\" /&gt;\n&lt;/intent-filter&gt;\nKeep android:launchMode=\"singleTask\" on MainActivity (the Capacitor default). If you do not use Google, Apple or Facebook login, disable them under plugins.SocialLogin.providers in capacitor.config.ts to keep their SDKs out of the build.\nStep 3: Initialize the Entra ID provider\nimport { Capacitor } from '@capacitor/core';\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nconst TENANT = 'YOUR_TENANT_ID'; // or organizations / common\nconst AUTHORITY = `https://login.microsoftonline.com/${TENANT}/oauth2/v2.0`;\nconst isWeb = Capacitor.getPlatform() === 'web';\n\nexport async function initAuth() {\n  await SocialLogin.initialize({\n    oauth2: {\n      azure: {\n        appId: 'YOUR_CLIENT_ID',\n        authorizationBaseUrl: `${AUTHORITY}/authorize`,\n        accessTokenEndpoint: `${AUTHORITY}/token`,\n        redirectUrl: isWeb\n          ? 'https://app.example.com/auth/callback'\n          : 'com.example.app://oauth/azure',\n        scope: 'openid profile email offline_access User.Read',\n        pkceEnabled: true,\n        resourceUrl: 'https://graph.microsoft.com/v1.0/me',\n        logoutUrl: `${AUTHORITY}/logout`,\n        postLogoutRedirectUrl: isWeb ? 'https://app.example.com/' : 'com.example.app://oauth/logout',\n        androidUseCustomTabs: true,\n      },\n    },\n  });\n}\nWith resourceUrl pointing at Graph /me, the plugin calls Graph right after login and returns the profile in resourceData.\nIf you are migrating from Ionic Auth Connect, SocialLoginAuthConnect has an azure preset that only needs tenantId, clientId and redirectUrl. See the Entra ID integration page.\nStep 4: Sign in\nimport { SocialLogin } from '@capgo/capacitor-social-login';\n\nexport async function signInWithMicrosoft() {\n  try {\n    const { result } = await SocialLogin.login({\n      provider: 'oauth2',\n      options: { providerId: 'azure' },\n    });\n\n    const me = result.resourceData as {\n      id: string;\n      displayName?: string;\n      mail?: string | null;\n      userPrincipalName?: string;\n    } | null;\n\n    return {\n      idToken: result.idToken,\n      graphToken: result.accessToken?.token,\n      refreshToken: result.refreshToken,\n      user: me,\n    };\n  } catch (error: any) {\n    if (error?.code === 'USER_CANCELLED') return null;\n    throw error;\n  }\n}\nUseful options:\n\nloginHint: 'jane@contoso.com' pre-fills the account and skips the account picker for that user.\nprompt: 'select_account' always shows the account picker, useful for shared devices.\nadditionalParameters: { domain_hint: 'contoso.com' } sends users straight to their federated IdP.\n\nmail is often null for accounts without a mailbox. Fall back to userPrincipalName or the preferred_username claim of the ID token.\nStep 5: Call Microsoft Graph\nexport async function getMyPhotoBlob(graphToken: string) {\n  const res = await fetch('https://graph.microsoft.com/v1.0/me/photo/$value', {\n    headers: { Authorization: `Bearer ${graphToken}` },\n  });\n  if (res.status === 404) return null; // no photo set\n  if (!res.ok) throw new Error(`Graph error ${res.status}`);\n  return res.blob();\n}\nAdd each Graph scope you need (for example Calendars.Read) both in API permissions and in the scope string.\nStep 6: Get a token for your own API\nAn access token targets one resource. To call your backend, add a second entry next to azure in the same oauth2 map of your initialize call, requesting your API scope instead of Graph:\nawait SocialLogin.initialize({\n  oauth2: {\n    azure: graphConfig, // the object from step 3, moved into a const\n    azureApi: {\n      appId: 'YOUR_CLIENT_ID',\n      authorizationBaseUrl: `${AUTHORITY}/authorize`,\n      accessTokenEndpoint: `${AUTHORITY}/token`,\n      redirectUrl: 'com.example.app://oauth/azure-api', // register this URI too\n      scope: 'openid profile offline_access api://YOUR_CLIENT_ID/access_as_user',\n      pkceEnabled: true,\n      androidUseCustomTabs: true,\n    },\n  },\n});\nThe user already has a Microsoft session, so the second login usually completes without a prompt. Validate the token on the server:\nimport { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst TENANT_ID = 'YOUR_TENANT_ID';\nconst jwks = createRemoteJWKSet(\n  new URL(`https://login.microsoftonline.com/${TENANT_ID}/discovery/v2.0/keys`),\n);\n\nexport async function verifyEntraToken(token: string) {\n  const { payload } = await jwtVerify(token, jwks, {\n    issuer: `https://login.microsoftonline.com/${TENANT_ID}/v2.0`,\n    audience: 'YOUR_CLIENT_ID', // v2 tokens use the client ID as aud\n  });\n  if (!String(payload.scp ?? '').split(' ').includes('access_as_user')) {\n    throw new Error('Missing scope');\n  }\n  return payload; // payload.oid is the stable user object ID\n}\nFor multitenant apps, the issuer contains each customer’s tenant ID. Validate the tid claim against the list of tenants you accept instead of a fixed issuer. Key users on oid plus tid, not on email.\nStep 7: Refresh and sign out\n// Get a valid Graph token, refreshing it when it has expired\nexport async function getGraphToken() {\n  const { isLoggedIn } = await SocialLogin.isLoggedIn({ provider: 'oauth2', providerId: 'azure' });\n  if (!isLoggedIn) {\n    try {\n      await SocialLogin.refresh({ provider: 'oauth2', options: { providerId: 'azure' } });\n    } catch {\n      // no session, or the refresh token expired or was revoked\n      const loginResult = await signInWithMicrosoft();\n      if (!loginResult) throw new Error('Sign-in cancelled');\n    }\n  }\n  const { accessToken } = await SocialLogin.getAuthorizationCode({ provider: 'oauth2', providerId: 'azure' });\n  return accessToken;\n}\n\n// Sign out\nawait SocialLogin.logout({ provider: 'oauth2', providerId: 'azure' });\nEntra refresh tokens for public clients last up to 90 days with a sliding window and are replaced on each use. The plugin stores the new one. If you store tokens yourself, use the Keychain or Keystore, for example NativeBiometric.setData from @capgo/capacitor-native-biometric, and pass them to SocialLogin.refreshToken.\nlogout clears local tokens and opens the v2.0 logout endpoint in the system browser. Microsoft sometimes shows a “You signed out of your account” page instead of redirecting to a custom scheme, so the user may have to close it. If you only need a local logout, drop logoutUrl and pass prompt: 'select_account' at the next login.\nConditional Access and Intune\nBrowser-based OIDC works with MFA, passwordless and most Conditional Access policies. Two cases need more:\n\nRequire compliant or hybrid-joined device: Entra must see device state. On Android this works through Custom Tabs when the Company Portal or Authenticator is installed. On managed iOS devices, the Microsoft Enterprise SSO plug-in deployed by your MDM provides it. Test this early with a real policy.\nIntune app protection policies (MAM): these require the Intune App SDK inside the native app. OIDC alone does not satisfy “Require app protection policy” grants.\n\nTroubleshooting\n\n\n\nError\nMeaning\nFix\n\n\n\n\nAADSTS50011\nRedirect URI mismatch\nAdd the exact URI under Mobile and desktop applications\n\n\nAADSTS7000218\nToken request needs a secret\nRedirect was registered under Web. Move it to Mobile and desktop\n\n\nAADSTS9002326\nCross-origin token redemption only allowed for SPA\nWeb build uses a mobile redirect. Register the web URL under Single-page application\n\n\nAADSTS700016\nApp not found in directory\nWrong tenant in the authority, or single-tenant app used with common\n\n\nAADSTS50020\nUser account from another tenant\nUse a multitenant registration, or invite the user as a guest\n\n\nAADSTS65001\nConsent not granted\nGrant admin consent or allow user consent\n\n\nAADSTS53003\nBlocked by Conditional Access\nCheck sign-in logs, see the section above\n\n\nAADSTS28000\nScopes for more than one resource in one request\nRequest Graph and your API scopes in separate logins\n\n\nNo refresh token\noffline_access missing\nAdd it to scopes and permissions\n\n\n\nThe Entra admin center Sign-in logs show the exact failure reason for each attempt, and logsEnabled: true in the plugin config prints the authorize URL and token response on the device.\nShipping updates\nPolicy changes on the Entra side are instant, but client-side fixes still need to reach devices. TypeScript changes such as scopes or error handling can ship through Capgo live updates. Native changes (intent filters, new schemes) need a new store build, which Capgo Build can produce without a local Mac.\nRelated guides\n\nHow to sign in with Okta using Capacitor\nHow to sign in with Auth0 using Capacitor\nHow to add authentication to a Capacitor app\nGeneric OAuth2 provider reference\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-sign-in-with-azure-entra-id-using-capacitor/"},"keywords":"azure entra id capacitor, microsoft entra id capacitor, azure ad capacitor login, ionic azure ad, msal capacitor, microsoft graph capacitor, aadsts50011, capacitor enterprise login","articleSection":"Tutorial"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-sign-in-with-azure-entra-id-using-capacitor/#faqpage","url":"https://capgo.app/blog/how-to-sign-in-with-azure-entra-id-using-capacitor/","mainEntity":[{"@type":"Question","name":"Do I need MSAL to use Microsoft Entra ID in a Capacitor app?","acceptedAnswer":{"@type":"Answer","text":"No. Entra ID is a standard OpenID Connect provider, so an authorization code flow with PKCE in the system browser works on iOS, Android and web. Microsoft does not ship an MSAL build for Capacitor. You only need native MSAL or the Intune App SDK if you must support broker-based device Conditional Access or Intune app protection policies."}},{"@type":"Question","name":"Do I need a client secret?","acceptedAnswer":{"@type":"Answer","text":"No. Register the redirect URI under the Mobile and desktop applications platform, which makes it a public client. The app uses PKCE. If you register it under the Web platform by mistake, the token endpoint demands a secret and returns AADSTS7000218."}},{"@type":"Question","name":"Can users from any Microsoft tenant sign in?","acceptedAnswer":{"@type":"Answer","text":"Only if you choose a multitenant account type at registration and use the organizations or common authority. Single-tenant apps must use the tenant ID in the URLs. Personal Microsoft accounts need the multitenant plus personal accounts option and the common or consumers authority."}},{"@type":"Question","name":"Can I use the Graph access token to call my own API?","acceptedAnswer":{"@type":"Answer","text":"No. A Graph token is meant for Microsoft Graph and your API cannot validate it. Expose a scope on your app registration, such as api://<client-id>/access_as_user, and request that scope for your API. One access token can only target one resource."}}]}]}</script>
