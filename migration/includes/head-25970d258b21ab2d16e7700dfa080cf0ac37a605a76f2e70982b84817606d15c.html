<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-enable-developer-options-on-android/#newsarticle","url":"https://capgo.app/blog/how-to-enable-developer-options-on-android/","headline":"How to Enable Developer Options on Android (2026)","description":"Enable Android developer mode on Pixel, Samsung, Xiaomi, OnePlus and Huawei, turn on USB and wireless debugging, fix adb issues, and turn it off again.","image":["https://capgo.app/android-studio-run.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To enable developer mode on Android, open Settings &gt; About phone and tap Build number seven times, then enter your PIN. A Developer options menu appears, where you can turn on USB debugging or Wireless debugging so Android Studio, adb or bunx cap run android can install and debug your app. The exact path to Build number depends on the manufacturer, so the steps for each brand are below.\nWhat developer options do (and what they don’t)\nDeveloper options is a hidden settings menu meant for app developers. Turning it on does nothing by itself. It only reveals switches such as:\n\nUSB debugging: lets a trusted computer run adb commands, install builds and read logs.\nWireless debugging: same thing over Wi-Fi (Android 11+).\nStay awake: screen stays on while charging, handy during testing.\nAnimation scale: speed up or turn off system animations, useful for UI tests.\nDon’t keep activities: destroys activities when you leave them, a good way to test state restoration in a Capacitor app.\nShow taps / Pointer location: useful for recording demos and checking touch targets.\n\nYou do not need developer options to install an APK from a browser or file manager, to use most apps, or to receive an over-the-air update.\nEnable developer options by brand\n\n\n\nBrand\nWhere to tap 7 times\nWhere the menu appears afterwards\n\n\n\n\nGoogle Pixel / stock Android\nSettings &gt; About phone &gt; Build number\nSettings &gt; System &gt; Developer options\n\n\nSamsung (One UI)\nSettings &gt; About phone &gt; Software information &gt; Build number\nSettings &gt; Developer options (bottom of list)\n\n\nXiaomi, Redmi, POCO (HyperOS)\nSettings &gt; About phone &gt; OS version\nSettings &gt; Additional settings &gt; Developer options\n\n\nXiaomi (older MIUI)\nSettings &gt; About phone &gt; MIUI version\nSettings &gt; Additional settings &gt; Developer options\n\n\nOnePlus (OxygenOS)\nSettings &gt; About device &gt; Version &gt; Build number\nSettings &gt; System settings &gt; Developer options\n\n\nOPPO / realme (ColorOS / realme UI)\nSettings &gt; About device &gt; Version &gt; Build number\nSettings &gt; Additional settings &gt; Developer options\n\n\nMotorola\nSettings &gt; About phone &gt; Build number\nSettings &gt; System &gt; Developer options\n\n\nHuawei / Honor (EMUI / MagicOS)\nSettings &gt; About phone &gt; Build number\nSettings &gt; System &amp; updates &gt; Developer options\n\n\n\nMenus move between OS versions. If you cannot find Build number, open Settings and use the search field: type “build number”. On almost every Android device search finds it directly.\nGoogle Pixel (Android 14, 15, 16)\n\nOpen Settings and scroll to About phone.\nScroll to the bottom and tap Build number seven times. After a few taps you see a countdown toast.\nEnter your PIN, pattern or password.\nGo back to Settings &gt; System &gt; Developer options.\n\nSamsung Galaxy\n\nOpen Settings &gt; About phone &gt; Software information.\nTap Build number seven times and confirm with your PIN.\nDeveloper options now appears at the very bottom of the main Settings list, below About phone.\n\nXiaomi, Redmi and POCO\n\nOpen Settings &gt; About phone.\nTap OS version (HyperOS) or MIUI version (older devices) seven times.\nGo to Settings &gt; Additional settings &gt; Developer options.\n\nXiaomi adds two extra switches you usually need for development: Install via USB and USB debugging (Security settings). Without “Install via USB”, adb install fails with INSTALL_FAILED_USER_RESTRICTED. Turning these on may require signing in to a Xiaomi account and having a SIM card inserted.\nOnePlus, OPPO and realme\n\nOpen Settings &gt; About device &gt; Version.\nTap Build number seven times.\nOpen Settings &gt; System settings &gt; Developer options (OnePlus) or Settings &gt; Additional settings &gt; Developer options (OPPO, realme).\n\nHuawei and Honor\n\nOpen Settings &gt; About phone.\nTap Build number seven times.\nGo to Settings &gt; System &amp; updates &gt; Developer options.\n\nOn Huawei devices, also set the USB connection mode to File transfer when you plug in, otherwise adb may not see the device. If you plan to ship to these phones, read how to publish a Capacitor app on Huawei AppGallery, because many of them have no Google Play services.\nWork profiles and managed devices\nIf your company manages the phone, the admin can block developer options. You will see “Developer options are not available for this user”. Ask IT for a test device rather than trying to work around the policy.\nTurn on USB debugging\n\nOpen Developer options and switch on USB debugging.\nConnect the phone with a USB cable that supports data (many cheap cables are charge-only).\nOn the phone, accept the Allow USB debugging? dialog. Tick Always allow from this computer on your own machine.\nOn the computer, check the connection:\n\nadb devices\nYou should see:\nList of devices attached\nR5CT1234ABC\tdevice\nunauthorized means you did not accept the prompt. offline usually means a bad cable or port, or an adb server from an old SDK.\nadb ships with the Android SDK Platform-Tools. If Android Studio is installed it lives in ~/Library/Android/sdk/platform-tools on macOS or %LOCALAPPDATA%\\Android\\Sdk\\platform-tools on Windows. Add that folder to your PATH. New to the Android toolchain? Our Android setup for Capacitor apps covers it.\nTurn on wireless debugging (Android 11 and later)\nWireless debugging removes the cable. Your computer and phone must be on the same Wi-Fi network, and some corporate or hotel networks block device-to-device traffic.\n\nIn Developer options, switch on Wireless debugging and accept the network prompt.\nTap Wireless debugging to open it, then Pair device with pairing code. Keep this screen open.\nOn the computer, pair using the IP address and port shown in the pairing dialog:\n\nadb pair 192.168.1.42:37145\n# Enter pairing code: 482913\n\nConnect using the IP and port shown on the main Wireless debugging screen (a different port from the pairing port):\n\nadb connect 192.168.1.42:41827\nadb devices\nAndroid Studio also has Pair Devices Using Wi-Fi in the device manager, which shows a QR code you scan from the Wireless debugging screen.\nThe port changes every time wireless debugging restarts, so you will repeat adb connect after reboots. Pairing itself is remembered.\nOn Android 10 and earlier, use the older method: connect once by USB, run adb tcpip 5555, unplug, and adb connect &lt;phone-ip&gt;:5555.\nRun your Capacitor app on the device\nWith the device listed in adb devices, the Capacitor CLI can build and install directly:\nbun run build\nbunx cap sync android\nbunx cap run android --list        # show connected devices and emulators\nbunx cap run android --target R5CT1234ABC\nFor a faster loop, use live reload so the app loads your dev server over the network:\nbunx cap run android -l --external\nThe phone needs to reach your machine’s IP for this to work. When you want testers outside your network to see changes without reinstalling, look at Capgo live updates instead of a dev server.\nTo read native logs while the app runs:\nadb logcat | grep -i -E \"capacitor|chromium\"\nAnd to debug the WebView, open chrome://inspect in desktop Chrome while the debug build is running. Debug builds of Capacitor apps enable WebView debugging by default.\nTroubleshooting\nBuild number tapping does nothing. You may be tapping the wrong field (for example Android version instead of Build number), or the device is managed by an organization. Some Xiaomi devices need you to tap OS version, not Build number.\nDevice missing from adb devices.\nadb kill-server\nadb start-server\nadb devices\nThen try a different cable and a port directly on the computer instead of a hub. Switch the USB mode notification to File transfer.\nWindows does not see the phone. Install the OEM USB driver (Samsung, Xiaomi and others publish their own) or the Google USB Driver from the SDK Manager for Pixel devices.\nINSTALL_FAILED_UPDATE_INCOMPATIBLE. The installed app was signed with a different key (for example a Play Store build versus your debug build). Uninstall it first: adb uninstall com.example.app.\nINSTALL_FAILED_USER_RESTRICTED on Xiaomi. Enable Install via USB in Developer options.\nWireless debugging keeps turning off. Android turns it off when you change Wi-Fi network. Some battery savers also stop it. Keep the phone on the same network and charging during long sessions.\nUnauthorized after updating Android Studio. The adb key in ~/.android/adbkey changed. In Developer options tap Revoke USB debugging authorizations, reconnect and accept the prompt again.\nHow to turn developer options off\n\nOpen Developer options.\nToggle Use developer options (or Developer options on Samsung) at the top to off.\n\nThe menu stays visible on some devices but every switch inside resets to default. To hide the menu completely, go to Settings &gt; Apps &gt; Settings &gt; Storage and clear storage for the Settings app. That resets other settings preferences too, so it is rarely worth it.\nBefore handing a test phone to someone else, also tap Revoke USB debugging authorizations so old computers can no longer connect.\nSecurity notes\n\nUSB debugging lets an authorized computer install apps and read app data from debuggable builds. Do not accept the RSA prompt on public charging stations or computers you do not trust.\nSome banking and payment apps refuse to run while developer options or USB debugging are on. Turn them off on your personal phone when you are done.\nNever ship a release build with android:debuggable=\"true\". Capacitor release builds are not debuggable by default.\n\nThe iOS equivalent\niPhones have their own Developer Mode switch that you need before running development or ad hoc builds. See how to enable Developer Mode on iOS. To get builds onto testers’ phones without cables, read how to distribute iOS and Android apps to testers.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-enable-developer-options-on-android/"},"keywords":"enable android developer mode, android developer options, usb debugging, wireless debugging, adb pair, enable developer mode samsung, enable developer options xiaomi, turn off developer options","articleSection":"Android"},{"@type":"FAQPage","@id":"https://capgo.app/blog/how-to-enable-developer-options-on-android/#faqpage","url":"https://capgo.app/blog/how-to-enable-developer-options-on-android/","mainEntity":[{"@type":"Question","name":"How do I enable developer mode on Android?","acceptedAnswer":{"@type":"Answer","text":"Open Settings, go to About phone, and tap Build number seven times. Enter your PIN if asked. A message confirms you are now a developer, and Developer options appears under Settings > System (Pixel) or at the bottom of Settings (Samsung)."}},{"@type":"Question","name":"Is it safe to enable developer options?","acceptedAnswer":{"@type":"Answer","text":"Yes, enabling the menu changes nothing by itself. The risk comes from individual settings such as USB debugging, which lets an authorized computer install apps and read data. Turn USB debugging off when you are not developing and revoke old authorizations."}},{"@type":"Question","name":"Do I need developer options to install an APK?","acceptedAnswer":{"@type":"Answer","text":"No. Installing an APK from a file only requires allowing the source app (browser, file manager) to install unknown apps. Developer options and USB debugging are needed when you install from a computer with adb, Android Studio or the Capacitor CLI."}},{"@type":"Question","name":"Why is my phone not showing up in adb devices?","acceptedAnswer":{"@type":"Answer","text":"Check that USB debugging is on, the cable supports data, the USB mode is not charge-only, and that you accepted the RSA fingerprint prompt on the phone. On Windows install the OEM USB driver. Then run adb kill-server and adb devices again."}},{"@type":"Question","name":"Can I use wireless debugging instead of a cable?","acceptedAnswer":{"@type":"Answer","text":"Yes, on Android 11 and later. Enable Wireless debugging in Developer options, choose Pair device with pairing code, run adb pair with the shown IP, port and code, then adb connect to the IP and port shown on the Wireless debugging screen. Both devices must be on the same Wi-Fi network."}}]}]}</script>
