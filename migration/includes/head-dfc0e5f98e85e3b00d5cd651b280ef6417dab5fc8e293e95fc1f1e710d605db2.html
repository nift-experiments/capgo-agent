<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/automatic-capacitor-ios-build-github-action-with-match/#newsarticle","url":"https://capgo.app/blog/automatic-capacitor-ios-build-github-action-with-match/","headline":"Automatic Capacitor IOS build with GitHub actions using match","description":"How to set up a CI/CD pipeline for your IOS Ionic app using fastlane and GitHub Actions in 5 mins (2022)","image":["https://capgo.app/fastlane_ios.webp"],"datePublished":"2022-10-30T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Automatic iOS Builds with GitHub Actions using Match\nSetting up CI/CD for Capacitor apps can be complex and time-consuming. Here’s what you need to know:\nRecommended for New Builds: Use Capgo Build\n\nWe now recommend using Capgo Build with the Capgo CLI for native Capacitor builds.\nThis Fastlane Match guide is kept for teams maintaining existing GitHub Actions pipelines, but new iOS builds should use the Capgo CLI so you do not have to maintain Fastlane, Match repositories, Xcode runners, certificates, and upload scripts yourself.\n\nCapgo Build for CI/CD by Capgo\nSkip the Fastlane Match, Xcode runner, certificate, provisioning profile, and upload-script maintenance. Capgo Build runs signed native iOS builds from your existing CI/CD pipeline:\n\nWorks with your pipeline: Trigger Capgo Build from GitHub Actions, GitLab CI, Jenkins, or local scripts after your web build and npx cap sync.\nSigning from CI secrets: Keep App Store Connect keys, certificates, provisioning profiles, passwords, and team IDs in your own CI secrets.\nNo native runner upkeep: Capgo Build provides maintained Apple build environments, so you do not have to manage macOS runners, Xcode images, Fastlane, or Match repositories.\nArtifacts and submission: Download signed artifacts for QA or submit release builds through the Capgo CLI.\n\nPricing\n\nCapgo plans start at $12/month\nIncludes OTA updates and about 15 native builds per month\nExtra build minutes are billed by minute through credits\n\nSet up Capgo Build in CI/CD\nManual Setup Guide\nHere’s what you need to do:\nContinuous Delivery for iOS using Fastlane and GitHub Actions using match\nPrerequisites\nBefore continuing with the tutorial…\n\nMake sure you have Fastlane installed on your development machine.\niOS developer program membership.\nDesire to read 😆…\nA team of many devs, otherwise we recommend to use fastlane cert for simpler workflows.\n\nImportant about the price\n\nhttps://github.com/features/actions\nThe service is ‘free’ up to the limit, depending on the chosen machine.\nWe are going to use a macOS machine, you can see in the screenshot its price and limits (prices as of the creation of the tutorial, they could undergo changes in the future)\n🔴 Once warned of requirements and prices, if you like, we continue…\n\n📣 In the post we assume that we have the app  created in iTunes connect, we do have the certificates of the Apple ecosystem, everything will be copied by Fastlane!\n\nLet’s dive in 🤿\nSteps to follow in the post\n\nUsing App Store Connect API with Fastlane Match\nRequirements\nCreating an App Store Connect API Key\nUsing an App Store Connect API Key\nCopy Fastlane files\nConfigure Fastlane match\n\n1. Using App Store Connect API with Fastlane Match\n\nStarting February 2021, two-factor authentication or two-step verification is required for all users to sign in to App Store Connect. This extra layer of security for your Apple ID helps ensure that you’re the only person who can access your account.\nFrom Apple Support\n\n\nGetting started with match requires you to revoke your existing certificates. But no worry, you will have the new one directly.\n\nRequirements\nTo be able to use App Store Connect API, Fastlane needs three things.\n\nIssuer ID.\nKey ID.\nKey file or Key content.\n\nCreating an App Store Connect API Key\nTo generate keys, you must have Admin permission in App Store Connect. If you don’t have that permission, you can direct the relevant person to this article and follow the following instructions.\n1 — Log in to App Store Connect.\n2 — Select Users and Access.\n\n3 — Select the Integration tab.\n\n4 — Click Generate API Key or the Add (+) button.\n\n5 — Enter a name for the key. The name is for your reference only and is not part of the key itself.\n\n6 — Under Access, select the role for the key. The roles that apply to keys are the same roles that apply to users on your team. See role permissions. We recommend to select App manager.\n7 — Click Generate.\n\nAn API key’s access cannot be limited to specific apps.\n\nThe new key’s name, key ID, a download link, and other information appear on the page.\n\nYou can grab all three necessary information here.\n&lt;1&gt; Issue ID.\n&lt;2&gt; Key ID.\n&lt;3&gt; Click “Download API Key” to download your API private key. The download link appears only if the private key has not yet been downloaded. Apple does not keep a copy of the private key. So, you can download it only once.\n\n🔴 Store your private key in a safe place. You should never share your keys, store keys in a code repository, or include keys in client-side code.\n\nUsing an App Store Connect API Key\nThe API Key file (p8 file that you download), the key ID, and the issuer ID are needed to create the JWT token for authorization. There are multiple ways that these pieces of information can be input into Fastlane using Fastlane’s new action, app_store_connect_api_key. You can learn other ways in Fastlane documentation. I show this method because I think it is the easiest way to work with most CI out there, where you can set environment variables.\nNow we can manage Fastlane with the App Store Connect API key, great!\n2. Copy Fastlane files\nFastlane is a Ruby library created to automate common mobile development tasks. Using Fastlane, you can configure custom “lanes” which bundle a series of “actions” that perform tasks that you’d normally perform using Android studio. You can do a lot with Fastlane, but for the purposes of this tutorial, we’ll be using only a handful of core actions.\nCreate a Fastlane folder at the root of your project and copy the following files:\nFastfile\ndefault_platform(:ios)\n\nDEVELOPER_APP_IDENTIFIER = ENV[\"DEVELOPER_APP_IDENTIFIER\"]\nDEVELOPER_APP_ID = ENV[\"DEVELOPER_APP_ID\"]\nPROVISIONING_PROFILE_SPECIFIER = ENV[\"PROVISIONING_PROFILE_SPECIFIER\"]\nTEMP_KEYCHAIN_USER = ENV[\"TEMP_KEYCHAIN_USER\"]\nTEMP_KEYCHAIN_PASSWORD = ENV[\"TEMP_KEYCHAIN_PASSWORD\"]\nAPPLE_ISSUER_ID = ENV[\"APPLE_ISSUER_ID\"]\nAPPLE_KEY_ID = ENV[\"APPLE_KEY_ID\"]\nAPPLE_KEY_CONTENT = ENV[\"APPLE_KEY_CONTENT\"]\nGIT_USERNAME = ENV[\"GIT_USERNAME\"]\nGIT_TOKEN = ENV[\"GIT_TOKEN\"]\n\ndef delete_temp_keychain(name)\n  delete_keychain(\n    name: name\n  ) if File.exist? File.expand_path(\"~/Library/Keychains/#{name}-db\")\nend\n\ndef create_temp_keychain(name, password)\n  create_keychain(\n    name: name,\n    password: password,\n    unlock: false,\n    timeout: 0\n  )\nend\n\ndef ensure_temp_keychain(name, password)\n  delete_temp_keychain(name)\n  create_temp_keychain(name, password)\nend\n\nplatform :ios do\n  lane :build do\n    build_app(\n      configuration: \"Release\",\n      workspace: \"./ios/App/App.xcworkspace\",\n      scheme: \"App\",\n      export_method: \"app-store\",\n      export_options: {\n        provisioningProfiles: { \n            DEVELOPER_APP_ID =&gt; \"#{PROVISIONING_PROFILE_SPECIFIER}\"\n        }\n      }\n    )\n  end\n  lane :refresh_profiles do\n    match(\n      type: \"development\",\n      force: true)\n    match(\n      type: \"adhoc\",\n      force: true)\n  end\n  desc \"Register new device\"\n  lane :register_new_device do  |options|\n      device_name = prompt(text: \"Enter the device name: \")\n      device_udid = prompt(text: \"Enter the device UDID: \")\n      device_hash = {}\n      device_hash[device_name] = device_udid\n      register_devices(\n                       devices: device_hash\n                       )\n    refresh_profiles\n  end\n  lane :closed_beta do\n    keychain_name = TEMP_KEYCHAIN_USER\n    keychain_password = TEMP_KEYCHAIN_PASSWORD\n    ensure_temp_keychain(keychain_name, keychain_password)\n\n    api_key = app_store_connect_api_key(\n      key_id: APPLE_KEY_ID,\n      issuer_id: APPLE_ISSUER_ID,\n      key_content: APPLE_KEY_CONTENT,            \n      duration: 1200,            \n      in_house: false\n    )\n\n    match(\n      type: 'appstore',\n      git_basic_authorization: Base64.strict_encode64(\"#{GIT_USERNAME}:#{GIT_TOKEN}\"),\n      readonly: true,\n      keychain_name: keychain_name,\n      keychain_password: keychain_password,\n      api_key: api_key\n    )\n\n    gym(\n      configuration: \"Release\",\n      workspace: \"./ios/App/App.xcworkspace\",\n      scheme: \"App\",\n      export_method: \"app-store\",\n      export_options: {\n        provisioningProfiles: { \n            DEVELOPER_APP_ID =&gt; \"#{PROVISIONING_PROFILE_SPECIFIER}\"\n        }\n      }\n    )\n\n    pilot(\n      apple_id: \"#{DEVELOPER_APP_ID}\",\n      app_identifier: \"#{DEVELOPER_APP_IDENTIFIER}\",\n      skip_waiting_for_build_processing: true,\n      skip_submission: true,\n      distribute_external: false,\n      notify_external_testers: false,\n      ipa: \"./App.ipa\"\n    )\n\n    delete_temp_keychain(keychain_name)\n  end\n  lane :submit_review do\n    version = ''\n    Dir.chdir(\"..\") do\n      file = File.read(\"package.json\")\n      data = JSON.parse(file)\n      version = data[\"version\"]\n    end\n    deliver(\n      app_version: version,\n      submit_for_review: true,\n      automatic_release: true,\n      force: true, # Skip HTMl report verification\n      skip_metadata: false,\n      skip_screenshots: false,\n      skip_binary_upload: true\n    )\n  end\nend\nAppfile\napp_identifier(ENV[\"DEVELOPER_APP_IDENTIFIER\"])\napple_id(ENV[\"FASTLANE_APPLE_ID\"])\nitc_team_id(ENV[\"APP_STORE_CONNECT_TEAM_ID\"])\nteam_id(ENV[\"DEVELOPER_PORTAL_TEAM_ID\"])\nConfigure Fastlane match\nFastlane match is a new approach to iOS’s code signing. Fastlane match makes it easy for teams to manage the required certificates and provisioning profiles for your iOS apps.\nCreate a new private repository named certificates, for example on your GitHub personal account or organization.\nInitialize Fastlane match for your iOS app.\nfastlane match init\nThen select option #1 (Git Storage).\n[01:00:00]: fastlane match supports multiple storage modes, please select the one you want to use:1. git2. google_cloud3. s3?\nAssign the URL of the newly created repository.\n[01:00:00]: Please create a new, private git repository to store the certificates and profiles there[01:00:00]: URL of the Git Repo: &lt;YOUR_CERTIFICATES_REPO_URL&gt;\n\nNow you have inside Fastlane folder a file named Matchfile and _git_url_should be set to the HTTPS URL of the certificates repository. Optionally, you can also use SSH, but it requires a different step to run.\n\n# ios/Matchfilegit_url(\"https://github.com/gitusername/certificates\")storage_mode(\"git\")type(\"appstore\")\nNext, we go to generate the certificates and enter your credentials when asked with Fastlane Match.\nYou will be prompted to enter a passphrase. Remember it correctly because it will be used later by GitHub Actions to decrypt your certificates repository.\nfastlane match appstore\nIf all went well, you should see something like that:\n[01:40:52]: All required keys, certificates and provisioning profiles are installed 🙌\n\nIf you experienced any problem with GitHub and the necessary permissions, maybe this post will help you to generate authentication tokens for git.\n\nGenerated certificates and provisioning profiles are uploaded to the certificates repository resources\n\nLastly, open your project in Xcode, and update the provisioning profile for the release configuration of your app.\n\nFew things to note 💡\nMATCH\nFor the CI/CD to import the certificates and provisioning profiles, it needs to have access to the certificates repository. You can do this by generating a personal access token (should be used before) that has the scope to access or read private repositories.\nIn GitHub, go to Settings → Developer Settings → Personal access tokens → click Generate New Token → tick the repo scope → then click Generate token.\n\nHave a copy of the personal access token generated. You will use it later for the environment variable GIT_TOKEN.\nThen replace your match file generated in Fastlane folder by\nMatchfile\nCERTIFICATE_STORE_URL = ENV[\"CERTIFICATE_STORE_URL\"]\nGIT_USERNAME = ENV[\"GIT_USERNAME\"]\nGIT_TOKEN = ENV[\"GIT_TOKEN\"]\nFASTLANE_APPLE_ID = ENV[\"FASTLANE_APPLE_ID\"]\n\ngit_url(CERTIFICATE_STORE_URL)\nstorage_mode(\"git\")\ntype(\"appstore\")\ngit_basic_authorization(Base64.strict_encode64(\"#{GIT_USERNAME}:#{GIT_TOKEN}\"))\nusername(FASTLANE_APPLE_ID)\nThis will be used by GitHub Actions to import the certificates and provisioning profiles.\nAnd var will be set in GitHub Secrets, instead of hard-coding them in the file.\nBuild Processing\nIn GitHub Actions, you are billed based on the minutes you have used for running your CI/CD workflow. From experience, it takes about 10–15 minutes before a build can be processed in App Store Connect.\nFor private projects, the estimated cost per build can go up to $0.08/min x 15 mins = $1.2, or more, depending on the configuration or dependencies of your project.\nIf you share the same concerns for the pricing as I do for private projects, you can keep the skip_waiting_for_build_processing to true.\nWhat’s the catch? You have to manually update the compliance of your app in App Store Connect after the build has been processed, for you to distribute the build to your users.\nThis is just an optional parameter to update if you want to save on the build minutes for private projects. For free projects, this shouldn’t be a problem at all. See pricing.\n3. Setup GitHub Actions\nConfigure GitHub secrets\nEver wonder where the values of the ENV are coming from? Well, it’s not a secret anymore – it’s from your project’s secret. 🤦\n\n1. APP_STORE_CONNECT_TEAM_ID - the ID of your App Store Connect team in you’re in multiple teams.\n2. DEVELOPER_APP_ID - in App Store Connect, go to the app → App Information → Scroll down to the General Information section of your app and look for Apple ID.\n3. DEVELOPER_APP_IDENTIFIER - your app’s bundle identifier.\n4. DEVELOPER_PORTAL_TEAM_ID - the ID of your Developer Portal team if you’re in multiple teams.\n5. FASTLANE_APPLE_ID - the Apple ID or developer email you use to manage the app.\n6. GIT_USERNAME &amp; GIT_TOKEN - Your git username and your personal access token.\n7. MATCH_PASSWORD - the passphrase that you assigned when initializing match, will be used for decrypting the certificates and provisioning profiles.\n8. PROVISIONING_PROFILE_SPECIFIER - match AppStore &lt;YOUR_APP_BUNDLE_IDENTIFIER&gt;, eg. match AppStore com.domain.blabla.demo.\n9. TEMP_KEYCHAIN_USER &amp; TEMP_KEYCHAIN_PASSWORD - assign a temp keychain user and password for your workflow.\n10. APPLE_KEY_ID — App Store Connect API Key 🔺Key ID.\n11. APPLE_ISSUER_ID — App Store Connect API Key 🔺Issuer ID.\n12. APPLE_KEY_CONTENT — App Store Connect API Key 🔺 Key file or Key content of .p8, check it\n\n13. CERTIFICATE_STORE_URL — The repo url of your Match keys (ex: https://github.com/***/fastlane_match.git)\n4. Configure GitHub workflow file\nCreate a GitHub workflow directory.\ncd .github/workflows\nInside the workflow folder, create a file named build-upload-ios.ymland add the following.\nname: Build source code on ios\n\non:\n  push:\n    tags:\n      - '*'\n\njobs:\n  build_ios:\n    runs-on: macOS-latest\n    steps:\n      - uses: actions/checkout@v6\n      - name: set Node.js\n        uses: actions/setup-node@v6\n        with:\n          node-version: '24'\n          cache: npm\n      - name: Install dependencies\n        id: install_code\n        run: npm ci\n      - name: Build\n        id: build_code\n        run: npm run build\n      - uses: actions/cache@v5\n        with:\n          path: ios/App/Pods\n          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}\n          restore-keys: |\n            ${{ runner.os }}-pods-\n      - name: Sync\n        id: sync_code\n        run: npx cap sync\n      - uses: ruby/setup-ruby@v1\n        with:\n          ruby-version: 2.7.2\n      - uses: maierj/fastlane-action@v2.3.0\n        env:\n          DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}\n          DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}\n          PROVISIONING_PROFILE_SPECIFIER: match AppStore ${{ secrets.DEVELOPER_APP_IDENTIFIER }}\n          TEMP_KEYCHAIN_USER: ${{ secrets.TEMP_KEYCHAIN_USER }}\n          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}\n          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}\n          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}\n          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}\n          CERTIFICATE_STORE_URL: https://github.com/${{ secrets.CERTIFICATE_STORE_REPO }}.git\n          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}\n          GIT_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}\n          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}\n          MATCH_USERNAME: ${{ secrets.FASTLANE_APPLE_ID }}\n          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}\n          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}\n          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}\n        with:\n          lane: closed_beta\n      - name: Upload release bundle\n        uses: actions/upload-artifact@v2\n        with:\n          name: ios-release\n          path: ./App.ipa\n          retention-days: 60\nThis workflow should be triggered after each GitHub tag, if you need to automatize tag please, refer to Automatic build and release with GitHub actions first.\nThen this workflow will pull your NodeJS deps, install them and build your JavaScript app.\n\nEach time you send a new commit, a release will be built in TestFlight.\n\nYour App doesn’t need to use Ionic, only Capacitor base is mandatory., it can have old Cordova module, but Capacitor JS plugin should be preferred.\n5. Trigger workflow\nCreate a Commit\nMake a commit, you should see the active workflow in the repository.\nTrigger the workflow\nPush the new commits to the branch main or development to trigger the workflow.\n\nAfter a few minutes, the build should be available in your App Store Connect dashboard.\n\nCan deploy from local machine?\nYes, you can, and it is effortless.\nImagine that you have a private repository, and you have used up the minutes of the free plan and you do not want to pay for new releases, or maybe you prefer to submit the application manually.\nLet’s go for it\nOk, first we need to create in my_project_path/fastlane path a file called .env, just in the same path as Fastfile, to be able to create the same secret properties found in our _GitHub, a_s below:\n.env file for deploy from local machine\nNow, you can go to the terminal and launch the Fastlane from your machine:\nfastlane closed_beta\n\n❌ Essential about the .env file, as we would rather not expose this data, we must add it in our .gitignore, something like that: ❌\n\nfastlane/*.env\nIt should work the same as it happens from GitHub Actions on the remote machine but in our local machine. 🍻\n\nTerminal execution: $ Fastlane closed_beta\nIf you have come this far, my congratulations, now you have a fully automated process for your iOS apps with Fastlane and GitHub Actions.\n\nEach time you send a new commit, a release will be built in Google Play console, beta channel.\nI will improve this blog with your feedbacks, if you have any question or suggestion, please let me know by email martin@capgo.app\n\nBuild on your device\nIf you still need to build on your device, you need to add them manually to the provisioning.\nConnect your device to your mac and open the device menu\n\nThen copy your identifier\n\nAnd then start the command:\nfastlane register_new_device\nit will ask you to set a device name and the identifier:\n\nif you got issues\nIf you have issue with dev device not able to test etc that usually fix it.\nThere a magic command who can save you:\nfastlane match nuke development\nfastlane match development\nThen :\nClean the project by holding Shift(⇧)+Command(⌘)+K or selecting Product &gt; Clean (it might be labelled “Clean Build Folder”)\nThen try to run again the app on your device.\nThanks\nThis blog is based on the following articles:\n\nContinuous delivery for IOS using Fastlane and GitHub actions\nFastlane Documentation\nThis GitHub message from @mrogunlana\n\nKeep going from Automatic Capacitor IOS build with GitHub actions using match\nIf you are using Automatic Capacitor IOS build with GitHub actions using match to plan CI/CD automation, connect it with Capgo CI/CD for the product workflow in Capgo CI/CD, Capgo Native Builds for the product workflow in Capgo Native Builds, Capgo Integrations for the product workflow in Capgo Integrations, CI/CD Integration for the implementation detail in CI/CD Integration, and GitHub Actions Integration for the implementation detail in GitHub Actions Integration.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/automatic-capacitor-ios-build-github-action-with-match/"},"keywords":"Fastlane, CI/CD, iOS, automatic build, automatic release, mobile app updates","articleSection":"CI/CD"}</script>
