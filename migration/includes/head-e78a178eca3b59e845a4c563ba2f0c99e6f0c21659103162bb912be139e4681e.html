<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/comparing-ci-cd-platforms-for-cordova-apps/#newsarticle","url":"https://capgo.app/blog/comparing-ci-cd-platforms-for-cordova-apps/","headline":"Best CI/CD Platforms for Cordova Apps in 2026, Compared","description":"Compare CI/CD platforms for Cordova apps in 2026: GitHub Actions, GitLab, Bitrise, Codemagic, Appcircle, Azure DevOps, and what to do about live updates.","image":["https://capgo.app/cordova.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"The best CI/CD platform for a Cordova app in 2026 is usually a general CI that can run the Cordova CLI on Linux for Android and on macOS for iOS: GitHub Actions, GitLab CI, Bitrise, Codemagic, Appcircle, CircleCI, or Azure DevOps. What none of them replace is the managed live update service Cordova teams got from App Center and Appflow. This comparison covers build support, signing, store publishing, live updates, and long-term outlook for each option.\nWhere Cordova CI/CD stands\nThree managed services built the Cordova ecosystem, and all three are gone or closing:\n\n\n\nService\nStatus\n\n\n\n\nPhoneGap Build\nShut down October 1, 2020\n\n\nMicrosoft App Center (builds, distribution, CodePush)\nRetired March 31, 2025\n\n\nIonic Appflow (builds, live updates)\nNo new customers since February 2025, service ends December 31, 2027\n\n\n\nCordova the framework still ships platform releases. The work that moved to you is everything around the build: signing storage, store uploads, version numbers, and over-the-air updates.\nIf you just need a working pipeline today, start with CI/CD for Cordova apps, which has a complete GitHub Actions workflow. This article helps you pick where to run it.\nWhat a Cordova team should compare\n\nCordova awareness. Does the platform have Cordova steps or templates, or do you script cordova build yourself? Scripting is fine; it is the same three commands everywhere.\nmacOS runners with Xcode 26, which App Store Connect requires since April 28, 2026.\nSigning storage for the Android keystore, iOS certificate, and provisioning profiles.\nStore publishing to TestFlight and Google Play tracks.\nLive updates for web-layer fixes.\nGit hosting and self-hosting, which matters for the enterprise and government apps that often still run Cordova.\n\nFeature matrix\n\n\n\nPlatform\nCordova support\nmacOS for iOS\nManaged signing\nStore publishing\nCordova live updates\nSelf-host option\n\n\n\n\nGitHub Actions\nScripted CLI\nHosted Apple Silicon\nSecrets only\nfastlane or scripts\nNo\nSelf-hosted runners\n\n\nGitLab CI\nScripted CLI\nHosted (beta, Premium/Ultimate) or self-managed\nSecure files, variables\nfastlane, store integrations\nNo\nYes, full GitLab\n\n\nBitrise\nDedicated Cordova steps\nHosted Apple Silicon\nYes\nBuilt-in steps\nNo\nNo\n\n\nCodemagic\nDocumented Ionic Cordova workflows\nHosted Mac minis\nYes\nBuilt-in\nNo\nNo\n\n\nAppcircle\nCustom script steps\nHosted or own\nYes\nBuilt-in\nNo\nYes, Appcircle Server\n\n\nCircleCI\nScripted CLI\nHosted Apple Silicon\nContexts only\nfastlane\nNo\nSelf-hosted runners\n\n\nAzure DevOps\nScripted CLI\nMicrosoft-hosted\nSecure files plus install tasks\nStore extension tasks\nNo\nSelf-hosted agents, Azure DevOps Server\n\n\nXcode Cloud\nVia ci_scripts hooks, iOS only\nApple-managed\nAutomatic\nBuilt-in\nNo\nNo\n\n\nVoltBuilder\nUpload a zip, Cordova and Capacitor\nManaged\nCertificates in the upload\nStore-ready output\nNo\nNo\n\n\nIonic Appflow\nFirst-class\nManaged\nYes\nYes\nYes, until end of 2027\nNo\n\n\nCapgo (live updates)\n@capgo/cordova-updater plugin, Cordova iOS 7+ / Android 13+\nNot a build service for Cordova\nNot applicable\nNot applicable\nYes, channels and rollbacks\nYes, open source backend\n\n\n\nCapgo sits next to whichever CI you pick rather than replacing it: your CI builds the Cordova binaries, and Capgo live updates ship web-only changes to installed apps. Capgo Build is documented for Capacitor projects, so it is not an option for building a Cordova binary.\nPlatform by platform\nGitHub Actions\nThe most common choice for Cordova teams on GitHub. Android builds on ubuntu-latest with actions/setup-java. iOS builds on macos-26 with Xcode 26 preinstalled. You decode the keystore and .p12 from secrets, write a build.json, and run cordova build. Uploads use fastlane, xcrun altool, or community Play upload actions. No Cordova-specific features, but nothing stops you either. Watch macOS minute costs on private repositories.\nGitLab CI\nSame scripted approach. Hosted macOS runners exist on GitLab.com for Premium and Ultimate in beta, with images like macos-26-xcode-26. Self-managed GitLab instances, which many regulated Cordova teams use, need their own Mac runners. Secure files are a clean place for the keystore and provisioning profile. See Set up CI/CD in GitLab.\nBitrise\nThe mobile CI with the most explicit Cordova support. Its step library includes Cordova steps for preparing the project and archiving iOS and Android builds, alongside code signing management and store deploy steps. If you want a UI-driven workflow and are fine with credit-based pricing, it is the closest thing to the old App Center build experience.\nCodemagic\nCodemagic documents Ionic Cordova builds in codemagic.yaml, with managed Android keystores, automatic iOS signing through an App Store Connect API key, and publishing to TestFlight and Google Play. Pricing is per build minute or a fixed annual plan. A good fit for teams that like YAML in the repository but want signing handled.\nAppcircle\nAppcircle builds Cordova through workflow custom scripts on top of its iOS and Android build pipelines, and adds signing identity storage, tester distribution, an enterprise app store, and store publishing. Appcircle Server can run fully on your infrastructure, which is the strongest self-hosting story in this list.\nCircleCI\nScripted Cordova builds on Linux Docker executors for Android and Apple Silicon macOS executors for iOS. Signing and uploads are fastlane or shell. Reasonable if CircleCI already runs your backend.\nAzure DevOps\nAzure Pipelines runs the Cordova CLI as script steps and adds first-party tasks for installing Apple certificates and provisioning profiles from secure files, Android signing, and store releases through marketplace extensions. Azure DevOps Server covers on-premises needs. Many former App Center customers landed here.\nXcode Cloud\nPossible for the iOS half only. A ci_scripts/ci_post_clone.sh hook installs Node, restores Cordova platforms, and builds the web layer before Xcode Cloud archives the generated project. Since Cordova generates platforms/ios at build time, the workspace path has to exist when the workflow starts, which makes setup awkward. Most Cordova teams use it only if they already rely on it for native apps.\nVoltBuilder\nA build service rather than a CI: you upload a zip of your project with signing files, and it returns store-ready binaries for Cordova and Capacitor projects. No Git triggers, pipelines, or live updates. Useful for small teams without a CI. See Alternative to VoltBuilder.\nIonic Appflow\nStill the most complete Cordova platform, with builds, signing, publishing, and live updates. It is also the one with an end date. If you are on Appflow, the question is not whether to leave but when. See Alternative to Appflow.\nFilling the live update gap\nEvery general CI on this list produces signed binaries. None of them deliver over-the-air updates to installed apps, and the old community hot code push plugins are not maintained. For Cordova that leaves Appflow until the end of 2027, a self-hosted update server, or Capgo.\nCapgo supports Cordova through @capgo/cordova-updater, which mirrors the Capacitor updater API and uses the same backend, channels, and CLI. It requires Cordova iOS 7+ and Cordova Android 13+, and it must not be combined with cordova-plugin-ionic-webview. Install it with your Capgo app ID:\ncordova plugin add @capgo/cordova-updater --variable APP_ID=com.example.app\ncordova prepare android ios\nCall cordova.plugins.Updater.notifyAppReady() after deviceready on every launch, then add one step to your CI for web-only releases:\nbun run build\nbunx @capgo/cli@latest bundle upload --channel=production\nPlugin additions or upgrades still need a store build; Capgo flags bundles whose native plugins differ from the live one. Details in the Cordova updater docs and live update compatibility. The full pipeline, including the live update job, is in CI/CD for Cordova apps.\nOptional: what moving to Capacitor adds in CI\nYou do not have to migrate to get live updates. Teams that do migrate mostly do it for the build side.\nCapacitor runs most Cordova plugins as is, keeps your web code, and commits the native projects to Git instead of generating them, which makes CI builds more predictable. Your Capgo app ID and channels carry over, only the updater plugin changes. Once migrated:\n\nYour Linux CI job runs bun run build, bunx cap sync, and one bunx @capgo/cli@latest build request per platform. No macOS runner needed for iOS.\nWeb-only releases go out as live updates with channels, rollbacks, and compatibility checks: bunx @capgo/cli@latest bundle upload --channel production.\nbunx @capgo/cli@latest build needed tells the pipeline whether a native build is required at all.\n\nMigration guide: Migrating from Cordova to Capacitor. If you want help, see Cordova to Capacitor.\nHow to choose\n\n\n\nYour situation\nGood fit\n\n\n\n\nCode on GitHub, small team, comfortable with YAML\nGitHub Actions\n\n\nCode on self-managed GitLab or on-premises requirements\nGitLab CI with own Mac runners, Appcircle Server, or Azure DevOps Server\n\n\nWant the closest replacement for App Center builds\nBitrise or Codemagic\n\n\nNo CI at all, just need binaries\nVoltBuilder\n\n\nNeed live updates after Appflow or App Center\nAny CI above plus Capgo with @capgo/cordova-updater\n\n\nWant iOS builds without macOS runners\nMigrate to Capacitor, then Capgo Build\n\n\n\nMigration checklist from App Center or Appflow\n\nDownload your Android upload keystore and iOS distribution .p12 with private keys. If the old platform generated them, export before you lose access.\nRecord current version codes and build numbers so the first build on the new platform does not collide.\nCreate a Google Play service account and an App Store Connect API key for the new CI.\nList every environment variable the old platform injected at build time.\nRun one internal-track and one TestFlight build before switching production.\nDecide your live update plan before the old service turns off, not after.\n\nFor the iOS and Android decisions in more depth, read Comparing CI/CD platforms for iOS apps and Comparing CI/CD platforms for Android apps.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/comparing-ci-cd-platforms-for-cordova-apps/"},"keywords":"Cordova CI/CD platforms, best CI/CD for Cordova, Cordova build service, Bitrise Cordova, Codemagic Cordova, Cordova App Center alternative, Cordova Appflow alternative, Cordova live updates","articleSection":"CI/CD"},{"@type":"FAQPage","@id":"https://capgo.app/blog/comparing-ci-cd-platforms-for-cordova-apps/#faqpage","url":"https://capgo.app/blog/comparing-ci-cd-platforms-for-cordova-apps/","mainEntity":[{"@type":"Question","name":"What is the best CI/CD platform for Cordova apps?","acceptedAnswer":{"@type":"Answer","text":"If your code is on GitHub or GitLab, their own CI with macOS runners is the simplest. Bitrise and Codemagic are the mobile CI services that document Cordova directly. Appcircle fits teams that must self-host. None of them ship live updates themselves; pair them with a live update service such as Capgo and its @capgo/cordova-updater plugin."}},{"@type":"Question","name":"Can I still use App Center or PhoneGap Build for Cordova?","acceptedAnswer":{"@type":"Answer","text":"No. PhoneGap Build shut down on October 1, 2020, and Microsoft App Center retired on March 31, 2025. Ionic Appflow only serves existing customers until December 31, 2027."}},{"@type":"Question","name":"Which platforms offer live updates for Cordova apps?","acceptedAnswer":{"@type":"Answer","text":"General CI platforms build binaries but do not deliver over-the-air updates. Ionic Appflow does until December 31, 2027 for existing customers. Capgo supports Cordova iOS 7+ and Android 13+ apps through the @capgo/cordova-updater plugin, with bundles uploaded from any CI using the Capgo CLI."}},{"@type":"Question","name":"Does Capgo work with Cordova apps?","acceptedAnswer":{"@type":"Answer","text":"Capgo live updates do, through @capgo/cordova-updater, which shares the API, channels, and backend of the Capacitor updater. Capgo Build's documentation covers Capacitor projects, so Cordova binaries are built on your own CI and Capgo handles the over-the-air updates."}},{"@type":"Question","name":"Do Cordova iOS builds need a Mac?","acceptedAnswer":{"@type":"Answer","text":"Yes, the build itself runs xcodebuild on macOS. A hosted CI with macOS runners or a cloud build service supplies that Mac, so your developers do not need one."}}]}]}</script>
