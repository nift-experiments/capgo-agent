<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/upgrade-capacitor-app-to-capacitor-8/#newsarticle","url":"https://capgo.app/blog/upgrade-capacitor-app-to-capacitor-8/","headline":"How to Upgrade Your Capacitor App to Capacitor 8","description":"Upgrade a Capacitor app to Capacitor 8: Node 22, Xcode 26, iOS 15, Android SDK 36, AGP 8.13, System Bars, SPM default, and fixes for common errors.","image":["https://capgo.app/capacitor-guide.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To upgrade a Capacitor app to Capacitor 8, install Node.js 22+, Xcode 26+ and Android Studio Otter, update @capacitor/cli to the latest 8.x, run bunx cap migrate, then fix whatever the migrator reports. The main breaking changes are iOS 15 as the minimum deployment target, Android SDK 36 with minSdk 24, AGP 8.13 with Gradle 8.14.3, and the removal of adjustMarginsForEdgeToEdge in favor of the new System Bars plugin.\nThis guide walks through the automated path, every manual step behind it, and the errors people hit most often after the upgrade. If you maintain a plugin rather than an app, read How to Upgrade Your Capacitor Plugin to Capacitor 8 instead.\nCapacitor 8 requirements at a glance\nCheck your toolchain before touching the project. Most failed upgrades are an old JDK, an old Xcode, or an old Node in CI, not the code.\n\n\n\nArea\nCapacitor 7\nCapacitor 8\n\n\n\n\nNode.js\n20+\n22+ (the CLI declares engines.node &gt;= 22.0.0)\n\n\nXcode\n16+\n26+\n\n\niOS deployment target\n14.0\n15.0\n\n\nAndroid Studio\nLadybug\nOtter 2025.2.1+\n\n\nminSdkVersion\n23\n24\n\n\ncompileSdkVersion / targetSdkVersion\n35\n36\n\n\nAndroid Gradle Plugin\n8.7.2\n8.13.0\n\n\nGradle wrapper\n8.11.1\n8.14.3\n\n\nKotlin (if used)\n1.9.25\n2.2.20\n\n\nJDK for Android builds\n21\n21 (@capacitor/android compiles with Java 21)\n\n\nNew iOS platform default\nCocoaPods\nSwift Package Manager\n\n\n\nXcode 26 is not only a Capacitor requirement. Since April 28, 2026, App Store Connect rejects uploads built with an older Xcode, so you need it anyway. See Apple’s Xcode 26 requirement for Capacitor apps for the details.\nBefore you start\n\nCommit everything, or create a branch. The migrator edits native files in place.\nMake sure the app builds on Capacitor 7 today. Upgrading a broken project only adds noise.\nIf you are on Capacitor 6 or older, do the previous major first. Each major has its own migration logic in the CLI.\nList your plugins with bunx cap ls and check that each one has a release supporting Capacitor 8. Look at the peerDependencies of the latest version:\n\nbun pm view @capgo/capacitor-updater peerDependencies\nA plugin with @capacitor/core: ^7.0.0 as its peer will install with warnings and may fail to compile. Capgo plugins follow the Capacitor major in their own version number, so @capgo/* 8.x releases target Capacitor 8.\n\nUpdate local and CI toolchains: Node 22, Xcode 26, JDK 21, Android Studio Otter. In GitHub Actions, pin a macOS image that ships Xcode 26 and use actions/setup-java with java-version: '21'.\n\nOption 1: upgrade with cap migrate\nThe CLI ships a migration command that handles most of the work. Install the latest CLI, then run it:\nbun add -D @capacitor/cli@latest\nbunx cap migrate\nThe migrator asks whether it should install the new Capacitor packages and lets you pick npm, Yarn, pnpm or Bun. Pick Bun if your project has a bun.lock. You can skip the prompt with bunx cap migrate --noprompt.\nWhat it changes for you:\n\nBumps @capacitor/core, @capacitor/ios, @capacitor/android and official @capacitor/* plugins to 8.x.\nSets IPHONEOS_DEPLOYMENT_TARGET = 15.0 in the Xcode project and platform :ios, '15.0' in the Podfile.\nUpdates variables.gradle, the AGP classpath, the Gradle wrapper and kotlin_version.\nAdds density to android:configChanges in AndroidManifest.xml.\n\nRead the full output. When a step cannot be applied, for example because a file was customized, the CLI prints an error with the file name and continues. Those lines are your manual to-do list.\nWhen it finishes:\nbun run build\nbunx cap sync\nThen open each platform and build it once from the IDE so you see native errors in full.\nOption 2: upgrade manually\nIf your native projects are heavily customized, or the migrator skipped steps, apply the changes by hand. These match the official Capacitor 8 upgrade guide.\nUpdate the npm packages\nbun add @capacitor/core@latest @capacitor/ios@latest @capacitor/android@latest\nbun add -D @capacitor/cli@latest\nThen update each official plugin, for example:\nbun add @capacitor/app@latest @capacitor/splash-screen@latest @capacitor/status-bar@latest\niOS: raise the deployment target to 15.0\nIn Xcode, select the project, open Build Settings, find iOS Deployment Target under Deployment and set it to 15.0. Repeat for every app target, including extensions.\nIf the app still uses CocoaPods, update ios/App/Podfile:\nplatform :ios, '15.0'\nThen run bunx cap sync ios, which runs pod install for you.\nIf the app uses SPM, the CLI regenerates ios/App/CapApp-SPM/Package.swift on every sync with the right platform version and an exact capacitor-swift-pm version that matches your installed @capacitor/ios. Don’t edit that file by hand.\niOS: remove custom view controller notifications\nCapacitor 8 now emits CAPBridgeViewController notifications for viewDidAppear and viewWillTransition itself. If you added an extension or subclass to post .capacitorViewDidAppear or .capacitorViewWillTransition, delete it, or listeners will fire twice.\nAndroid: update Android Studio and AGP\nInstall Android Studio Otter or newer, open the android folder and run Tools &gt; AGP Upgrade Assistant. Choose 8.13.0 and run the selected steps. Or edit android/build.gradle directly:\nbuildscript {\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.13.0'\n        classpath 'com.google.gms:google-services:4.4.4'\n    }\n}\nAnd android/gradle/wrapper/gradle-wrapper.properties:\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip\nAndroid: update variables.gradle\next {\n    minSdkVersion = 24\n    compileSdkVersion = 36\n    targetSdkVersion = 36\n    androidxActivityVersion = '1.11.0'\n    androidxAppCompatVersion = '1.7.1'\n    androidxCoordinatorLayoutVersion = '1.3.0'\n    androidxCoreVersion = '1.17.0'\n    androidxFragmentVersion = '1.8.9'\n    coreSplashScreenVersion = '1.2.0'\n    androidxWebkitVersion = '1.14.0'\n    junitVersion = '4.13.2'\n    androidxJunitVersion = '1.3.0'\n    androidxEspressoCoreVersion = '3.7.0'\n    cordovaAndroidVersion = '14.0.1'\n}\nKeep any extra variables your plugins read (for example firebaseMessagingVersion). Official plugin bumps for Capacitor 8 include firebaseMessagingVersion = '25.0.1', androidxBrowserVersion = '1.9.0', androidxMaterialVersion = '1.13.0' and androidxExifInterfaceVersion = '1.4.1'.\nAndroid: switch to = assignment in Gradle files\nGradle deprecated the space-assignment syntax. It only warns today, but it will break in a future Gradle release, so fix it now in android/app/build.gradle:\nandroid {\n-    namespace \"com.example.app\"\n-    compileSdk rootProject.ext.compileSdkVersion\n+    namespace = \"com.example.app\"\n+    compileSdk = rootProject.ext.compileSdkVersion\n     defaultConfig {\n         aaptOptions {\n-            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'\n+            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'\n         }\n     }\n}\nMethod calls such as google() or mavenCentral() stay as they are.\nAndroid: Kotlin and configChanges\nIf your app module uses Kotlin, set kotlin_version = '2.2.20'. Kotlin 2.x turns the old kotlinOptions {} block into an error, so move jvmTarget into kotlin { compilerOptions { ... } }.\nThen add density to the main activity so the WebView isn’t recreated when the display density changes (foldables, window resizing, display size settings):\nandroid:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation|density\"\nAndroid: the bridge layout was renamed\nbridge_layout_main.xml no longer exists. If your MainActivity or a custom fragment referenced R.layout.bridge_layout_main, use R.layout.capacitor_bridge_layout_main.\nEdge-to-edge and the new System Bars plugin\nThis is the change most likely to show up visually. Capacitor 8 removed android.adjustMarginsForEdgeToEdge and added a core System Bars plugin. You don’t install it, it ships with @capacitor/core.\nAndroid 15 forces edge-to-edge for apps targeting SDK 35, and Android 16 removes the opt-out for apps targeting SDK 36. Capacitor 8 targets 36, so your web content now draws behind the status and navigation bars unless you handle insets.\nThe plugin config lives under plugins.SystemBars:\nimport type { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.app',\n  appName: 'Example',\n  webDir: 'dist',\n  plugins: {\n    SystemBars: {\n      // 'css' (default) injects --safe-area-inset-* variables on Android\n      // 'native' relies on env() and viewport-fit\n      // 'disable' leaves inset handling entirely to you\n      insetsHandling: 'css',\n      initialViewportFitValueHint: 'cover',\n    },\n  },\n};\n\nexport default config;\nWith css or native, newer Android WebViews (Chromium 140+) honor viewport-fit=cover and report real env(safe-area-inset-*) values. On older WebViews, Capacitor pads the WebView and sets the env values to 0px. So set the meta tag and use the variables:\n&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" /&gt;\nbody {\n  padding-top: env(safe-area-inset-top);\n  padding-bottom: env(safe-area-inset-bottom);\n}\nAt runtime you can change bar style or visibility:\nimport { SystemBars, SystemBarsStyle, SystemBarType } from '@capacitor/core';\n\nawait SystemBars.setStyle({ style: SystemBarsStyle.Dark });\nawait SystemBars.hide({ bar: SystemBarType.NavigationBar });\nIonic Framework apps already use the safe-area variables, so they usually only need the meta tag. Our older post on edge-to-edge without plugins describes the Capacitor 7 option, which no longer exists in 8.\nOther behavior changes to check\n\nappendUserAgent on iOS: Capacitor 7 added two spaces before your string, Capacitor 8 adds one. If your server parses the user agent strictly, add a leading space to ios.appendUserAgent (not the root option, which also affects Android).\nScreen Orientation and Barcode Scanner: on Android 16+ large screens, orientation locks are ignored. A temporary opt-out exists through the android.window.PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY manifest property, but Android 17 drops it.\nGeolocation: timeout now applies to all requests on Android and iOS. If you see new timeouts, raise the value. watchPosition on Android gained an interval option.\nStatus Bar: the plugin no longer ships its own CAPBridgeViewController notification files, since core now emits those events.\nNew iOS platforms default to SPM: bunx cap add ios now creates an SPM project. Use --packagemanager CocoaPods if you need the old template. See how to use CocoaPods with Capacitor 8.\n\nVerify the upgrade\nRun through this list on both platforms before you ship:\nbunx cap doctor\nbunx cap sync\nbunx cap run ios\nbunx cap run android\n\ncap doctor shows matching 8.x versions for core, CLI, iOS and Android.\nApp launches, splash screen hides, deep links open the right screen.\nStatus bar and navigation bar areas look right on an Android 15/16 device and on a notched iPhone.\nPush notifications, camera, file access and any plugin with native permissions still work.\nA release build (Archive in Xcode, ./gradlew bundleRelease) succeeds, not only debug.\n\nIf you don’t want to maintain Xcode 26 and JDK 21 on every machine, Capgo Build runs the iOS and Android builds in the cloud with current toolchains.\nShip the upgrade safely with live updates\nA Capacitor major upgrade changes native code, so it has to go through the App Store and Google Play. Web bundles built after the upgrade may call plugin APIs that older binaries don’t have.\nIf you use Capgo live updates, keep Capacitor 7 users and Capacitor 8 users apart until adoption catches up: bump your native version, upload new bundles to a channel used by the new binary, and run the compatibility check before you upload:\nbunx @capgo/cli@latest bundle compatibility\nIt compares the native plugin versions in your bundle with what’s running on the channel and flags mismatches before users get a broken update.\nTroubleshooting common Capacitor 8 upgrade errors\nThe engine \"node\" is incompatible or the CLI refuses to run. You are on Node 20 or older. Install Node 22 LTS, and update your CI image too.\nerror: invalid source release: 21 on Android. Gradle is running with JDK 17. Point Android Studio to its bundled JDK 21 (Settings &gt; Build, Execution, Deployment &gt; Build Tools &gt; Gradle &gt; Gradle JDK) and set JAVA_HOME to a JDK 21 for command-line and CI builds.\nMinimum supported Gradle version is 8.13. You updated AGP but not the wrapper. Set the wrapper to 8.14.3.\nDependency ... requires libraries and applications that depend on it to compile against version 36. compileSdkVersion is still 35 somewhere. Check variables.gradle and any plugin that hardcodes it.\nUsing 'kotlinOptions' ... is an error or similar Kotlin DSL errors. A plugin or your app module still uses kotlinOptions. Update the plugin, or patch it until a release lands (see how to patch a Capacitor plugin).\nXcode: No such module 'Capacitor' after upgrading. For CocoaPods, open App.xcworkspace, not App.xcodeproj, and rerun bunx cap sync ios. For SPM, use File &gt; Packages &gt; Reset Package Caches.\n\"X\" plugin is not implemented on ios/android. The plugin didn’t get synced, or it has no Capacitor 8 / SPM-compatible release. Run bunx cap sync and read the warnings.\nFor a longer list, see the Capacitor iOS troubleshooting guide and the Android troubleshooting guide. Mismatched core and plugin versions are covered in fix Capacitor version mismatch errors.\nLet an AI agent do the boring parts\nIf you use Claude Code, Cursor or a similar agent, the open Capgo Skills include capacitor-app-upgrade-v7-to-v8 and capacitor-app-upgrades for multi-major jumps. Install them with bunx skills add Cap-go/capgo-skills and ask the agent to upgrade the app. It runs the migrator, then checks the steps the CLI usually misses, such as Gradle syntax, Kotlin options and CI images.\nWhat comes next\nCapacitor 9 is already in prerelease. Once you’re stable on 8, read Preparing for Capacitor 9 so the next upgrade is smaller.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/upgrade-capacitor-app-to-capacitor-8/"},"keywords":"upgrade to Capacitor 8, Capacitor 8 migration, cap migrate, Capacitor 7 to 8, Capacitor 8 breaking changes, Android SDK 36, Xcode 26, System Bars, edge-to-edge","articleSection":"Capacitor"},{"@type":"FAQPage","@id":"https://capgo.app/blog/upgrade-capacitor-app-to-capacitor-8/#faqpage","url":"https://capgo.app/blog/upgrade-capacitor-app-to-capacitor-8/","mainEntity":[{"@type":"Question","name":"What are the minimum requirements for Capacitor 8?","acceptedAnswer":{"@type":"Answer","text":"Capacitor 8 needs Node.js 22 or later, Xcode 26 or later, an iOS deployment target of 15.0, Android Studio Otter (2025.2.1) or later, minSdkVersion 24, compileSdkVersion and targetSdkVersion 36, Android Gradle Plugin 8.13.0, Gradle 8.14.3, and a JDK 21 for Android builds."}},{"@type":"Question","name":"Does upgrading to Capacitor 8 force my iOS app onto Swift Package Manager?","acceptedAnswer":{"@type":"Answer","text":"No. Existing apps keep their current setup. SPM only becomes the default when you create a new iOS platform with cap add ios. If you delete the ios folder and want to stay on CocoaPods, run bunx cap add ios --packagemanager CocoaPods."}},{"@type":"Question","name":"Can I skip from Capacitor 6 straight to Capacitor 8?","acceptedAnswer":{"@type":"Answer","text":"Yes, but apply the Capacitor 7 changes too. Run the 7 migration first (or read its guide), build both platforms, then run the 8 migration. Doing both in one jump makes it harder to tell which change broke the build."}},{"@type":"Question","name":"Why does my content now sit under the status bar on Android after upgrading?","acceptedAnswer":{"@type":"Answer","text":"Capacitor 8 removed android.adjustMarginsForEdgeToEdge. Safe areas are now handled by the System Bars core plugin and CSS env(safe-area-inset-*) values. Add viewport-fit=cover to your viewport meta tag and pad your layout with the safe area variables."}},{"@type":"Question","name":"Do live updates keep working after a Capacitor 8 upgrade?","acceptedAnswer":{"@type":"Answer","text":"Yes, but ship a new store build first. A web bundle built against Capacitor 8 plugins should only reach devices running the Capacitor 8 native binary. With Capgo, use separate channels or native version checks so older binaries don't receive incompatible bundles."}}]}]}</script>
