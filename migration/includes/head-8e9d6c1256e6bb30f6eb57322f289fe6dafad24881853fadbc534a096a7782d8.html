<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/capgo-2025-year-in-review/#newsarticle","url":"https://capgo.app/blog/capgo-2025-year-in-review/","headline":"Capgo 2025 Year in Review: From 20 to 78 Plugins and Enterprise-Ready","description":"2025 was transformational for Capgo - 58 new Capacitor plugins, enterprise security features, and global infrastructure. Here's how we became the go-to platform for Capacitor development.","image":["https://capgo.app/capgo-2025-recap-blog-post-img.webp"],"datePublished":"2025-12-31T00:00:00.000Z","dateModified":"2026-08-25T01:16:42.000Z","inLanguage":"en","articleBody":"What a year. As 2025 comes to a close, we’re looking back at twelve months that completely transformed Capgo from a solid OTA update platform into the comprehensive Capacitor ecosystem you rely on today.\nThe numbers tell part of the story: 58 new Capacitor plugins created, growing our catalog from 20 to 78 plugins (that’s 290% growth). Enterprise security features that make Capgo ready for the most demanding organizations. A global infrastructure spanning 7+ regions with automatic failover.\nBut the real story is what these changes mean for you: faster development, better security, and plugins for nearly every use case you can imagine.\nLet’s walk through how 2025 unfolded.\nQ1: The Foundation - Streamcall Development Begins\nQ1 2025 marked the beginning of something special. We started development on capacitor-streamcall, what would become our flagship plugin of the year - a complete video calling SDK integration for Capacitor.\nThis wasn’t just another plugin. Streamcall would receive continuous development and improvements throughout the entire year. By December, it had shipped over 90 releases and upgraded to Capacitor 8 support. But in Q1, we were just laying the groundwork.\nQ1 Plugin Count: 1 new plugin (in development)\nThe foundation was set. Little did we know what was coming.\nQ2: Expansion Begins\nApril through June saw the plugin ecosystem start to expand. Six new plugins joined the catalog, each solving real problems developers face:\n\ncapacitor-llm (June) - Run large language models locally on iOS and Android with Apple Intelligence support\ncapacitor-jw-player (April) - Native video playback with JW Player SDK\ncapacitor-appinsights (June) - Azure App Insights integration\ncapacitor-android-usagestatsmanager (April) - Track app usage stats natively on Android\ncapacitor-autofill-save-password (May) - iOS keychain password saving\n\nThe AI wave was hitting mobile, and we were ready with local LLM support. Video processing moved to the edge. Developer tooling got smarter.\nQ2 Plugin Count: 5 new plugins\nQ3: The Acceleration\nJuly through September is when things really started to take off. But before we get to the plugin numbers, let’s talk about the biggest enterprise milestone of the year:\nTeam Growth: Building the Foundation\nJordan Joins (July)\nIn July 2025, Jordan joined the Capgo team as an experienced developer. Jordan previously worked with Martin at Toucan Toco, bringing deep expertise in building complex projects and features.\nJordan’s impact was immediate. Throughout Q3 and Q4, he architected and built several critical systems, including the usage credits system (launched December 9) that now powers Capgo’s billing infrastructure. His expertise in complex feature development became a cornerstone of our Q4 enterprise push.\nValeria Joins (September)\nSeptember brought a different kind of growth challenge: major applications with over 5 million users were adopting Capgo. These weren’t just regular customers - they were enterprise clients needing dedicated support, complex deployment strategies, and relationship management at scale.\nValeria (Lera) joined as Project &amp; Success Manager, bringing order to what was becoming chaotic growth. She created onboarding playbooks, established support processes, and most importantly, ensured our biggest clients felt heard and supported. With Valeria managing enterprise relationships, the team could focus on building while knowing our largest customers were in excellent hands.\nSOC 2 Type II Certified (July 16)\n\nOn July 16, 2025, Capgo achieved SOC 2 Type II certification. This isn’t just a badge on our website - it’s proof that our security controls, data handling, and operational practices meet the strictest standards that enterprise security teams demand.\nFor context: SOC 2 certification means independent auditors examined our entire infrastructure, security practices, and operational procedures over an extended period. They verified we’re doing everything right - access controls, encryption, monitoring, incident response, data protection, the works.\nThis opened doors. Enterprise teams that couldn’t even consider Capgo before July could now move forward. Security questionnaires got easier. Procurement processes sped up. IT departments gave the green light.\nSOC 2 wasn’t just certification - it was validation that Capgo is ready for production at any scale.\nQ3 Plugin Expansion\nWith that foundation in place, the plugin development pace doubled with 12 new plugins released:\nEnterprise Integrations:\n\ncapacitor-twilio-voice - Production-grade voice calling with Twilio\ncapacitor-gtm - Google Tag Manager for native analytics\n\nHealth &amp; Fitness:\n\ncapacitor-health - Apple HealthKit and Google Fit data access\ncapacitor-background-geolocation - Accurate location tracking in background\n\nMedia &amp; Streaming:\n\ncapacitor-mux-player - Mux Player SDK for iOS and Android\ncapacitor-audiosession - Advanced audio session management\n\nDeveloper Tools:\n\ncapacitor-persistent-account - Persist account data between installs\ncapacitor-android-inline-install - Trigger Android inline install feature\ncapacitor-alarm - Native alarm functionality\ncapacitor-launch-navigator - Route navigation integration\ncapacitor-is-root - Jailbreak and root detection\ncapacitor-textinteraction - iOS text interaction controls\n\nThe focus was clear: enterprise integrations for serious apps, health and fitness capabilities, and developer experience improvements.\nQ3 Plugin Count: 12 new plugins\nThe Human Side: Team Madeira (August)\nBehind all these features, plugins, and certifications are real people. In August 2025, the Capgo team met in person in Madeira, Portugal - and it was truly special.\nJordan, Michael, and Martin (our CEO) spent a week working together, exploring the island, and building the relationships that make everything else possible. Some moments from that week:\n\nDay one of the Madeira experience - Jordan (left), Michael (middle), and Martin (right, CEO) exploring the island’s breathtaking views\n\nWhen your office is a sunny beach in Calheta - Jordan (left), Michael (middle), and Martin (right, CEO) getting work done in paradise\n\nTaking a break at the beautiful Praia do Seixal waterfall - Jordan (left), Michael (middle), and Martin (right, CEO)\n\nMichael (left) and Martin (right, CEO) taking in the views at Câmara De Lobos\nAnd because no team trip is complete without karaoke in a Tesla:\n\n  \n    \n    Your browser does not support the video tag.\n  \n\nImpromptu Tesla karaoke - one of my favorite memories from the trip\nThis wasn’t just a team retreat. It was the week where we talked through the enterprise features that would launch in Q4. Where we planned the plugin explosion. Where we became more than colleagues - we became a team that truly trusts each other.\nThe SOC 2 certification? The 40 Q4 plugins? The enterprise features? They all happened because of the foundation built during this week in Madeira.\nCamera Preview Complete Rewrite (August 21)\nOne of the most ambitious technical projects of 2025 happened in August: a complete rewrite of capacitor-camera-preview. This wasn’t just an update - it was a ground-up rebuild.\nThe massive PR (#205) included:\n\n193 commits across 170 files\nComplete Android migration to CameraX API\niOS rebuild using AVFoundation\nNew web video pipeline\n\nNew capabilities added:\n\nMulti-lens and device discovery\nZoom, focus, and flash controls\nAspect ratio and grid overlays\nEXIF and GPS embedding\nVideo recording support\nSafe area and orientation handling\n\nThis level of rewrite - 41,000+ lines of code changed - demonstrated our commitment to maintaining best-in-class plugins. When Android deprecated the old Camera API, we didn’t just patch it. We rebuilt the entire plugin with modern APIs and expanded functionality.\nQ4: The Explosion\nOctober through December was unprecedented. 40 new plugins in just three months. The plugin catalog nearly doubled.\nWe shipped plugins for nearly every use case imaginable:\nPayments &amp; Commerce:\n\ncapacitor-pay (Apple Pay &amp; Google Pay)\ncapacitor-in-app-review (App store ratings)\n\nIoT &amp; Hardware:\n\ncapacitor-nfc (NFC tag reading/writing)\ncapacitor-bluetooth-low-energy (BLE integration)\ncapacitor-ibeacon (iBeacon support)\ncapacitor-accelerometer, capacitor-barometer, capacitor-compass\ncapacitor-volume-buttons (Hardware button listening)\n\nMessaging &amp; Social:\n\ncapacitor-wechat (WeChat SDK integration)\ncapacitor-share-target (Receive share intents)\n\nMedia &amp; Content:\n\ncapacitor-youtube-player\ncapacitor-admob (AdMob SDK bridge)\ncapacitor-video-player\ncapacitor-media-session\ncapacitor-audio-recorder\n\nDeveloper Infrastructure:\n\ncapacitor-live-reload (Remote Vite dev server)\ncapacitor-file, capacitor-file-picker, capacitor-file-compressor\ncapacitor-zip (Compression utilities)\ncapacitor-printer (Document &amp; PDF printing)\ncapacitor-fast-sql (High-performance local database)\n\nHealth &amp; Accessibility:\n\ncapacitor-pedometer (Step tracking)\ncapacitor-speech-recognition &amp; capacitor-speech-synthesis\ncapacitor-document-scanner\n\nEnterprise &amp; Security:\n\ncapacitor-android-kiosk (Kiosk mode apps)\ncapacitor-webview-guardian (Detect and recover from WebView crashes)\ncapacitor-android-age-signals (Play Age Signals API)\n\nDeveloper Experience:\n\ncapacitor-wifi (WiFi management)\ncapacitor-screen-orientation (True physical orientation)\ncapacitor-keep-awake (Prevent screen sleep)\ncapacitor-sim (SIM card information)\nAnd many more…\n\nOn December 13, we upgraded capacitor-streamcall to v8.0, bringing full Capacitor 8 support to our flagship video calling plugin.\nQ4 Plugin Count: 40 new plugins\nQ4: Platform Goes Enterprise\nWhile the plugin ecosystem exploded, we didn’t neglect the core platform. December 2025 brought a wave of enterprise-grade security features that transformed Capgo into a platform ready for Fortune 500 companies.\nSecurity &amp; Access Control\nSAML SSO with Auto-Join (December 28)\nEnterprise teams can now use their existing identity providers with domain-based auto-provisioning. When users from verified domains log in, they’re automatically added to the right organization. No manual user management needed.\nTwo-Factor Authentication Enforcement (December 24-28)\nOrganization admins can now require 2FA for all members. Before enforcement, you get a preview showing which team members would be affected. App-level 2FA enforcement ensures only verified users can access your apps.\nHashed API Keys with Security Policies (December 28)\nAPI keys are now only visible once after creation - just like GitHub or AWS. Organizations can enforce this policy across all members and reject plain-text keys. Your keys are hashed and secure.\nAPI Key Expiration &amp; Lifecycle Management (December 28)\nSet expiration dates on API keys. Organizations can enforce maximum validity periods. Keys automatically delete after a 30-day grace period. Clear error messages when keys expire. No more forgotten, permanent API keys floating around.\nOrganization Password Policies (December 28)\nConfigure password complexity requirements at the organization level. Track compliance. Enforce security standards across your entire team.\nAutomation &amp; Integration\nWebhooks System (December 27)\nSubscribe to events across your apps, channels, and devices. Delivery history tracking shows exactly what was sent and when. HMAC-SHA256 signatures ensure webhook authenticity. Build custom automations and integrations with your existing tools.\nDeveloper Experience\nGranular Email Notification Preferences (December 28)\nNine different notification types, each customizable per user. Usage alerts, stats updates, bundle notifications, device errors - control exactly what you want to hear about. Available in 14 languages: German, Spanish, French, Hindi, Indonesian, Italian, Japanese, Korean, Polish, Portuguese (BR), Russian, Turkish, Vietnamese, and Chinese.\nNative Dependencies Tracking (December 4)\nA new “Native Dependencies” tab in bundle details shows exactly which native packages and versions are in each build. Direct npm links for every dependency. No more guessing what’s in production.\nCLI Version Tracking (December 19)\nEvery bundle now records which CLI version uploaded it. Visible in your dashboard. When users report issues, you know exactly which tooling they used.\nEncryption Key Validation (December 13)\n20-character public key prefixes identify which encryption key is in use. Automatic mismatch detection prevents updates from going to devices with wrong keys. Your encrypted bundles stay secure.\nUsage Credits System (December 9)\nJordan architected and built our complete credit-based billing infrastructure. Credit top-up functionality with automatic overage handling. Alerts at 50%, 75%, 90%, and 100% usage. Complete transaction tracking. Know exactly where you stand before hitting limits.\nEnhanced Channel Management (December 31)\nChannel ID and device ID now included in all request payloads. Better tracking, better analytics, easier debugging when issues arise.\nDeveloper Infrastructure Revolution\nCapgo Cloud Build (November 19)\nWe launched a game-changing feature: build native apps directly in the cloud without Xcode or Android Studio. Built on 3 years of internal expertise, Capgo Cloud Build lets you run a single CLI command to build iOS and Android apps on dedicated infrastructure.\nKey capabilities:\n\nOne-command builds - No local Xcode (30+ GB) or Android Studio required\nCross-platform builds - Build iOS apps from Linux/Windows, eliminating the Mac requirement\nBattle-tested infrastructure - Using the same system we’ve relied on for thousands of internal builds\nReal-time log streaming - Watch your builds happen with instant terminal feedback\nDirect App Store submission - Build and submit to TestFlight or Play Store in one step\nSecure credential handling - Credentials stored locally, never on our servers\n\nThis is like Expo EAS Build, but specifically optimized for Capacitor. After years of building apps for clients, we made our proven infrastructure available to everyone.\nInfrastructure &amp; Reliability\nCapacitor 8 Support (December 2025)\nFull compatibility with Capacitor 8. Node.js 24 support in build workflows. Modern tooling integration across the board.\nPostgreSQL 17 Compatibility (December 29)\nMigrated to PostgreSQL 17’s built-in gen_random_uuid(). Removed deprecated uuid-ossp extension. Future-proof database layer ready for years to come.\nCircuit Breaker Pattern for Regional Failover (December 30)\nAutomatic health checks for regional servers. When a region has issues, traffic instantly routes to healthy backup regions. Five-minute recovery window with automatic retry. Better uptime, better user experience.\nChunk Load Error Handling (December 24)\nWhen users hit loading failures, they now get automatic update notifications. Better error recovery. Fewer frustrated users.\nBy The Numbers\nLet’s look at what 2025 meant in hard data:\nPlugin Ecosystem:\n\n59 new Capacitor plugins created\n\nQ1: 1 plugin\nQ2: 6 plugins\nQ3: 12 plugins\nQ4: 40 plugins\n\n\nPlugin catalog grew 295% (from ~20 to ~79 total plugins)\ncapacitor-streamcall: 10+ months of active development, 90+ releases\n\nPlatform Evolution:\n\nSOC 2 Type II certified (July 16) - enterprise-ready security validation\n16 major features launched in Q4 alone\nPlatform versions: v12.70 → v12.83 (continuous iteration)\n7+ global database regions for low-latency access worldwide\n14 languages supported for email notifications\nEnterprise-grade security features ready for Fortune 500\n\nWhat It All Means\n2025 wasn’t just about adding features. It was about transformation.\n1. Plugin Ecosystem Explosion\nWe became the go-to source for Capacitor plugins. Whether you need video calling (streamcall), AI capabilities (LLM), payment processing (pay), IoT integration (NFC, Bluetooth, iBeacon), health data (health, pedometer), or any of dozens of other capabilities - we’ve got you covered.\nThe Q4 acceleration shows this momentum isn’t slowing down. Developers are building serious production apps with Capacitor, and they need serious tooling. We’re delivering it.\n2. Enterprise-Ready Platform\nSOC 2 Type II certification in July set the foundation. Then came SAML SSO, 2FA enforcement, hashed API keys with expiration, password policies, webhooks, and audit logging in Q4.\nThese aren’t just buzzword features. They’re the requirements that enterprise security teams demand before approving any platform. The SOC 2 certification proved we meet those standards. The Q4 features gave you the tools to enforce them.\nNow Capgo checks every box on the enterprise security checklist.\n3. Global Infrastructure\nSeven-plus database regions. Circuit breaker patterns. Automatic failover. 14-language support.\nYour users are everywhere. Your infrastructure should be too. Whether your customers are in Tokyo, Mumbai, São Paulo, or San Francisco - Capgo delivers fast, reliable updates.\n4. Developer Experience\nCLI version tracking. Native dependencies visibility. Encryption key validation. Usage credits with alerts. Granular notifications.\nWe know you’re shipping fast and need visibility when things go wrong. Every feature we built in 2025 was designed to give you the information you need, when you need it.\nLooking Ahead\nWe’re not slowing down. The plugin ecosystem momentum continues. Enterprise features mature. Infrastructure expands.\nBut we don’t want to make promises about timelines. What we will say: 2026 will build on everything we achieved in 2025. More plugins. Deeper enterprise integration. Better developer tools. Faster infrastructure.\nMost importantly: we’re listening. The features we built in 2025 came directly from what you told us you needed. That won’t change.\nThank You\nTo everyone who shipped an app with Capgo in 2025, filed an issue, requested a feature, or just believed in what we’re building - thank you.\nThe plugin ecosystem exists because developers needed solutions and we delivered. The enterprise features exist because teams trusted us with their production apps. The global infrastructure exists because your users deserve the best.\nHere’s to 2025. And here’s to what we’ll build together in 2026.\nWant to try the new enterprise features? Check out our documentation or reach out to our team.\nNeed a plugin that doesn’t exist yet? Let us know - 2025 proved we can move fast.\n— The Capgo Team\nKeep going from Capgo 2025 Year in Review: From 20 to 78 Plugins and Enterprise-Ready\nIf you are using Capgo 2025 Year in Review: From 20 to 78 Plugins and Enterprise-Ready to plan security and compliance, connect it with Encryption for the implementation detail in Encryption, Compliance for the implementation detail in Compliance, Capgo Security Scanner for the product workflow in Capgo Security Scanner, Capgo Security for the product workflow in Capgo Security, and Capgo Trust Center for the product workflow in Capgo Trust Center.\n","author":{"@type":"Person","name":"Michael (WcaleNieWolny)","url":"https://github.com/WcaleNieWolny/WcaleNieWolny","image":"https://avatars.githubusercontent.com/u/50914789?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/capgo-2025-year-in-review/"},"keywords":"Capgo, year in review, 2025, enterprise features, security, OTA updates, Capacitor, plugins","articleSection":"Company"}</script>
