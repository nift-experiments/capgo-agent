<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"NewsArticle","@id":"https://capgo.app/blog/distribute-ios-and-android-apps-to-testers/#newsarticle","url":"https://capgo.app/blog/distribute-ios-and-android-apps-to-testers/","headline":"How to Distribute iOS and Android Apps to Testers","description":"How to distribute iOS and Android apps to testers: TestFlight, Google Play testing tracks, internal app sharing, Firebase App Distribution and ad hoc builds.","image":["https://capgo.app/testflight_app.webp"],"datePublished":"2026-10-01T09:00:00.000Z","dateModified":"2026-10-01T03:59:51.000Z","inLanguage":"en","articleBody":"To distribute iOS apps to testers, use TestFlight (internal testers instantly, external testers after a short Beta App Review) or an ad hoc build for registered devices. For Android, use a Google Play testing track (internal, closed or open), Play internal app sharing for one-off links, or share a signed APK through Firebase App Distribution or a direct download. Which one is right depends on who your testers are, how many there are, and whether you need the build to go through store infrastructure.\nThis guide compares every option, shows how to set each one up for a Capacitor app, and lists the errors testers typically run into.\nChoosing a method\n\n\n\nMethod\nPlatform\nMax testers\nReview before testers get it\nTesters need\nBest for\n\n\n\n\nTestFlight internal\niOS\n100 team members\nNo\nApp Store Connect user, TestFlight app\nYour team\n\n\nTestFlight external\niOS\n10,000\nBeta App Review (first build of a version)\nEmail invite or public link, TestFlight app\nBeta users, clients\n\n\nAd hoc\niOS\n100 devices per device type per year\nNo\nRegistered UDID, Developer Mode\nSmall QA team, no Apple review\n\n\nPlay internal testing\nAndroid\n100\nNo full review, usually available in minutes\nGoogle account on email list\nYour team\n\n\nPlay closed testing\nAndroid\nEmail lists or Google Groups\nYes\nGoogle account, opt-in link\nBeta users, the 12-tester requirement\n\n\nPlay open testing\nAndroid\nUnlimited or capped\nYes\nOpt-in on the listing\nPublic beta\n\n\nPlay internal app sharing\nAndroid\nAnyone with the link\nNo\nGoogle account, setting enabled\nQuick QA builds, any version code\n\n\nFirebase App Distribution\nBoth\nLarge\nNo\nEmail invite; iOS needs registered UDID\nCross-platform QA\n\n\nDirect APK link\nAndroid\nAnyone\nNo\nAllow unknown sources\nFast internal tests\n\n\n\nRules of thumb:\n\nSame build you will ship to the store? Use TestFlight and Play tracks. The binary testers use is the binary that gets promoted.\nDaily QA builds? Internal testing on both stores, or Firebase App Distribution.\nNeed to test a web-layer change in minutes? Ship a live update to a test channel instead of a new binary.\n\nBefore you distribute: signing\nEvery test build must be signed.\n\niOS test builds use either an App Store Connect profile (TestFlight) or an Ad Hoc profile (direct install). Both use an Apple Distribution certificate. See iOS certificates and provisioning profiles explained.\nAndroid builds for Play tracks are AABs signed with your upload key. For direct installs you need an APK signed with any release key. A debug APK also installs, but it behaves differently (debuggable, different signing) and cannot be upgraded by your Play build later.\n\niOS: TestFlight\nUpload a build\nFrom Xcode: Product &gt; Archive, then Distribute App &gt; App Store Connect &gt; Upload. From the command line or CI, export an .ipa and upload with an App Store Connect API key, or let a cloud build service do it.\nSince April 2026, uploads must be built with Xcode 26 or later.\nAdd this key to ios/App/App/Info.plist if your app only uses standard HTTPS encryption, so App Store Connect does not ask the export compliance question for every build:\n&lt;key&gt;ITSAppUsesNonExemptEncryption&lt;/key&gt;\n&lt;false/&gt;\nProcessing takes from a few minutes to around an hour. You get an email when the build is ready.\nInternal testing\n\nIn App Store Connect open your app, TestFlight &gt; Internal Testing, and create a group.\nAdd team members. They must have an App Store Connect role (Admin, App Manager, Developer, Marketing…). Up to 100 people.\nEnable automatic distribution so every new build goes to the group.\nTesters install the TestFlight app from the App Store and accept the invite.\n\nNo review is needed. This is the fastest path from upload to phone.\nExternal testing\n\nTestFlight &gt; External Testing &gt; + to create a group.\nAdd testers by email, or enable a public link with an optional tester limit.\nAdd the build to the group and fill in Test Information (what to test, feedback email, beta app description, and demo login if needed).\nSubmit for Beta App Review. The first build of each version is reviewed, usually within a day. Later builds of the same version often go out without full review.\n\nExternal testing supports up to 10,000 testers. Testers can send screenshots with feedback directly from TestFlight, which you see in App Store Connect.\nTestFlight limits to know\n\nBuilds expire after 90 days.\nTesters need iOS versions supported by your build (Capacitor 8 requires iOS 15 or later).\nTestFlight builds use the production App Store signing, so push notifications use the production APNs environment.\nIn-app purchases in TestFlight use the sandbox and are not charged.\n\niOS: ad hoc distribution\nAd hoc builds install directly on devices you registered in the Apple Developer portal, without TestFlight or Apple review.\n\nCollect each tester’s UDID. Testers can get it on their own phone with the iOS UDID finder, or you can read it from Finder or Xcode when the device is connected.\nRegister the devices in Certificates, Identifiers &amp; Profiles &gt; Devices.\nCreate an Ad Hoc provisioning profile that includes those devices and download it.\nBuild an .ipa with that profile (Xcode: Distribute App &gt; Release Testing, which is the newer name for Ad Hoc).\nInstall it:\n\nDrag the .ipa onto the device in Finder or Xcode &gt; Window &gt; Devices and Simulators.\nOr host it with an itms-services manifest over HTTPS so testers can tap a link. Services like Firebase App Distribution do this for you.\n\n\nOn iOS 16 and later, installing the .ipa from a Mac (Xcode or Apple Configurator) requires Developer Mode on the device (Settings &gt; Privacy &amp; Security). Installs from an itms-services link don’t need it. See how to enable Developer Mode on iOS.\n\nAdding a new tester means registering their UDID, regenerating the profile and rebuilding. Device slots (100 per device family) only reset when your membership year renews, so do not register devices casually.\nAndroid: Google Play testing tracks\nPlay Console has three testing tracks plus production. All of them need an AAB signed with your upload key.\nInternal testing\n\nTesting &gt; Internal testing &gt; Testers: create an email list (up to 100 addresses).\nCreate new release, upload the AAB, add release notes, save and roll out.\nCopy the opt-in link and send it to testers. They accept and install from the Play Store.\n\nInternal releases are usually available within minutes and do not wait for full review. The first release of a brand new app may take longer while Google processes the app.\nClosed testing\nClosed tracks are reviewed and support email lists or Google Groups. This is the track you need for the 12 testers for 14 days rule that applies to personal developer accounts created after November 13, 2023, before production access. Using a Google Group makes it easy for testers to join. Details are in how to create Apple and Google Play developer accounts.\nOpen testing\nAnyone can join from your Play listing. Use it for a public beta once your store listing is complete. Feedback from open testers is private and does not affect your public rating.\nOur Android beta testing guide compares the tracks in more detail.\nAndroid: Internal app sharing\nInternal app sharing is the fastest way to get any APK or AAB on a device through the Play Store, without version code rules and without review.\n\nIn Play Console, open Internal app sharing (under Testing) and add uploaders.\nUpload an APK or AAB. You get a link.\nTesters open the Play Store app, go to settings, tap the Play Store version seven times to reveal developer settings, and turn on Internal app sharing.\nTesters open the link and install.\n\nIt is useful for QA of pull request builds because version codes do not need to increase.\nAndroid: direct APK and Firebase App Distribution\nDirect APK\nBuild a signed release APK. A new Capacitor project has no release signing config, so assembleRelease would produce an unsigned APK that won’t install. Add a signingConfigs.release block (keystore path and passwords, usually read from key.properties) to android/app/build.gradle and point buildTypes.release.signingConfig at it first.\nbun run build\nbunx cap sync android\ncd android &amp;&amp; ./gradlew assembleRelease\nShare android/app/build/outputs/apk/release/app-release.apk through a link. Testers allow their browser or file manager to install unknown apps and open the file. If they already have a Play Store version installed, they must uninstall it first because the signatures differ. You can also install over USB with adb install -r app-release.apk (see how to enable developer options on Android).\nFrom September 30, 2026, certified Android devices in Brazil, Indonesia, Singapore and Thailand only install apps whose package name is registered by a verified developer, with global rollout planned for 2027. If your testers are in those countries, register the package name in the Android Developer Console or Play Console. Installs through adb are not affected.\nFirebase App Distribution\nFirebase App Distribution works for both platforms, sends email invites, and tracks who installed which build.\nbun add -g firebase-tools\nfirebase login\n\nfirebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk \\\n  --app 1:1234567890:android:abc123def456 \\\n  --groups \"qa-team\" \\\n  --release-notes \"Fix checkout crash\"\n\nAndroid testers install from the email link or the App Tester app.\niOS testers must still be in an ad hoc (or development) profile. App Distribution collects their UDIDs when they accept the invite, but you register them and rebuild yourself.\nAAB distribution requires linking the Firebase project to Google Play.\n\nCloud builds that hand testers a link\nIf you do not want to maintain Macs and signing on every CI runner, Capgo Build builds Capacitor apps in the cloud. For test builds it can skip store submission and upload the binary to a time-limited download link with a QR code:\n# Android APK/AAB for testers, no Play upload\nbunx @capgo/cli@latest build request com.example.app \\\n  --platform android --no-playstore-upload --output-upload --output-retention 2d\n\n# iOS ad hoc build (no App Store submission)\nbunx @capgo/cli@latest build request com.example.app \\\n  --platform ios --ios-distribution ad_hoc --output-upload\n\n# iOS build uploaded to TestFlight for external groups\nbunx @capgo/cli@latest build request com.example.app \\\n  --platform ios --ios-testflight-groups \"Beta Testers\"\nAdd --output-record build.json and read the link in CI with bunx @capgo/cli@latest build last-output --path build.json --field outputUrl to post it into a pull request or chat. The Capgo Build docs list every option.\nSkip rebuilding for web changes\nMost changes in a Capacitor app are in the web layer. Rebuilding and redistributing a binary for a text fix wastes a day of TestFlight processing and review. With Capgo live updates, testers keep the build they installed, and you push new JavaScript bundles to a test channel:\nbunx @capgo/cli@latest bundle upload --channel beta\nYou can even give each pull request its own channel and let QA switch between them on the same installed app. See turn every pull request into an installable preview.\nTroubleshooting\n“Unable to install” on iOS ad hoc. The device UDID is not in the profile, or the profile expired. Check with security cms -D -i profile.mobileprovision.\nApp opens and immediately closes on iOS. Developer Mode is off (ad hoc/development builds), or the profile expired.\nTestFlight build stuck in “Processing”. Wait up to an hour. If it fails, the email lists the reason, often a missing usage description string (NSCameraUsageDescription and similar) or an icon problem.\nTestFlight “Missing Compliance”. Answer the export compliance question in App Store Connect or add ITSAppUsesNonExemptEncryption to Info.plist.\nAndroid “App not installed”. A version with a different signature is already installed, or the APK is unsigned or corrupt. Uninstall the existing app.\nTester does not see the app in Play Store after opting in. Wait a few minutes, make sure they are signed in with the invited account, and check that the release is rolled out to the track and their country is available.\n“Version code already used” on upload. Bump versionCode in android/app/build.gradle. Internal app sharing is the exception.\nPush notifications do not arrive in TestFlight. TestFlight uses the production APNs environment. Check the aps-environment entitlement and your push provider’s environment setting.\nRecommended setup for a small team\n\nTestFlight internal group with automatic distribution, plus a Play internal testing track, for every merge to main.\nA TestFlight external group and a Play closed testing track for beta users, updated weekly.\nLive updates on a beta channel for web-only fixes between builds.\nWhen the beta is stable, promote the same build to production on both stores and follow the first-time app review guide.\n\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/distribute-ios-and-android-apps-to-testers/"},"keywords":"distribute app to testers, testflight, testflight external testers, google play internal testing, internal app sharing, firebase app distribution, ad hoc distribution ios, beta testing android, install apk testers","articleSection":"iOS"},{"@type":"FAQPage","@id":"https://capgo.app/blog/distribute-ios-and-android-apps-to-testers/#faqpage","url":"https://capgo.app/blog/distribute-ios-and-android-apps-to-testers/","mainEntity":[{"@type":"Question","name":"What is the fastest way to get an iOS build to testers?","acceptedAnswer":{"@type":"Answer","text":"TestFlight internal testing. Once App Store Connect finishes processing the upload, up to 100 team members can install it with the TestFlight app, with no Beta App Review. For people outside your team, external testing needs a Beta App Review for the first build of each version, which usually takes about a day."}},{"@type":"Question","name":"Do testers need a Google account to test an Android app?","acceptedAnswer":{"@type":"Answer","text":"For Google Play testing tracks and internal app sharing, yes, testers need a Google account signed in to the Play Store. For a direct APK link or Firebase App Distribution, they do not need a Play account, but they must allow installs from unknown sources."}},{"@type":"Question","name":"Why do iOS ad hoc builds need the device UDID but Android does not?","acceptedAnswer":{"@type":"Answer","text":"iOS only runs apps signed with a provisioning profile that authorizes the device. Ad hoc and development profiles list allowed UDIDs. Android checks the signature but not the device, so any device can install a signed APK."}},{"@type":"Question","name":"How long do TestFlight builds last?","acceptedAnswer":{"@type":"Answer","text":"TestFlight builds expire 90 days after upload. Testers get a reminder, and you need to upload a new build to keep testing."}},{"@type":"Question","name":"Can I update test builds without uploading a new binary?","acceptedAnswer":{"@type":"Answer","text":"For JavaScript, HTML and CSS changes in a Capacitor app, yes. Capgo live updates can push a new web bundle to a test channel, so testers get the change on next launch. Native changes still need a new build."}}]}]}</script>
