<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/vue-mobile-app-capacitor/#newsarticle","url":"https://capgo.app/blog/vue-mobile-app-capacitor/","headline":"Building Mobile Apps with Vue and Capacitor","description":"Learn how to create a mobile app using Vue, Capacitor, and optionally enhance Capgo Native Navigation, Transitions, and iOS layout best practices.","image":["https://capgo.app/vue_capacitor.webp"],"datePublished":"2023-06-08T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"In this tutorial, we’ll guide you through the process of converting a Vue web application into a native mobile app using Capacitor. You can also add Capgo Native Navigation and Transitions for a native mobile feel, and use tailwind-capacitor for safe areas.\nAbout Capacitor\nCapacitor is a game-changing tool that allows you to easily integrate it into any web project and convert your application into a native mobile app. It generates native Xcode and Android Studio projects for you and provides access to native device features like the camera through a JavaScript bridge.\nPreparing Your Vue App\nFirst, create a new Vue app by running the following command:\nvue create my-app\ncd my-app\nnpm install\nTo prepare your Vue app for native mobile deployment, you’ll need to export your project. Add a script in your package.json file to build and copy the Vue project:\n{\n  \"scripts\": {\n    // ...\n    \"build\": \"vue-cli-service build\"\n  }\n}\nAfter running the build command, you should see a new dist folder in your project’s root directory. This folder will be used by Capacitor later.\nAdding Capacitor to Your Vue App\nTo convert your Vue web app into a native mobile container, follow these steps:\n\n\nInstall the Capacitor CLI as a development dependency and set it up within your project. Accept the default values for name and bundle ID during the setup.\n\n\nInstall the core package and the relevant packages for the iOS and Android platforms.\n\n\nAdd the platforms, and Capacitor will create folders for each platform at the root of your project:\n\n\n# Install the Capacitor CLI locally\nnpm install -D @capacitor/cli\n\n# Initialize Capacitor in your Vue project\nnpx cap init\n\n# Install the required packages\nnpm install @capacitor/core @capacitor/ios @capacitor/android\n\n# Add the native platforms\nnpx cap add ios\nnpx cap add android\nYou should now see new iOS and android folders in your Vue project.\nUpdate the capacitor.config.json file to point the webDir to the result of your build command:\n{\n  \"appId\": \"com.example.app\",\n  \"appName\": \"my-app\",\n  \"webDir\": \"dist\"\n}\nNow, you can build your Vue project and sync it with Capacitor:\nnpm run build\nnpx cap sync\nBuild and Deploy Native Apps\nTo develop iOS apps, you need Xcode installed, and for Android apps, you need Android Studio installed. Additionally, you need to enroll in the Apple Developer Program for iOS and the Google Play Console for Android to distribute your app on the app store.\nUse the Capacitor CLI to open both native projects:\nnpx cap open ios\nnpx cap open android\nDeploy your app to a connected device using Android Studio or Xcode.\nCapacitor Live Reload\nEnable live reload on your mobile device by having the Capacitor app load the content from a specific URL on your network.\nFind your local IP address and update the capacitor.config.ts file with the correct IP and port:\nimport { CapacitorConfig } from '@capacitor/cli';\n\nconst config: CapacitorConfig = {\n  appId: 'com.example.app',\n  appName: 'my-app',\n  webDir: 'dist',\n  bundledWebRuntime: false,\n  server: {\n    url: 'http://192.168.x.xx:8080',\n    cleartext: true\n  }\n};\n\nexport default config;\nApply these changes by copying them over to your native project:\nnpx cap copy\nNow, your app will automatically reload and show changes when you update your Vue app.\nUsing Capacitor Plugins\nInstall a Capacitor plugin, such as the Share plugin, and use it in your Vue app:\nnpm i @capacitor/share\nImport the package and call the share() function in your app:\n&lt;template&gt;\n  &lt;div&gt;\n    &lt;h1&gt;Welcome to Vue and Capacitor!&lt;/h1&gt;\n    &lt;button @click=\"share\"&gt;Share now!&lt;/button&gt;\n  &lt;/div&gt;\n&lt;/template&gt;\n\n&lt;script setup lang=\"ts\"&gt;\nimport { Share } from '@capacitor/share';\n\nasync function share() {\n  await Share.share({\n    title: 'Open Youtube',\n    text: 'Check new video on youtube',\n    url: 'https://www.youtube.com',\n    dialogTitle: 'Share with friends'\n  });\n}\n&lt;/script&gt;\nAfter installing new plugins, run the sync command and redeploy the app to your device:\nnpx cap sync\nNext, you can make the app feel more native on iOS and Android with Capgo navigation and transitions, and fix common iOS layout issues that cause horizontal overflow or cropped safe areas.\nNative-feeling UI with Capgo Native Navigation and Transitions\nI’ve worked for years with Ionic to build cross-platform applications, but integrating it with Vue is hacky and rarely worth it when you already have Tailwind CSS.\nFor a native mobile feel in a Vue + Capacitor app, use Capgo plugins instead of web-only UI kits like Konsta UI:\n\n@capgo/capacitor-native-navigation — native navbar, Liquid Glass tab bar on iOS, and a blurred tab bar style on Android. Your Vue router keeps route state; the plugin owns the native chrome.\n@capgo/capacitor-transitions — Ionic-style page transitions and iOS edge swipe-back in the WebView layer, without adopting Ionic UI.\n\nInstall both:\nbun add @capgo/capacitor-native-navigation @capgo/capacitor-transitions\nbunx cap sync\nConfigure native navigation with CSS inset mode so web content respects the native bars:\nimport { NativeNavigation } from '@capgo/capacitor-native-navigation';\n\nawait NativeNavigation.configure({\n  contentInsetMode: 'css',\n  animationDuration: 360,\n  glass: {\n    effect: 'liquidGlass',\n  },\n});\nRender a Liquid Glass tab bar (iOS uses system-owned rendering; Android uses a blurred WebView backdrop):\nawait NativeNavigation.setTabbar({\n  selectedId: 'home',\n  labelVisibilityMode: 'labeled',\n  icons: true,\n  colors: { dynamic: true },\n  tabs: [\n    { id: 'home', title: 'Home', icon: { svg: '...' } },\n    { id: 'settings', title: 'Settings', icon: { svg: '...' } },\n  ],\n});\n\nawait NativeNavigation.addListener('tabSelect', ({ id }) =&gt; {\n  router.push(`/${id}`);\n});\nAdd native page transitions in your app shell:\n&lt;script setup&gt;\nimport { ref, onMounted } from 'vue';\nimport { useRouter } from 'vue-router';\nimport '@capgo/capacitor-transitions';\nimport { initTransitions, setDirection, setupRouterOutlet } from '@capgo/capacitor-transitions/vue';\n\ninitTransitions({ platform: 'auto' });\n\nconst router = useRouter();\nconst outletRef = ref(null);\n\nonMounted(() =&gt; {\n  if (outletRef.value) {\n    setupRouterOutlet(outletRef.value, { platform: 'auto', swipeGesture: 'auto' });\n  }\n});\n\nconst openSettings = () =&gt; {\n  setDirection('forward');\n  router.push('/settings');\n};\n&lt;/script&gt;\n\n&lt;template&gt;\n  &lt;cap-router-outlet ref=\"outletRef\"&gt;\n    &lt;router-view /&gt;\n  &lt;/cap-router-outlet&gt;\n&lt;/template&gt;\nWrap routed pages in cap-router-outlet, cap-page, and cap-content, and call setDirection('forward') or setDirection('back') before navigating. Do not duplicate web headers or footers when native navigation owns those surfaces.\nSee the full guides: Using @capgo/capacitor-native-navigation and Using @capgo/capacitor-transitions.\nSafe areas with Tailwind\nFor device safe areas in Tailwind CSS, use @capgo/tailwind-capacitor (published as tailwind-capacitor on npm). It provides safe-areas utilities and other Capacitor-friendly Tailwind plugins:\nbun add -D tailwind-capacitor\nIn src/assets/main.css:\n@import 'tailwindcss';\n@plugin \"@capgo/tailwind-capacitor/platform\";\n@plugin \"@capgo/tailwind-capacitor/safe-areas\";\nUse utilities such as pt-safe, pb-safe, and px-safe instead of sprinkling env(safe-area-inset-*) by hand. The project is actively developed — if something is missing for your Vue setup, open a PR on GitHub.\nFixing iOS Layout Issues (Viewport, Safe Area, and Horizontal Overflow)\nIf content looks cropped, shifted, or horizontally scrollable on iOS, adding more overflow-x: hidden or tweaking the viewport tag alone usually does not fix it. Work through these checks in order.\nMake sure the viewport meta tag is applied correctly\nAdd the viewport meta tag in index.html inside &lt;head&gt;:\n&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" /&gt;\nHandle iOS safe area from one root wrapper only\nCreate a single app shell and apply safe area padding there — not in multiple nested components:\nhtml,\nbody,\n#app {\n  width: 100%;\n  min-height: 100%;\n  margin: 0;\n  padding: 0;\n  overflow-x: hidden;\n}\n\n* {\n  box-sizing: border-box;\n}\n\n.app-shell {\n  min-height: 100dvh;\n  width: 100%;\n  padding-top: env(safe-area-inset-top);\n  padding-right: env(safe-area-inset-right);\n  padding-bottom: env(safe-area-inset-bottom);\n  padding-left: env(safe-area-inset-left);\n}\nWrap all page content inside .app-shell. Duplicated safe-area padding in headers, modals, and layout wrappers often makes the UI look cropped or too large.\nWith @capgo/tailwind-capacitor, you can express the same padding with utilities like pt-safe pb-safe px-safe on that single shell.\nSet Capacitor iOS contentInset to never first\nIn capacitor.config.ts, prefer native inset disabled and let CSS (or Native Navigation’s contentInsetMode: 'css') own the safe area:\nconst config: CapacitorConfig = {\n  appId: 'com.example.myapp',\n  appName: 'my-app',\n  webDir: 'dist',\n  ios: {\n    contentInset: 'never',\n  },\n};\nMixing Capacitor’s automatic content inset with CSS env(safe-area-inset-*) padding is a common cause of double spacing.\nFind the real overflowing element\nThe usual culprit is an element using 100vw, Tailwind w-screen, a fixed pixel width, or a large min-width.\nIn Safari Web Inspector, run:\n[...document.querySelectorAll('*')]\n  .filter(el =&gt; el.scrollWidth &gt; document.documentElement.clientWidth)\n  .map(el =&gt; ({\n    el,\n    tag: el.tagName,\n    class: el.className,\n    scrollWidth: el.scrollWidth,\n    clientWidth: document.documentElement.clientWidth,\n  }));\nWith Tailwind, replace w-screen with w-full when possible. Many horizontal overflow issues come from 100vw / w-screen, duplicated safe-area padding, or a fixed-width container — not from the viewport meta tag itself.\nConclusion\nCapacitor is a great option for building native applications based on an existing web project. With the addition of Capgo, it’s even easier to add live updates to your app, ensuring that your users always have access to the latest features and bug fixes.\nLearn how Capgo can help you build better apps faster, sign up for a free account today.\nKeep going from Building Mobile Apps with Vue and Capacitor\nIf you are using Building Mobile Apps with Vue and Capacitor to plan native media and interface behavior, connect it with Using @capgo/capacitor-live-activities for the native capability in Using @capgo/capacitor-live-activities, @capgo/capacitor-live-activities for the implementation detail in @capgo/capacitor-live-activities, Using @capgo/capacitor-video-player for the native capability in Using @capgo/capacitor-video-player, @capgo/capacitor-video-player for the implementation detail in @capgo/capacitor-video-player, and Using @capgo/capacitor-native-navigation for the native capability in Using @capgo/capacitor-native-navigation.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/vue-mobile-app-capacitor/"},"keywords":"Vue, Capacitor, mobile app development, live updates, OTA updates, continuous integration, mobile app updates","articleSection":"Tutorial"}</script>
