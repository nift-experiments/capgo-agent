<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/do-apple-allow-live-updates/#newsarticle","url":"https://capgo.app/blog/do-apple-allow-live-updates/","headline":"Does Apple Allow Live Updates Without Store Review?","description":"How can you push code updates to production iOS apps and be fully compliant with Apple’s guidelines? ","image":["https://capgo.app/apple_appstore.webp"],"datePublished":"2022-01-13T00:00:00.000Z","dateModified":"2026-08-27T16:41:24.000Z","inLanguage":"en","articleBody":"Updating Capacitor JS apps without going through the App Store review process is possible under certain conditions outlined in Apple’s official guidelines. However, it is important to note that this is not legal advice. In order for code updates to be pushed directly to an app and remain compliant with Apple’s guidelines, the following conditions must be met:\n\nThe code must be run by Apple’s built-in WebKit framework\nThe code must not provide, unlock or enable additional features or functionality\nThe user must not be aware that an update is occurring\n\nThe Capgo Capacitor plugin allows for updates and modifications to be made to HTML, CSS, and JavaScript, satisfying the first condition.\nThe ability for apps to update themselves without going through the App Store review process has been available for some time for apps created using JavaScript frameworks such as Facebook’s React Native and services like Expo.\nThe second condition, not providing additional features or functionality, is determined by the developer. Capgo is intended for making small tweaks or fixes, rather than introducing new features or functionality. For significant changes, it is necessary to release updates through the App Store. It is worth noting that many other developers use live updates without any issues or rejection from Apple.\nGoogle Play is less restrictive than Apple when it comes to updating apps. Google Play allows for apps installed from their store with JavaScript bundles to be updated by non-Google services.\nFor more information on how to install Capgo to bypass review, please refer to my next article.\nKeep going from Does Apple Allow Live Updates Without Store Review?\nIf you are using Does Apple Allow Live Updates Without Store Review? to plan store approval and distribution, connect it with @capgo/capacitor-in-app-review for the implementation detail in @capgo/capacitor-in-app-review, Using @capgo/capacitor-in-app-review for the native capability in Using @capgo/capacitor-in-app-review, @capgo/capacitor-native-market for the implementation detail in @capgo/capacitor-native-market, Using @capgo/capacitor-native-market for the native capability in Using @capgo/capacitor-native-market, and Capacitor OTA Updates: App Store Approval Guide for the practical context in Capacitor OTA Updates: App Store Approval Guide.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://x.com/martindonadieu","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/"
