<script hid="seo-schema-graph" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","@id":"https://capgo.app/blog/how-to-add-dependencies-in-capacitor-plugins/#newsarticle","url":"https://capgo.app/blog/how-to-add-dependencies-in-capacitor-plugins/","headline":"How to Add Dependencies in Capacitor Plugins","description":"Learn to streamline dependency management in Capacitor plugins across platforms with practical steps and best practices.","image":["https://capgo.app/blog-images/how-to-add-dependencies-in-capacitor-plugins.webp"],"datePublished":"2025-03-27T02:08:04.837Z","dateModified":"2026-08-25T01:16:42.000Z","inLanguage":"en","articleBody":"Adding dependencies to Capacitor plugins can feel overwhelming, but it’s easier when broken into clear steps. Here’s what you need to know:\n\n\nUnderstand the tools:\n\nJavaScript: Use npm to manage dependencies.\niOS: Use CocoaPods or Swift Package Manager (SPM).\nAndroid: Use Gradle for dependency management.\n\n\n\nSet up your development environment:\n\nInstall tools like Node.js, npm, Xcode, Android Studio, CocoaPods, and JDK.\n\n\n\nStart your Capacitor plugin project:\n\nUse npm init @capacitor/plugin to create a new plugin.\n\n\n\nAdd JavaScript dependencies:\n\nUse npm install for production and development dependencies.\nUpdate package.json to include peer dependencies like @capacitor/core.\n\n\n\nHandle platform-specific dependencies:\n\niOS: Configure CocoaPods or SPM with libraries like Alamofire or SwiftyJSON.\nAndroid: Use Gradle to add dependencies like Gson or AppCompat.\n\n\n\nOptimize performance:\n\nPin versions, audit dependencies, and resolve conflicts to ensure stability.\n\n\n\nUse tools like Capgo for live updates:\n\nPush updates instantly without app store reviews.\n\n\n\nQuick Comparison of Tools:\n\n\n\nPlatform\nTool\nExample Dependency\n\n\n\n\nJavaScript\nnpm\nnpm install lodash --save\n\n\niOS\nCocoaPods/SPM\npod 'Alamofire', '~&gt; 5.6.4'\n\n\nAndroid\nGradle\nimplementation 'com.google.code.gson:gson:2.10.1'\n\n\n\nWhy it matters: Managing dependencies effectively ensures your plugin works seamlessly across platforms, saves time, and avoids errors. Let’s dive deeper into the steps.\nHow to create a Capacitor plugin for iOS/Android\n\n\nSetting Up Your Development Environment\nPrepare your setup with the necessary tools to handle Capacitor plugin dependencies effectively.\nRequired Development Tools\nHere’s a list of tools you’ll need:\n\n\n\nTool\nVersion\nPurpose\n\n\n\n\nNode.js\n16.0.0+\nJavaScript runtime environment\n\n\nnpm\n8.0.0+\nPackage management\n\n\nXcode\n14.0+\niOS development (Mac only)\n\n\nAndroid Studio\nElectric Eel+\nAndroid development\n\n\nCocoaPods\n1.11.0+\niOS dependency management\n\n\nJDK\n11+\nAndroid build tools\n\n\n\nStarting a New Plugin\nUse the Capacitor CLI to kick off your plugin project. This includes setting up platforms and naming your plugin using a reverse-domain format (e.g., com.mycompany.plugin):\n\nRun the following command:\nnpm init @capacitor/plugin\nChoose your target platforms (iOS/Android).\nAssign a name to your plugin in reverse-domain format.\n\nProject Setup Steps\n\n\nUpdate package.json\nModify your package.json to include the following:\n{\n  \"capacitor\": {\n    \"ios\": {\n      \"src\": \"ios\"\n    },\n    \"android\": {\n      \"src\": \"android\"\n    }\n  },\n  \"peerDependencies\": {\n    \"@capacitor/core\": \"^5.0.0\"\n  }\n}\n\n\nPlatform-Specific Setup\n\n\nFor iOS, ensure your Podfile includes:\nplatform :ios, '13.0'\nuse_frameworks!\n\n\nFor Android, verify your build.gradle contains:\nandroid {\n    compileSdkVersion 33\n    defaultConfig {\n        minSdkVersion 22\n    }\n}\n\n\n\n\nSet Up Environment Variables\nConfigure the following environment variables for your development tools:\n\n\n\nVariable\nPurpose\nExample Value\n\n\n\n\nANDROID_HOME\nAndroid SDK location\n/Users/username/Library/Android/sdk\n\n\nJAVA_HOME\nJDK installation path\n/Library/Java/JavaVirtualMachines/jdk-11.0.12.jdk/Contents/Home\n\n\nXCODE_SELECT\nXcode command line tools\n/Applications/Xcode.app/Contents/Developer\n\n\n\n\n\nOnce your project is set up, you’re ready to move on to managing JavaScript dependencies.\nJavaScript Dependencies\nEffectively managing JavaScript dependencies is key to maintaining stable plugin performance.\nnpm Package Installation\n\nTo install dependencies, use the following commands:\n# Add a production dependency\nnpm install lodash --save\n\n# Add a development dependency\nnpm install @types/lodash --save-dev\nMake sure to manually include peer dependencies in your package.json file. Test all dependencies to confirm compatibility across both web and native platforms.\nManaging package.json\nHere’s an example package.json configuration:\n{\n  \"name\": \"my-capacitor-plugin\",\n  \"version\": \"1.0.0\",\n  \"dependencies\": {\n    \"lodash\": \"^4.17.21\"\n  },\n  \"devDependencies\": {\n    \"@types/lodash\": \"^4.14.195\",\n    \"@capacitor/core\": \"^5.0.0\"\n  },\n  \"peerDependencies\": {\n    \"@capacitor/core\": \"^5.0.0\"\n  }\n}\nTo maintain consistency, lock dependency versions appropriately:\n\n\n\nConstraint Type\nExample\nUse Case\n\n\n\n\nExact\n“5.0.0”\nFor critical dependencies requiring a specific version\n\n\nCaret\n“^5.0.0”\nAllows minor updates and patches\n\n\nTilde\n“~5.0.0”\nRestricts updates to patches only\n\n\n\nUsing JavaScript Libraries\nWhen importing libraries, focus on reducing the bundle size:\n// Import only the required function\nimport { isEqual } from 'lodash';\n\nexport class MyPlugin {\n  async compare(options: { value1: any, value2: any }): Promise&lt;boolean&gt; {\n    return isEqual(options.value1, options.value2);\n  }\n}\nAdditionally, ensure proper error handling and type checking:\nimport { Plugin } from '@capacitor/core';\nimport { validate } from 'your-validation-library';\n\n@Plugin({\n  name: 'MyPlugin',\n  platforms: ['web', 'ios', 'android']\n})\nexport class MyPlugin {\n  async validateData(data: unknown): Promise&lt;void&gt; {\n    try {\n      if (!validate(data)) {\n        throw new Error('Invalid data format');\n      }\n      // Continue processing if valid\n    } catch (error) {\n      throw new Error(`Validation failed: ${error.message}`);\n    }\n  }\n}\nUp next, explore how to handle platform-specific dependencies for iOS.\niOS Dependencies\nThis section explains how to manage native iOS dependencies in Capacitor plugins. Once you’ve set up your JavaScript dependencies, the next step is handling native iOS dependencies.\nCocoaPods Setup\n\nStart by initializing CocoaPods in your iOS directory:\ncd ios\npod init\nThen, update your Plugin.podspec file with the following configurations:\nPod::Spec.new do |s|\n  s.name = 'MyCapacitorPlugin'\n  s.version = '1.0.0'\n  s.summary = 'Your plugin description'\n  s.platform = :ios, '13.0'\n  s.dependency 'Capacitor'\n  # Include your iOS dependencies here\n  s.dependency 'Alamofire', '~&gt; 5.6.4'\nend\nPodfile Configuration\nAfter initializing CocoaPods, configure the Podfile to include Capacitor and any additional third-party libraries:\nplatform :ios, '13.0'\nuse_frameworks!\n\ndef capacitor_pods\n  pod 'Capacitor', :path =&gt; '../../node_modules/@capacitor/ios'\n  pod 'CapacitorCordova', :path =&gt; '../../node_modules/@capacitor/ios'\nend\n\ntarget 'Plugin' do\n  capacitor_pods\n  # Add third-party dependencies\n  pod 'KeychainAccess', '~&gt; 4.2.2'\n  pod 'SwiftyJSON', '~&gt; 5.0.1'\nend\n\ntarget 'PluginTests' do\n  capacitor_pods\nend\nHere are some common dependency configuration patterns:\n\n\n\nConstraint Type\nExample\nUse Case\n\n\n\n\nExact Version\npod 'KeychainAccess', '4.2.2'\nWhen precise control is needed, such as for security components\n\n\nMinor Version\npod 'Alamofire', '~&gt; 5.6'\nFor stable APIs that may receive patch updates\n\n\nMajor Version\npod 'SwiftyJSON', '&gt; 5.0'\nWhen flexibility across updates is acceptable\n\n\n\nSwift Package Dependencies\nIf you’d rather not use CocoaPods, Swift Package Manager (SPM) is a good alternative. Add SPM dependencies directly in Xcode with the following configuration in your Package.swift file:\n// Package.swift\ndependencies: [\n    .package(url: \"https://github.com/Alamofire/Alamofire.git\", .upToNextMajor(from: \"5.6.4\")),\n    .package(url: \"https://github.com/SwiftyJSON/SwiftyJSON.git\", from: \"5.0.1\")\n]\nTo use SPM dependencies in your plugin code, import them and integrate as needed. For example:\nimport Capacitor\nimport Alamofire\n\n@objc(MyPlugin)\npublic class MyPlugin: CAPPlugin {\n    @objc func makeRequest(_ call: CAPPluginCall) {\n        AF.request(\"https://api.example.com/data\").response { response in\n            // Process the response\n            call.resolve([\n                \"data\": response.data\n            ])\n        }\n    }\n}\nThis approach allows you to choose between CocoaPods and Swift Package Manager based on your project requirements.\nAndroid Dependencies\nSet up Android dependencies to ensure smooth native integration. Here’s how to manage dependencies for your Capacitor plugin.\nGradle Dependencies\n\nAdd the following configurations to your build.gradle file:\nandroid {\n    defaultConfig {\n        minSdkVersion 22\n        targetSdkVersion 33\n    }\n}\n\ndependencies {\n    implementation \"androidx.appcompat:appcompat:1.6.1\"\n    implementation \"com.google.code.gson:gson:2.10.1\"\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.8.20\"\n    implementation project(':capacitor-android')\n}\nDefine additional versions in the buildscript block:\nbuildscript {\n    ext {\n        androidxCoreVersion = '1.10.1'\n        kotlinVersion = '1.8.20'\n    }\n}\nOnce dependencies are configured, make sure to set up the necessary repositories.\nRepository Configuration\nIn your project-level build.gradle, include the required Maven repositories:\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url \"https://jitpack.io\" }\n    }\n}\nIf you’re using custom or private Maven repositories, add credentials like this:\nmaven {\n    url \"https://maven.example.com/releases\"\n    credentials {\n        username = project.findProperty(\"mavenUsername\") ?: System.getenv(\"MAVEN_USERNAME\")\n        password = project.findProperty(\"mavenPassword\") ?: System.getenv(\"MAVEN_PASSWORD\")\n    }\n}\nWith repositories set up, address any dependency conflicts that may arise.\nFixing Compatibility Issues\nTo handle dependency conflicts, apply version resolutions in your build.gradle:\nconfigurations.all {\n    resolutionStrategy {\n        force \"org.jetbrains.kotlin:kotlin-stdlib:1.8.20\"\n        force \"androidx.core:core-ktx:1.10.1\"\n    }\n}\nHere are strategies for resolving common dependency issues:\n\n\n\nIssue Type\nStrategy\nExample\n\n\n\n\nVersion Conflict\nForce a specific version\nforce 'com.google.code.gson:gson:2.10.1'\n\n\nMultiple Versions\nExclude a module\nexclude group: 'org.json', module: 'json'\n\n\nTransitive Issues\nUse strict versions\nstrictly 'androidx.core:core-ktx:1.10.1'\n\n\n\nFor instance, you can exclude conflicting modules like this:\ndependencies {\n    implementation('library:name:1.0.0') {\n        exclude group: 'com.conflicting.dependency'\n    }\n}\nFinally, optimize your build process by enabling caching and parallel execution in gradle.properties:\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx2048m\nCapgo Integration\n\nUsing Capgo alongside native and JavaScript dependency management makes updating your plugin faster and easier.\nAbout Capgo\nCapgo is a live update platform designed for Capacitor plugins and apps. With over 23.5 million updates delivered across 750 production apps [1], Capgo allows developers to push updates for dependencies and code instantly - no app store review required. Updates are secured with end-to-end encryption and meet both Apple and Android compliance standards.\nCapgo Update Features\nCapgo simplifies managing plugin dependencies with these features:\n\n\n\nFeature\nWhat It Does\nKey Metric\n\n\n\n\nLive Updates\nPush updates in minutes\n95% user update rate in 24 hours\n\n\nPartial Updates\nDownload only changed files\n434ms average API response time\n\n\nVersion Control\nManage multiple versions\n82% global success rate\n\n\nChannel System\nTarget specific user groups\nSupports multiple deployment channels\n\n\n\nSource: [1]\nCapgo works seamlessly with CI/CD tools like GitHub Actions, GitLab CI, and Jenkins, automating dependency updates and ensuring consistent plugin versions. These tools make it easier to integrate Capgo into your workflow.\nSetting Up Capgo\nFollow these steps to integrate Capgo into your project:\n\n\nInstall the Capgo CLI\nRun the following command in your terminal:\nnpx @capgo/cli init\n\n\nConfigure Update Preferences\nUse the Capgo dashboard to set up deployment channels and preferences. Both cloud-hosted and self-hosted configurations are supported.\n\n\nAdd Update Logic\nAdd this code to your main plugin file to enable updates:\nimport { Capgo } from '@capgo/capacitor-updater';\n\n// Initialize Capgo\nconst capgo = new Capgo({\n  appId: 'YOUR_APP_ID',\n  channel: 'production'\n});\n\n// Check for updates\nawait capgo.checkForUpdate();\n\n\n\n“We practice agile development and @Capgo is mission-critical in delivering continuously to our users!” - Rodrigo Mantica\n\nCapgo also provides an analytics dashboard for real-time insights into update success rates and user activity. Features like one-click rollback and error tracking help resolve any issues quickly, keeping your plugin updates running smoothly.\nConclusion\nProcess Review\nManaging dependencies for Capacitor plugins involves aligning the native components (iOS and Android) with their JavaScript counterparts to ensure smooth integration. This process includes platform-specific setups and managing JavaScript packages to achieve the best performance. Following the outlined steps will help maintain stable and efficient plugin functionality.\nBest Practices\nTo manage dependencies effectively, consider these practices:\n\n\n\nPractice\nBenefit\nHow to Implement\n\n\n\n\nVersion Pinning\nAvoids unexpected issues\nUse fixed versions in package.json\n\n\nPlatform Isolation\nMinimizes conflicts\nSeparate native dependencies\n\n\nRegular Updates\nImproves security\nApply critical patches promptly\n\n\nDependency Auditing\nDetects risks\nRun npm audit frequently\n\n\n\nUsing live update tools like Capgo can further simplify and improve these practices by enabling real-time updates.\nCapgo Benefits\nCapgo simplifies the dependency management process while delivering strong performance. It achieves an impressive 95% user update rate within 24 hours and maintains a global API response time of 434ms [1]. With end-to-end encryption, it ensures secure updates that comply with both Apple and Android guidelines. For teams managing multiple plugin versions, Capgo’s channel system allows targeted deployments for specific user groups.\nHere’s a quick look at Capgo’s performance:\n\n\n\nMetric\nValue\n\n\n\n\nGlobal API Response Time\n434ms\n\n\nUpdate Success Rate\n82%\n\n\nUser Update Rate (24 Hours)\n95%\n\n\n\nKeep going from How to Add Dependencies in Capacitor Plugins\nIf you are using How to Add Dependencies in Capacitor Plugins to plan native plugin work, connect it with Capgo Plugin Directory for the product workflow in Capgo Plugin Directory, Capacitor Plugins by Capgo for the implementation detail in Capacitor Plugins by Capgo, Adding or Updating Plugins for the implementation detail in Adding or Updating Plugins, Ionic Enterprise Plugin Alternatives for the product workflow in Ionic Enterprise Plugin Alternatives, and Capgo Native Builds for the product workflow in Capgo Native Builds.\n","author":{"@type":"Person","name":"Martin Donadieu","url":"https://github.com/riderx","image":"https://avatars.githubusercontent.com/u/4084527?v=4"},"publisher":{"@type":"Organization","@id":"https://capgo.app/#organization","name":"Capgo","legalName":"Digital Shift OÜ","alternateName":["Capgo.app","Capgo Live Updates"],"url":"https://capgo.app","logo":{"@type":"ImageObject","url":"https://capgo.app/capgo.webp","contentUrl":"https://capgo.app/capgo.webp","width":"1024","height":"1024"},"sameAs":["https://twitter.com/Capgo_app","https://github.com/Cap-go","https://www.linkedin.com/company/capgo"],"description":"The best articles to enhance your Capacitor app. Do more with Capacitor and Capgo. Learn how to build a modern app with Capacitor.","email":"support@capgo.app","address":{"@type":"PostalAddress","streetAddress":"Sepapaja 6","postalCode":"15551","addressLocality":"Tallinn","addressCountry":"EE"},"contactPoint":{"@type":"ContactPoint","contactType":"technical support","email":"support@capgo.app","url":"https://capgo.app/contact/","availableLanguage":["English"]}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://capgo.app/blog/how-to-add-dependencies-in-capacitor-plugins/"},"keywords":"Capacitor, plugin dependencies, iOS, Android, JavaScript, CocoaPods, Gradle, development tools","articleSection":"Development"}</script>
