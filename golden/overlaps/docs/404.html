<script>(function(){const locales = ["de","en","es","fr","id","it","ja","ko","zh"];
const defaultLocale = "en";

  const languageMenu = document.getElementById('language-menu')
  const button = document.getElementById('language-menu-button')
  if (languageMenu && button) {
    const adjustMenuPosition = () => {
      if (languageMenu.classList.contains('hidden')) return
      const rect = button.getBoundingClientRect()
      const viewportHeight = window.innerHeight
      const menuHeight = languageMenu.offsetHeight
      if (rect.bottom + menuHeight > viewportHeight) {
        languageMenu.style.top = 'auto'
        languageMenu.style.bottom = '100%'
      } else {
        languageMenu.style.top = '100%'
        languageMenu.style.bottom = 'auto'
      }
    }
    // window.addEventListener('resize', adjustMenuPosition)
    button.onclick = () => {
      const willShow = languageMenu.classList.contains('hidden')
      languageMenu.classList.toggle('hidden')
      if (willShow) adjustMenuPosition()
    }
    const stripLocale = (pathname) => {
      const segments = pathname.split('/')
      if (!locales.includes(segments[1])) return pathname || '/'
      const stripped = '/' + segments.slice(2).join('/')
      return stripped || '/'
    }
    const localizedPath = (targetLocale) => {
      const basePath = stripLocale(window.location.pathname)
      return targetLocale === defaultLocale ? basePath : '/' + targetLocale + (basePath === '/' ? '/' : basePath)
    }
    const activateLanguage = (target) => {
      window.location.href = target
    }
    locales.forEach((j) => {
      const item = document.getElementById(`language_${j}`)
      if (!item) return
      const target = localizedPath(j) + window.location.search + window.location.hash
      item.setAttribute('href', target)
      item.addEventListener('click', (event) => {
        event.preventDefault()
        activateLanguage(target)
      })
      item.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return
        event.preventDefault()
        activateLanguage(target)
      })
    })
  }
})();</script>
